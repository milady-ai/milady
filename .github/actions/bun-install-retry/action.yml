name: Install dependencies with retry
description: Runs bun install with retry logic for flaky network failures
inputs:
  flags:
    description: 'Flags to pass to bun install (e.g. --frozen-lockfile --ignore-scripts)'
    required: false
    default: '--frozen-lockfile --ignore-scripts'
  max-retries:
    description: 'Maximum number of retry attempts'
    required: false
    default: '3'
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        flags="${{ inputs.flags }}"
        max=${{ inputs.max-retries }}
        for i in $(seq 1 $max); do
          echo "Attempt $i/$max: bun install $flags"
          if bun install $flags; then
            echo "Install succeeded on attempt $i"
            exit 0
          fi
          if [ "$i" -lt "$max" ]; then
            echo "Install failed, retrying in 15s..."
            sleep 15
          fi
        done
        echo "Install failed after $max attempts"
        exit 1
