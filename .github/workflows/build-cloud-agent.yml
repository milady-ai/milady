# =============================================================================
# build-cloud-agent.yml — Build cloud agent image (workspace-native)
# =============================================================================
#
# Dockerfile.ci now owns the install/build: it copies the full milady + eliza
# workspace, runs bun install at the workspace root, builds runtime/UI artifacts,
# and runs the cloud import smoke contract inside the image.
#
# Published to: ghcr.io/milady-ai/agent
#   Version tags are immutable-ish release handles. Mutable latest tags are not
#   pushed from staging builds; bump cloud-staging-latest only after Nyx verifies.
# =============================================================================

name: Build Cloud Agent

on:
  push:
    branches:
      - cloud/main
      - cloud/staging
  workflow_dispatch:
    inputs:
      version:
        description: "Cloud version tag (e.g. 2.1.0). Defaults to 2.1.0 on staging, run number elsewhere."
        required: false
        type: string
      push_image:
        description: "Push image to GHCR"
        required: false
        type: boolean
        default: true

concurrency:
  group: build-cloud-agent-${{ github.event_name == 'push' && github.ref_name || (github.ref_name == 'cloud/staging' && 'cloud/staging' || 'cloud/main') }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: milady-ai/agent
  SOURCE_REF: ${{ github.event_name == 'push' && github.ref_name || (github.ref_name == 'cloud/staging' && 'cloud/staging' || 'cloud/main') }}
  DEPOT_PROJECT_ID: m89t0f0p08

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build cloud agent image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Init full workspace submodules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          if [ -n "${GH_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init eliza
          git -C eliza submodule update --init --recursive
          MILADY_SKIP_LOCAL_UPSTREAMS=1 node scripts/init-submodules.mjs || echo "Some non-eliza submodules failed, continuing"
          test -f eliza/package.json
          test -f eliza/cloud/packages/sdk/package.json
          test -f eliza/plugins/plugin-sql/typescript/package.json

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ "${SOURCE_REF}" = "cloud/staging" ]; then
            VERSION_PREFIX="cloud-staging-v"
            BUILD_ENVIRONMENT="staging"
            DEFAULT_VERSION="2.1.0"
          else
            VERSION_PREFIX="cloud-v"
            BUILD_ENVIRONMENT="production"
            DEFAULT_VERSION="2.1.${{ github.run_number }}"
          fi

          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${VERSION_PREFIX}${{ inputs.version }}"
          else
            VERSION="${VERSION_PREFIX}${DEFAULT_VERSION}"
          fi

          if [ "${BUILD_ENVIRONMENT}" = "staging" ]; then
            VERSION_CLEAN="${VERSION#cloud-staging-v}"
          else
            VERSION_CLEAN="${VERSION#cloud-v}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_clean=${VERSION_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "build_environment=${BUILD_ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "Cloud version: ${VERSION}"
          echo "Build environment: ${BUILD_ENVIRONMENT}"
          echo "Source branch: ${SOURCE_REF}"
          echo "Source SHA: $(git rev-parse --short HEAD)"

      - name: Load deploy config
        run: |
          set -a
          source eliza/packages/app-core/deploy/deploy.defaults.env
          source deploy/deploy.env
          set +a
          {
            echo "APP_ENTRYPOINT=${APP_ENTRYPOINT}"
            echo "APP_PORT=${APP_PORT}"
            echo "APP_API_BIND=${APP_API_BIND}"
            echo "OCI_SOURCE=${OCI_SOURCE}"
            echo "OCI_LICENSES=${OCI_LICENSES}"
            echo "APP_CMD_START<<EOF"
            echo "${APP_CMD_START}"
            echo "EOF"
            echo "OCI_TITLE<<EOF"
            echo "${OCI_TITLE}"
            echo "EOF"
            echo "OCI_DESCRIPTION<<EOF"
            echo "${OCI_DESCRIPTION}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up CI dockerignore
        run: cp eliza/packages/app-core/deploy/.dockerignore.ci .dockerignore

      - name: Set up Depot CLI
        if: vars.DEPOT_ENABLED != 'false'
        uses: depot/setup-action@v1
        continue-on-error: true

      - name: Set up Docker Buildx fallback
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' || inputs.push_image != false }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image with Depot
        id: depot-build
        if: vars.DEPOT_ENABLED != 'false'
        continue-on-error: true
        uses: depot/build-push-action@v1
        with:
          context: .
          file: deploy/Dockerfile.ci
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.push_image != false }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          build-args: |
            APP_ENTRYPOINT=${{ env.APP_ENTRYPOINT }}
            APP_CMD_START=${{ env.APP_CMD_START }}
            APP_PORT=${{ env.APP_PORT }}
            APP_API_BIND=${{ env.APP_API_BIND }}
            OCI_SOURCE=${{ env.OCI_SOURCE }}
            OCI_TITLE=${{ env.OCI_TITLE }}
            OCI_DESCRIPTION=${{ env.OCI_DESCRIPTION }}
            OCI_LICENSES=${{ env.OCI_LICENSES }}
            VERSION=${{ steps.version.outputs.version }}
            VERSION_CLEAN=${{ steps.version.outputs.version_clean }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push Docker image with Buildx fallback
        if: vars.DEPOT_ENABLED == 'false' || steps.depot-build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.ci
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.push_image != false }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          build-args: |
            APP_ENTRYPOINT=${{ env.APP_ENTRYPOINT }}
            APP_CMD_START=${{ env.APP_CMD_START }}
            APP_PORT=${{ env.APP_PORT }}
            APP_API_BIND=${{ env.APP_API_BIND }}
            OCI_SOURCE=${{ env.OCI_SOURCE }}
            OCI_TITLE=${{ env.OCI_TITLE }}
            OCI_DESCRIPTION=${{ env.OCI_DESCRIPTION }}
            OCI_LICENSES=${{ env.OCI_LICENSES }}
            VERSION=${{ steps.version.outputs.version }}
            VERSION_CLEAN=${{ steps.version.outputs.version_clean }}
            REVISION=${{ github.sha }}
          provenance: false

      - name: Pull and run smoke contract from pushed image
        if: ${{ github.event_name == 'push' || inputs.push_image != false }}
        run: |
          set -euxo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" node --import ./node_modules/tsx/dist/loader.mjs scripts/cloud-smoke-imports.mjs
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee /tmp/image-digest.txt

      - name: Build summary
        if: always()
        run: |
          if [ "${{ steps.version.outputs.build_environment }}" = "staging" ]; then
            BUILD_LABEL="Staging"
            LATEST_NOTE="cloud-staging-latest intentionally not pushed by CI; bump after Nyx verification."
          else
            BUILD_LABEL="Production"
            LATEST_NOTE="cloud-latest not pushed by this workflow; promote mutable tags after verification."
          fi

          echo "## ☁️ Cloud Agent Image (${BUILD_LABEL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ steps.version.outputs.build_environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${SOURCE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`$(git rev-parse --short HEAD)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mutable latest | ${LATEST_NOTE} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/image-digest.txt ]; then
            echo "| Digest | \`$(cat /tmp/image-digest.txt)\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
