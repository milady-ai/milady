# =============================================================================
# build-cloud-image.yml — Build the full Milady app image for cloud deploys
# =============================================================================
#
# Triggers:
#   - Push of release tags: v2.0.0-alpha.*, v2.0.*
#   - Reusable workflow call from agent-release.yml for validated releases
#   - Manual dispatch (workflow_dispatch) with optional override
#
# Published to: ghcr.io/milady-ai/milady/agent
#   Tags: :cloud-app
#         :cloud-app-{version}
#
# Build strategy: publish the complete Milady app image (UI + API + runtime)
# for hosted cloud deployments. Subordinate per-agent runtimes use the internal
# eliza/packages/app-core/deploy/Dockerfile.cloud-agent contract instead of this
# user-facing image.
# =============================================================================

name: Build Cloud App Image

on:
  push:
    tags:
      - "v2.0.0-alpha.*"
      - "v2.0.*"
  workflow_call:
    inputs:
      version:
        description: "Version tag to publish (e.g. v2.0.0-alpha.91)"
        required: true
        type: string
      push_image:
        description: "Push image to GHCR"
        required: false
        type: boolean
        default: true
      source_sha:
        description: "Exact git commit to build"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Override version tag (e.g. v2.0.0-alpha.91). Defaults to latest tag."
        required: false
        type: string
      push_image:
        description: "Push image to GHCR (uncheck for dry-run)"
        required: false
        type: boolean
        default: true
      source_sha:
        description: "Optional exact git commit to build instead of the dispatched ref"
        required: false
        type: string

concurrency:
  group: build-cloud-image-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  # Pin the canonical elizaOS/eliza checkout to the latest verified develop SHA.
  # Override with MILADY_ELIZA_REF only for a specific upstream release test.
  MILADY_ELIZA_REF: "v2.0.11-beta.5"
  REGISTRY: ghcr.io
  IMAGE_NAME: milady-ai/milady/agent
  MILADY_SKIP_LOCAL_UPSTREAMS: "1"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build cloud app image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: false

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache bun store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-

      - name: Init eliza checkout
        run: |
          if [ ! -f eliza/package.json ]; then
            git clone --depth=1 --branch "${MILADY_ELIZA_BRANCH:-develop}" https://github.com/elizaOS/eliza.git eliza
            if [ -n "${MILADY_ELIZA_REF:-}" ]; then
              git -C eliza fetch --depth=1 origin "$MILADY_ELIZA_REF"
              git -C eliza checkout --quiet FETCH_HEAD
              echo "Pinned eliza to ${MILADY_ELIZA_REF}"
            fi
          fi

      - name: Init cloud image plugin manifests
        run: |
          git -C eliza submodule update --init --depth=1 \
            plugins/plugin-sql \
            plugins/plugin-elizacloud

      - name: Apply elizaOS source CI patches
        run: node scripts/apply-eliza-ci-patches.mjs

      - name: Init non-eliza submodules
        run: |
          node scripts/init-submodules.mjs
          node scripts/disable-local-eliza-workspace.mjs

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Install eliza source dependencies
        run: bun install --cwd eliza --no-frozen-lockfile --ignore-scripts

      - name: Hydrate eliza Bun package postinstall
        # bun is hoisted to top-level node_modules in some setups; only hydrate
        # the eliza-nested copy when it actually exists.
        run: |
          if [ -f eliza/node_modules/bun/install.js ]; then
            (cd eliza/node_modules/bun && node install.js)
          else
            echo "eliza/node_modules/bun not present (likely hoisted) — skipping hydration"
          fi

      - name: Install published-workspace fallback dependencies
        run: bash scripts/install-published-workspace-fallback-deps.sh

      - name: Run postinstall patches
        run: bun run postinstall
        env:
          SKIP_AVATAR_CLONE: "1"
          MILADY_NO_VISION_DEPS: "1"

      - name: Build Capacitor plugins
        run: |
          node eliza/packages/app-core/scripts/build-native-plugins.mjs

      - name: Build agent workspace
        run: |
          cd eliza/packages/agent
          bun run build:docker-dist

      - name: Build @elizaos/core (includes agent-orchestrator)
        run: |
          export PATH="$GITHUB_WORKSPACE/eliza/node_modules/.bin:$GITHUB_WORKSPACE/eliza/packages/schemas/node_modules/.bin:$PATH"
          # Proto generation — eliza/packages/schemas was removed from
          # upstream eliza in a recent restructure. Guard against its
          # absence so the cloud image build works against current eliza
          # develop. The pattern mirrors build-docker.yml's guard.
          if [ -d eliza/packages/schemas ] && [ -f eliza/packages/schemas/buf.gen.yaml ]; then
            (cd eliza/packages/schemas && buf dep update && buf generate)
          else
            echo "eliza/packages/schemas not present in this eliza checkout — skipping proto generation"
          fi
          cd eliza/packages/core
          node ../shared/scripts/generate-keywords.mjs --target ts 2>/dev/null || echo "keyword gen skipped"
          bun run build:node

      - name: Build runtime (tsdown)
        run: |
          node scripts/run-tsdown.mjs
          echo '{"type":"module"}' > dist/package.json
          node --import tsx eliza/packages/app-core/scripts/write-build-info.ts 2>/dev/null || true

      - name: Inject tailwindcss into eliza/packages/app-core/node_modules
        run: |
          mkdir -p eliza/packages/app-core/node_modules
          if [ ! -d "eliza/packages/app-core/node_modules/tailwindcss" ]; then
            echo "Fetching tailwindcss tarball..."
            TAILWIND_URL=$(npm view tailwindcss dist.tarball 2>/dev/null)
            if [ -n "$TAILWIND_URL" ]; then
              rm -rf /tmp/tw_extract
              mkdir -p /tmp/tw_extract
              curl -sL "$TAILWIND_URL" | tar xz -C /tmp/tw_extract
              mv /tmp/tw_extract/package eliza/packages/app-core/node_modules/tailwindcss
              echo "+ tailwindcss $(node -p "require('./eliza/packages/app-core/node_modules/tailwindcss/package.json').version")"
            else
              echo "WARN: could not resolve tailwindcss tarball URL"
            fi
          else
            echo "tailwindcss already present in app-core/node_modules"
          fi

      # Link local @elizaos workspace packages into node_modules. The vite build
      # below imports symbols from @elizaos/ui (createVoiceCapture, VoicePill,
      # VoicePillMessage, VoiceCaptureHandle) that ship in the repo-local
      # eliza/packages/ui but have not landed on the npm alpha dist-tag yet
      # (currently @elizaos/ui@2.0.0-alpha.537). Without this step, vite resolves
      # @elizaos/ui from npm and the build fails with
      # `"createVoiceCapture" is not exported by "@elizaos/ui"`. The linker
      # symlinks every local @elizaos/* workspace package over the npm-installed
      # copy and rewrites `exports` to point at TS source when dist is absent.
      - name: Link local @elizaos workspace packages
        run: node eliza/packages/app-core/scripts/link-docker-local-app-packages.mjs

      # MILADY_FORCE_LOCAL_UPSTREAMS=1 forces apps/app/vite.config.ts to treat
      # the freshly-linked eliza/ checkout as the source of truth for the
      # @elizaos/* aliases. Without this, the config falls back to its
      # auto-detect heuristic and may resolve @elizaos/ui from npm.
      - name: Build UI (vite)
        run: |
          cd apps/app
          bun run build:web
        env:
          NODE_ENV: production
          MILADY_FORCE_LOCAL_UPSTREAMS: "1"

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Only match release tags (v2.0.5, v2.0.0-alpha.132) — skip dev/experimental tags
            VERSION="$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$' | head -1)"
            if [ -z "$VERSION" ]; then
              VERSION="$(git tag --sort=-creatordate | grep '^v' | head -1)"
            fi
          fi

          VERSION_CLEAN="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_clean=${VERSION_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "Source SHA: $(git rev-parse HEAD)"

      - name: Load deploy config
        run: |
          set -a
          source eliza/packages/app-core/deploy/deploy.defaults.env
          if [ -f deploy/deploy.env ]; then
            source deploy/deploy.env
          fi
          set +a
          {
            echo "APP_ENTRYPOINT=${APP_ENTRYPOINT}"
            echo "APP_PORT=${APP_PORT}"
            echo "APP_API_BIND=${APP_API_BIND}"
            echo "OCI_SOURCE=${OCI_SOURCE}"
            echo "OCI_LICENSES=${OCI_LICENSES}"
            echo "APP_CMD_START<<EOF"
            echo "${APP_CMD_START}"
            echo "EOF"
            echo "OCI_TITLE<<EOF"
            echo "${OCI_TITLE}"
            echo "EOF"
            echo "OCI_DESCRIPTION<<EOF"
            echo "${OCI_DESCRIPTION}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Stage Dockerfile-expected paths
        # Dockerfile.cloud was authored against the eliza-monorepo layout where
        # packages/<name>/ and plugins/<name>/ live at repo root. In milady
        # they live under eliza/packages/ and eliza/plugins/, so mirror the
        # specific packages and plugins the Dockerfile COPYs into the build
        # context root here. Mirroring is intentionally narrow: bringing in
        # extra eliza packages introduces workspace:* dependency edges that
        # the Dockerfile doesn't materialize (e.g. @elizaos/prompts), which
        # would cause `bun install` in the deps stage to fail.
        # Special case: packages/app comes from apps/app (the Vite app).
        run: |
          set -eu
          # Mirror just the packages the Dockerfile COPYs from `packages/<name>` / `plugins/<name>`.
          mkdir -p packages plugins
          for name in core agent app-core shared ui workflows; do
            if [ ! -e "packages/$name" ] && [ -d "eliza/packages/$name" ]; then
              cp -R "eliza/packages/$name" "packages/$name"
            fi
          done
          for name in plugin-sql plugin-elizacloud plugin-workflow; do
            if [ ! -e "plugins/$name" ] && [ -d "eliza/plugins/$name" ]; then
              cp -R "eliza/plugins/$name" "plugins/$name"
            fi
          done
          # patches/ at build context root — Dockerfile COPYs both patches and packages/app-core/patches
          if [ ! -e patches ] && [ -d eliza/packages/app-core/patches ]; then
            cp -R eliza/packages/app-core/patches patches
          fi
          # scripts/docker-entrypoint.sh — for the milady-rooted COPY in Dockerfile prep stage
          mkdir -p scripts
          if [ ! -e scripts/docker-entrypoint.sh ] && [ -f eliza/packages/app-core/scripts/docker-entrypoint.sh ]; then
            cp eliza/packages/app-core/scripts/docker-entrypoint.sh scripts/docker-entrypoint.sh
            chmod +x scripts/docker-entrypoint.sh
          fi
          # plugins/plugin-selfcontrol — copy from packages/plugin-selfcontrol if milady-local
          if [ ! -e plugins/plugin-selfcontrol ] && [ -d packages/plugin-selfcontrol ]; then
            cp -R packages/plugin-selfcontrol plugins/plugin-selfcontrol
          fi
          rm -rf cloud-sdk
          cp -R eliza/cloud/packages/sdk cloud-sdk
          test -f cloud-sdk/package.json
          # packages/app comes from milady's Vite app at apps/app, not from eliza
          mkdir -p packages/app
          cp apps/app/package.json packages/app/package.json
          rm -rf packages/app/dist
          cp -R apps/app/dist packages/app/dist
          test -f packages/app/package.json
          test -d packages/app/dist
          test -f scripts/cloud-image-prune-deps.mjs
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const dockerfile = "eliza/packages/app-core/deploy/Dockerfile.cloud";
          if (fs.existsSync(dockerfile)) {
            let dockerfileContents = fs.readFileSync(dockerfile, "utf8");
            const original = dockerfileContents;
            dockerfileContents = dockerfileContents.replace(
              "plugin-agent-orchestrator|plugin-cli|plugin-imessage",
              "plugin-agent-orchestrator|plugin-app-control|plugin-cli|plugin-imessage",
            );
            // The prep stage does `cp -a "${APP_ENTRYPOINT}" /runtime/` but
            // the upstream Dockerfile never `COPY`s the milady-specific
            // entrypoint into /src. Inject a `COPY milady.mjs ./` next to
            // the existing `COPY package.json plugins.json ./` line so
            // milady.mjs lands at /src/milady.mjs before the RUN script.
            const prepCopyLine = "COPY package.json plugins.json ./";
            const prepCopyWithEntry = `${prepCopyLine}\nCOPY milady.mjs ./milady.mjs`;
            if (
              !dockerfileContents.includes("COPY milady.mjs") &&
              dockerfileContents.includes(prepCopyLine)
            ) {
              dockerfileContents = dockerfileContents.replace(
                prepCopyLine,
                prepCopyWithEntry,
              );
            }
            if (dockerfileContents !== original) {
              fs.writeFileSync(dockerfile, dockerfileContents);
            }
          }
          const manifests = [
            "package.json",
            "apps/app/package.json",
            // Every mirrored package — these are the manifests that travel
            // into the docker build context and must be free of workspace:*
            // specs that the container can't resolve.
            "packages/core/package.json",
            "packages/agent/package.json",
            "packages/app-core/package.json",
            "packages/shared/package.json",
            "packages/ui/package.json",
            "packages/workflows/package.json",
            "packages/app-core/platforms/electrobun/package.json",
            "packages/app-core/deploy/cloud-agent-template/package.json",
            "plugins/plugin-sql/package.json",
            "plugins/plugin-elizacloud/package.json",
            "plugins/plugin-workflow/package.json",
            // Keep the eliza/ originals in sync too (host-side bun install
            // still consults them during release-check etc.).
            "eliza/packages/core/package.json",
            "eliza/packages/agent/package.json",
            "eliza/packages/app-core/package.json",
            "eliza/packages/shared/package.json",
            "eliza/packages/ui/package.json",
            "eliza/packages/workflows/package.json",
            "eliza/packages/app-core/platforms/electrobun/package.json",
            "eliza/packages/app-core/deploy/cloud-agent-template/package.json",
            "eliza/plugins/plugin-sql/package.json",
            "eliza/plugins/plugin-elizacloud/package.json",
            "eliza/plugins/plugin-workflow/package.json",
          ];
          const fields = [
            "dependencies",
            "devDependencies",
            "optionalDependencies",
            "peerDependencies",
            "overrides",
          ];
          const unpublished = /^@elizaos\/(app-|capacitor-|plugin-agent-orchestrator|plugin-app-control|plugin-cli|plugin-imessage|plugin-local-ai|plugin-pdf|plugin-wechat|steward-)/;
          // Only packages the cloud-image build stage actually materializes
          // can satisfy a workspace:* spec inside the container. The rest
          // (electrobun-carrots, plugin-mlx, plugin-aosp-*, plugin-streaming,
          // etc.) live only in the upstream eliza workspace and either 404
          // on npm or have no alpha dist-tag — keeping them wedges bun
          // install inside the Docker deps stage.
          const mirroredWorkspacePackages = new Set([
            "@elizaos/core",
            "@elizaos/agent",
            "@elizaos/app-core",
            "@elizaos/shared",
            "@elizaos/ui",
            "@elizaos/workflows",
            "@elizaos/plugin-sql",
            "@elizaos/plugin-elizacloud",
            "@elizaos/plugin-workflow",
          ]);
          function isLocalSpec(value) {
            if (typeof value !== "string") return false;
            return ["workspace:", "file:", "link:", "portal:"].some((p) => value.startsWith(p));
          }
          for (const manifest of manifests) {
            if (!fs.existsSync(manifest)) continue;
            const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
            let changed = false;
            for (const field of fields) {
              const deps = pkg[field];
              if (!deps || typeof deps !== "object" || Array.isArray(deps)) continue;
              for (const [name, spec] of Object.entries(deps)) {
                if (unpublished.test(name)) {
                  delete deps[name];
                  changed = true;
                  continue;
                }
                if (isLocalSpec(spec)) {
                  // Keep workspace:* for mirrored packages — the root
                  // manifest below extends `workspaces` to packages/* and
                  // plugins/* so bun resolves them inside the container.
                  // Drop the rest — there's no corresponding directory to
                  // resolve and they aren't reliably published on npm.
                  if (mirroredWorkspacePackages.has(name)) {
                    deps[name] = "workspace:*";
                  } else {
                    delete deps[name];
                  }
                  changed = true;
                }
              }
            }
            if (changed) {
              fs.writeFileSync(manifest, JSON.stringify(pkg, null, 2) + "\n");
            }
          }
          // Extend root.workspaces so bun treats the mirrored packages/* and
          // plugins/* trees as workspace members inside the docker context.
          const rootForWorkspaces = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const existingWorkspaces = Array.isArray(rootForWorkspaces.workspaces)
            ? rootForWorkspaces.workspaces
            : [];
          const requiredWorkspaces = ["packages/*", "plugins/*"];
          const mergedWorkspaces = [...existingWorkspaces];
          let workspacesChanged = false;
          for (const entry of requiredWorkspaces) {
            if (!mergedWorkspaces.includes(entry)) {
              mergedWorkspaces.push(entry);
              workspacesChanged = true;
            }
          }
          if (workspacesChanged) {
            rootForWorkspaces.workspaces = mergedWorkspaces;
            fs.writeFileSync("package.json", JSON.stringify(rootForWorkspaces, null, 2) + "\n");
          }
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const existingOverrides =
            root.overrides && typeof root.overrides === "object" ? root.overrides : {};
          // Drop any pre-existing @elizaos/* overrides — disable-local-eliza-workspace
          // pins those to npm dist-tags (e.g. @elizaos/core: alpha), which then
          // collides with the same package resolved through workspaces, producing
          // bun's "Package has a dependency loop" error.
          const overridesWithoutEliza = Object.fromEntries(
            Object.entries(existingOverrides).filter(
              ([name]) => !name.startsWith("@elizaos/"),
            ),
          );
          root.overrides = {
            ...overridesWithoutEliza,
            // Point at the mirrored packages/ locations so transitive consumers
            // get the same source bun resolves through workspaces. eliza/ is
            // gitignored from the docker build context, so file:./eliza/... can't
            // resolve inside the container.
            "@elizaos/core": "file:./packages/core",
            "@elizaos/agent": "file:./packages/agent",
            "@elizaos/app-core": "file:./packages/app-core",
            "@elizaos/shared": "file:./packages/shared",
            "@elizaos/ui": "file:./packages/ui",
            "@elizaos/workflows": "file:./packages/workflows",
            "@elizaos/plugin-sql": "file:./plugins/plugin-sql",
            "@elizaos/plugin-elizacloud": "file:./plugins/plugin-elizacloud",
            "@elizaos/plugin-workflow": "file:./plugins/plugin-workflow",
          };
          fs.writeFileSync("package.json", JSON.stringify(root, null, 2) + "\n");
          NODE
          if [ ! -f bun.lock ]; then
            git show HEAD:bun.lock > bun.lock
          fi
          test -f bun.lock
          for staged_path in patches scripts/docker-entrypoint.sh plugins/plugin-selfcontrol; do
            if [ -e "$staged_path" ]; then
              find "$staged_path" -maxdepth 2 -print | head -20
            else
              echo "Missing expected staged path: $staged_path"
            fi
          done

      - name: Set up CI dockerignore
        run: cp eliza/packages/app-core/deploy/Dockerfile.cloud.dockerignore .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        if: ${{ github.event_name == 'push' || inputs.push_image != false }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cloud-app
            type=raw,value=cloud-app-${{ steps.version.outputs.version_clean }}

      - name: Build and push cloud app image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: eliza/packages/app-core/deploy/Dockerfile.cloud
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.push_image != false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_ENTRYPOINT=${{ env.APP_ENTRYPOINT }}
            APP_CMD_START=${{ env.APP_CMD_START }}
            APP_PORT=${{ env.APP_PORT }}
            APP_API_BIND=${{ env.APP_API_BIND }}
            OCI_SOURCE=${{ env.OCI_SOURCE }}
            OCI_TITLE=${{ env.OCI_TITLE }}
            OCI_DESCRIPTION=${{ env.OCI_DESCRIPTION }}
            OCI_LICENSES=${{ env.OCI_LICENSES }}
            VERSION=${{ steps.version.outputs.version }}
            VERSION_CLEAN=${{ steps.version.outputs.version_clean }}
            REVISION=${{ github.sha }}
          provenance: false

      - name: Build summary
        if: always()
        run: |
          {
            echo "## ☁️ Milady Cloud App Image"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Registry | \`${{ env.REGISTRY }}\` |"
            echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Built SHA | \`$(git rev-parse HEAD)\` |"
            echo ""
            echo "### Pull commands"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cloud-app"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cloud-app-${{ steps.version.outputs.version_clean }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
