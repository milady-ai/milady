# =============================================================================
# build-docker.yml — Build the canonical Milady agent image and push to GHCR
# =============================================================================
#
# Triggers:
#   - Push of release tags: v2.0.0-alpha.*, v2.0.*
#   - GitHub Release published (covers tags created via API/UI)
#   - Reusable workflow call from agent-release.yml for validated releases
#   - Manual dispatch (workflow_dispatch) with optional override
#   - Push to develop branch (produces :dev tag, no :latest)
#
# Published to: ghcr.io/milady-ai/agent
#   Tags: :v{version}  (e.g. :v2.0.0-alpha.91)
#         :latest      (when tag_latest is enabled)
#         :dev         (on develop pushes / manual non-release builds)
#
# Build strategy: GHA pre-builds the app (bun install + tsdown + vite build),
# then Dockerfile.ci copies the pre-built artifacts and applies size pruning.
# This produces a ~1.8GB image (vs 4GB baseline) via TIER 1+2 pruning.
# =============================================================================

name: Build Agent Image

on:
  push:
    tags:
      - "v2.0.0-alpha.*"
      - "v2.0.*"
    branches:
      - develop
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: "Version tag to publish (e.g. v2.0.0-alpha.91)"
        required: true
        type: string
      push_image:
        description: "Push image to GHCR"
        required: false
        type: boolean
        default: true
      tag_latest:
        description: "Also tag as :latest"
        required: false
        type: boolean
        default: true
      source_sha:
        description: "Exact git commit to build"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Override version tag (e.g. v2.0.0-alpha.91). Defaults to package.json version."
        required: false
        type: string
      push_image:
        description: "Push image to GHCR (uncheck for dry-run)"
        required: false
        type: boolean
        default: true
      tag_latest:
        description: "Also tag as :latest"
        required: false
        type: boolean
        default: true
      source_sha:
        description: "Optional exact git commit to build instead of the dispatched ref"
        required: false
        type: string

concurrency:
  group: build-docker-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  # Pin the canonical elizaOS/eliza checkout to an exact verified upstream SHA.
  # Prefer a develop SHA after the matching elizaOS PR merges.
  MILADY_ELIZA_REF: "v2.0.11-beta.7"
  REGISTRY: ghcr.io
  IMAGE_NAME: milady-ai/agent

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build agent image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.event.release.tag_name || github.sha }}
          submodules: false

      # ── 1b. Free runner disk space ──────────────────────────────────────────
      # The combined eliza source build + linked workspace node_modules + Docker
      # build context exceeds the ~14 GB free on the default ubuntu runner, which
      # surfaced as intermittent (now deterministic) "No space left on device"
      # IOExceptions during install. Reclaim the large preinstalled toolchains we
      # do not use here (~25-35 GB) before the heavy install/Docker build. Inline
      # rm (no third-party action) keeps the pinned-action security posture intact.
      - name: Free runner disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"; df -h /

      # ── 2. Set up Node 22 ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      # ── 3. Set up Bun ───────────────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      # ── 4. Restore cached bun store ─────────────────────────────────────────
      - name: Cache bun store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-

      # ── 4.5. Init eliza source checkout ───────────────────────────────────
      # The Milady repo now defaults to published @elizaos packages and no
      # longer tracks eliza/ as a gitlink. The image build still needs source
      # artifacts, so hydrate the canonical eliza repo explicitly.
      - name: Initialize eliza source checkout
        run: |
          if [ ! -f eliza/package.json ]; then
            git clone --depth=1 --branch "${MILADY_ELIZA_BRANCH:-develop}" https://github.com/elizaOS/eliza.git eliza
            if [ -n "${MILADY_ELIZA_REF:-}" ]; then
              git -C eliza fetch --depth=1 origin "$MILADY_ELIZA_REF"
              git -C eliza checkout --quiet FETCH_HEAD
              echo "Pinned eliza to ${MILADY_ELIZA_REF}"
            fi
          fi

      - name: Initialize tracked workspace submodules
        run: node scripts/init-submodules.mjs
        env:
          MILADY_SKIP_CLOUD_SUBMODULE: "1"

      - name: Prepare eliza source workspace
        run: |
          if [ -f eliza/.gitmodules ]; then
            # Untrack orphan gitlinks (160000 entries in the tree that aren't
            # declared in .gitmodules) so the recursive submodule init doesn't
            # die with "fatal: No url found for submodule path …". Upstream
            # eliza currently has e.g. swe-bench-workspace-opencode/* orphans.
            mapfile -t TREE_GITLINKS < <(git -C eliza ls-files --stage | awk '$1=="160000"{print $4}')
            mapfile -t GITMODULES_PATHS < <(git -C eliza config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
            for path in "${TREE_GITLINKS[@]}"; do
              found=0
              for known in "${GITMODULES_PATHS[@]}"; do
                if [ "$path" = "$known" ]; then found=1; break; fi
              done
              if [ "$found" = "0" ]; then
                echo "Untracking orphan gitlink not in .gitmodules: $path"
                git -C eliza rm --cached -r --force --quiet "$path" || true
              fi
            done

            git -C eliza submodule sync --recursive
            git -C eliza \
              -c submodule.cloud.update=none \
              -c submodule.plugins/plugin-elizacloud.update=none \
              -c submodule.plugins/plugin-local-inference/native/omnivoice.cpp.update=none \
              submodule update --init --recursive --depth=1
          fi
          node --input-type=module <<'NODE'
          import {
            pruneDuplicateLegacyElizaPluginWorkspaces,
            pruneSkippedCloudWorkspace,
          } from "./scripts/init-submodules.mjs";

          pruneSkippedCloudWorkspace({ rootDir: process.cwd() });
          pruneDuplicateLegacyElizaPluginWorkspaces({ rootDir: process.cwd() });
          NODE
        env:
          MILADY_SKIP_CLOUD_SUBMODULE: "1"

      # Stub any localPackages entry from link-docker-local-app-packages.mjs
      # that has no package.json on disk. Upstream eliza periodically renames
      # or adds entries (cloud-sdk, plugin-native-activity-tracker) faster than
      # the actual file moves land, leaving the linker pointing at non-existent
      # paths. The agent image doesn't actually use these stubs at runtime —
      # they exist solely to satisfy resolveLocalPackageDir().
      - name: Stub missing eliza local-package entries for docker context
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const linker = "eliza/packages/app-core/scripts/link-docker-local-app-packages.mjs";
          if (!fs.existsSync(linker)) process.exit(0);
          const src = fs.readFileSync(linker, "utf8");
          const arrayMatch = src.match(/const localPackages = \[([\s\S]*?)\];/);
          if (!arrayMatch) {
            console.log("[stub-local-packages] localPackages array not found in linker; skipping");
            process.exit(0);
          }
          const entries = [...arrayMatch[1].matchAll(/"([^"]+)"/g)].map((m) => m[1]);
          for (const entry of entries) {
            const candidates = [entry];
            if (entry.startsWith("eliza/")) candidates.push(entry.slice("eliza/".length));
            const found = candidates.some((c) => fs.existsSync(path.join(c, "package.json")));
            if (found) continue;
            const stubDir = entry;
            fs.mkdirSync(stubDir, { recursive: true });
            const inferredName = "@elizaos/" + path.basename(entry);
            const pkg = {
              name: inferredName,
              version: "0.0.0-stub",
              private: true,
              description: "Stub injected by milady CI for missing upstream eliza local-package entry.",
              main: "index.js",
              exports: { ".": "./index.js" },
            };
            fs.writeFileSync(path.join(stubDir, "package.json"), JSON.stringify(pkg, null, 2) + "\n");
            fs.writeFileSync(path.join(stubDir, "index.js"), "// stub for docker build context\n");
            console.log(`[stub-local-packages] stubbed ${stubDir} as ${inferredName}`);
          }
          NODE

      - name: Apply elizaOS source CI patches
        run: node scripts/apply-eliza-ci-patches.mjs

      - name: Repair known eliza patch files
        run: |
          node --input-type=module <<'NODE'
          import { repairKnownElizaPatchFiles } from "./scripts/disable-local-eliza-workspace.mjs";

          repairKnownElizaPatchFiles();
          NODE

      # ── 5. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: bun install --ignore-scripts --no-frozen-lockfile

      - name: Install eliza source dependencies
        run: |
          install_cmd=(timeout 10m bun install --cwd eliza --no-frozen-lockfile --ignore-scripts)

          for attempt in 1 2 3; do
            if "${install_cmd[@]}"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "eliza bun install failed after ${attempt} attempts" >&2
              exit 1
            fi

            echo "eliza bun install failed on attempt ${attempt}; retrying in 15 seconds" >&2
            sleep 15
          done

      - name: Hydrate eliza Bun package postinstall
        # bun is hoisted to top-level node_modules in some setups; only hydrate
        # the eliza-nested copy when it actually exists.
        run: |
          if [ -f eliza/node_modules/bun/install.js ]; then
            (cd eliza/node_modules/bun && node install.js)
          else
            echo "eliza/node_modules/bun not present (likely hoisted) — skipping hydration"
          fi

      # ── 5b. Install build fallback dependencies ────────────────────────────
      # Hydrate published-only dependency fallbacks first so package-local builds
      # can resolve @noble/*, @types/*, and other third-party deps while
      # postinstall skips the expensive repo-local upstream setup.
      - name: Install published-workspace fallback dependencies
        run: bash scripts/install-published-workspace-fallback-deps.sh

      # ── 5c. Run postinstall patches ────────────────────────────────────────
      - name: Run postinstall patches
        run: bun run postinstall
        env:
          SKIP_AVATAR_CLONE: "1"
          MILADY_NO_VISION_DEPS: "1"
          MILADY_SKIP_LOCAL_UPSTREAMS: "1"

      # ── 6. Build Capacitor plugins ──────────────────────────────────────────
      # The Vite UI imports @elizaos/capacitor-* workspace packages which need
      # their dist/ built before vite can resolve them.
      - name: Build Capacitor plugins
        run: |
          node eliza/packages/app-core/scripts/build-native-plugins.mjs

      # ── 6.4. Generate protobuf types ────────────────────────────────────────
      # eliza/packages/app-core/scripts/ensure-generated-core-proto-js.mjs
      # (invoked from the agent Dockerfile) errors out when the proto outputs
      # under eliza/packages/core/src/types/generated/eliza/v1 are missing.
      # Run buf generate when the v1 outputs are absent (an empty `generated/`
      # parent directory still trips the script).
      - name: Generate protobuf types
        run: |
          if [ -d eliza/packages/schemas ] && [ -f eliza/packages/schemas/buf.gen.yaml ] && [ ! -d eliza/packages/core/src/types/generated/eliza/v1 ]; then
            cd eliza/packages/schemas
            node node_modules/@bufbuild/buf/install.js 2>/dev/null || true
            bunx @bufbuild/buf@1.67.0 generate
          fi
          ls -la eliza/packages/core/src/types/generated/eliza/v1 2>/dev/null || echo "WARN: proto generated dir still missing"

      # ── 6.5. Build leaf @elizaos packages consumed with default (dist) types ─
      # @elizaos/core imports @elizaos/logger and @elizaos/shared imports
      # @elizaos/contracts. Both packages default their "." export "types" to
      # ./dist/index.d.ts and only expose ./src under the "eliza-source"
      # condition, which is NOT active in these per-package `tsc` builds — so
      # their dist must exist before core/shared typecheck or it fails with
      # TS2307 "Cannot find module". Both are leaf packages (no @elizaos/* deps).
      - name: Build @elizaos/logger
        run: |
          cd eliza/packages/logger
          bun run build

      - name: Build @elizaos/contracts
        run: |
          cd eliza/packages/contracts
          bun run build

      # ── 6.6. Build eliza runtime packages needed by the agent image ─────────
      - name: Build @elizaos/core
        run: |
          cd eliza/packages/core
          bun run build

      # ── 7. Build runtime workspace packages with source exports ─────────────
      - name: Build agent workspace
        run: |
          cd eliza/packages/agent
          bun run build:docker-dist

      - name: Build @elizaos/shared
        run: |
          cd eliza/packages/shared
          bun run build

      # ── 7.5. Build @elizaos/app-core ────────────────────────────────────────
      # browser.ts (the Vite alias target for @elizaos/app-core) re-exports
      # from ../dist/index.js. Build the dist first so Vite can resolve it.
      - name: Build @elizaos/app-core
        run: |
          cd eliza/packages/app-core
          bun run build

      - name: Reapply app-core package style patches
        run: node scripts/patch-elizaos-package-styles.mjs

      # ── 8. Link local @elizaos workspace packages into node_modules ─────────
      # The vite build below imports symbols from @elizaos/ui (createVoiceCapture,
      # VoicePill, VoicePillMessage, VoiceCaptureHandle) that ship in the
      # repo-local eliza/packages/ui but have not yet landed on the npm alpha
      # dist-tag (currently @elizaos/ui@2.0.0-alpha.537). Without this step,
      # vite resolves @elizaos/ui from npm and the build fails with
      # `"createVoiceCapture" is not exported by "@elizaos/ui"`.
      #
      # Postinstall skips elizaOS's repo-local link step under
      # MILADY_SKIP_LOCAL_UPSTREAMS=1, so we invoke the linker explicitly here
      # — after the local eliza packages have been built — to symlink every
      # local @elizaos/* workspace package over the npm-installed copy. The
      # script also rewrites each package's `exports` to point at TS source
      # when the dist artifact is absent, which is what lets vite import the
      # ui package directly from `eliza/packages/ui/src`.
      - name: Link local @elizaos workspace packages
        run: node eliza/packages/app-core/scripts/link-docker-local-app-packages.mjs

      # ── 9. Build runtime (tsdown) ───────────────────────────────────────────
      - name: Build runtime (tsdown)
        run: |
          # bun npm package ships a postinstall (install.js) that sets up
          # the runtime-embedded build plugins. --ignore-scripts in step 5
          # skipped it; run it manually so rolldown/tsdown can use Bun APIs.
          if [ -d node_modules/bun ] && [ -f node_modules/bun/install.js ]; then
            (cd node_modules/bun && node install.js) || true
          fi
          node scripts/run-tsdown.mjs
          echo '{"type":"module"}' > dist/package.json
          # write-build-info.ts may not exist on all branches — soft fail
          node --import tsx eliza/packages/app-core/scripts/write-build-info.ts 2>/dev/null || true

      # ── 10. Determine version ───────────────────────────────────────────────
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            # Triggered by release event — use the release tag
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Branch push (develop) — use package.json version with dev suffix
            VERSION="v$(node -p "require('./package.json').version")-dev"
          fi

          VERSION_CLEAN="${VERSION#v}"

          # Only treat explicit versioned builds as releases.
          IS_RELEASE="false"
          TAG_LATEST="false"
          if [[ -n "${{ inputs.version }}" ]] || [[ -n "${{ github.event.release.tag_name }}" ]] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IS_RELEASE="true"
            if [[ "${{ inputs.tag_latest }}" != "false" ]]; then
              TAG_LATEST="true"
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "version_clean=${VERSION_CLEAN}"
            echo "is_release=${IS_RELEASE}"
            echo "tag_latest=${TAG_LATEST}"
          } >> "$GITHUB_OUTPUT"

          echo "Version:    ${VERSION}"
          echo "Clean:      ${VERSION_CLEAN}"
          echo "Is release: ${IS_RELEASE}"
          echo "Tag latest: ${TAG_LATEST}"
          echo "Source SHA: $(git rev-parse HEAD)"

      - name: Load deploy config
        run: |
          set -a
          source eliza/packages/app-core/deploy/deploy.defaults.env
          if [ -f deploy/deploy.env ]; then
            source deploy/deploy.env
          fi
          set +a
          {
            echo "APP_ENTRYPOINT=${APP_ENTRYPOINT}"
            echo "APP_PORT=${APP_PORT}"
            echo "APP_API_BIND=${APP_API_BIND}"
            echo "OCI_SOURCE=${OCI_SOURCE}"
            echo "OCI_LICENSES=${OCI_LICENSES}"
            echo "APP_CMD_START<<EOF"
            echo "${APP_CMD_START}"
            echo "EOF"
            echo "OCI_TITLE<<EOF"
            echo "${OCI_TITLE}"
            echo "EOF"
            echo "OCI_DESCRIPTION<<EOF"
            echo "${OCI_DESCRIPTION}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # ── 11. Build UI (vite) ─────────────────────────────────────────────────
      # MILADY_FORCE_LOCAL_UPSTREAMS=1 forces apps/app/vite.config.ts to treat
      # the freshly-linked eliza/ checkout as the source of truth for the
      # @elizaos/* aliases (created by the "Link local @elizaos workspace
      # packages" step above). Without this, the config falls back to the
      # auto-detect heuristic and may resolve @elizaos/ui from npm, which
      # lacks the createVoiceCapture / VoicePill exports used by main.tsx.
      - name: Build UI (vite)
        run: |
          cd apps/app
          bun run build:web
        env:
          MILADY_RELEASE_TAG: ${{ steps.version.outputs.is_release == 'true' && steps.version.outputs.version || '' }}
          VITE_ASSET_BASE_URL: ${{ steps.version.outputs.is_release == 'true' && format('https://raw.githubusercontent.com/milady-ai/milady/{0}/apps/app/public/', steps.version.outputs.version) || '' }}
          NODE_ENV: production
          MILADY_FORCE_LOCAL_UPSTREAMS: "1"

      # ── 12. Override dockerignore to include pre-built dist/ ────────────────
      # The repo's .dockerignore excludes dist/ to keep developer Docker builds clean.
      # For CI, dist/ is pre-built by GHA so we need it in the build context.
      # We use eliza/packages/app-core/deploy/.dockerignore.ci (tracked in the
      # repo) instead of the default.
      - name: Set up CI dockerignore
        run: cp eliza/packages/app-core/deploy/.dockerignore.ci .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      # ── 13. Login to GHCR ───────────────────────────────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        if: ${{ github.event_name == 'push' || inputs.push_image != false }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 14. Docker image metadata ───────────────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.tag_latest == 'true' }}
            type=raw,value=dev,enable=${{ steps.version.outputs.is_release == 'false' }}

      # ── 15. Build and push Docker image ────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: eliza/packages/app-core/deploy/Dockerfile.ci
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.push_image != false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_CORE_DIR=eliza/packages/app-core
            AGENT_DIR=eliza/packages/agent
            APP_DIR=apps/app
            APP_ENTRYPOINT=${{ env.APP_ENTRYPOINT }}
            APP_CMD_START=${{ env.APP_CMD_START }}
            APP_PORT=${{ env.APP_PORT }}
            APP_API_BIND=${{ env.APP_API_BIND }}
            OCI_SOURCE=${{ env.OCI_SOURCE }}
            OCI_TITLE=${{ env.OCI_TITLE }}
            OCI_DESCRIPTION=${{ env.OCI_DESCRIPTION }}
            OCI_LICENSES=${{ env.OCI_LICENSES }}
            VERSION=${{ steps.version.outputs.version }}
            VERSION_CLEAN=${{ steps.version.outputs.version_clean }}
            REVISION=${{ github.sha }}
            MILADY_RELEASE_TAG=${{ steps.version.outputs.is_release == 'true' && steps.version.outputs.version || '' }}
          provenance: false

      # ── 16. Build summary ───────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          {
            echo "## 🐳 Milady Docker Image"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Registry | \`${{ env.REGISTRY }}\` |"
            echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Tagged latest | \`${{ steps.version.outputs.tag_latest }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Requested SHA | \`${{ inputs.source_sha || github.sha }}\` |"
            echo "| Built SHA | \`$(git rev-parse HEAD)\` |"
            echo ""
            echo "### Pull commands"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            if [ "${{ steps.version.outputs.tag_latest }}" = "true" ]; then
              echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
