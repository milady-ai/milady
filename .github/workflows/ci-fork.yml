name: CI (Fork)

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-fork-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  lint:
    name: Lint & Format
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile
          prepare-local-eliza-runtime: "true"
          skip-cloud-submodule: "true"

      - name: Restore eliza workspace paths for repo scripts
        run: node scripts/restore-local-eliza-workspace.mjs

      - name: Biome lint
        run: bun run verify:lint

      - name: Biome format check
        run: bunx @biomejs/biome format scripts/validate-ci-bootstrap-contract.mjs

  typecheck:
    name: Type Check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile
          prepare-local-eliza-runtime: "true"
          skip-cloud-submodule: "true"

      - name: Restore eliza workspace paths for repo scripts
        run: node scripts/restore-local-eliza-workspace.mjs

      - name: Run type checker
        run: bun run verify:typecheck

  test:
    name: Targeted Tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile
          prepare-local-eliza-runtime: "true"
          skip-cloud-submodule: "true"

      - name: Restore eliza workspace paths for repo scripts
        run: node scripts/restore-local-eliza-workspace.mjs

      - name: Run onboarding voice regression tests
        run: bunx vitest run eliza/packages/app-core/src/onboarding/tests/flow.test.ts
        env:
          NODE_NO_WARNINGS: "1"

  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile
          prepare-local-eliza-runtime: "true"
          skip-cloud-submodule: "true"

      - name: Restore eliza workspace paths for repo scripts
        run: node scripts/restore-local-eliza-workspace.mjs

      # Link local @elizaos workspace packages into node_modules. `bun run build`
      # invokes vite (via scripts/run-production-build.mjs), which imports
      # symbols from @elizaos/ui (createVoiceCapture, VoicePill, VoicePillMessage,
      # VoiceCaptureHandle) that ship in repo-local eliza/packages/ui but have
      # not landed on the npm alpha dist-tag yet (currently
      # @elizaos/ui@2.0.0-alpha.537). Without this step, vite resolves
      # @elizaos/ui from npm and the build fails with
      # `"createVoiceCapture" is not exported by "@elizaos/ui"`.
      - name: Link local @elizaos workspace packages
        run: |
          if [ -f eliza/packages/app-core/scripts/link-docker-local-app-packages.mjs ]; then
            node eliza/packages/app-core/scripts/link-docker-local-app-packages.mjs
            echo "MILADY_FORCE_LOCAL_UPSTREAMS=1" >> "$GITHUB_ENV"
          else
            echo "eliza checkout absent; package-mode build will use installed @elizaos packages"
          fi

      # MILADY_FORCE_LOCAL_UPSTREAMS=1 forces apps/app/vite.config.ts to treat
      # the freshly-linked eliza/ checkout as the source of truth for the
      # @elizaos/* aliases.
      - name: Build project
        run: bun run build

      - name: Build homepage
        run: bun run build:web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
