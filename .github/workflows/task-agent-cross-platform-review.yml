name: Task Agent Cross-Platform Review

on:
  workflow_dispatch:

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "22.20.0"
  NODE_NO_WARNINGS: "1"
  MILADY_SKIP_LOCAL_UPSTREAMS: "1"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  coordinator-platform-review:
    name: Coordinator Platform Review (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Set-GitLongPaths([string]$Scope) {
            & git config $Scope core.longpaths true
            if ($LASTEXITCODE -ne 0) {
              throw "git config $Scope core.longpaths true failed with exit code $LASTEXITCODE"
            }
          }

          try {
            Set-GitLongPaths "--system"
            Write-Host "Enabled Git long paths in system config."
          } catch {
            Write-Warning "System git config failed; falling back to --global. $($_.Exception.Message)"
            Set-GitLongPaths "--global"
            Write-Host "Enabled Git long paths in global config."
          }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: false

      - name: Initialize tracked workspace submodules
        run: node scripts/init-submodules.mjs

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        shell: bash
        # Retry once: github: deps (e.g. node-llama-cpp) can hit transient
        # GitHub resolution/rate-limit failures on non-frozen installs.
        run: bun install --ignore-scripts || (sleep 5 && bun install --ignore-scripts)

      - name: Run repository postinstall
        run: bun run postinstall
        env:
          SKIP_AVATAR_CLONE: "1"
          MILADY_NO_VISION_DEPS: "1"

      - name: Run coordinator platform review
        run: node eliza/packages/app-core/scripts/coordinator-cross-platform-review.mjs

      - name: Upload review artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: task-agent-cross-platform-review-${{ matrix.os }}
          path: .tmp/qa/
          retention-days: 14
