name: Android APK build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build"
        required: false
        default: develop

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.ref }}
          submodules: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          install-command: bun install --ignore-scripts --no-frozen-lockfile
          install-native-deps: "false"
          run-postinstall: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          preserve-android-sdk: "true"
          skip-cloud-submodule: "true"
      - name: Restore legacy electrobun compatibility path
        run: node scripts/ensure-legacy-electrobun-compat.mjs
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456"
      - name: Prepare Android project
        run: node eliza/packages/app-core/scripts/run-mobile-build.mjs android
      - name: Build APK
        working-directory: apps/app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-apk
          path: apps/app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
