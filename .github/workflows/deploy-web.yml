name: Deploy Web

on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/deploy-web.yml"
      - "apps/homepage/**"
      - "scripts/write-homepage-release-data.mjs"
      - "install.sh"
      - "install.ps1"
      - "package.json"
      - "bun.lock"
  workflow_call:
    inputs:
      release_version:
        description: "Release tag override for homepage metadata (e.g. v2.0.0-alpha.87)"
        required: false
        type: string
  workflow_dispatch:

concurrency:
  group: homepage-pages
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"
  CI: "true"

jobs:
  deploy:
    name: Build and Publish Homepage
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout current ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Published-only CI restores required non-eliza submodules during setup.
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-homepage-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-homepage-${{ runner.os }}-

      - name: Initialize tracked workspace submodules
        run: node scripts/init-submodules.mjs

      - name: Disable repo-local eliza workspace
        run: node scripts/disable-local-eliza-workspace.mjs

      - name: Install dependencies
        # Retry once: github: deps (e.g. node-llama-cpp) can hit transient
        # GitHub resolution/rate-limit failures on non-frozen installs.
        run: bun install --ignore-scripts || (sleep 5 && bun install --ignore-scripts)

      - name: Generate release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILADY_RELEASE_TAG: ${{ inputs.release_version }}
        run: node scripts/write-homepage-release-data.mjs

      - name: Build homepage
        run: cd apps/homepage && bunx vite build

      - name: Stage GitHub Pages files
        run: |
          cp install.sh apps/homepage/dist/install.sh
          cp install.ps1 apps/homepage/dist/install.ps1

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./apps/homepage/dist
