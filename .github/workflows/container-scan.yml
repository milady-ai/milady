# SOC2 CC6.2 / A1.3 — vulnerability scanning of container images.
# Fails the build on CRITICAL CVEs; annotates on HIGH.
name: container-scan

on:
  pull_request:
    paths:
      - 'deploy/Dockerfile.ci'
      - 'deploy/**'
      - '.github/workflows/container-scan.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'deploy/Dockerfile.ci'
      - 'deploy/**'
  workflow_dispatch:
    inputs:
      allow_high:
        description: 'Treat HIGH findings as warnings (annotation only) rather than failing'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Trivy filesystem scan (config + IaC)
        # aquasecurity/trivy-action@0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463
        with:
          sarif_file: 'trivy-fs.sarif'
          category: trivy-fs

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Check image Dockerfile
        id: image-dockerfile
        run: |
          if [ -f deploy/Dockerfile.ci ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "deploy/Dockerfile.ci is absent; skipping image scan."
          fi

      # Build only — do not push. We scan the local OCI tarball.
      - name: Set up Docker Buildx
        if: steps.image-dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build agent image (no push)
        if: steps.image-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/Dockerfile.ci
          push: false
          load: true
          tags: localhost/eliza-agent:scan
          outputs: type=docker

      # Hard gate: any CRITICAL fails the job.
      - name: Trivy image scan (fail on CRITICAL)
        if: steps.image-dockerfile.outputs.exists == 'true'
        # aquasecurity/trivy-action@0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'localhost/eliza-agent:scan'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

      # Soft gate: HIGH writes SARIF + annotates, but does not fail unless
      # the dispatcher disables allow_high.
      - name: Trivy image scan (HIGH -> SARIF)
        if: always() && steps.image-dockerfile.outputs.exists == 'true'
        # aquasecurity/trivy-action@0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'localhost/eliza-agent:scan'
          severity: 'HIGH'
          exit-code: ${{ github.event.inputs.allow_high == 'false' && '1' || '0' }}
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-image-high.sarif'

      - name: Upload HIGH SARIF
        if: always() && steps.image-dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463
        with:
          sarif_file: 'trivy-image-high.sarif'
          category: trivy-image-high
