# SOC2 CC6.2 / A1.3 — vulnerability scanning of container images.
# Fails the build on CRITICAL CVEs; annotates on HIGH.
name: container-scan

on:
  pull_request:
    paths:
      - 'deploy/Dockerfile.ci'
      - 'deploy/**'
      - '.github/workflows/container-scan.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'deploy/Dockerfile.ci'
      - 'deploy/**'
  workflow_dispatch:
    inputs:
      allow_high:
        description: 'Treat HIGH findings as warnings (annotation only) rather than failing'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Trivy filesystem scan (config + IaC)
        # aquasecurity/trivy-action@0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: 'trivy-fs.sarif'
          category: trivy-fs

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check image Dockerfile
        id: image-dockerfile
        run: |
          if [ -f deploy/Dockerfile.ci ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "deploy/Dockerfile.ci is absent; skipping image scan."
          fi

      # Build only — do not push. We scan the local OCI tarball.
      - name: Set up Docker Buildx
        if: steps.image-dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build agent image (no push)
        if: steps.image-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile.ci
          push: false
          load: true
          tags: localhost/eliza-agent:scan
          outputs: type=docker

      # Hard gate: any CRITICAL fails the job.
      - name: Trivy image scan (fail on CRITICAL)
        if: steps.image-dockerfile.outputs.exists == 'true'
        # aquasecurity/trivy-action@0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'localhost/eliza-agent:scan'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

      # Soft gate: HIGH writes SARIF + annotates, but does not fail unless
      # the dispatcher disables allow_high.
      - name: Trivy image scan (HIGH -> SARIF)
        if: always() && steps.image-dockerfile.outputs.exists == 'true'
        # aquasecurity/trivy-action@0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'localhost/eliza-agent:scan'
          severity: 'HIGH'
          exit-code: ${{ github.event.inputs.allow_high == 'false' && '1' || '0' }}
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-image-high.sarif'

      - name: Upload HIGH SARIF
        if: always() && steps.image-dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: 'trivy-image-high.sarif'
          category: trivy-image-high
