<!-- concept-D03-L4 | direction: Classic Chat + Voice Dock | look: Clean System Light | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D03 · Classic Chat + Voice Dock · Clean System Light</title>
<style>
:root{
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --surface-2:#FFFFFF;
  --border:rgba(60,60,67,0.18);
  --text:#1C1C1E;
  --text-secondary:rgba(60,60,67,0.60);
  --text-muted:#8E8E93;
  --accent:#0A84FF;
  --accent-2:#30D158;
  --danger:#FF3B30;
  --radius:13px;
  --radius-sm:9px;
  --font:"SF Pro Text",-apple-system,"Segoe UI Variable","Helvetica Neue",system-ui,sans-serif;
  --shadow:0 8px 30px rgba(0,0,0,0.12);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.10);
  --ease:cubic-bezier(.32,.72,0,1);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:var(--font);
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.app-window{
  width:420px;
  height:760px;
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:0.5px solid var(--border);
}

/* Header */
.header{
  padding:14px 16px 12px;
  background:rgba(242,242,247,0.9);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;
}
.header-avatar{
  width:36px;height:36px;
  border-radius:50%;
  flex-shrink:0;
}
.header-info{flex:1;}
.header-name{font-size:15px;font-weight:590;color:var(--text);letter-spacing:-0.02em;}
.header-status{font-size:12px;color:var(--text-muted);margin-top:1px;}
.header-btn{
  width:28px;height:28px;
  border-radius:50%;
  background:rgba(118,118,128,0.12);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-muted);font-size:13px;
  transition:background 0.2s var(--ease);
}
.header-btn:hover{background:rgba(10,132,255,0.12);color:var(--accent);}

/* Thread */
.thread{
  flex:1;overflow-y:auto;
  padding:12px 14px 8px;
  scroll-behavior:smooth;
  display:flex;flex-direction:column;gap:2px;
  -webkit-overflow-scrolling:touch;
}
.thread::-webkit-scrollbar{width:0;}

/* Empty state */
.empty-state{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;padding:28px;text-align:center;
}
.empty-title{font-size:17px;font-weight:590;color:var(--text);letter-spacing:-0.02em;}
.empty-subtitle{font-size:14px;color:var(--text-muted);line-height:1.5;}

/* Chips */
.chips-row{
  display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:4px;
}
.chip{
  padding:7px 14px;
  background:var(--bg);
  border-radius:20px;
  font-size:13px;font-weight:400;
  color:var(--accent);cursor:pointer;
  transition:all 0.2s var(--ease);
  border:0.5px solid rgba(10,132,255,0.3);
}
.chip:hover{background:rgba(10,132,255,0.08);}
.chip:active{transform:scale(0.96);}
.chip.followup{font-size:12px;padding:5px 12px;background:rgba(10,132,255,0.06);}

/* Messages */
.msg-group{margin-bottom:8px;animation:msgIn 0.28s var(--ease);}
@keyframes msgIn{from{opacity:0;transform:scale(0.97) translateY(4px);}to{opacity:1;transform:scale(1) translateY(0);}}

.msg-row{display:flex;gap:7px;align-items:flex-end;margin-bottom:1px;}
.msg-row.user{flex-direction:row-reverse;}

.bubble{
  max-width:74%;
  padding:10px 13px;
  font-size:15px;line-height:1.45;
  position:relative;
}
.bubble.assistant{
  background:var(--bg);
  border-radius:var(--radius-sm) var(--radius-sm) var(--radius-sm) 4px;
  color:var(--text);
}
.bubble.user{
  background:var(--accent);
  color:#fff;
  border-radius:var(--radius-sm) var(--radius-sm) 4px var(--radius-sm);
}
.bubble.partial{opacity:0.6;}

.msg-meta{
  display:flex;align-items:center;gap:4px;
  font-size:10px;color:var(--text-muted);
  padding:0 2px;
}
.msg-meta.user{flex-direction:row-reverse;}
.modality-glyph{
  width:14px;height:14px;
  border-radius:50%;
  background:rgba(142,142,147,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:7px;
}

.interrupted-badge{
  display:inline-flex;align-items:center;gap:3px;
  background:rgba(255,59,48,0.1);
  color:var(--danger);
  font-size:10px;font-weight:500;
  padding:2px 7px;border-radius:20px;
  margin-top:4px;
}

.msg-attachment{
  width:56px;height:56px;border-radius:10px;
  background:linear-gradient(135deg,rgba(10,132,255,0.15),rgba(48,209,88,0.15));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;margin-top:4px;
  overflow:hidden;
}

/* App card */
.app-card{
  background:var(--surface);
  border-radius:var(--radius-sm);
  overflow:hidden;margin-top:8px;
  box-shadow:0 2px 12px rgba(0,0,0,0.09);
  max-width:270px;
  border:0.5px solid var(--border);
}
.app-card-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  border-bottom:0.5px solid var(--border);
  background:rgba(242,242,247,0.5);
}
.app-icon{
  width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,#64B5F6,var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
}
.app-card-name{font-size:11px;font-weight:600;color:var(--text-secondary);}
.app-card-body{padding:12px;}
.weather-big{font-size:36px;font-weight:200;color:var(--text);line-height:1;letter-spacing:-0.03em;}
.weather-desc{font-size:13px;color:var(--text-muted);margin-top:3px;}
.weather-detail{font-size:12px;color:var(--text-muted);margin-top:7px;display:flex;gap:12px;}
.app-card-actions{padding:8px 12px;border-top:0.5px solid var(--border);display:flex;gap:8px;}
.card-btn{
  flex:1;padding:7px;
  border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;
  border:0.5px solid var(--border);
  background:var(--bg);color:var(--accent);cursor:pointer;
  transition:all 0.2s var(--ease);text-align:center;
}
.card-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.card-btn:hover{opacity:0.8;}
.card-expand{font-size:11px;color:var(--accent);text-align:right;padding:3px 12px 7px;cursor:pointer;}

/* Voice Dock */
.voice-dock{
  background:var(--bg);
  border-top:0.5px solid var(--border);
  border-bottom:0.5px solid var(--border);
  padding:10px 16px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}

.dock-orb{
  width:40px;height:40px;
  border-radius:50%;flex-shrink:0;cursor:pointer;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
#dock-canvas{display:block;border-radius:50%;}

.dock-info{flex:1;min-width:0;}
.dock-label{
  font-size:13px;font-weight:590;color:var(--text);
  display:flex;align-items:center;gap:6px;letter-spacing:-0.01em;
}
.dock-sublabel{font-size:11px;color:var(--text-muted);margin-top:1px;}
.live-indicator{
  display:none;align-items:center;gap:4px;
  font-size:11px;font-weight:600;color:var(--accent-2);
}
.live-indicator.visible{display:flex;}
.live-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent-2);
  animation:livePulse 1s ease-in-out infinite;
}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}
.muted-label{
  display:none;font-size:11px;font-weight:600;color:var(--danger);
}
.muted-label.visible{display:block;}

/* Amplitude bars */
.waveform{display:flex;align-items:center;gap:2px;height:18px;margin-top:3px;}
.wave-bar{width:3px;border-radius:2px;background:var(--accent);transition:height 0.1s ease;}

.dock-controls{display:flex;align-items:center;gap:7px;}
.dock-btn{
  width:30px;height:30px;
  border-radius:50%;
  background:rgba(118,118,128,0.12);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;
  color:var(--text-muted);
  transition:all 0.2s var(--ease);border:none;
}
.dock-btn:hover{background:rgba(10,132,255,0.12);color:var(--accent);}
.dock-btn.danger:hover{background:rgba(255,59,48,0.12);color:var(--danger);}
.dock-btn.muted-active{background:rgba(255,59,48,0.12);color:var(--danger);}

/* Composer */
.composer{
  padding:8px 14px 14px;
  background:var(--surface);flex-shrink:0;
}
.attach-chips{display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap;}
.attach-chip{
  display:flex;align-items:center;gap:5px;
  background:var(--bg);
  border:0.5px solid var(--border);
  border-radius:8px;
  padding:4px 8px 4px 5px;
  font-size:11px;color:var(--text-muted);
}
.attach-thumb{
  width:26px;height:26px;border-radius:6px;
  background:linear-gradient(135deg,rgba(10,132,255,0.15),rgba(48,209,88,0.15));
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;
}
.attach-remove{cursor:pointer;color:var(--text-muted);font-size:11px;font-weight:600;}
.attach-remove:hover{color:var(--danger);}

.composer-row{display:flex;align-items:flex-end;gap:8px;}
.attach-btn{
  width:32px;height:32px;
  border-radius:50%;
  background:rgba(118,118,128,0.12);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-muted);
  font-size:18px;font-weight:300;flex-shrink:0;
  transition:all 0.2s var(--ease);border:none;line-height:1;
}
.attach-btn:hover{background:rgba(10,132,255,0.1);color:var(--accent);}

.input-wrap{
  flex:1;
  background:var(--bg);
  border-radius:var(--radius-sm);
  display:flex;align-items:flex-end;
  padding:8px 10px 8px 12px;
  border:0.5px solid var(--border);
  transition:border-color 0.2s;
}
.input-wrap:focus-within{border-color:rgba(10,132,255,0.4);}

textarea#composer-input{
  flex:1;border:none;background:transparent;
  font-family:var(--font);font-size:15px;
  color:var(--text);resize:none;outline:none;
  min-height:20px;max-height:80px;line-height:1.4;
}
textarea#composer-input::placeholder{color:var(--text-muted);}

.send-btn{
  width:30px;height:30px;
  border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;flex-shrink:0;
  transition:all 0.25s var(--ease);margin-left:4px;
}
.send-btn.mic{
  background:var(--accent);color:#fff;
  box-shadow:0 2px 8px rgba(10,132,255,0.4);
}
.send-btn.send{
  background:var(--accent);color:#fff;
  box-shadow:0 2px 8px rgba(10,132,255,0.4);
}
.send-btn.stop{
  background:var(--danger);color:#fff;
  box-shadow:0 2px 8px rgba(255,59,48,0.4);
}

.typing-chips{
  display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;
  transition:opacity 0.2s var(--ease);
}
.typing-chips.hidden{opacity:0;pointer-events:none;}

.time-divider{
  text-align:center;font-size:11px;color:var(--text-muted);
  padding:6px 0;font-weight:400;
}

.demo-btn{
  position:fixed;bottom:20px;right:20px;
  padding:9px 18px;
  background:var(--surface);
  border:0.5px solid var(--border);
  border-radius:20px;
  font-family:var(--font);font-size:13px;font-weight:590;
  color:var(--accent);cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:all 0.2s var(--ease);z-index:100;
}
.demo-btn:hover{box-shadow:var(--shadow);}

@media(min-width:900px){body{align-items:center;}}
</style>
</head>
<body>

<div class="app-window">
  <div class="header">
    <canvas id="header-canvas" width="36" height="36" style="border-radius:50%;"></canvas>
    <div class="header-info">
      <div class="header-name">Eliza</div>
      <div class="header-status" id="header-status">Ready to help</div>
    </div>
    <div class="header-btn">···</div>
  </div>

  <div class="thread" id="thread">
    <div class="empty-state" id="empty-state">
      <canvas id="avatar-canvas" width="72" height="72" style="border-radius:50%;"></canvas>
      <div class="empty-title">Hi, how can I help?</div>
      <div class="empty-subtitle">Ask anything, or try one of these</div>
      <div class="chips-row" id="starter-chips">
        <div class="chip" onclick="useChip(this)">Today's weather</div>
        <div class="chip" onclick="useChip(this)">My schedule</div>
        <div class="chip" onclick="useChip(this)">Play music</div>
        <div class="chip" onclick="useChip(this)">Brainstorm</div>
      </div>
    </div>
  </div>

  <div class="voice-dock" id="voice-dock">
    <div class="dock-orb" onclick="toggleVoice()">
      <canvas id="dock-canvas" width="40" height="40" style="border-radius:50%;"></canvas>
    </div>

    <div class="dock-info">
      <div class="dock-label">
        <span id="dock-label-text">Hold to talk</span>
        <div class="live-indicator" id="live-indicator">
          <div class="live-dot"></div>
          <span>Listening…</span>
        </div>
      </div>
      <div class="dock-sublabel" id="dock-sublabel">Tap for hands-free</div>
      <div class="muted-label" id="muted-label">Muted</div>
      <div class="waveform" id="waveform" style="display:none;">
        <div class="wave-bar" style="height:4px;" id="wb1"></div>
        <div class="wave-bar" style="height:7px;" id="wb2"></div>
        <div class="wave-bar" style="height:11px;" id="wb3"></div>
        <div class="wave-bar" style="height:5px;" id="wb4"></div>
        <div class="wave-bar" style="height:9px;" id="wb5"></div>
        <div class="wave-bar" style="height:3px;" id="wb6"></div>
        <div class="wave-bar" style="height:8px;" id="wb7"></div>
      </div>
    </div>

    <div class="dock-controls">
      <div class="dock-btn" id="mute-btn" onclick="toggleMute()">🎙</div>
      <div class="dock-btn danger" onclick="endVoice()">✕</div>
    </div>
  </div>

  <div class="composer">
    <div class="attach-chips" id="attach-chips" style="display:none;"></div>
    <div class="composer-row">
      <div class="attach-btn" onclick="addAttachment()">+</div>
      <div class="input-wrap">
        <textarea id="composer-input" placeholder="Message" rows="1"></textarea>
      </div>
      <button class="send-btn mic" id="send-btn" onclick="handleSendBtn()">🎙</button>
    </div>
    <div class="typing-chips" id="typing-chips">
      <div class="chip followup" onclick="useChip(this)">Make shorter</div>
      <div class="chip followup" onclick="useChip(this)">Expand on this</div>
    </div>
  </div>
</div>

<button class="demo-btn" onclick="runDemo()">▶ Play demo</button>

<script>
let voiceState = 'idle';
let isMuted = false;
let isGenerating = false;
let pendingAttachments = [];
let demoTimers = [];
let hasMessages = false;
let time = 0;
let micLevel = 0;
let ttsLevel = 0;

const headerCanvas = document.getElementById('header-canvas');
const hCtx = headerCanvas.getContext('2d');
const avatarCanvas = document.getElementById('avatar-canvas');
const aCtx = avatarCanvas.getContext('2d');
const dockCanvas = document.getElementById('dock-canvas');
const dCtx = dockCanvas.getContext('2d');

// Gemini/Siri-inspired multi-hue orb
function drawSystemOrb(ctx, w, h, state, t, mic, tts){
  ctx.clearRect(0,0,w,h);
  const cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 2;

  if(state === 'idle'){
    // Soft breathing blue sphere
    const pulse = 0.92 + 0.08*Math.sin(t*0.7);
    const grad = ctx.createRadialGradient(cx-r*0.3, cy-r*0.3, r*0.1, cx, cy, r*pulse);
    grad.addColorStop(0,'rgba(100,185,255,0.9)');
    grad.addColorStop(0.5,'rgba(10,132,255,0.7)');
    grad.addColorStop(1,'rgba(0,80,200,0.5)');
    ctx.fillStyle = grad;
    ctx.beginPath();ctx.arc(cx,cy,r*pulse,0,Math.PI*2);ctx.fill();
    // Ring
    ctx.strokeStyle = 'rgba(10,132,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  } else if(state === 'listening'){
    // Blue ring ripples with amplitude
    const pulse = 0.8 + mic*0.2;
    const grad = ctx.createRadialGradient(cx-r*0.25, cy-r*0.25, r*0.05, cx, cy, r);
    grad.addColorStop(0,'rgba(80,220,180,0.9)');
    grad.addColorStop(0.5,'rgba(10,132,255,0.7)');
    grad.addColorStop(1,'rgba(10,80,180,0.5)');
    ctx.fillStyle = grad;
    ctx.beginPath();ctx.arc(cx,cy,r*0.7,0,Math.PI*2);ctx.fill();
    // Ripple rings
    for(let ring=0;ring<3;ring++){
      const rr = r*(0.75 + ring*0.1 + mic*0.08);
      const alpha = Math.max(0,(0.4 - ring*0.12)*mic);
      ctx.strokeStyle = `rgba(10,132,255,${alpha})`;
      ctx.lineWidth = 1.5 - ring*0.4;
      ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.stroke();
    }
  } else if(state === 'thinking'){
    // Multi-hue shimmer: blue→teal→indigo
    const hue = 200 + 60*Math.sin(t*0.7);
    const hue2 = 250 + 40*Math.cos(t*0.5);
    const grad = ctx.createLinearGradient(
      cx + Math.cos(t)*r*0.5, cy + Math.sin(t)*r*0.5,
      cx - Math.cos(t)*r*0.5, cy - Math.sin(t)*r*0.5
    );
    grad.addColorStop(0,`hsla(${hue},90%,60%,0.9)`);
    grad.addColorStop(1,`hsla(${hue2},80%,50%,0.8)`);
    ctx.fillStyle = grad;
    ctx.beginPath();ctx.arc(cx,cy,r*0.75,0,Math.PI*2);ctx.fill();
    // Outer ring slowly rotating
    ctx.strokeStyle = `hsla(${hue},70%,65%,0.4)`;
    ctx.lineWidth = 2;
    ctx.setLineDash([4,8]);
    ctx.lineDashOffset = t*20;
    ctx.beginPath();ctx.arc(cx,cy,r*0.9,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  } else if(state === 'speaking'){
    // Steady amplitude pulse - blue with green tint
    const pulse = 0.75 + tts*0.2;
    const grad = ctx.createRadialGradient(cx-r*0.2, cy-r*0.2, r*0.05, cx, cy, r*pulse);
    grad.addColorStop(0,'rgba(120,240,200,0.9)');
    grad.addColorStop(0.4,'rgba(10,132,255,0.8)');
    grad.addColorStop(1,'rgba(30,100,200,0.5)');
    ctx.fillStyle = grad;
    ctx.beginPath();ctx.arc(cx,cy,r*pulse,0,Math.PI*2);ctx.fill();
    // Outer pulse
    const outerR = r*(0.9 + tts*0.1);
    ctx.strokeStyle = `rgba(10,132,255,${0.2+tts*0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();ctx.arc(cx,cy,outerR,0,Math.PI*2);ctx.stroke();
  } else {
    // Muted: greyed sphere
    const grad = ctx.createRadialGradient(cx-r*0.2, cy-r*0.2, r*0.05, cx, cy, r);
    grad.addColorStop(0,'rgba(180,180,185,0.8)');
    grad.addColorStop(1,'rgba(140,140,145,0.6)');
    ctx.fillStyle = grad;
    ctx.beginPath();ctx.arc(cx,cy,r*0.75,0,Math.PI*2);ctx.fill();
    // Slash
    ctx.strokeStyle = 'rgba(255,59,48,0.6)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();ctx.moveTo(cx-r*0.3,cy-r*0.3);ctx.lineTo(cx+r*0.3,cy+r*0.3);ctx.stroke();
  }
}

function animLoop(){
  time += 0.03;
  if(voiceState==='listening') micLevel = 0.3 + 0.7*Math.abs(Math.sin(time*2.2 + Math.random()*0.25));
  else micLevel = 0;
  if(voiceState==='speaking') ttsLevel = 0.35 + 0.65*Math.abs(Math.sin(time*3.5));
  else ttsLevel = 0;

  const state = isMuted ? 'muted' : voiceState;
  drawSystemOrb(hCtx,36,36,state,time,micLevel,ttsLevel);
  drawSystemOrb(aCtx,72,72,state,time,micLevel,ttsLevel);
  drawSystemOrb(dCtx,40,40,state,time,micLevel,ttsLevel);

  if(voiceState==='listening'||voiceState==='speaking'){
    const bars=['wb1','wb2','wb3','wb4','wb5','wb6','wb7'];
    bars.forEach((id,i) => {
      const el=document.getElementById(id);if(!el)return;
      const level=voiceState==='listening'?micLevel:ttsLevel;
      const h=3+level*(1.5+Math.abs(Math.sin(time*2+i*0.9))*10);
      el.style.height=Math.max(3,h)+'px';
      el.style.background=voiceState==='speaking'?'var(--accent-2)':'var(--accent)';
    });
  }
  requestAnimationFrame(animLoop);
}
animLoop();

// ===== Messages =====
function hideEmpty(){
  if(!hasMessages){
    const es=document.getElementById('empty-state');if(es)es.style.display='none';
    hasMessages=true;
  }
}
function scrollThread(){const t=document.getElementById('thread');t.scrollTop=t.scrollHeight;}

function addTypedMessage(role, text){
  hideEmpty();
  const thread=document.getElementById('thread');
  const group=document.createElement('div');group.className='msg-group';
  const row=document.createElement('div');row.className=`msg-row ${role}`;
  const bubble=document.createElement('div');bubble.className=`bubble ${role}`;bubble.textContent=text;
  const meta=document.createElement('div');meta.className=`msg-meta ${role}`;
  const glyph=document.createElement('div');glyph.className='modality-glyph';glyph.textContent='⌨';
  const ts=document.createElement('span');ts.textContent='Now';
  meta.appendChild(glyph);meta.appendChild(ts);
  row.appendChild(bubble);group.appendChild(row);group.appendChild(meta);

  if(pendingAttachments.length && role==='user'){
    pendingAttachments.forEach(a=>{
      const att=document.createElement('div');att.className='msg-attachment';att.textContent=a;
      row.insertBefore(att,bubble);
    });
    pendingAttachments=[];clearAttachChips();
  }
  thread.appendChild(group);scrollThread();return bubble;
}

function addVoiceMessage(role, text, finalized, interrupted){
  hideEmpty();
  const thread=document.getElementById('thread');
  const group=document.createElement('div');group.className='msg-group';
  const row=document.createElement('div');row.className=`msg-row ${role}`;
  const bubble=document.createElement('div');
  bubble.className=`bubble ${role}${finalized?'':' partial'}`;
  bubble.textContent=text;
  if(interrupted){
    const badge=document.createElement('div');badge.className='interrupted-badge';
    badge.textContent='⚡ Interrupted';
    bubble.appendChild(document.createElement('br'));bubble.appendChild(badge);
  }
  const meta=document.createElement('div');meta.className=`msg-meta ${role}`;
  const glyph=document.createElement('div');glyph.className='modality-glyph';glyph.textContent='🎙';
  const ts=document.createElement('span');ts.textContent=finalized?'Now':'Speaking…';
  meta.appendChild(glyph);meta.appendChild(ts);
  row.appendChild(bubble);group.appendChild(row);group.appendChild(meta);
  thread.appendChild(group);scrollThread();return bubble;
}

function addAssistantMessage(text, withCard, cardType){
  hideEmpty();
  const thread=document.getElementById('thread');
  const group=document.createElement('div');group.className='msg-group';
  const row=document.createElement('div');row.className='msg-row assistant';
  const bubble=document.createElement('div');bubble.className='bubble assistant';bubble.textContent=text;

  if(withCard&&cardType==='weather'){
    const card=document.createElement('div');card.className='app-card';
    card.innerHTML=`
      <div class="app-card-header">
        <div class="app-icon">🌤</div>
        <span class="app-card-name">Weather · San Francisco</span>
      </div>
      <div class="app-card-body">
        <div class="weather-big">68°</div>
        <div class="weather-desc">Partly cloudy · Low 56°</div>
        <div class="weather-detail"><span>💧 42%</span><span>🌬 12 mph</span><span>UV 4</span></div>
      </div>
      <div class="app-card-actions">
        <div class="card-btn">5-day forecast</div>
        <div class="card-btn primary">Set alert</div>
      </div>
    `;
    const expand=document.createElement('div');expand.className='card-expand';expand.textContent='Open full view →';
    bubble.appendChild(card);bubble.appendChild(expand);
  }

  const meta=document.createElement('div');meta.className='msg-meta assistant';
  const glyph=document.createElement('div');glyph.className='modality-glyph';glyph.textContent='⌨';
  const ts=document.createElement('span');ts.textContent='Now';
  meta.appendChild(glyph);meta.appendChild(ts);
  row.appendChild(bubble);group.appendChild(row);group.appendChild(meta);
  thread.appendChild(group);scrollThread();return bubble;
}

function addFollowupChips(){
  const thread=document.getElementById('thread');
  const cr=document.createElement('div');cr.className='chips-row';cr.style.justifyContent='flex-start';
  cr.innerHTML=`
    <div class="chip followup" onclick="useChip(this)">Show on map</div>
    <div class="chip followup" onclick="useChip(this)">Save trail</div>
    <div class="chip followup" onclick="useChip(this)">Get directions</div>
  `;
  thread.appendChild(cr);scrollThread();
}

function useChip(el){
  const text=el.textContent.trim();el.closest('.chips-row')&&el.closest('.chips-row').remove();
  document.getElementById('composer-input').value=text;handleInputChange();
  document.getElementById('composer-input').focus();
}

function addAttachment(){
  const items=['📷','📄','📊','🎵'];
  pendingAttachments.push(items[Math.floor(Math.random()*items.length)]);renderAttachChips();
}
function renderAttachChips(){
  const c=document.getElementById('attach-chips');c.style.display='flex';c.innerHTML='';
  pendingAttachments.forEach((a,i)=>{
    const chip=document.createElement('div');chip.className='attach-chip';
    chip.innerHTML=`<div class="attach-thumb">${a}</div><span>Attachment ${i+1}</span><span class="attach-remove" onclick="removeAttach(${i})">✕</span>`;
    c.appendChild(chip);
  });
}
function removeAttach(i){
  pendingAttachments.splice(i,1);
  if(!pendingAttachments.length)clearAttachChips();else renderAttachChips();
}
function clearAttachChips(){
  document.getElementById('attach-chips').style.display='none';
  document.getElementById('attach-chips').innerHTML='';
}

function setVoiceState(state){
  voiceState=state;
  const liveInd=document.getElementById('live-indicator');
  const wf=document.getElementById('waveform');
  const labelText=document.getElementById('dock-label-text');
  const sublabel=document.getElementById('dock-sublabel');
  const headerStatus=document.getElementById('header-status');
  const mutedLabel=document.getElementById('muted-label');

  liveInd.className=`live-indicator ${state==='listening'&&!isMuted?'visible':''}`;
  mutedLabel.className=`muted-label ${isMuted?'visible':''}`;

  if(state==='listening'&&!isMuted){
    labelText.textContent='Listening…';sublabel.textContent='';wf.style.display='flex';headerStatus.textContent='Listening…';
  } else if(state==='thinking'){
    labelText.textContent='Thinking…';sublabel.textContent='';wf.style.display='none';headerStatus.textContent='Thinking…';
  } else if(state==='speaking'){
    labelText.textContent='Speaking';sublabel.textContent='Tap to interrupt';wf.style.display='flex';headerStatus.textContent='Speaking…';
  } else {
    labelText.textContent='Hold to talk';sublabel.textContent=isMuted?'Mic muted':'Tap for hands-free';wf.style.display='none';headerStatus.textContent=isMuted?'Muted':'Ready to help';
  }
}

function toggleVoice(){if(isGenerating)return;if(voiceState==='idle')runDemo();else endVoice();}
function endVoice(){cancelDemoTimers();setVoiceState('idle');isGenerating=false;updateSendBtn();}
function toggleMute(){
  isMuted=!isMuted;
  const btn=document.getElementById('mute-btn');
  btn.className=isMuted?'dock-btn muted-active':'dock-btn';
  btn.textContent=isMuted?'🔇':'🎙';
  setVoiceState(voiceState);
}

const inputEl=document.getElementById('composer-input');
inputEl.addEventListener('input',handleInputChange);
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSendBtn();}});
function handleInputChange(){
  inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,80)+'px';
  updateSendBtn();
  document.getElementById('typing-chips').className=inputEl.value.trim()?'typing-chips hidden':'typing-chips';
}
function updateSendBtn(){
  const btn=document.getElementById('send-btn');
  if(isGenerating){btn.className='send-btn stop';btn.textContent='◼';}
  else if(inputEl.value.trim()){btn.className='send-btn send';btn.textContent='↑';}
  else{btn.className='send-btn mic';btn.textContent='🎙';}
}
function handleSendBtn(){
  if(isGenerating){stopGeneration();return;}
  const text=inputEl.value.trim();
  if(text){sendTypedMessage(text);return;}
  runDemo();
}
function sendTypedMessage(text){
  inputEl.value='';handleInputChange();addTypedMessage('user',text);
  isGenerating=true;updateSendBtn();setVoiceState('thinking');
  setTimeout(()=>{
    addAssistantMessage('Here\'s what I found for that.',false,null);
    addFollowupChips();isGenerating=false;setVoiceState('idle');updateSendBtn();
  },1200);
}
function stopGeneration(){cancelDemoTimers();isGenerating=false;setVoiceState('idle');updateSendBtn();}

function cancelDemoTimers(){demoTimers.forEach(t=>clearTimeout(t));demoTimers=[];}
function runDemo(){
  cancelDemoTimers();endVoice();
  setVoiceState('listening');isGenerating=true;updateSendBtn();

  demoTimers.push(setTimeout(()=>{
    if(voiceState!=='listening')return;
    setVoiceState('thinking');
    addVoiceMessage('user','What\'s the weather this weekend?',true,false);
  },2000));

  demoTimers.push(setTimeout(()=>{
    if(voiceState!=='thinking')return;
    setVoiceState('speaking');
    const bubble=addVoiceMessage('assistant','Saturday will be great — ','partial',false);
    const words=['about','71 degrees,','clear','skies.','Sunday','morning','may','be','foggy,','but','clears','by','early','afternoon.'];
    let wi=0;
    const si=setInterval(()=>{
      if(wi<words.length){bubble.textContent=bubble.textContent+words[wi++]+' ';scrollThread();}
      else{clearInterval(si);bubble.className='bubble assistant';}
    },170);
    demoTimers.push(setTimeout(()=>{
      clearInterval(si);bubble.className='bubble assistant';
      addFollowupChips();isGenerating=false;setVoiceState('idle');updateSendBtn();
    },3400));
  },3100));
}

window.addEventListener('load',()=>{
  addTypedMessage('user','Show me the weather for this week');
  addAssistantMessage('Here\'s the current forecast for San Francisco.',true,'weather');
  addVoiceMessage('assistant','The weekend looks especially nice — great hiking weather Saturday morning.',true,false);
  addVoiceMessage('assistant','I was going to share more about the weekend, but—',false,true);
  addTypedMessage('user','What trails would you recommend near the city?');
  addAssistantMessage('Marin Headlands is great for coastal views. Muir Woods for redwoods. Tennessee Valley is easier and dog-friendly.',false,null);
  addFollowupChips();
  setTimeout(runDemo,1000);
});
</script>
