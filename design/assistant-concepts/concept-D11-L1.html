<!-- concept-D11-L1 | direction: Zen Single-Line Minimal | look: Soft Aurora Glass | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D11 · Zen Single-Line Minimal · Soft Aurora Glass</title>
<style>
:root{
  --bg:#EAF0FB;
  --bg-aurora:radial-gradient(120% 90% at 18% 12%,#F3E9FB 0%,transparent 55%),radial-gradient(120% 90% at 82% 88%,#E6F7F4 0%,transparent 55%),linear-gradient(160deg,#EAF0FB,#EFEAFB);
  --surface:rgba(255,255,255,0.55);
  --surface-2:rgba(255,255,255,0.72);
  --border:rgba(255,255,255,0.65);
  --text:#1B2233;
  --text-muted:#5A6582;
  --accent:#6E8BFF;
  --accent-2:#9C6CF0;
  --accent-3:#5FE3C0;
  --danger:#FF6B8B;
  --radius:22px;
  --radius-sm:14px;
  --font:"SF Pro Display","Segoe UI Variable","Helvetica Neue",system-ui,sans-serif;
  --shadow:0 12px 40px rgba(80,90,160,0.18);
  --shadow-sm:0 4px 16px rgba(80,90,160,0.12);
  --blur:saturate(1.4) blur(24px);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--font);
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* Aurora background */
.aurora-bg{
  position:fixed;inset:0;
  background:var(--bg-aurora);
  animation:auroraShift 30s ease-in-out infinite;
  z-index:0;
}
@keyframes auroraShift{
  0%,100%{filter:hue-rotate(0deg) brightness(1);}
  33%{filter:hue-rotate(15deg) brightness(1.02);}
  66%{filter:hue-rotate(-10deg) brightness(0.98);}
}

/* Device frame */
.device{
  position:relative;z-index:1;
  width:420px;height:760px;
  background:var(--surface);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-radius:40px;
  border:1px solid var(--border);
  box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,0.4) inset;
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* Header */
.header{
  padding:28px 28px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.header-title{
  font-size:13px;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--text-muted);
}
.header-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{
  width:32px;height:32px;border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.24s var(--ease);
  backdrop-filter:blur(12px);
}
.icon-btn:hover{background:rgba(255,255,255,0.85);transform:scale(1.05);}
.icon-btn svg{width:14px;height:14px;stroke:var(--text-muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* Avatar / breathing mark */
.avatar-area{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 40px;
  position:relative;
}

.orb-wrap{
  position:relative;width:80px;height:80px;
  margin-bottom:32px;
  cursor:pointer;
}
.orb{
  width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%, #9B8FFF 0%, #6E8BFF 35%, #9C6CF0 65%, #5FE3C0 100%);
  position:relative;
  animation:orbIdle 4s ease-in-out infinite;
  transition:all 0.4s var(--ease);
}
.orb::before{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  background:radial-gradient(circle,rgba(110,139,255,0.3) 0%,transparent 70%);
  animation:haloBreath 4s ease-in-out infinite;
}
.orb::after{
  content:'';position:absolute;
  width:20px;height:12px;top:16px;left:18px;
  background:rgba(255,255,255,0.55);
  border-radius:50%;
  filter:blur(3px);
}
.mute-dot{
  position:absolute;bottom:2px;right:2px;
  width:16px;height:16px;border-radius:50%;
  background:var(--danger);
  border:2px solid white;
  opacity:0;transition:opacity 0.3s;
  z-index:2;
}
.mute-label{
  font-size:11px;color:var(--danger);
  font-weight:500;letter-spacing:0.04em;
  margin-top:6px;opacity:0;
  transition:opacity 0.3s var(--ease);
  text-align:center;
}

@keyframes orbIdle{
  0%,100%{transform:scale(1);filter:brightness(1);}
  50%{transform:scale(1.04);filter:brightness(1.06);}
}
@keyframes haloBreath{
  0%,100%{transform:scale(1);opacity:0.6;}
  50%{transform:scale(1.15);opacity:0.9;}
}
@keyframes orbListening{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}
@keyframes orbThinking{
  0%{filter:hue-rotate(0deg) brightness(1);}
  100%{filter:hue-rotate(360deg) brightness(1.1);}
}
@keyframes orbSpeaking{
  0%,100%{transform:scale(1);filter:brightness(1);}
  25%{transform:scale(1.07);filter:brightness(1.12);}
  75%{transform:scale(1.03);filter:brightness(1.06);}
}

.state-listening .orb{animation:orbListening 0.6s ease-in-out infinite;}
.state-listening .orb::before{animation:haloBreath 0.6s ease-in-out infinite;}
.state-thinking .orb{animation:orbThinking 2s linear infinite;}
.state-speaking .orb{animation:orbSpeaking 0.8s ease-in-out infinite;}
.state-muted .orb{animation:none;filter:saturate(0.3) brightness(0.8);}

/* Listening indicator */
.listening-indicator{
  display:flex;align-items:center;gap:8px;
  padding:6px 14px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:20px;
  backdrop-filter:blur(12px);
  margin-bottom:16px;
  opacity:0;transform:translateY(6px);
  transition:all 0.3s var(--ease);
  pointer-events:none;
}
.listening-indicator.visible{opacity:1;transform:translateY(0);}
.listening-indicator svg{width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;}
.listening-indicator span{font-size:12px;color:var(--accent);font-weight:500;}
.listen-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  animation:blink 1.2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* Current turn display */
.current-turn{
  text-align:center;
  min-height:48px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;
  padding:0 20px;
  width:100%;
}
.turn-line{
  font-size:20px;font-weight:300;
  color:var(--text);
  line-height:1.4;
  letter-spacing:-0.01em;
  opacity:1;
  transition:all 0.5s var(--ease);
  max-width:100%;
  text-align:center;
}
.turn-line.fading{opacity:0;transform:translateY(-12px);}
.turn-line.partial{opacity:0.5;font-style:italic;}
.turn-line.empty{color:var(--text-muted);font-size:17px;}

.turn-meta{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text-muted);
  letter-spacing:0.03em;
}
.turn-meta svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;}
.turn-meta.voice-turn svg{stroke:var(--accent);}

/* Suggestion */
.suggestion{
  margin-top:20px;
  padding:8px 18px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:20px;
  font-size:13px;color:var(--text-muted);
  cursor:pointer;
  backdrop-filter:blur(12px);
  transition:all 0.3s var(--ease);
  opacity:1;
}
.suggestion:hover{background:rgba(255,255,255,0.88);color:var(--text);transform:scale(1.02);}
.suggestion.hidden{opacity:0;pointer-events:none;transform:translateY(4px);}

/* Inline card */
.inline-card{
  margin-top:24px;
  width:100%;max-width:300px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  opacity:0;transform:translateY(16px) scale(0.97);
  transition:all 0.5s var(--ease);
}
.inline-card.visible{opacity:1;transform:translateY(0) scale(1);}
.card-header{
  padding:12px 16px 8px;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid rgba(255,255,255,0.4);
}
.card-icon{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.card-title{font-size:13px;font-weight:600;color:var(--text);}
.card-subtitle{font-size:11px;color:var(--text-muted);}
.card-body{padding:12px 16px;}
.weather-display{display:flex;align-items:center;justify-content:space-between;}
.weather-temp{font-size:36px;font-weight:300;color:var(--text);}
.weather-detail{text-align:right;}
.weather-desc{font-size:14px;color:var(--text-muted);}
.weather-city{font-size:12px;color:var(--text-muted);}
.card-actions{
  padding:8px 16px 12px;
  display:flex;gap:8px;
}
.card-btn{
  flex:1;padding:8px;
  border-radius:var(--radius-sm);
  font-size:12px;font-weight:500;
  font-family:var(--font);
  border:1px solid var(--border);
  background:rgba(110,139,255,0.15);
  color:var(--accent);cursor:pointer;
  transition:all 0.2s var(--ease);
}
.card-btn:hover{background:rgba(110,139,255,0.25);}
.card-btn.secondary{background:transparent;color:var(--text-muted);}
.card-expand{
  position:absolute;top:8px;right:8px;
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:0.5;
}
.card-expand svg{width:12px;height:12px;stroke:var(--text-muted);fill:none;stroke-width:2;}

/* Bottom area */
.bottom-area{
  padding:0 24px 32px;
  display:flex;flex-direction:column;
  gap:12px;
}

/* Thread swipe hint */
.thread-hint{
  text-align:center;
  font-size:11px;color:var(--text-muted);
  letter-spacing:0.04em;
  opacity:0.6;
  margin-bottom:2px;
}

/* Composer */
.composer{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:28px;
  backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
  display:flex;align-items:center;
  gap:8px;
  padding:8px 8px 8px 12px;
  transition:all 0.3s var(--ease);
}
.composer:focus-within{
  border-color:rgba(110,139,255,0.5);
  box-shadow:0 0 0 3px rgba(110,139,255,0.12),var(--shadow-sm);
}

.attach-btn{
  width:32px;height:32px;border-radius:50%;
  background:transparent;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s var(--ease);
  flex-shrink:0;
}
.attach-btn:hover{background:rgba(110,139,255,0.1);}
.attach-btn svg{width:16px;height:16px;stroke:var(--text-muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.composer-input{
  flex:1;
  background:transparent;border:none;outline:none;
  font-family:var(--font);font-size:15px;font-weight:300;
  color:var(--text);
  line-height:1.5;
  resize:none;height:24px;
}
.composer-input::placeholder{color:var(--text-muted);}

/* Attachment chip */
.attachment-chip{
  display:flex;align-items:center;gap:6px;
  background:rgba(110,139,255,0.12);
  border:1px solid rgba(110,139,255,0.25);
  border-radius:12px;
  padding:4px 8px;
  font-size:12px;color:var(--accent);
  margin:0 4px;
  opacity:0;max-width:0;overflow:hidden;
  transition:all 0.3s var(--ease);
}
.attachment-chip.visible{opacity:1;max-width:160px;}
.attachment-chip span{white-space:nowrap;}
.chip-remove{
  width:14px;height:14px;border-radius:50%;
  background:rgba(110,139,255,0.2);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-size:10px;color:var(--accent);
}

/* Mic/Send button */
.action-btn{
  width:40px;height:40px;border-radius:50%;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.28s var(--ease);
  flex-shrink:0;
  position:relative;
  overflow:hidden;
}
.action-btn svg{
  width:18px;height:18px;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  position:absolute;
  transition:all 0.28s var(--ease);
}

/* mic state */
.action-btn.mic-mode{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 4px 14px rgba(110,139,255,0.4);
}
.action-btn.mic-mode .mic-icon{opacity:1;stroke:white;}
.action-btn.mic-mode .send-icon{opacity:0;transform:scale(0.5);}
.action-btn.mic-mode .stop-icon{opacity:0;transform:scale(0.5);}

/* send state */
.action-btn.send-mode{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 4px 14px rgba(110,139,255,0.4);
}
.action-btn.send-mode .mic-icon{opacity:0;transform:scale(0.5);}
.action-btn.send-mode .send-icon{opacity:1;stroke:white;}
.action-btn.send-mode .stop-icon{opacity:0;transform:scale(0.5);}

/* stop state */
.action-btn.stop-mode{
  background:rgba(255,107,139,0.15);
  box-shadow:0 4px 14px rgba(255,107,139,0.2);
}
.action-btn.stop-mode .mic-icon{opacity:0;transform:scale(0.5);}
.action-btn.stop-mode .send-icon{opacity:0;transform:scale(0.5);}
.action-btn.stop-mode .stop-icon{opacity:1;stroke:var(--danger);}

.action-btn:hover{transform:scale(1.06);}
.action-btn:active{transform:scale(0.94);}

/* Thread panel */
.thread-panel{
  position:absolute;
  inset:0;border-radius:40px;
  background:rgba(255,255,255,0.88);
  backdrop-filter:var(--blur);
  z-index:10;
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform 0.4s var(--ease);
  overflow:hidden;
}
.thread-panel.open{transform:translateX(0);}
.thread-header{
  padding:24px 24px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.thread-title{font-size:16px;font-weight:600;color:var(--text);}
.close-thread{
  width:28px;height:28px;border-radius:50%;
  background:rgba(90,101,130,0.1);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.close-thread svg{width:12px;height:12px;stroke:var(--text-muted);fill:none;stroke-width:2;}
.thread-list{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:12px;}
.thread-turn{
  display:flex;flex-direction:column;gap:4px;
}
.thread-bubble{
  padding:10px 14px;
  border-radius:var(--radius-sm);
  font-size:14px;line-height:1.5;
  max-width:85%;
}
.thread-bubble.user{
  background:rgba(110,139,255,0.12);
  border:1px solid rgba(110,139,255,0.2);
  color:var(--text);
  align-self:flex-end;
}
.thread-bubble.assistant{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  align-self:flex-start;
}
.thread-bubble.interrupted{opacity:0.6;border-style:dashed;}
.thread-meta{
  font-size:11px;color:var(--text-muted);
  display:flex;align-items:center;gap:4px;
  padding:0 2px;
}
.thread-meta.user-meta{align-self:flex-end;}
.thread-meta svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8;}
.interrupted-badge{
  font-size:10px;
  color:var(--accent-2);
  background:rgba(156,108,240,0.1);
  border-radius:4px;
  padding:1px 5px;
}

/* Demo button */
.demo-btn{
  position:absolute;top:20px;right:70px;
  padding:5px 12px;
  background:rgba(110,139,255,0.12);
  border:1px solid rgba(110,139,255,0.3);
  border-radius:20px;
  font-size:11px;font-weight:500;
  color:var(--accent);
  cursor:pointer;
  font-family:var(--font);
  transition:all 0.2s var(--ease);
  z-index:5;
}
.demo-btn:hover{background:rgba(110,139,255,0.22);}

/* State indicator label */
.state-badge{
  font-size:11px;font-weight:500;
  letter-spacing:0.04em;
  color:var(--text-muted);
  margin-top:4px;
  min-height:16px;
  text-align:center;
  transition:all 0.3s var(--ease);
}

@media(min-width:600px){
  body{background:linear-gradient(135deg,#D8E4F8,#EAE0F7,#D4EFF0);}
  .device{
    width:420px;height:760px;
    box-shadow:var(--shadow),0 40px 80px rgba(80,90,160,0.15);
  }
}
</style>
</head>
<body>
<div class="aurora-bg"></div>

<div class="device" id="device">
  <!-- Thread panel (hidden, swipe-away) -->
  <div class="thread-panel" id="threadPanel">
    <div class="thread-header">
      <span class="thread-title">Conversation</span>
      <button class="close-thread" id="closeThread">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="thread-list" id="threadList">
      <!-- populated by JS -->
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <span class="header-title">Eliza</span>
    <div class="header-actions">
      <button class="demo-btn" id="demoBtn">▶ Demo</button>
      <button class="icon-btn" id="threadBtn" title="View transcript">
        <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h8M2 12h10"/></svg>
      </button>
    </div>
  </div>

  <!-- Main area -->
  <div class="avatar-area" id="avatarArea">

    <!-- Listening indicator -->
    <div class="listening-indicator" id="listeningIndicator">
      <svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>
      <div class="listen-dot"></div>
      <span>Listening…</span>
    </div>

    <!-- Orb / avatar -->
    <div class="orb-wrap" id="orbWrap" title="Tap to mute">
      <div class="orb" id="orb"></div>
      <div class="mute-dot" id="muteDot"></div>
    </div>
    <div class="mute-label" id="muteLabel">Muted</div>
    <div class="state-badge" id="stateBadge"></div>

    <!-- Current single line -->
    <div class="current-turn" id="currentTurn">
      <div class="turn-line empty" id="turnLine">Ask me anything…</div>
      <div class="turn-meta" id="turnMeta" style="opacity:0"></div>
    </div>

    <!-- Suggestion -->
    <div class="suggestion" id="suggestion" data-text="What's the weather like today?">
      What's the weather like today?
    </div>

    <!-- Inline card -->
    <div class="inline-card" id="inlineCard">
      <div class="card-header" style="position:relative;">
        <div class="card-icon" style="background:linear-gradient(135deg,#74b0ff,#5fe3c0);">🌤</div>
        <div>
          <div class="card-title">Weather</div>
          <div class="card-subtitle">San Francisco</div>
        </div>
        <div class="card-expand" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);">
          <svg viewBox="0 0 16 16"><path d="M10 2h4v4M14 2l-6 6M6 14H2v-4M2 14l6-6"/></svg>
        </div>
      </div>
      <div class="card-body">
        <div class="weather-display">
          <div class="weather-temp">64°</div>
          <div class="weather-detail">
            <div class="weather-desc">Partly cloudy</div>
            <div class="weather-city">Feels like 61°</div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="card-btn">7-day forecast</button>
        <button class="card-btn secondary">Dismiss</button>
      </div>
    </div>

  </div>

  <!-- Bottom -->
  <div class="bottom-area">
    <div class="thread-hint">↑ swipe for transcript</div>
    <div class="composer" id="composer">
      <button class="attach-btn" id="attachBtn" title="Attach">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
      <div class="attachment-chip" id="attachChip">
        <span>📎 photo.jpg</span>
        <button class="chip-remove" id="chipRemove">×</button>
      </div>
      <input class="composer-input" id="composerInput" type="text" placeholder="Type or speak…" autocomplete="off">
      <button class="action-btn mic-mode" id="actionBtn" title="Voice input">
        <svg class="mic-icon" viewBox="0 0 20 20"><path d="M10 1a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V4a3 3 0 0 1 3-3z"/><path d="M4 10a6 6 0 0 0 12 0"/><line x1="10" y1="16" x2="10" y2="19"/></svg>
        <svg class="send-icon" viewBox="0 0 20 20"><path d="M10 15V5M5 10l5-5 5 5"/></svg>
        <svg class="stop-icon" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2" stroke-width="2" fill="none"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const S = {
  appState: 'idle',   // idle | listening | thinking | speaking | muted
  isMuted: false,
  hasText: false,
  hasAttach: false,
  demoTimer: null,
  ampT: 0,
  turnHistory: [
    {role:'assistant', modality:'voice', text:'Good morning! How can I help you today?', interrupted:false},
    {role:'user', modality:'voice', text:"What's the forecast for the week?", interrupted:false, partial:false},
    {role:'assistant', modality:'typed', text:'Currently 64° and partly cloudy in San Francisco. Highs in the mid-60s through the weekend.', interrupted:true},
  ]
};

// ─── Elements ─────────────────────────────────────────────────────────────────
const orbWrap = document.getElementById('orbWrap');
const orb = document.getElementById('orb');
const device = document.getElementById('device');
const muteDot = document.getElementById('muteDot');
const muteLabel = document.getElementById('muteLabel');
const stateBadge = document.getElementById('stateBadge');
const listeningIndicator = document.getElementById('listeningIndicator');
const currentTurn = document.getElementById('currentTurn');
const turnLine = document.getElementById('turnLine');
const turnMeta = document.getElementById('turnMeta');
const suggestion = document.getElementById('suggestion');
const inlineCard = document.getElementById('inlineCard');
const composer = document.getElementById('composer');
const composerInput = document.getElementById('composerInput');
const actionBtn = document.getElementById('actionBtn');
const attachBtn = document.getElementById('attachBtn');
const attachChip = document.getElementById('attachChip');
const chipRemove = document.getElementById('chipRemove');
const demoBtn = document.getElementById('demoBtn');
const threadBtn = document.getElementById('threadBtn');
const threadPanel = document.getElementById('threadPanel');
const closeThread = document.getElementById('closeThread');
const threadList = document.getElementById('threadList');

// ─── Set avatar state ─────────────────────────────────────────────────────────
function setAvatarState(state){
  ['state-idle','state-listening','state-thinking','state-speaking','state-muted']
    .forEach(c => device.classList.remove(c));
  if(state) device.classList.add('state-'+state);

  const badges = {idle:'',listening:'',thinking:'Thinking…',speaking:'',muted:''};
  stateBadge.textContent = badges[state]||'';

  listeningIndicator.classList.toggle('visible', state==='listening');
}

// ─── Mic/send button morph ────────────────────────────────────────────────────
function updateActionBtn(){
  if(S.appState==='thinking'||S.appState==='speaking'){
    actionBtn.className='action-btn stop-mode';
  } else if(S.hasText){
    actionBtn.className='action-btn send-mode';
  } else {
    actionBtn.className='action-btn mic-mode';
  }
}

// ─── Show turn ────────────────────────────────────────────────────────────────
function showTurn(text, modality, isPartial=false){
  turnLine.classList.add('fading');
  setTimeout(()=>{
    turnLine.className = 'turn-line' + (isPartial?' partial':'');
    turnLine.textContent = text;
    turnLine.classList.remove('fading');
    // meta
    if(modality){
      turnMeta.style.opacity='1';
      turnMeta.innerHTML = modality==='voice'
        ? `<svg class="voice-icon" viewBox="0 0 16 16" style="stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;"><path d="M8 1v7M5 4v2M11 4v2M2 7c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg><span>Voice</span>`
        : `<svg viewBox="0 0 16 16" style="stroke:var(--text-muted);fill:none;stroke-width:1.8;stroke-linecap:round;"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 7h6M5 10h4"/></svg><span>Typed</span>`;
    } else {
      turnMeta.style.opacity='0';
    }
  },300);
}

function resetTurn(){
  turnLine.className='turn-line empty';
  turnLine.textContent='Ask me anything…';
  turnMeta.style.opacity='0';
}

// ─── Suggestion visibility ────────────────────────────────────────────────────
function hideSuggestion(){suggestion.classList.add('hidden');}
function showSuggestion(){suggestion.classList.remove('hidden');}

// ─── Thread render ────────────────────────────────────────────────────────────
function renderThread(){
  threadList.innerHTML='';
  S.turnHistory.forEach(t=>{
    const div=document.createElement('div');
    div.className='thread-turn';
    const bubble=document.createElement('div');
    bubble.className='thread-bubble '+t.role+(t.interrupted?' interrupted':'');
    bubble.textContent=t.text;
    const meta=document.createElement('div');
    meta.className='thread-meta'+(t.role==='user'?' user-meta':'');
    const iconSvg = t.modality==='voice'
      ? `<svg viewBox="0 0 16 16"><path d="M8 1v7M5 4v2M11 4v2M2 7c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>`
      : `<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 7h6M5 10h4"/></svg>`;
    meta.innerHTML = iconSvg + `<span>${t.modality==='voice'?'Voice':'Typed'}${t.interrupted?' <span class="interrupted-badge">interrupted</span>':''}</span>`;
    div.appendChild(bubble);
    div.appendChild(meta);
    threadList.appendChild(div);
  });
}

// ─── Amplitude animation ──────────────────────────────────────────────────────
let rafId=null;
function animateAmp(){
  if(S.appState!=='listening'&&S.appState!=='speaking'){return;}
  S.ampT+=0.06;
  const raw = Math.sin(S.ampT*2.3)*0.5+Math.sin(S.ampT*3.7)*0.3+Math.random()*0.2;
  const amp = Math.max(0,Math.min(1,(raw+0.5)*0.7));
  const scale = 1 + amp*0.18;
  const glowSize = 8 + amp*24;
  orb.style.transform=`scale(${scale})`;
  orb.style.boxShadow=`0 0 ${glowSize}px rgba(110,139,255,${0.3+amp*0.4}),0 0 ${glowSize*1.5}px rgba(156,108,240,${0.2+amp*0.3})`;
  rafId=requestAnimationFrame(animateAmp);
}
function stopAmp(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  orb.style.transform='';
  orb.style.boxShadow='';
}

// ─── Mute toggle ──────────────────────────────────────────────────────────────
orbWrap.addEventListener('click',()=>{
  if(S.appState==='listening'||S.appState==='speaking'||S.appState==='idle'||S.appState==='muted'){
    S.isMuted=!S.isMuted;
    if(S.isMuted){
      stopAmp();
      setState('muted');
      muteDot.style.opacity='1';
      muteLabel.style.opacity='1';
    } else {
      muteDot.style.opacity='0';
      muteLabel.style.opacity='0';
      setState('idle');
    }
  }
});

// ─── setState helper ──────────────────────────────────────────────────────────
function setState(s){
  S.appState=s;
  setAvatarState(s);
  updateActionBtn();
  if(s==='listening'){animateAmp();}
  else if(s==='speaking'){animateAmp();}
  else{stopAmp();}
}

// ─── Demo cycle ───────────────────────────────────────────────────────────────
const DEMO_TURNS = [
  {step:'start-listen', delay:0},
  {step:'partial', delay:2200, text:'Tell me about… the weather today'},
  {step:'finalize-listen', delay:3500, text:'Tell me about the weather today.'},
  {step:'thinking', delay:3700},
  {step:'start-speak', delay:5000, text:'Currently 64° and partly cloudy in San Francisco.'},
  {step:'show-card', delay:5400},
  {step:'barge-in', delay:8500},
  {step:'final-listen', delay:8600, text:'Actually, what about tomorrow?'},
  {step:'thinking2', delay:10000},
  {step:'speak2', delay:11200, text:'Tomorrow looks clearer — expect sunshine and a high of 68°.'},
  {step:'idle', delay:14500},
];

let demoTimers=[];
function clearDemo(){demoTimers.forEach(t=>clearTimeout(t));demoTimers=[];}

function runDemo(){
  clearDemo();
  inlineCard.classList.remove('visible');
  resetTurn();
  showSuggestion();
  setState('idle');
  S.isMuted=false;
  muteDot.style.opacity='0';
  muteLabel.style.opacity='0';

  DEMO_TURNS.forEach(({step,delay,text})=>{
    const t=setTimeout(()=>{
      if(step==='start-listen'){
        setState('listening');
        showTurn('…','voice',true);
        hideSuggestion();
      } else if(step==='partial'){
        showTurn(text,'voice',true);
      } else if(step==='finalize-listen'){
        S.turnHistory.push({role:'user',modality:'voice',text,interrupted:false});
        showTurn(text,'voice',false);
      } else if(step==='thinking'){
        setState('thinking');
        showTurn('…',null,true);
      } else if(step==='start-speak'){
        setState('speaking');
        showTurn(text,'voice',false);
      } else if(step==='show-card'){
        inlineCard.classList.add('visible');
        S.turnHistory.push({role:'assistant',modality:'voice',text,interrupted:false});
      } else if(step==='barge-in'){
        // user interrupts — snap to listening
        setState('listening');
        showTurn('…','voice',true);
        inlineCard.classList.remove('visible');
      } else if(step==='final-listen'){
        showTurn(text,'voice',true);
      } else if(step==='thinking2'){
        S.turnHistory.push({role:'user',modality:'voice',text:'Actually, what about tomorrow?',interrupted:false});
        setState('thinking');
        showTurn('…',null,true);
      } else if(step==='speak2'){
        setState('speaking');
        showTurn(text,'voice',false);
        S.turnHistory.push({role:'assistant',modality:'voice',text,interrupted:false});
      } else if(step==='idle'){
        setState('idle');
        resetTurn();
        showSuggestion();
      }
    },delay);
    demoTimers.push(t);
  });
}

// ─── Input handlers ───────────────────────────────────────────────────────────
composerInput.addEventListener('input',()=>{
  S.hasText=composerInput.value.trim().length>0;
  updateActionBtn();
  if(S.hasText){hideSuggestion();}
  else if(S.appState==='idle'){showSuggestion();}
});

actionBtn.addEventListener('click',()=>{
  if(actionBtn.classList.contains('stop-mode')){
    setState('idle');
    resetTurn();
    showSuggestion();
    return;
  }
  if(actionBtn.classList.contains('send-mode')){
    const txt=composerInput.value.trim();
    if(!txt)return;
    S.turnHistory.push({role:'user',modality:'typed',text:txt});
    showTurn(txt,'typed',false);
    composerInput.value='';
    S.hasText=false;
    S.hasAttach=false;
    attachChip.classList.remove('visible');
    updateActionBtn();
    hideSuggestion();
    // simulate reply
    setState('thinking');
    setTimeout(()=>{
      setState('speaking');
      const reply="That's a great question. Let me think on that for a moment.";
      showTurn(reply,'voice',false);
      S.turnHistory.push({role:'assistant',modality:'typed',text:reply});
      setTimeout(()=>{setState('idle');showSuggestion();resetTurn();},4000);
    },1800);
    return;
  }
  // mic mode — start voice
  if(!S.isMuted){
    runDemo();
  }
});

attachBtn.addEventListener('click',()=>{
  S.hasAttach=!S.hasAttach;
  attachChip.classList.toggle('visible',S.hasAttach);
});
chipRemove.addEventListener('click',()=>{
  S.hasAttach=false;
  attachChip.classList.remove('visible');
});

suggestion.addEventListener('click',()=>{
  const t=suggestion.dataset.text;
  composerInput.value=t;
  S.hasText=true;
  updateActionBtn();
  hideSuggestion();
  composerInput.focus();
});

demoBtn.addEventListener('click',runDemo);
threadBtn.addEventListener('click',()=>{
  renderThread();
  threadPanel.classList.add('open');
});
closeThread.addEventListener('click',()=>threadPanel.classList.remove('open'));

// ─── Init ─────────────────────────────────────────────────────────────────────
setState('idle');
renderThread();
setTimeout(runDemo, 800);
</script>
</body>
</html>
