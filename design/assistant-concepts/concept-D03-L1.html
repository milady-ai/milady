<!-- concept-D03-L1 | direction: Classic Chat + Voice Dock | look: Soft Aurora Glass | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D03 · Classic Chat + Voice Dock · Soft Aurora Glass</title>
<style>
:root{
  --bg:#EAF0FB;
  --bg-aurora:radial-gradient(120% 90% at 18% 12%,#F3E9FB 0%,transparent 55%),radial-gradient(120% 90% at 82% 88%,#E6F7F4 0%,transparent 55%),linear-gradient(160deg,#EAF0FB,#EFEAFB);
  --surface:rgba(255,255,255,0.55);
  --surface-2:rgba(255,255,255,0.72);
  --border:rgba(255,255,255,0.65);
  --text:#1B2233;
  --text-muted:#5A6582;
  --accent:#6E8BFF;
  --accent-2:#9C6CF0;
  --accent-3:#5FE3C0;
  --danger:#FF6B8B;
  --radius:22px;
  --radius-sm:14px;
  --font:"SF Pro Display","Segoe UI Variable","Helvetica Neue",system-ui,sans-serif;
  --shadow:0 12px 40px rgba(80,90,160,0.18);
  --shadow-sm:0 4px 16px rgba(80,90,160,0.12);
  --blur:saturate(1.4) blur(24px);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:var(--font);
  background:var(--bg-aurora);
  background-color:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  animation:auroraDrift 30s ease-in-out infinite alternate;
}

@keyframes auroraDrift{
  0%{background-position:0% 0%,100% 100%,0% 0%;}
  50%{background-position:30% 20%,70% 80%,100% 100%;}
  100%{background-position:60% 40%,40% 60%,50% 50%;}
}

.app-window{
  width:420px;
  height:760px;
  background:var(--surface);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-radius:var(--radius);
  border:1.5px solid var(--border);
  box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,0.3) inset;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* Header */
.header{
  padding:18px 20px 14px;
  background:var(--surface-2);
  backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}
.header-avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#A8C4FF,#9C6CF0 50%,#5FE3C0);
  box-shadow:0 0 16px rgba(110,139,255,0.4),0 0 0 2px rgba(255,255,255,0.5);
  animation:headerOrb 4s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes headerOrb{
  0%,100%{box-shadow:0 0 16px rgba(110,139,255,0.4),0 0 0 2px rgba(255,255,255,0.5);}
  50%{box-shadow:0 0 24px rgba(156,108,240,0.5),0 0 0 2px rgba(255,255,255,0.6);}
}
.header-info{flex:1;}
.header-name{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.01em;}
.header-status{font-size:12px;color:var(--text-muted);letter-spacing:0.04em;margin-top:1px;}
.header-btn{
  width:32px;height:32px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  color:var(--text-muted);
  font-size:14px;
  transition:all 0.24s var(--ease);
}
.header-btn:hover{background:rgba(110,139,255,0.15);color:var(--accent);}

/* Thread */
.thread{
  flex:1;
  overflow-y:auto;
  padding:16px 16px 8px;
  scroll-behavior:smooth;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.thread::-webkit-scrollbar{width:3px;}
.thread::-webkit-scrollbar-thumb{background:rgba(110,139,255,0.3);border-radius:10px;}

/* Empty state */
.empty-state{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:24px;
  text-align:center;
}
.empty-orb{
  width:64px;height:64px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(168,196,255,0.9),rgba(156,108,240,0.7) 50%,rgba(95,227,192,0.6));
  box-shadow:0 0 32px rgba(110,139,255,0.3),0 0 0 2px rgba(255,255,255,0.4);
  margin:0 auto;
}
.empty-title{font-size:16px;font-weight:600;color:var(--text);}
.empty-subtitle{font-size:13px;color:var(--text-muted);line-height:1.5;}

/* Chips */
.chips-row{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  margin-top:4px;
}
.chip{
  padding:8px 14px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:20px;
  font-size:12px;
  color:var(--text);
  cursor:pointer;
  transition:all 0.24s var(--ease);
  white-space:nowrap;
  font-family:var(--font);
}
.chip:hover{
  background:rgba(110,139,255,0.15);
  border-color:rgba(110,139,255,0.4);
  color:var(--accent);
  transform:translateY(-1px);
}
.chip.followup{
  background:rgba(110,139,255,0.08);
  border-color:rgba(110,139,255,0.25);
  font-size:11.5px;
}

/* Messages */
.msg-group{
  margin-bottom:10px;
  animation:msgIn 0.3s var(--ease);
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.msg-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:2px;}
.msg-row.user{flex-direction:row-reverse;}

.bubble{
  max-width:72%;
  padding:10px 14px;
  border-radius:var(--radius-sm);
  font-size:14px;
  line-height:1.5;
  position:relative;
}
.bubble.assistant{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm) var(--radius-sm) var(--radius-sm) 6px;
  color:var(--text);
  box-shadow:var(--shadow-sm);
}
.bubble.user{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  border-radius:var(--radius-sm) var(--radius-sm) 6px var(--radius-sm);
  box-shadow:0 4px 16px rgba(110,139,255,0.35);
}
.bubble.partial{color:var(--text-muted);}

.msg-meta{
  display:flex;align-items:center;gap:5px;
  font-size:10px;color:var(--text-muted);
  padding:0 4px;
  letter-spacing:0.02em;
}
.msg-meta.user{flex-direction:row-reverse;}
.modality-glyph{
  width:14px;height:14px;
  border-radius:50%;
  background:rgba(110,139,255,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:8px;
}

/* Interrupted badge */
.interrupted-badge{
  display:inline-block;
  background:rgba(255,107,139,0.1);
  border:1px solid rgba(255,107,139,0.3);
  color:var(--danger);
  font-size:10px;
  padding:2px 8px;
  border-radius:20px;
  margin-top:4px;
  font-family:var(--font);
}

/* Attachment in message */
.msg-attachment{
  width:60px;height:60px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent-2),var(--accent-3));
  margin-top:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

/* App card */
.app-card{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
  margin-top:8px;
  box-shadow:var(--shadow-sm);
  max-width:280px;
}
.app-card-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.3);
}
.app-icon{
  width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  color:#fff;
}
.app-card-name{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:0.04em;text-transform:uppercase;font-family:var(--font);}
.app-card-body{padding:12px;}
.weather-big{font-size:36px;font-weight:300;color:var(--text);line-height:1;}
.weather-desc{font-size:13px;color:var(--text-muted);margin-top:4px;}
.weather-detail{font-size:12px;color:var(--text-muted);margin-top:8px;display:flex;gap:12px;}
.app-card-actions{
  padding:8px 12px;
  border-top:1px solid var(--border);
  display:flex;gap:8px;
}
.card-btn{
  flex:1;padding:6px;
  border-radius:var(--radius-sm);
  font-size:12px;font-weight:500;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.5);
  color:var(--text);
  cursor:pointer;
  transition:all 0.2s var(--ease);
  font-family:var(--font);
  text-align:center;
}
.card-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.card-btn:hover{transform:translateY(-1px);}
.card-expand{
  font-size:10px;color:var(--accent);text-align:right;padding:4px 12px 8px;
  cursor:pointer;text-decoration:underline;
}

/* Voice Dock */
.voice-dock{
  background:var(--surface-2);
  backdrop-filter:var(--blur);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  transition:all 0.3s var(--ease);
}

/* Dock Orb */
.dock-orb{
  width:36px;height:36px;
  border-radius:50%;
  flex-shrink:0;
  position:relative;
  cursor:pointer;
}
.dock-orb-inner{
  width:100%;height:100%;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#C8D8FF,#9C6CF0 50%,#5FE3C0 85%);
  box-shadow:0 0 16px rgba(110,139,255,0.35),0 0 0 2px rgba(255,255,255,0.4);
  transition:all 0.24s var(--ease);
  animation:orbIdle 4s ease-in-out infinite;
}
.dock-orb-halo{
  position:absolute;
  inset:-6px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(110,139,255,0.2),transparent 70%);
  animation:haloIdle 4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes orbIdle{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.04);}
}
@keyframes haloIdle{
  0%,100%{opacity:0.5;transform:scale(1);}
  50%{opacity:0.8;transform:scale(1.08);}
}

/* Orb states */
.dock-orb.listening .dock-orb-inner{
  background:radial-gradient(circle at 35% 30%,#A8FFEF,#5FE3C0 50%,#6E8BFF 85%);
  animation:orbListening 0.15s ease-in-out infinite;
}
.dock-orb.listening .dock-orb-halo{
  animation:haloListening 0.5s ease-in-out infinite;
}
@keyframes orbListening{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.06);}
}
@keyframes haloListening{
  0%,100%{opacity:0.6;transform:scale(1.1);}
  50%{opacity:1;transform:scale(1.3);}
}
.dock-orb.thinking .dock-orb-inner{
  background:conic-gradient(from 0deg,#6E8BFF,#9C6CF0,#5FE3C0,#6E8BFF);
  animation:orbThinking 1.5s linear infinite;
}
@keyframes orbThinking{
  to{transform:rotate(360deg);}
}
.dock-orb.speaking .dock-orb-inner{
  background:radial-gradient(circle at 35% 30%,#FFD4E8,#9C6CF0 40%,#6E8BFF 80%);
  animation:orbSpeaking 0.6s ease-in-out infinite;
}
@keyframes orbSpeaking{
  0%,100%{transform:scale(1);box-shadow:0 0 16px rgba(156,108,240,0.4);}
  50%{transform:scale(1.05);box-shadow:0 0 28px rgba(156,108,240,0.7);}
}
.dock-orb.muted .dock-orb-inner{
  background:rgba(90,101,130,0.3);
  box-shadow:none;
  animation:none;
}
.dock-orb.muted .dock-orb-halo{animation:none;opacity:0;}

.dock-info{flex:1;min-width:0;}
.dock-label{
  font-size:12px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:6px;
}
.dock-sublabel{font-size:11px;color:var(--text-muted);}
.live-indicator{
  display:none;
  align-items:center;gap:5px;
  font-size:11px;font-weight:600;
  color:var(--accent-3);
  letter-spacing:0.04em;
}
.live-indicator.visible{display:flex;}
.live-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--accent-3);
  animation:livePulse 1s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.5;transform:scale(0.8);}
}
.muted-label{
  display:none;
  font-size:11px;
  font-weight:600;
  color:var(--danger);
  letter-spacing:0.04em;
}
.muted-label.visible{display:block;}

.dock-controls{display:flex;align-items:center;gap:8px;}
.dock-btn{
  width:30px;height:30px;
  border-radius:50%;
  background:rgba(255,255,255,0.6);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:13px;
  transition:all 0.2s var(--ease);
  color:var(--text-muted);
}
.dock-btn:hover{background:rgba(110,139,255,0.15);color:var(--accent);}
.dock-btn.danger{color:var(--danger);}
.dock-btn.danger:hover{background:rgba(255,107,139,0.15);}
.dock-btn.muted-active{
  background:rgba(255,107,139,0.15);
  border-color:rgba(255,107,139,0.4);
  color:var(--danger);
}

/* Waveform bars */
.waveform{
  display:flex;align-items:center;gap:2px;height:20px;
}
.wave-bar{
  width:3px;
  border-radius:2px;
  background:var(--accent);
  transition:height 0.1s ease;
}

/* Composer */
.composer{
  padding:10px 16px 16px;
  background:var(--surface);
  backdrop-filter:var(--blur);
  flex-shrink:0;
}
.attach-chips{
  display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;
}
.attach-chip{
  display:flex;align-items:center;gap:5px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:4px 8px 4px 6px;
  font-size:11px;color:var(--text);
  font-family:var(--font);
}
.attach-thumb{
  width:28px;height:28px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),var(--accent-3));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}
.attach-remove{
  cursor:pointer;color:var(--text-muted);font-size:12px;
  transition:color 0.2s;
}
.attach-remove:hover{color:var(--danger);}

.composer-row{
  display:flex;align-items:flex-end;gap:8px;
}
.attach-btn{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  color:var(--text-muted);
  font-size:18px;
  flex-shrink:0;
  transition:all 0.2s var(--ease);
}
.attach-btn:hover{color:var(--accent);background:rgba(110,139,255,0.1);}

.input-wrap{
  flex:1;
  background:var(--surface-2);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  display:flex;
  align-items:flex-end;
  padding:8px 10px 8px 14px;
  transition:border-color 0.2s var(--ease);
}
.input-wrap:focus-within{border-color:rgba(110,139,255,0.5);}

textarea#composer-input{
  flex:1;
  border:none;background:transparent;
  font-family:var(--font);font-size:14px;
  color:var(--text);resize:none;outline:none;
  min-height:20px;max-height:80px;
  line-height:1.4;
}
textarea#composer-input::placeholder{color:var(--text-muted);}

.send-btn{
  width:32px;height:32px;
  border-radius:50%;
  border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:14px;
  flex-shrink:0;
  transition:all 0.3s var(--ease);
  margin-left:4px;
}
.send-btn.mic{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  box-shadow:0 4px 12px rgba(110,139,255,0.4);
}
.send-btn.send{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  box-shadow:0 4px 12px rgba(110,139,255,0.4);
  transform:rotate(0deg) scale(1);
}
.send-btn.stop{
  background:linear-gradient(135deg,var(--danger),#FF8B9A);
  color:#fff;
  box-shadow:0 4px 12px rgba(255,107,139,0.4);
}

/* Suggestion chips during typing */
.typing-chips{
  display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;
  transition:opacity 0.3s var(--ease);
}
.typing-chips.hidden{opacity:0;pointer-events:none;}

/* Time divider */
.time-divider{
  text-align:center;
  font-size:11px;color:var(--text-muted);
  padding:8px 0;
  letter-spacing:0.04em;
}

/* Demo control */
.demo-btn{
  position:fixed;bottom:20px;right:20px;
  padding:10px 18px;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(12px);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-family:var(--font);font-size:13px;font-weight:600;
  color:var(--accent);
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:all 0.2s var(--ease);
  z-index:100;
}
.demo-btn:hover{background:rgba(255,255,255,0.9);transform:translateY(-2px);}

@media(min-width:600px){
  .app-window{width:420px;height:760px;}
}
@media(min-width:900px){
  body{align-items:center;}
}
</style>
</head>
<body>

<div class="app-window">
  <!-- Header -->
  <div class="header">
    <div class="header-avatar"></div>
    <div class="header-info">
      <div class="header-name">Eliza</div>
      <div class="header-status" id="header-status">Ready to help</div>
    </div>
    <div class="header-btn">⋯</div>
  </div>

  <!-- Thread -->
  <div class="thread" id="thread">
    <!-- Empty state shown initially -->
    <div class="empty-state" id="empty-state">
      <div class="empty-orb" id="empty-orb"></div>
      <div class="empty-title">Good morning ✦</div>
      <div class="empty-subtitle">Ask anything, speak your mind,<br>or start with a suggestion.</div>
      <div class="chips-row" id="starter-chips">
        <div class="chip" onclick="useChip(this)">🌤 Today's weather</div>
        <div class="chip" onclick="useChip(this)">📅 My schedule today</div>
        <div class="chip" onclick="useChip(this)">🎵 Play something calm</div>
        <div class="chip" onclick="useChip(this)">💡 Brainstorm ideas</div>
      </div>
    </div>
  </div>

  <!-- Voice Dock -->
  <div class="voice-dock" id="voice-dock">
    <div class="dock-orb idle" id="dock-orb" onclick="toggleVoice()">
      <div class="dock-orb-inner" id="dock-orb-inner"></div>
      <div class="dock-orb-halo"></div>
    </div>

    <div class="dock-info">
      <div class="dock-label">
        <span id="dock-label-text">Hold to talk</span>
        <div class="live-indicator" id="live-indicator">
          <div class="live-dot"></div>
          <span>Listening…</span>
        </div>
      </div>
      <div class="dock-sublabel" id="dock-sublabel">Tap for hands-free</div>
      <div class="muted-label" id="muted-label">🔇 Muted</div>
      <!-- Waveform (shows during listening/speaking) -->
      <div class="waveform" id="waveform" style="display:none;margin-top:4px;">
        <div class="wave-bar" style="height:4px;" id="wb1"></div>
        <div class="wave-bar" style="height:8px;" id="wb2"></div>
        <div class="wave-bar" style="height:12px;" id="wb3"></div>
        <div class="wave-bar" style="height:6px;" id="wb4"></div>
        <div class="wave-bar" style="height:10px;" id="wb5"></div>
        <div class="wave-bar" style="height:4px;" id="wb6"></div>
        <div class="wave-bar" style="height:8px;" id="wb7"></div>
      </div>
    </div>

    <div class="dock-controls">
      <div class="dock-btn" id="mute-btn" onclick="toggleMute()" title="Mute">🎙</div>
      <div class="dock-btn danger" id="end-btn" onclick="endVoice()" title="End voice">✕</div>
    </div>
  </div>

  <!-- Composer -->
  <div class="composer">
    <div class="attach-chips" id="attach-chips" style="display:none;"></div>
    <div class="composer-row">
      <div class="attach-btn" id="attach-btn" onclick="addAttachment()" title="Attach">+</div>
      <div class="input-wrap">
        <textarea id="composer-input" placeholder="Message Eliza…" rows="1"></textarea>
      </div>
      <button class="send-btn mic" id="send-btn" onclick="handleSendBtn()">🎙</button>
    </div>
    <div class="typing-chips" id="typing-chips">
      <div class="chip followup" onclick="useChip(this)">Be more concise</div>
      <div class="chip followup" onclick="useChip(this)">Expand on this</div>
    </div>
  </div>
</div>

<button class="demo-btn" id="demo-btn" onclick="runDemo()">▶ Play demo</button>

<script>
// ===== State =====
let voiceState = 'idle'; // idle | listening | thinking | speaking | muted
let isMuted = false;
let isGenerating = false;
let pendingAttachments = [];
let demoTimer = null;
let waveformTimer = null;
let msgCount = 0;
let hasMessages = false;

// ===== Initial messages =====
function initMessages(){
  addTypedMessage('user','Can you show me the weather for this week?',false);
  addAssistantMessage(
    'Of course! Here\'s the forecast for San Francisco.',
    true,
    'weather',
    false
  );
  addVoiceMessage('assistant','Sure, I can also tell you about the weekend — looks like there\'s a great hiking window Saturday morning.',true,false,true);
  addTypedMessage('user','What trails would you recommend near the city?',false);
  addAssistantMessage(
    'Great question! I was actually going to suggest Marin Headlands — coastal views, about 6 miles round trip. Also Muir Woods if you want something more lush.',
    false,
    null,
    false
  );
  addFollowupChips();
  scrollThread();
}

// ===== Message helpers =====
function hideEmpty(){
  if(!hasMessages){
    const es = document.getElementById('empty-state');
    if(es) es.style.display = 'none';
    hasMessages = true;
  }
}

function scrollThread(){
  const t = document.getElementById('thread');
  t.scrollTop = t.scrollHeight;
}

function addTimeDivider(text){
  const d = document.createElement('div');
  d.className = 'time-divider';
  d.textContent = text;
  document.getElementById('thread').appendChild(d);
}

function addTypedMessage(role, text, animate){
  hideEmpty();
  const thread = document.getElementById('thread');

  const group = document.createElement('div');
  group.className = 'msg-group';

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.textContent = text;

  const meta = document.createElement('div');
  meta.className = `msg-meta ${role}`;
  const glyph = document.createElement('div');
  glyph.className = 'modality-glyph';
  glyph.textContent = '⌨';
  const time = document.createElement('span');
  time.textContent = 'Just now';
  meta.appendChild(glyph);
  meta.appendChild(time);

  row.appendChild(bubble);
  group.appendChild(row);
  group.appendChild(meta);

  if(pendingAttachments.length && role === 'user'){
    pendingAttachments.forEach(a => {
      const att = document.createElement('div');
      att.className = 'msg-attachment';
      att.textContent = a;
      row.insertBefore(att, bubble);
    });
    pendingAttachments = [];
    clearAttachChips();
  }

  thread.appendChild(group);
  if(animate) group.style.animation = 'msgIn 0.3s var(--ease)';
  scrollThread();
  msgCount++;
}

function addVoiceMessage(role, text, finalized, interrupted, animate){
  hideEmpty();
  const thread = document.getElementById('thread');

  const group = document.createElement('div');
  group.className = 'msg-group';

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}${finalized ? '' : ' partial'}`;
  bubble.textContent = text;

  if(interrupted){
    const badge = document.createElement('div');
    badge.className = 'interrupted-badge';
    badge.textContent = '⚡ Interrupted';
    bubble.appendChild(document.createElement('br'));
    bubble.appendChild(badge);
  }

  const meta = document.createElement('div');
  meta.className = `msg-meta ${role}`;
  const glyph = document.createElement('div');
  glyph.className = 'modality-glyph';
  glyph.textContent = '🎙';
  const time = document.createElement('span');
  time.textContent = finalized ? 'Just now' : 'Transcribing…';
  meta.appendChild(glyph);
  meta.appendChild(time);

  row.appendChild(bubble);
  group.appendChild(row);
  group.appendChild(meta);
  thread.appendChild(group);
  if(animate) group.style.animation = 'msgIn 0.3s var(--ease)';
  scrollThread();
  msgCount++;
  return bubble;
}

function addAssistantMessage(text, withCard, cardType, animate){
  hideEmpty();
  const thread = document.getElementById('thread');
  const group = document.createElement('div');
  group.className = 'msg-group';

  const row = document.createElement('div');
  row.className = 'msg-row assistant';

  const bubble = document.createElement('div');
  bubble.className = 'bubble assistant';
  bubble.textContent = text;

  if(withCard && cardType === 'weather'){
    const card = document.createElement('div');
    card.className = 'app-card';
    card.innerHTML = `
      <div class="app-card-header">
        <div class="app-icon">🌤</div>
        <span class="app-card-name">Weather · San Francisco</span>
      </div>
      <div class="app-card-body">
        <div class="weather-big">68°</div>
        <div class="weather-desc">Partly cloudy, light breeze</div>
        <div class="weather-detail">
          <span>💧 42%</span>
          <span>🌬 12 mph</span>
          <span>UV 4</span>
        </div>
      </div>
      <div class="app-card-actions">
        <div class="card-btn">5-day forecast</div>
        <div class="card-btn primary">Set alert</div>
      </div>
    `;
    const expand = document.createElement('div');
    expand.className = 'card-expand';
    expand.textContent = 'Open full view →';
    expand.onclick = () => alert('Opens fullscreen weather card');
    bubble.appendChild(card);
    bubble.appendChild(expand);
  }

  const meta = document.createElement('div');
  meta.className = 'msg-meta assistant';
  const glyph = document.createElement('div');
  glyph.className = 'modality-glyph';
  glyph.textContent = '⌨';
  const time = document.createElement('span');
  time.textContent = 'Just now';
  meta.appendChild(glyph);
  meta.appendChild(time);

  row.appendChild(bubble);
  group.appendChild(row);
  group.appendChild(meta);
  thread.appendChild(group);
  if(animate) group.style.animation = 'msgIn 0.3s var(--ease)';
  scrollThread();
  return bubble;
}

function addFollowupChips(){
  const thread = document.getElementById('thread');
  const cr = document.createElement('div');
  cr.className = 'chips-row';
  cr.style.justifyContent = 'flex-start';
  cr.style.paddingLeft = '0';
  cr.innerHTML = `
    <div class="chip followup" onclick="useChip(this)">🗺 Show map</div>
    <div class="chip followup" onclick="useChip(this)">⭐ Save trail</div>
    <div class="chip followup" onclick="useChip(this)">📍 Directions</div>
  `;
  thread.appendChild(cr);
  scrollThread();
}

function useChip(el){
  const text = el.textContent.trim();
  el.closest('.chips-row') && el.closest('.chips-row').remove();
  document.getElementById('composer-input').value = text;
  handleInputChange();
  document.getElementById('composer-input').focus();
}

// ===== Attachment =====
function addAttachment(){
  const items = ['📷','📄','📊','🎵'];
  const item = items[Math.floor(Math.random()*items.length)];
  pendingAttachments.push(item);
  renderAttachChips();
}

function renderAttachChips(){
  const container = document.getElementById('attach-chips');
  container.style.display = 'flex';
  container.innerHTML = '';
  pendingAttachments.forEach((a,i) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    chip.innerHTML = `<div class="attach-thumb">${a}</div><span>Attachment ${i+1}</span><span class="attach-remove" onclick="removeAttach(${i})">✕</span>`;
    container.appendChild(chip);
  });
}

function removeAttach(i){
  pendingAttachments.splice(i,1);
  if(pendingAttachments.length === 0) clearAttachChips();
  else renderAttachChips();
}

function clearAttachChips(){
  document.getElementById('attach-chips').style.display = 'none';
  document.getElementById('attach-chips').innerHTML = '';
}

// ===== Voice state machine =====
function setVoiceState(state){
  voiceState = state;
  const orb = document.getElementById('dock-orb');
  const inner = document.getElementById('dock-orb-inner');
  const liveInd = document.getElementById('live-indicator');
  const wf = document.getElementById('waveform');
  const labelText = document.getElementById('dock-label-text');
  const sublabel = document.getElementById('dock-sublabel');
  const headerStatus = document.getElementById('header-status');
  const mutedLabel = document.getElementById('muted-label');

  orb.className = `dock-orb ${isMuted ? 'muted' : state}`;

  liveInd.className = `live-indicator ${state === 'listening' && !isMuted ? 'visible' : ''}`;
  mutedLabel.className = `muted-label ${isMuted ? 'visible' : ''}`;

  if(state === 'listening' && !isMuted){
    labelText.textContent = 'Listening';
    sublabel.textContent = '';
    wf.style.display = 'flex';
    startWaveform();
    headerStatus.textContent = 'Listening…';
  } else if(state === 'thinking'){
    labelText.textContent = 'Thinking…';
    sublabel.textContent = '';
    wf.style.display = 'none';
    stopWaveform();
    headerStatus.textContent = 'Processing…';
  } else if(state === 'speaking'){
    labelText.textContent = 'Speaking';
    sublabel.textContent = 'Tap to interrupt';
    wf.style.display = 'flex';
    startWaveform(true);
    headerStatus.textContent = 'Speaking…';
  } else {
    labelText.textContent = 'Hold to talk';
    sublabel.textContent = isMuted ? 'Mic muted' : 'Tap for hands-free';
    wf.style.display = 'none';
    stopWaveform();
    headerStatus.textContent = isMuted ? 'Muted' : 'Ready to help';
  }
}

function startWaveform(speaking = false){
  const bars = ['wb1','wb2','wb3','wb4','wb5','wb6','wb7'];
  if(waveformTimer) clearInterval(waveformTimer);
  waveformTimer = setInterval(() => {
    bars.forEach(id => {
      const el = document.getElementById(id);
      if(!el) return;
      const amp = speaking
        ? (4 + Math.abs(Math.sin(Date.now()/300 + Math.random()))*16)
        : (2 + Math.random()*14);
      el.style.height = amp + 'px';
      el.style.background = speaking ? `var(--accent-2)` : `var(--accent)`;
    });
  }, 80);
}

function stopWaveform(){
  if(waveformTimer){ clearInterval(waveformTimer); waveformTimer = null; }
  ['wb1','wb2','wb3','wb4','wb5','wb6','wb7'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.style.height = '4px';
  });
}

function toggleVoice(){
  if(isGenerating) return;
  if(voiceState === 'idle') runDemo();
  else endVoice();
}

function endVoice(){
  cancelDemoTimers();
  setVoiceState('idle');
  isGenerating = false;
  updateSendBtn();
}

function toggleMute(){
  isMuted = !isMuted;
  const btn = document.getElementById('mute-btn');
  btn.className = isMuted ? 'dock-btn muted-active' : 'dock-btn';
  btn.textContent = isMuted ? '🔇' : '🎙';
  setVoiceState(voiceState);
}

// ===== Composer =====
const inputEl = document.getElementById('composer-input');
inputEl.addEventListener('input', handleInputChange);
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleSendBtn(); }
});

function handleInputChange(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 80) + 'px';
  updateSendBtn();
  const chips = document.getElementById('typing-chips');
  chips.className = inputEl.value.trim() ? 'typing-chips hidden' : 'typing-chips';
}

function updateSendBtn(){
  const btn = document.getElementById('send-btn');
  if(isGenerating){
    btn.className = 'send-btn stop';
    btn.textContent = '◼';
  } else if(inputEl.value.trim()){
    btn.className = 'send-btn send';
    btn.textContent = '↑';
  } else {
    btn.className = 'send-btn mic';
    btn.textContent = '🎙';
  }
}

function handleSendBtn(){
  if(isGenerating){ stopGeneration(); return; }
  const text = inputEl.value.trim();
  if(text){ sendTypedMessage(text); return; }
  runDemo();
}

function sendTypedMessage(text){
  inputEl.value = '';
  handleInputChange();
  addTypedMessage('user', text, true);

  isGenerating = true;
  updateSendBtn();
  setVoiceState('thinking');

  setTimeout(() => {
    const responses = [
      'I\'d be happy to help with that! Let me pull up the relevant information for you.',
      'Great idea — here\'s what I found based on your question.',
      'Sure thing! Based on what you\'ve asked, here\'s my take on it.',
    ];
    const reply = responses[Math.floor(Math.random()*responses.length)];
    addAssistantMessage(reply, false, null, true);
    addFollowupChips();
    isGenerating = false;
    setVoiceState('idle');
    updateSendBtn();
  }, 1200);
}

function stopGeneration(){
  cancelDemoTimers();
  isGenerating = false;
  setVoiceState('idle');
  updateSendBtn();
}

// ===== Demo cycle =====
let demoTimers = [];
function cancelDemoTimers(){
  demoTimers.forEach(t => clearTimeout(t));
  demoTimers = [];
}

function runDemo(){
  cancelDemoTimers();
  endVoice();

  // IDLE -> LISTENING
  setVoiceState('listening');
  isGenerating = true;
  updateSendBtn();

  // Barge-in: user types mid-voice
  demoTimers.push(setTimeout(() => {
    if(voiceState !== 'listening') return;
    // LISTENING -> THINKING
    setVoiceState('thinking');
    addVoiceMessage('user','What\'s the weather like this weekend?', true, false, true);
  }, 2200));

  // THINKING -> SPEAKING
  demoTimers.push(setTimeout(() => {
    if(voiceState !== 'thinking') return;
    setVoiceState('speaking');
    const bubble = addVoiceMessage('assistant', 'Saturday looks really beautiful — expect about 71 degrees with clear skies. ', false, false, true);

    // Stream transcript
    const words = ['Great', 'for', 'outdoor', 'activities.', 'Sunday', 'might', 'bring', 'some', 'fog', 'in', 'the', 'morning,', 'but', 'it', 'should', 'clear', 'by', 'noon.'];
    let wi = 0;
    const streamInterval = setInterval(() => {
      if(wi < words.length){
        bubble.textContent = bubble.textContent + words[wi] + ' ';
        wi++;
        scrollThread();
      } else {
        clearInterval(streamInterval);
        // Finalize
        bubble.className = 'bubble assistant';
      }
    }, 180);

    // Speaking -> idle
    demoTimers.push(setTimeout(() => {
      clearInterval(streamInterval);
      bubble.className = 'bubble assistant';
      addFollowupChips();
      isGenerating = false;
      setVoiceState('idle');
      updateSendBtn();
    }, 4000));
  }, 3400));
}

// ===== Init =====
window.addEventListener('load', () => {
  initMessages();
  // Autostart demo after short delay
  setTimeout(runDemo, 1200);
});
</script>
</body>
</html>
