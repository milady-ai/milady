<!-- concept-D01-L5 | direction: Giant Centered Orb (Voice-First) | look: Brutalist Mono | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D01 · Giant Centered Orb (Voice-First) · Brutalist Mono</title>
<style>
:root {
  --bg:#F4F2EC;
  --surface:#FFFFFF;
  --surface-2:#E8E5DC;
  --border:#111111;
  --text:#111111;
  --text-muted:#555555;
  --accent:#1A57FF;
  --accent-2:#FF4A00;
  --danger:#D90429;
  --radius:0px;
  --radius-sm:0px;
  --font:"JetBrains Mono","IBM Plex Mono","SF Mono","Cascadia Mono","Courier New",monospace;
  --shadow:4px 4px 0 #111111;
  --shadow-sm:2px 2px 0 #111111;
  --border-w:2px;
  --ease:steps(1,end);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  font-family: var(--font);
  background: #DDDBD3;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.device {
  width: 420px;
  height: 760px;
  position: relative;
  background: var(--bg);
  border: var(--border-w) solid var(--border);
  box-shadow: 8px 8px 0 var(--border);
  flex-shrink: 0;
  overflow: hidden;
}
@media (max-width:480px) {
  body { background: var(--bg); }
  .device { width:100vw; height:100vh; border:none; box-shadow:none; }
}
@media (min-width:900px) and (max-height:700px) {
  .device { width:380px; height:640px; }
}

.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--bg);
}

/* Header */
.header {
  width: 100%;
  border-bottom: var(--border-w) solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  flex-shrink: 0;
  z-index: 10;
}

.agent-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.cc-toggle {
  background: var(--bg);
  border: var(--border-w) solid var(--border);
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: background 0s, color 0s;
  user-select: none;
  box-shadow: var(--shadow-sm);
}
.cc-toggle:hover, .cc-toggle.active {
  background: var(--border);
  color: var(--bg);
}
.cc-toggle svg { width: 12px; height: 12px; }

/* Orb stage */
.orb-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  padding: 20px;
}

/* State label above orb */
.state-label {
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 20px;
}
.state-label .blink { animation: hardBlink 1s steps(1) infinite; }
@keyframes hardBlink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Listening indicator */
.listening-indicator {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--text);
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font);
  color: var(--bg);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0s var(--ease);
  pointer-events: none;
}
.listening-indicator.visible { opacity: 1; }
.listening-indicator.muted { background: var(--danger); }
.listening-indicator svg { width: 11px; height: 11px; }

/* THE ORB — waveform box */
.orb-wrapper {
  position: relative;
  width: 200px;
  height: 200px;
  cursor: pointer;
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow);
  background: var(--surface);
  flex-shrink: 0;
  overflow: hidden;
}
.orb-wrapper:hover { background: var(--surface-2); }

/* Canvas for waveform/bars */
#orbCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* State text label inside orb */
.orb-state-text {
  position: absolute;
  bottom: 8px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  pointer-events: none;
}

/* Grid lines inside orb */
.orb-grid {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(17,17,17,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(17,17,17,0.05) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* Caption area */
.caption-area {
  width: 90%;
  margin-top: 16px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: var(--border-w) solid transparent;
  opacity: 0;
  transition: opacity 0s var(--ease);
}
.caption-area.visible {
  opacity: 1;
  border-color: var(--border);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.caption-text {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  padding: 4px 10px;
  text-align: center;
}
.caption-text .word { opacity: 0.3; display: inline; }
.caption-text .word.final { opacity: 1; color: var(--text); }

/* Suggestion chips */
.chips-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  width: 90%;
  margin-top: 14px;
  transition: opacity 0s;
}
.chips-row.hidden { opacity: 0; pointer-events: none; }

.chip {
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font);
  color: var(--text);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  box-shadow: var(--shadow-sm);
  transition: background 0s, color 0s;
  user-select: none;
}
.chip:hover { background: var(--border); color: var(--bg); }
.chip.followup { color: var(--accent); border-color: var(--accent); box-shadow: 2px 2px 0 var(--accent); }
.chip.followup:hover { background: var(--accent); color: var(--surface); }

/* Controls */
.controls {
  width: 100%;
  padding: 0;
  border-top: var(--border-w) solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  flex-shrink: 0;
}

.ctrl-btn {
  border: none;
  border-right: var(--border-w) solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 4px;
  padding: 16px 8px;
  cursor: pointer;
  transition: background 0s;
  color: var(--text);
  font-family: var(--font);
}
.ctrl-btn:last-child { border-right: none; }
.ctrl-btn:hover { background: var(--border); color: var(--bg); }
.ctrl-btn svg { width: 18px; height: 18px; }
.ctrl-btn .btn-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: inherit;
}

.ctrl-btn.muted-btn { background: var(--danger); color: var(--bg); }
.ctrl-btn.end-btn { color: var(--danger); }
.ctrl-btn.end-btn:hover { background: var(--danger); color: var(--bg); }
.ctrl-btn.talk-btn-cell { background: var(--accent); color: var(--surface); }
.ctrl-btn.talk-btn-cell:hover { background: #0030cc; }
.ctrl-btn.talk-btn-cell .btn-label { color: inherit; }

/* Show text btn */
.show-text-btn {
  position: absolute;
  bottom: 100px;
  right: 16px;
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  padding: 5px 10px;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font);
  color: var(--text-muted);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 5px;
  z-index: 10;
  transition: background 0s, color 0s;
}
.show-text-btn:hover { background: var(--border); color: var(--bg); }

/* Text view */
.text-view {
  position: absolute;
  inset: 0;
  background: var(--bg);
  z-index: 50;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0s var(--ease);
}
.text-view.open { transform: translateX(0); }

.text-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border-bottom: var(--border-w) solid var(--border);
  background: var(--bg);
}
.text-header h2 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.close-text {
  background: var(--surface-2);
  border: var(--border-w) solid var(--border);
  padding: 4px 10px;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font);
  color: var(--text);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  box-shadow: var(--shadow-sm);
  transition: background 0s;
}
.close-text:hover { background: var(--border); color: var(--bg); }

.log {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.log::-webkit-scrollbar { width: 6px; }
.log::-webkit-scrollbar-thumb { background: var(--border); }
.log::-webkit-scrollbar-track { background: var(--surface-2); }

.bubble { display: flex; flex-direction: column; gap: 3px; }
.bubble.user { align-items: flex-end; }
.bubble.assistant { align-items: flex-start; }

.bubble-meta {
  display: flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 700;
  color: var(--text-muted); padding: 0 2px;
  text-transform: uppercase; letter-spacing: 0.1em;
}
.bubble-meta svg { width: 8px; height: 8px; }
.bubble-meta.interrupted { color: var(--danger); }

.bubble-body {
  max-width: 86%;
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  border: var(--border-w) solid var(--border);
}
.bubble.user .bubble-body {
  background: var(--text);
  color: var(--bg);
  box-shadow: var(--shadow-sm);
}
.bubble.assistant .bubble-body {
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.bubble-body.partial { opacity: 0.5; }

.attach-chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--text-muted); padding: 3px 8px;
  font-size: 10px; color: var(--text-muted); margin-top: 5px;
}

/* App card — brutalist */
.app-card {
  max-width: 92%; margin: 0 2px;
  background: var(--surface);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow);
}
.app-card-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: var(--border-w) solid var(--border);
  background: var(--text);
  color: var(--bg);
}
.app-icon { font-size: 14px; }
.app-card-title {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--bg);
}
.app-card-body { padding: 10px 12px; }
.weather-main { display: flex; align-items: baseline; gap: 3px; margin-bottom: 5px; }
.weather-temp { font-size: 36px; font-weight: 700; color: var(--text); }
.weather-unit { font-size: 16px; color: var(--text-muted); }
.weather-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
.weather-row { display: flex; gap: 14px; }
.weather-item { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.weather-item strong { color: var(--text); }
.card-actions { display: flex; border-top: var(--border-w) solid var(--border); }
.card-action {
  flex: 1; padding: 8px;
  border: none; border-right: var(--border-w) solid var(--border);
  background: var(--surface-2);
  font-size: 10px; font-weight: 700; font-family: var(--font);
  color: var(--text); cursor: pointer;
  text-align: center; text-transform: uppercase; letter-spacing: 0.06em;
  transition: background 0s;
}
.card-action:last-child { border-right: none; }
.card-action:hover { background: var(--border); color: var(--bg); }
.card-action.primary { background: var(--accent); color: white; }
.card-action.primary:hover { background: #0030cc; }

/* Composer */
.composer-area {
  padding: 10px 14px 14px;
  background: var(--bg);
  border-top: var(--border-w) solid var(--border);
}
.attach-staged { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.attach-staged-chip {
  display: flex; align-items: center; gap: 5px;
  background: var(--surface-2); border: var(--border-w) solid var(--border);
  padding: 4px 8px; font-size: 10px; font-weight: 700;
  color: var(--text); text-transform: uppercase;
  box-shadow: var(--shadow-sm);
}
.attach-remove { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 14px; line-height: 1; padding: 0; font-family: var(--font); }
.composer { display: flex; align-items: stretch; gap: 6px; }
.attach-btn {
  width: 36px;
  border: var(--border-w) solid var(--border);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: background 0s;
  color: var(--text-muted); box-shadow: var(--shadow-sm);
}
.attach-btn svg { width: 14px; height: 14px; }
.attach-btn:hover { background: var(--border); color: var(--bg); }
.text-input {
  flex: 1;
  border: var(--border-w) solid var(--border);
  background: var(--surface);
  padding: 8px 10px;
  font-size: 12px;
  font-family: var(--font);
  color: var(--text);
  outline: none;
  resize: none;
  min-height: 36px;
  max-height: 90px;
  box-shadow: inset 2px 2px 0 rgba(0,0,0,0.05);
}
.text-input:focus { outline: var(--border-w) solid var(--accent); }
.text-input::placeholder { color: var(--text-muted); }
.send-btn {
  width: 44px;
  border: var(--border-w) solid var(--accent);
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: background 0s;
  color: white; box-shadow: var(--shadow-sm);
}
.send-btn:hover { background: #0030cc; }
.send-btn svg { width: 16px; height: 16px; }
.send-btn.mic-mode { background: var(--surface-2); color: var(--text-muted); border-color: var(--border); box-shadow: var(--shadow-sm); }
.send-btn.mic-mode:hover { background: var(--border); color: var(--bg); }
.send-btn.stop-mode { background: var(--danger); color: white; border-color: var(--danger); }

/* Demo btn */
.demo-btn {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  background: var(--text); border: none;
  padding: 7px 18px;
  font-size: 11px; font-weight: 700; font-family: var(--font);
  color: var(--bg); cursor: pointer; z-index: 20;
  text-transform: uppercase; letter-spacing: 0.08em;
  box-shadow: var(--shadow); white-space: nowrap;
  transition: background 0s;
}
.demo-btn:hover { background: var(--accent); }
</style>
</head>
<body>
<div class="device">
<div class="scene" id="voiceScene">
  <div class="header">
    <div class="agent-name">ELIZA</div>
    <button class="cc-toggle" id="ccToggle" onclick="toggleCC()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="6" width="20" height="12" rx="0"/>
        <path d="M7 10.5h3m-3 3h5m1-3h3m0 3h-3"/>
      </svg>
      [CC]
    </button>
  </div>

  <div class="orb-stage">
    <div class="listening-indicator" id="listenIndicator">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      </svg>
      <span id="listenLabel" class="blink">[ LISTENING ]</span>
    </div>

    <div class="state-label" id="stateLabel">
      <span id="stateLabelText">[ IDLE ]</span>
    </div>

    <div class="orb-wrapper" id="orbWrapper" onclick="handleOrbTap()">
      <div class="orb-grid"></div>
      <canvas id="orbCanvas" width="200" height="200"></canvas>
      <div class="orb-state-text" id="orbStateText">IDLE</div>
    </div>

    <div class="caption-area" id="captionArea">
      <div class="caption-text" id="captionText"></div>
    </div>

    <div class="chips-row" id="idleChips">
      <div class="chip" onclick="handleChip(this)">[WEATHER?]</div>
      <div class="chip" onclick="handleChip(this)">[REMINDER]</div>
      <div class="chip" onclick="handleChip(this)">[STATUS]</div>
      <div class="chip followup" onclick="handleChip(this)" id="followupChip" style="display:none">[EXPAND →]</div>
    </div>
  </div>

  <button class="show-text-btn" onclick="openTextView()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:10px;height:10px">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    [LOG]
  </button>

  <div class="controls">
    <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">
      <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
      </svg>
      <span class="btn-label">MUTE</span>
    </button>

    <button class="ctrl-btn talk-btn-cell" id="talkBtn" onclick="startDemo()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
      </svg>
      <span class="btn-label">TALK</span>
    </button>

    <button class="ctrl-btn end-btn" onclick="endSession()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      <span class="btn-label">END</span>
    </button>
  </div>
</div>

<!-- Text view -->
<div class="text-view" id="textView">
  <div class="text-header">
    <h2>// TRANSCRIPT LOG</h2>
    <button class="close-text" onclick="closeTextView()">← BACK</button>
  </div>
  <div class="log" id="chatLog"></div>
  <div class="composer-area">
    <div class="attach-staged" id="attachStaged" style="display:none"></div>
    <div class="composer">
      <button class="attach-btn" onclick="handleAttach()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>
      <input class="text-input" id="textInput" placeholder="> query..." oninput="handleInput(this)" onkeydown="handleKeydown(event)">
      <button class="send-btn mic-mode" id="sendBtn" onclick="handleSend()">
        <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<button class="demo-btn" id="demoBtn" onclick="startDemo()" style="display:none">▶ RUN DEMO</button>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let appState = 'idle';
let isMuted = false;
let ccOn = false;
let demoRunning = false;
let generatingReply = false;
let stagedAttach = null;
let demoTimer = null;
let currentAmp = 0;
let targetAmp = 0;
let ampInterval = null;

const VOICE_REPLY = ["SAN_FRANCISCO","TEMP:","62F,","PARTLY","CLOUDY,","WEST","BREEZE","8MPH.","SUITABLE","FOR","OUTDOOR","ACTIVITY."];
const TYPED_REPLY = "ACK: reminder queued for 15:00. alert at 14:50. end.";

// DOM
const orb = document.getElementById('orbWrapper');
const listenIndicator = document.getElementById('listenIndicator');
const listenLabel = document.getElementById('listenLabel');
const orbStateText = document.getElementById('orbStateText');
const stateLabelText = document.getElementById('stateLabelText');
const captionArea = document.getElementById('captionArea');
const captionText = document.getElementById('captionText');
const idleChips = document.getElementById('idleChips');
const muteBtn = document.getElementById('muteBtn');
const muteIcon = document.getElementById('muteIcon');
const ccToggle = document.getElementById('ccToggle');
const chatLogEl = document.getElementById('chatLog');
const textView = document.getElementById('textView');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const sendIcon = document.getElementById('sendIcon');
const attachStaged = document.getElementById('attachStaged');
const followupChip = document.getElementById('followupChip');

// Canvas — block bars / ASCII waveform
const canvas = document.getElementById('orbCanvas');
const ctx = canvas.getContext('2d');
const W = 200, H = 200;

// Block chars for display
const BLOCKS = ['▁','▂','▃','▄','▅','▆','▇','█'];
let spinnerIdx = 0;
const SPINNER = ['|','/','-','\\'];
let tick = 0;
let blinkOn = true;

function drawOrb() {
  requestAnimationFrame(drawOrb);
  tick++;
  currentAmp += (targetAmp - currentAmp) * 0.15;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);

  if (appState === 'idle') drawIdleOrb();
  else if (appState === 'listening') drawBars(currentAmp, '#1A57FF', false);
  else if (appState === 'thinking') drawSpinner();
  else if (appState === 'speaking') drawBars(currentAmp, '#FF4A00', true);
}
drawOrb();

// Slow blink for idle cursor
setInterval(() => { blinkOn = !blinkOn; }, 500);

function drawIdleOrb() {
  // ASCII-style block art / low static bars
  ctx.font = '24px JetBrains Mono, Courier New, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const bars = 8;
  const barW = W / bars;
  for (let i = 0; i < bars; i++) {
    const h = Math.abs(Math.sin(i * 0.9 + tick * 0.03)) * 0.15 + 0.02;
    const barH = Math.floor(h * 7);
    const char = BLOCKS[barH];
    ctx.fillStyle = '#CCCCCC';
    ctx.fillText(char, barW * i + barW / 2, H / 2);
  }

  // Blinking cursor center
  if (blinkOn) {
    ctx.font = 'bold 28px JetBrains Mono, Courier New, monospace';
    ctx.fillStyle = '#111111';
    ctx.fillText('_', W / 2, H / 2 + 40);
  }
}

function drawBars(amp, color, isSpeaking) {
  const bars = 14;
  const barW = W / bars - 2;
  const maxH = H * 0.75;
  const centerY = H / 2;

  for (let i = 0; i < bars; i++) {
    const noise = Math.abs(Math.sin(i * 1.8 + tick * (isSpeaking ? 0.22 : 0.15)));
    const h = (amp * noise * 0.9 + 0.06) * maxH;
    const x = (W / bars) * i + 1;

    // Main bar — mirrored
    ctx.fillStyle = color;
    ctx.fillRect(x, centerY - h / 2, barW, h);

    // Invert color top slice for effect
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x, centerY - h / 2, barW, 2);
    ctx.fillRect(x, centerY + h / 2 - 2, barW, 2);
  }

  // Center line
  ctx.fillStyle = color;
  ctx.fillRect(0, centerY, W, 1);
}

function drawSpinner() {
  ctx.font = 'bold 64px JetBrains Mono, Courier New, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#111111';
  const frame = SPINNER[Math.floor(tick / 8) % SPINNER.length];
  ctx.fillText(frame, W / 2, H / 2 - 12);

  ctx.font = '11px JetBrains Mono, Courier New, monospace';
  ctx.fillStyle = '#555555';
  ctx.fillText('PROCESSING...', W / 2, H / 2 + 36);
}

// ── Amplitude ─────────────────────────────────────────────────────────────
function startAmp(fast) {
  stopAmpSim();
  ampInterval = setInterval(() => { targetAmp = Math.random() * 0.85; }, fast ? 75 : 100);
}
function stopAmpSim() {
  if (ampInterval) { clearInterval(ampInterval); ampInterval = null; }
  targetAmp = 0;
}

// ── State machine ─────────────────────────────────────────────────────────
const STATE_LABELS = { idle: '[ IDLE ]', listening: '[ LISTENING ]', thinking: '[ PROCESSING ]', speaking: '[ SPEAKING ]', muted: '[ MUTED ]' };
const ORB_LABELS = { idle: 'IDLE', listening: 'LIVE', thinking: 'PROC', speaking: 'OUT', muted: 'MUTED' };

function setState(s) {
  appState = s;
  stateLabelText.textContent = STATE_LABELS[s] || `[ ${s.toUpperCase()} ]`;
  orbStateText.textContent = ORB_LABELS[s] || s.toUpperCase();

  if (s === 'listening' && !isMuted) {
    listenIndicator.classList.add('visible');
    listenIndicator.classList.remove('muted');
    listenLabel.textContent = '[ LISTENING ]';
    listenLabel.classList.add('blink');
  } else if (isMuted) {
    listenIndicator.classList.add('visible','muted');
    listenLabel.textContent = '[ MUTED ]';
    listenLabel.classList.remove('blink');
  } else {
    listenIndicator.classList.remove('visible');
  }

  idleChips.classList.toggle('hidden', s !== 'idle');
  if (s !== 'speaking') captionArea.classList.remove('visible');
}

function toggleMute() {
  isMuted = !isMuted;
  if (isMuted) {
    muteBtn.classList.add('muted-btn');
    muteIcon.innerHTML = `<line x1="2" y1="2" x2="22" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2m-7-7a3 3 0 0 1 3 3v5.27m-3.27 3.73A3 3 0 0 1 9 12V5"/><line x1="12" y1="19" x2="12" y2="23"/>`;
    listenIndicator.classList.add('visible','muted');
    listenLabel.textContent = '[ MUTED ]';
    listenLabel.classList.remove('blink');
    stopAmpSim();
    stateLabelText.textContent = STATE_LABELS.muted;
    orbStateText.textContent = ORB_LABELS.muted;
  } else {
    muteBtn.classList.remove('muted-btn');
    muteIcon.innerHTML = `<path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>`;
    listenIndicator.classList.remove('muted');
    if (appState !== 'listening') listenIndicator.classList.remove('visible');
    setState(appState);
  }
}

function toggleCC() {
  ccOn = !ccOn;
  ccToggle.classList.toggle('active', ccOn);
  if (!ccOn) captionArea.classList.remove('visible');
}

// ── Demo ──────────────────────────────────────────────────────────────────
function startDemo() {
  if (demoRunning) return;
  demoRunning = true; captionText.innerHTML = '';
  document.getElementById('demoBtn').style.display = 'none';

  setState('listening'); startAmp(false);
  demoTimer = setTimeout(() => {
    stopAmpSim(); setState('thinking');
    demoTimer = setTimeout(() => {
      setState('speaking'); startAmp(true); streamCaption();
      demoTimer = setTimeout(() => {
        stopAmpSim(); setState('idle');
        captionText.innerHTML = ''; captionArea.classList.remove('visible');
        addLogBubble('user', "QUERY: weather san francisco", 'voice');
        addWeatherCard();
        addLogBubble('assistant', VOICE_REPLY.join(' '), 'voice');
        followupChip.style.display = '';
        demoRunning = false; document.getElementById('demoBtn').style.display = 'block';
      }, VOICE_REPLY.length * 120 + 700);
    }, 1200);
  }, 2000);
}

function streamCaption() {
  if (ccOn) captionArea.classList.add('visible');
  let idx = 0; captionText.innerHTML = '';
  function addWord() {
    if (idx >= VOICE_REPLY.length) return;
    const span = document.createElement('span'); span.className = 'word';
    span.textContent = VOICE_REPLY[idx] + ' '; captionText.appendChild(span);
    setTimeout(() => span.classList.add('final'), 30);
    idx++; demoTimer = setTimeout(addWord, 120);
  }
  addWord();
}

// ── Log ───────────────────────────────────────────────────────────────────
function addLogBubble(role, text, modality, opts = {}) {
  const div = document.createElement('div'); div.className = `bubble ${role}`;
  const meta = document.createElement('div'); meta.className = 'bubble-meta';
  if (opts.interrupted) meta.classList.add('interrupted');
  if (modality === 'voice') {
    meta.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg> [VCE]${opts.interrupted ? ' [INT!]' : ''}`;
  } else {
    meta.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> [TXT]`;
  }
  div.appendChild(meta);
  const body = document.createElement('div'); body.className = 'bubble-body' + (opts.partial ? ' partial' : '');
  body.textContent = text;
  if (opts.attach) { const c = document.createElement('div'); c.className = 'attach-chip'; c.textContent = `[FILE: ${opts.attach}]`; body.appendChild(c); }
  div.appendChild(body); chatLogEl.appendChild(div); chatLogEl.scrollTop = chatLogEl.scrollHeight;
  return div;
}

function addWeatherCard() {
  const wrap = document.createElement('div'); wrap.className = 'bubble assistant';
  const card = document.createElement('div'); card.className = 'app-card';
  card.innerHTML = `
    <div class="app-card-header"><div class="app-icon">🌡</div><span class="app-card-title">SYS::WEATHER // SAN_FRANCISCO_CA</span></div>
    <div class="app-card-body">
      <div class="weather-main"><span class="weather-temp">62</span><span class="weather-unit">°F</span></div>
      <div class="weather-desc">PARTLY_CLOUDY | WEST_WIND | 8MPH</div>
      <div class="weather-row">
        <div class="weather-item">HI <strong>67°</strong></div>
        <div class="weather-item">LO <strong>55°</strong></div>
        <div class="weather-item">HUM <strong>74%</strong></div>
      </div>
    </div>
    <div class="card-actions">
      <button class="card-action">5D_FORECAST</button>
      <button class="card-action primary">OPEN_MAP</button>
    </div>`;
  wrap.appendChild(card); chatLogEl.appendChild(wrap); chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

// ── Input morph ───────────────────────────────────────────────────────────
const MIC_SVG = `<path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>`;
const SEND_SVG = `<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>`;
const STOP_SVG = `<rect x="4" y="4" width="16" height="16"/>`;

function handleInput(el) {
  updateSendBtn(el.value.trim());
  if (el.value.trim()) idleChips.classList.add('hidden');
  else idleChips.classList.remove('hidden');
}
function updateSendBtn(val) {
  if (generatingReply) { sendBtn.className='send-btn stop-mode'; sendIcon.innerHTML=STOP_SVG; }
  else if (val) { sendBtn.className='send-btn'; sendIcon.innerHTML=SEND_SVG; }
  else { sendBtn.className='send-btn mic-mode'; sendIcon.innerHTML=MIC_SVG; }
}
function handleKeydown(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();} }
function handleSend() {
  if (generatingReply) { generatingReply=false; updateSendBtn(''); return; }
  const val = textInput.value.trim();
  if (!val && !stagedAttach) { startDemo(); return; }
  if (!val) return;
  const attach = stagedAttach; stagedAttach=null; attachStaged.style.display='none'; attachStaged.innerHTML='';
  addLogBubble('user', val, 'text', attach?{attach}:{});
  textInput.value=''; updateSendBtn('');
  generatingReply=true; updateSendBtn('x');
  const partial = addLogBubble('assistant','PROCESSING...','text',{partial:true});
  setTimeout(()=>{ partial.remove(); generatingReply=false; addLogBubble('assistant',TYPED_REPLY,'text'); updateSendBtn(''); followupChip.style.display=''; },1300);
}
function handleAttach() {
  const names=['file_001.jpg','report_q2.pdf','data_dump.csv'];
  const c=names[Math.floor(Math.random()*names.length)];
  stagedAttach=c; attachStaged.style.display='flex';
  attachStaged.innerHTML=`<div class="attach-staged-chip">[FILE: ${c}]<button class="attach-remove" onclick="removeAttach()">×</button></div>`;
}
function removeAttach(){stagedAttach=null;attachStaged.style.display='none';attachStaged.innerHTML='';}

// ── Views ─────────────────────────────────────────────────────────────────
function openTextView(){textView.classList.add('open');}
function closeTextView(){textView.classList.remove('open');}
function handleOrbTap(){
  if(appState==='idle') startDemo();
  else if(appState==='speaking'){
    clearTimeout(demoTimer); stopAmpSim(); setState('listening'); startAmp(false);
    const metas=chatLogEl.querySelectorAll('.bubble.assistant .bubble-meta');
    if(metas.length){const l=metas[metas.length-1];l.classList.add('interrupted');l.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:8px;height:8px"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg> [VCE] [INT!]`;}
    setTimeout(()=>{stopAmpSim();setState('idle');demoRunning=false;document.getElementById('demoBtn').style.display='block';},2000);
  }
}
function handleChip(el){el.style.opacity='0';setTimeout(()=>el.style.display='none',100);startDemo();}
function endSession(){clearTimeout(demoTimer);stopAmpSim();demoRunning=false;setState('idle');captionText.innerHTML='';captionArea.classList.remove('visible');}

// Seed
(function(){
  addLogBubble('assistant','SYSTEM READY. VOICE INPUT ACTIVE.','text');
  const p=addLogBubble('assistant','FETCHING DATA FROM REMOTE...','voice',{partial:true});
  setTimeout(()=>{const m=p.querySelector('.bubble-meta');m.classList.add('interrupted');m.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:8px;height:8px"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg> [VCE] [INT!]`;},100);
})();
setTimeout(()=>{document.getElementById('demoBtn').style.display='block';},400);
setTimeout(startDemo,700);
</script>
