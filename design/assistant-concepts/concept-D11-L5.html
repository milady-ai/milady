<!-- concept-D11-L5 | direction: Zen Single-Line Minimal | look: Brutalist Mono | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D11 · Zen Single-Line Minimal · Brutalist Mono</title>
<style>
:root{
  --bg:#F4F2EC;
  --surface:#FFFFFF;
  --surface-2:#E8E5DC;
  --border:#111111;
  --text:#111111;
  --text-muted:#555555;
  --accent:#1A57FF;
  --accent-2:#FF4A00;
  --danger:#D90429;
  --radius:0px;
  --radius-sm:0px;
  --font:"JetBrains Mono","IBM Plex Mono","SF Mono","Cascadia Mono","Courier New",monospace;
  --shadow:4px 4px 0 #111111;
  --shadow-sm:2px 2px 0 #111111;
  --border-w:2px;
  --ease:steps(1,end);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:var(--font);
  background:var(--bg);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  image-rendering:pixelated;
}

/* Grid background */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(17,17,17,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(17,17,17,0.04) 1px,transparent 1px);
  background-size:20px 20px;
  pointer-events:none;
}

.device{
  position:relative;
  width:420px;height:760px;
  background:var(--bg);
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* Corner marks */
.device::before,.device::after{
  content:'';position:absolute;
  width:12px;height:12px;
  border:2px solid var(--accent);
  z-index:5;
}
.device::before{top:6px;left:6px;border-right:none;border-bottom:none;}
.device::after{bottom:6px;right:6px;border-left:none;border-top:none;}

/* Header */
.header{
  padding:14px 16px 12px;
  border-bottom:var(--border-w) solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);
}
.header-left{display:flex;align-items:center;gap:12px;}
.header-title{
  font-size:13px;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text);
}
.header-status{
  font-size:10px;color:var(--text-muted);
  letter-spacing:0.06em;
}
.header-right{display:flex;align-items:center;gap:6px;}

.demo-btn{
  padding:4px 10px;
  background:var(--accent);
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow-sm);
  font-family:var(--font);
  font-size:10px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  color:white;cursor:pointer;
  transition:all var(--ease);
}
.demo-btn:hover{background:var(--text);box-shadow:none;}
.demo-btn:active{transform:translate(2px,2px);box-shadow:none;}

.icon-btn{
  width:28px;height:28px;
  background:var(--surface-2);
  border:var(--border-w) solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all var(--ease);
}
.icon-btn:hover{background:var(--text);}
.icon-btn:hover svg{stroke:white;}
.icon-btn svg{width:13px;height:13px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;}

/* Avatar area */
.avatar-area{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px 24px;
  position:relative;
}

/* Waveform box avatar */
.orb-wrap{
  position:relative;
  width:200px;
  margin-bottom:20px;
  cursor:pointer;
}
.waveform-box{
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow-sm);
  background:var(--surface);
  padding:12px 14px 8px;
  position:relative;
}
.waveform-label{
  font-size:9px;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:6px;
  display:flex;align-items:center;justify-content:space-between;
}
.waveform-label .wl-state{color:var(--accent);}
.waveform-bars{
  display:flex;align-items:flex-end;
  gap:3px;height:40px;
  justify-content:center;
}
.waveform-bars span{
  width:8px;background:var(--text);
  display:block;
  transition:height steps(1,end) 80ms;
  min-height:2px;
}
.mute-dot{
  position:absolute;top:-4px;right:-4px;
  width:12px;height:12px;
  background:var(--danger);
  border:var(--border-w) solid var(--border);
  opacity:0;transition:opacity var(--ease);
}
.mute-label{
  font-size:10px;color:var(--danger);
  letter-spacing:0.08em;text-transform:uppercase;
  margin-top:6px;opacity:0;
  transition:opacity var(--ease);
  text-align:center;
  font-weight:700;
}
.state-badge{
  font-size:10px;color:var(--text-muted);
  letter-spacing:0.08em;text-transform:uppercase;
  min-height:13px;text-align:center;
  margin-top:4px;
}

/* Listening indicator */
.listening-indicator{
  display:flex;align-items:center;gap:8px;
  padding:5px 10px;
  border:var(--border-w) solid var(--text);
  background:var(--text);
  margin-bottom:14px;
  opacity:0;
  transition:opacity var(--ease);
  pointer-events:none;
}
.listening-indicator.visible{opacity:1;}
.listening-indicator svg{width:11px;height:11px;stroke:white;fill:none;stroke-width:2;stroke-linecap:square;}
.listening-indicator span{
  font-size:10px;color:white;
  letter-spacing:0.1em;text-transform:uppercase;font-weight:700;
}
.blink-cursor{
  display:inline-block;
  width:7px;height:10px;
  background:white;
  animation:cursorBlink 1s steps(1,end) infinite;
  margin-left:2px;
  vertical-align:middle;
}
@keyframes cursorBlink{0%,50%{opacity:1;}51%,100%{opacity:0;}}

/* Current turn */
.current-turn-outer{
  width:100%;
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow-sm);
  background:var(--surface);
}
.current-turn-inner{
  padding:16px 18px;
  border-bottom:1px solid var(--surface-2);
  min-height:64px;
  display:flex;flex-direction:column;justify-content:center;gap:8px;
}
.turn-line{
  font-size:16px;font-weight:400;
  color:var(--text);
  line-height:1.4;
  letter-spacing:0.01em;
  text-align:left;
  opacity:1;
  transition:opacity var(--ease);
  max-width:100%;
  word-break:break-word;
}
.turn-line.fading{opacity:0;}
.turn-line.partial{opacity:0.45;}
.turn-line.empty{color:var(--text-muted);font-size:14px;}
.turn-meta-bar{
  padding:5px 18px;
  border-top:1px solid var(--surface-2);
  display:flex;align-items:center;gap:6px;
  font-size:9px;color:var(--text-muted);
  letter-spacing:0.1em;text-transform:uppercase;
}
.turn-meta-bar svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;}
.turn-meta-bar.voice-meta{color:var(--accent);}
.turn-meta-bar .meta-visible{transition:opacity var(--ease);}

/* Suggestion set */
.suggestion-set{
  margin-top:14px;
  width:100%;
  display:flex;flex-direction:column;gap:6px;
  opacity:1;
  transition:opacity var(--ease);
}
.suggestion-set.hidden{opacity:0;pointer-events:none;}
.suggestion{
  padding:7px 12px;
  border:var(--border-w) solid var(--text);
  background:var(--surface-2);
  font-size:12px;color:var(--text);
  cursor:pointer;
  letter-spacing:0.03em;
  transition:all var(--ease);
  display:flex;align-items:center;gap:8px;
  width:100%;
  text-align:left;
}
.suggestion::before{content:'>';font-weight:700;color:var(--accent);flex-shrink:0;}
.suggestion:hover{background:var(--text);color:white;}
.suggestion:hover::before{color:white;}

/* Inline card */
.inline-card{
  margin-top:16px;
  width:100%;
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow-sm);
  background:var(--surface);
  opacity:0;
  transition:opacity var(--ease);
  overflow:hidden;
}
.inline-card.visible{opacity:1;}
.card-header{
  padding:8px 12px;
  border-bottom:var(--border-w) solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--text);
  position:relative;
}
.card-header-left{display:flex;align-items:center;gap:8px;}
.card-icon-box{
  width:20px;height:20px;
  border:1px solid rgba(255,255,255,0.4);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
}
.card-title{font-size:11px;font-weight:700;color:white;letter-spacing:0.1em;text-transform:uppercase;}
.card-sub{font-size:9px;color:rgba(255,255,255,0.6);}
.card-expand{cursor:pointer;opacity:0.5;}
.card-expand svg{width:10px;height:10px;stroke:white;fill:none;stroke-width:2;}
.card-body{padding:10px 12px;}
.weather-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;}
.weather-temp{
  font-size:38px;font-weight:700;color:var(--text);
  letter-spacing:-1px;line-height:1;
}
.weather-right{}
.weather-desc{font-size:13px;color:var(--text);letter-spacing:0.02em;}
.weather-sub{font-size:10px;color:var(--text-muted);letter-spacing:0.04em;margin-top:2px;}
.card-actions{
  padding:6px 12px 10px;
  display:flex;gap:6px;
  border-top:1px solid var(--surface-2);
}
.card-btn{
  flex:1;padding:6px;
  font-family:var(--font);
  font-size:10px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  border:var(--border-w) solid var(--border);
  background:var(--accent);color:white;
  cursor:pointer;
  transition:all var(--ease);
}
.card-btn:hover{background:var(--text);}
.card-btn:active{transform:translate(2px,2px);}
.card-btn.secondary{background:var(--surface-2);color:var(--text);}
.card-btn.secondary:hover{background:var(--text);color:white;}

/* Bottom */
.bottom-area{
  border-top:var(--border-w) solid var(--border);
  padding:10px 12px 14px;
  display:flex;flex-direction:column;gap:8px;
  background:var(--surface);
}
.thread-hint{
  text-align:center;
  font-size:9px;color:var(--text-muted);
  letter-spacing:0.1em;text-transform:uppercase;
  opacity:0.6;
}

/* Composer */
.composer{
  display:flex;align-items:stretch;
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow-sm);
  background:var(--surface);
  transition:all var(--ease);
}
.composer:focus-within{
  border-color:var(--accent);
  box-shadow:2px 2px 0 var(--accent);
}

.attach-btn{
  width:36px;
  background:var(--surface-2);
  border:none;border-right:var(--border-w) solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:all var(--ease);
}
.attach-btn:hover{background:var(--text);}
.attach-btn:hover svg{stroke:white;}
.attach-btn svg{width:14px;height:14px;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;}

.attachment-chip{
  display:flex;align-items:center;gap:4px;
  background:rgba(26,87,255,0.1);
  border-right:var(--border-w) solid var(--border);
  padding:0 8px;
  font-size:10px;color:var(--accent);
  opacity:0;max-width:0;overflow:hidden;
  transition:all var(--ease);
}
.attachment-chip.visible{opacity:1;max-width:130px;}
.chip-remove{
  background:none;border:none;cursor:pointer;
  color:var(--accent);font-size:11px;font-family:var(--font);
}

/* Attachment chip rendered inside the current turn line */
.turn-attach-chip{
  display:inline-flex;align-items:center;gap:4px;
  vertical-align:middle;
  margin-right:8px;
  padding:2px 6px;
  border:var(--border-w) solid var(--border);
  background:rgba(26,87,255,0.1);
  font-size:10px;font-weight:700;
  letter-spacing:0.06em;
  color:var(--accent);
  text-transform:uppercase;
}
.turn-attach-chip svg{
  width:10px;height:10px;stroke:var(--accent);fill:none;
  stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;
}

/* Attachment chip above a thread bubble */
.thread-attach-chip{
  display:inline-flex;align-items:center;gap:5px;
  align-self:flex-start;
  padding:3px 7px;
  border:var(--border-w) solid var(--border);
  background:var(--surface-2);
  font-size:9px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--text);
}
.thread-attach-chip.user{align-self:flex-end;background:var(--accent);color:white;}
.thread-attach-chip svg{
  width:9px;height:9px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;
}

.composer-input{
  flex:1;background:none;border:none;outline:none;
  font-family:var(--font);font-size:13px;
  color:var(--text);line-height:1.4;
  padding:10px 10px;
  caret-color:var(--accent);
}
.composer-input::placeholder{color:var(--text-muted);}

.action-btn{
  width:40px;
  border:none;border-left:var(--border-w) solid var(--border);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  position:relative;overflow:hidden;
  transition:all var(--ease);
}
.action-btn svg{
  width:16px;height:16px;fill:none;
  stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;
  position:absolute;
  transition:all var(--ease);
}

.action-btn.mic-mode{background:var(--accent);}
.action-btn.mic-mode .mic-icon{opacity:1;stroke:white;}
.action-btn.mic-mode .send-icon{opacity:0;}
.action-btn.mic-mode .stop-icon{opacity:0;}

.action-btn.send-mode{background:var(--text);}
.action-btn.send-mode .mic-icon{opacity:0;}
.action-btn.send-mode .send-icon{opacity:1;stroke:white;}
.action-btn.send-mode .stop-icon{opacity:0;}

.action-btn.stop-mode{background:var(--danger);}
.action-btn.stop-mode .mic-icon{opacity:0;}
.action-btn.stop-mode .send-icon{opacity:0;}
.action-btn.stop-mode .stop-icon{opacity:1;stroke:white;}

.action-btn:active{transform:translate(2px,2px);}

/* Thread panel */
.thread-panel{
  position:absolute;inset:0;
  background:var(--bg);
  border:var(--border-w) solid var(--border);
  z-index:10;display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform 200ms steps(6,end);
  overflow:hidden;
}
.thread-panel.open{transform:translateX(0);}
.thread-header{
  padding:14px 16px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:var(--border-w) solid var(--border);
  background:var(--surface);
}
.thread-title{
  font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text);
}
.close-thread{
  padding:4px 10px;
  background:var(--surface-2);
  border:var(--border-w) solid var(--border);
  font-family:var(--font);
  font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--text);cursor:pointer;
}
.close-thread:hover{background:var(--text);color:white;}
.thread-list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.thread-turn{display:flex;flex-direction:column;gap:3px;}
.thread-bubble{
  padding:8px 12px;
  font-size:12px;line-height:1.5;
  max-width:85%;
  border:var(--border-w) solid var(--border);
}
.thread-bubble.user{
  background:var(--text);color:white;
  align-self:flex-end;
  box-shadow:var(--shadow-sm);
}
.thread-bubble.assistant{
  background:var(--surface);color:var(--text);
  align-self:flex-start;
}
.thread-bubble.interrupted{opacity:0.5;border-style:dashed;}
.thread-meta{
  font-size:9px;color:var(--text-muted);
  display:flex;align-items:center;gap:4px;
  letter-spacing:0.08em;text-transform:uppercase;
  padding:0 2px;
}
.thread-meta.user-meta{align-self:flex-end;}
.thread-meta svg{width:8px;height:8px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;}
.interrupted-badge{
  font-size:8px;color:var(--danger);
  border:1px solid var(--danger);
  padding:0 3px;
}

@media(min-width:600px){
  body{background:#DDD9CE;}
  .device{box-shadow:6px 6px 0 #111;}
}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="thread-panel" id="threadPanel">
    <div class="thread-header">
      <span class="thread-title">// TRANSCRIPT</span>
      <button class="close-thread" id="closeThread">CLOSE</button>
    </div>
    <div class="thread-list" id="threadList"></div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <span class="header-title">ELIZA</span>
      <span class="header-status" id="headerStatus">READY</span>
    </div>
    <div class="header-right">
      <button class="demo-btn" id="demoBtn">▶ RUN DEMO</button>
      <button class="icon-btn" id="threadBtn">
        <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h8M2 12h10"/></svg>
      </button>
    </div>
  </div>

  <div class="avatar-area">

    <div class="listening-indicator" id="listeningIndicator">
      <svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>
      <span>LISTENING<div class="blink-cursor"></div></span>
    </div>

    <div class="orb-wrap" id="orbWrap" title="Click to mute">
      <div class="waveform-box">
        <div class="waveform-label">
          <span>ELIZA.AI</span>
          <span class="wl-state" id="waveLabel">IDLE</span>
        </div>
        <div class="waveform-bars" id="waveformBars">
          <!-- bars populated by JS -->
        </div>
      </div>
      <div class="mute-dot" id="muteDot"></div>
    </div>
    <div class="mute-label" id="muteLabel">[MUTED]</div>
    <div class="state-badge" id="stateBadge"></div>

    <div class="current-turn-outer">
      <div class="current-turn-inner">
        <div class="turn-line empty" id="turnLine">_ ask me anything</div>
      </div>
      <div class="turn-meta-bar" id="turnMeta" style="opacity:0;min-height:24px;">
        <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="0"/><path d="M5 7h6M5 10h4"/></svg>
        <span id="turnMetaText">TYPED</span>
      </div>
    </div>

    <div class="suggestion-set" id="suggestionSet"></div>

    <div class="inline-card" id="inlineCard">
      <div class="card-header">
        <div class="card-header-left">
          <div class="card-icon-box">🌤</div>
          <div>
            <div class="card-title">WEATHER.SYS</div>
            <div class="card-sub">SAN FRANCISCO, CA</div>
          </div>
        </div>
        <div class="card-expand"><svg viewBox="0 0 16 16"><path d="M10 2h4v4M14 2l-6 6M6 14H2v-4M2 14l6-6"/></svg></div>
      </div>
      <div class="card-body">
        <div class="weather-grid">
          <div class="weather-temp">64°</div>
          <div class="weather-right">
            <div class="weather-desc">PARTLY CLOUDY</div>
            <div class="weather-sub">FEELS_LIKE: 61°F</div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="card-btn">7-DAY FORECAST</button>
        <button class="card-btn secondary">DISMISS</button>
      </div>
    </div>

  </div>

  <div class="bottom-area">
    <div class="thread-hint">↑ VIEW FULL TRANSCRIPT</div>
    <div class="composer" id="composer">
      <button class="attach-btn" id="attachBtn">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
      <div class="attachment-chip" id="attachChip">
        <span>PHOTO.JPG</span>
        <button class="chip-remove" id="chipRemove">×</button>
      </div>
      <input class="composer-input" id="composerInput" type="text" placeholder="TYPE OR SPEAK_" autocomplete="off">
      <button class="action-btn mic-mode" id="actionBtn">
        <svg class="mic-icon" viewBox="0 0 20 20"><path d="M10 1a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V4a3 3 0 0 1 3-3z"/><path d="M4 10a6 6 0 0 0 12 0"/><line x1="10" y1="16" x2="10" y2="19"/></svg>
        <svg class="send-icon" viewBox="0 0 20 20"><path d="M10 15V5M5 10l5-5 5 5"/></svg>
        <svg class="stop-icon" viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ─── Waveform bars ────────────────────────────────────────────────────────────
const barsContainer=document.getElementById('waveformBars');
const NUM_BARS=20;
const bars=[];
for(let i=0;i<NUM_BARS;i++){
  const b=document.createElement('span');
  b.style.height='2px';
  barsContainer.appendChild(b);
  bars.push(b);
}

let barsState='idle';let barsAmp=0;let barsT=0;let barsMuted=false;
let barsRaf=null;
let lastBarUpdate=0;

// Block-character levels for ASCII aesthetic
const BAR_CHARS=['▁','▂','▃','▅','▆','▇','█'];

function updateBars(ts){
  if(ts-lastBarUpdate<80){barsRaf=requestAnimationFrame(updateBars);return;}
  lastBarUpdate=ts;
  barsT+=1;

  for(let i=0;i<NUM_BARS;i++){
    let h;
    if(barsMuted){
      h=2;
      bars[i].style.background='var(--danger)';
      bars[i].style.opacity='0.4';
    } else if(barsState==='idle'){
      h=barsT%16<8?3:2;
      bars[i].style.background='var(--text)';
      bars[i].style.opacity='0.4';
    } else if(barsState==='listening'){
      const wave=Math.floor(Math.random()*barsAmp*36)+2;
      h=Math.min(40,wave);
      bars[i].style.background='var(--accent)';
      bars[i].style.opacity='1';
    } else if(barsState==='thinking'){
      // spinner-like rotation
      const pos=(barsT+i*2)%NUM_BARS;
      h=pos<4?24-pos*4:4;
      bars[i].style.background=i%2===0?'var(--text)':'var(--text-muted)';
      bars[i].style.opacity='0.8';
    } else if(barsState==='speaking'){
      const sine=Math.sin((barsT*0.3+i*0.5))*barsAmp*20+4;
      h=Math.max(2,Math.min(40,Math.floor(sine)));
      bars[i].style.background='var(--text)';
      bars[i].style.opacity='1';
    }
    bars[i].style.height=h+'px';
  }

  barsRaf=requestAnimationFrame(updateBars);
}
barsRaf=requestAnimationFrame(updateBars);

// ─── App state ────────────────────────────────────────────────────────────────
const S={
  appState:'idle',isMuted:false,hasText:false,hasAttach:false,ampT:0,
  turnHistory:[
    {role:'assistant',modality:'typed',text:'SYSTEM READY. HOW CAN I HELP YOU?',interrupted:false,attachment:null},
    {role:'user',modality:'typed',text:'Identify what is in this photo.',interrupted:false,attachment:'PHOTO.JPG'},
    {role:'assistant',modality:'typed',text:'IMAGE: COASTAL SKYLINE AT DUSK. LANDMARK: GOLDEN GATE BRIDGE.',interrupted:false,attachment:null},
    {role:'user',modality:'voice',text:'What\'s the current weather in San Francisco?',interrupted:false,attachment:null},
    {role:'assistant',modality:'typed',text:'SF WEATHER: 64°F / PARTLY CLOUDY / WIND 12MPH W',interrupted:true,attachment:null},
  ]
};

const headerStatus=document.getElementById('headerStatus');
const waveLabel=document.getElementById('waveLabel');
const muteDot=document.getElementById('muteDot');
const muteLabel=document.getElementById('muteLabel');
const stateBadge=document.getElementById('stateBadge');
const listeningIndicator=document.getElementById('listeningIndicator');
const turnLine=document.getElementById('turnLine');
const turnMeta=document.getElementById('turnMeta');
const turnMetaText=document.getElementById('turnMetaText');
const suggestionSet=document.getElementById('suggestionSet');
const inlineCard=document.getElementById('inlineCard');
const composerInput=document.getElementById('composerInput');
const actionBtn=document.getElementById('actionBtn');
const attachBtn=document.getElementById('attachBtn');
const attachChip=document.getElementById('attachChip');
const chipRemove=document.getElementById('chipRemove');
const demoBtn=document.getElementById('demoBtn');
const threadBtn=document.getElementById('threadBtn');
const threadPanel=document.getElementById('threadPanel');
const closeThread=document.getElementById('closeThread');
const threadList=document.getElementById('threadList');
const orbWrap=document.getElementById('orbWrap');

let ampRaf=null;
function animateAmp(){
  S.ampT+=1;
  barsAmp=Math.max(0,Math.min(1,
    (Math.sin(S.ampT*0.3)*0.5+Math.sin(S.ampT*0.7)*0.3+Math.random()*0.2+0.5)*0.7
  ));
  ampRaf=requestAnimationFrame(animateAmp);
}
function stopAmp(){if(ampRaf){cancelAnimationFrame(ampRaf);ampRaf=null;}barsAmp=0;}

function setState(s){
  S.appState=s;barsState=s;
  const statLabels={idle:'READY',listening:'[LISTENING]',thinking:'[THINKING…]',speaking:'[SPEAKING]',muted:'[MUTED]'};
  const wavLabels={idle:'IDLE',listening:'INPUT',thinking:'PROC',speaking:'OUTPUT',muted:'MUTED'};
  headerStatus.textContent=statLabels[s]||'READY';
  headerStatus.style.color=s==='listening'?'var(--accent)':s==='muted'?'var(--danger)':s==='thinking'?'var(--accent-2)':'var(--text-muted)';
  waveLabel.textContent=wavLabels[s]||'IDLE';
  waveLabel.style.color=s==='listening'?'var(--accent)':s==='muted'?'var(--danger)':s==='thinking'?'var(--accent-2)':'var(--text)';
  stateBadge.style.color='var(--text-muted)';
  listeningIndicator.classList.toggle('visible',s==='listening');
  updateActionBtn();
  if(s==='listening'||s==='speaking'){animateAmp();}else{stopAmp();}
}

function updateActionBtn(){
  if(S.appState==='thinking'||S.appState==='speaking'){actionBtn.className='action-btn stop-mode';}
  else if(S.hasText){actionBtn.className='action-btn send-mode';}
  else{actionBtn.className='action-btn mic-mode';}
}

function showTurn(text,modality,partial=false,attachment=null){
  turnLine.classList.add('fading');
  setTimeout(()=>{
    turnLine.className='turn-line'+(partial?' partial':'');
    turnLine.textContent='';
    if(attachment){
      const chip=document.createElement('span');
      chip.className='turn-attach-chip';
      chip.innerHTML='<svg viewBox="0 0 16 16"><path d="M11 5L6 10a2 2 0 0 0 3 3l5-5a3.5 3.5 0 0 0-5-5L4 9a5 5 0 0 0 7 7l4-4"/></svg><span>'+attachment+'</span>';
      turnLine.appendChild(chip);
    }
    turnLine.appendChild(document.createTextNode((partial?'_ ':'')+text.toUpperCase()));
    turnLine.classList.remove('fading');
    if(modality){
      turnMeta.style.opacity='1';
      const isMic=modality==='voice';
      turnMeta.className='turn-meta-bar'+(isMic?' voice-meta':'');
      // update icon inline
      turnMeta.innerHTML=isMic
        ?`<svg viewBox="0 0 16 16" style="width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg><span>VOICE</span>`
        :`<svg viewBox="0 0 16 16" style="width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;"><rect x="2" y="3" width="12" height="10"/><path d="M5 7h6M5 10h4"/></svg><span>TYPED</span>`;
    }else{
      turnMeta.style.opacity='0';
    }
  },80);
}
function resetTurn(){
  turnLine.className='turn-line empty';
  turnLine.textContent='_ ASK ME ANYTHING';
  turnMeta.style.opacity='0';
}

function renderThread(){
  threadList.innerHTML='';
  S.turnHistory.forEach(t=>{
    const div=document.createElement('div');div.className='thread-turn';
    if(t.attachment){
      const att=document.createElement('div');
      att.className='thread-attach-chip'+(t.role==='user'?' user':'');
      att.innerHTML='<svg viewBox="0 0 16 16"><path d="M11 5L6 10a2 2 0 0 0 3 3l5-5a3.5 3.5 0 0 0-5-5L4 9a5 5 0 0 0 7 7l4-4"/></svg><span>'+t.attachment+'</span>';
      div.appendChild(att);
    }
    const bubble=document.createElement('div');
    bubble.className='thread-bubble '+t.role+(t.interrupted?' interrupted':'');
    bubble.textContent=t.text.toUpperCase();
    const meta=document.createElement('div');
    meta.className='thread-meta'+(t.role==='user'?' user-meta':'');
    const isMic=t.modality==='voice';
    meta.innerHTML=(isMic
      ?`<svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>`
      :`<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10"/><path d="M5 7h6M5 10h4"/></svg>`
    )+`<span>${isMic?'VOICE':'TYPED'}${t.interrupted?' <span class="interrupted-badge">INTERRUPTED</span>':''}</span>`;
    div.appendChild(bubble);div.appendChild(meta);
    threadList.appendChild(div);
  });
}

// ─── Contextual suggestions ─────────────────────────────────────────────────
const SUGGESTIONS={
  idle:[
    "What's the weather like today?",
    'Set a timer for 10 minutes',
    "What's on my calendar tomorrow?",
  ],
  weather:[
    "What's the weather like today?",
    'Will it rain this weekend?',
    'Show me the 7-day forecast',
  ],
  timer:[
    'Set a timer for 10 minutes',
    'Set a 25 minute focus timer',
    'How much time is left?',
  ],
  calendar:[
    "What's on my calendar tomorrow?",
    'Schedule a meeting at 3pm',
    'Am I free on Friday?',
  ],
  music:[
    'Play something focused',
    'Skip this track',
    'Turn the volume down',
  ],
};
function suggestionContext(value){
  const v=value.toLowerCase();
  if(/weather|rain|forecast|temperature|cloud|sunny|cold|hot/.test(v))return 'weather';
  if(/timer|remind|alarm|minute|countdown|pomodoro|focus/.test(v))return 'timer';
  if(/calendar|meeting|schedule|appointment|event|free|busy/.test(v))return 'calendar';
  if(/play|song|music|track|album|playlist|volume/.test(v))return 'music';
  return 'idle';
}
let currentSuggestionKey=null;
function renderSuggestions(value=''){
  const key=value.trim().length>0?suggestionContext(value):'idle';
  if(key===currentSuggestionKey&&suggestionSet.children.length)return;
  currentSuggestionKey=key;
  suggestionSet.innerHTML='';
  SUGGESTIONS[key].forEach(text=>{
    const chip=document.createElement('button');
    chip.type='button';
    chip.className='suggestion';
    chip.textContent=text;
    chip.addEventListener('click',()=>{
      composerInput.value=text;S.hasText=true;updateActionBtn();
      hideSuggestions();composerInput.focus();
    });
    suggestionSet.appendChild(chip);
  });
}
function showSuggestions(){renderSuggestions(composerInput.value);suggestionSet.classList.remove('hidden');}
function hideSuggestions(){suggestionSet.classList.add('hidden');}

orbWrap.addEventListener('click',()=>{
  S.isMuted=!S.isMuted;barsMuted=S.isMuted;
  if(S.isMuted){stopAmp();setState('muted');muteDot.style.opacity='1';muteLabel.style.opacity='1';}
  else{muteDot.style.opacity='0';muteLabel.style.opacity='0';setState('idle');}
});

let demoTimers=[];
function clearDemo(){demoTimers.forEach(t=>clearTimeout(t));demoTimers=[];}
const DEMO=[
  {d:0,fn(){setState('listening');showTurn('…','voice',true);hideSuggestions();}},
  {d:1800,fn(){showTurn('Tell me about the weather today…','voice',true);}},
  {d:3200,fn(){
    S.turnHistory.push({role:'user',modality:'voice',text:'Tell me about the weather today.',interrupted:false});
    showTurn('Tell me about the weather today.','voice',false);
  }},
  {d:3400,fn(){setState('thinking');showTurn('PROCESSING…',null,true);}},
  {d:5000,fn(){
    setState('speaking');
    showTurn('Currently 64° and partly cloudy in San Francisco.','voice',false);
  }},
  {d:5300,fn(){
    inlineCard.classList.add('visible');
    S.turnHistory.push({role:'assistant',modality:'typed',text:'Currently 64° and partly cloudy in San Francisco.',interrupted:false});
  }},
  {d:8500,fn(){
    setState('listening');showTurn('…','voice',true);
    inlineCard.classList.remove('visible');
  }},
  {d:9300,fn(){showTurn('What about tomorrow?','voice',true);}},
  {d:10400,fn(){
    S.turnHistory.push({role:'user',modality:'voice',text:'What about tomorrow?',interrupted:false});
    setState('thinking');showTurn('PROCESSING…',null,true);
  }},
  {d:11800,fn(){
    setState('speaking');
    const r='Tomorrow: clear skies, high of 68°. Recommended: outdoor activity.';
    showTurn(r,'voice',false);
    S.turnHistory.push({role:'assistant',modality:'typed',text:r,interrupted:false});
  }},
  {d:14800,fn(){
    setState('idle');
    S.turnHistory.push({role:'user',modality:'typed',text:'And what is in this photo?',attachment:'PHOTO.JPG',interrupted:false});
    showTurn('And what is in this photo?','typed',false,'PHOTO.JPG');
  }},
  {d:16000,fn(){setState('thinking');showTurn('PROCESSING…',null,true);}},
  {d:17600,fn(){
    setState('speaking');
    const r='That photo shows the Golden Gate Bridge at dusk.';
    showTurn(r,'voice',false);
    S.turnHistory.push({role:'assistant',modality:'typed',text:r,interrupted:false});
  }},
  {d:21000,fn(){setState('idle');resetTurn();showSuggestions();}},
];

function runDemo(){
  clearDemo();inlineCard.classList.remove('visible');resetTurn();
  showSuggestions();setState('idle');
  S.isMuted=false;barsMuted=false;
  muteDot.style.opacity='0';muteLabel.style.opacity='0';
  DEMO.forEach(({d,fn})=>demoTimers.push(setTimeout(fn,d)));
}

composerInput.addEventListener('input',()=>{
  S.hasText=composerInput.value.trim().length>0;
  updateActionBtn();
  if(S.appState==='idle'){renderSuggestions(composerInput.value);showSuggestions();}
  else hideSuggestions();
});

actionBtn.addEventListener('click',()=>{
  if(actionBtn.classList.contains('stop-mode')){setState('idle');resetTurn();showSuggestions();return;}
  if(actionBtn.classList.contains('send-mode')){
    const txt=composerInput.value.trim();if(!txt)return;
    const attachment=S.hasAttach?'PHOTO.JPG':null;
    S.turnHistory.push({role:'user',modality:'typed',text:txt,attachment});
    showTurn(txt,'typed',false,attachment);
    composerInput.value='';S.hasText=false;S.hasAttach=false;
    attachChip.classList.remove('visible');updateActionBtn();hideSuggestions();
    setState('thinking');
    setTimeout(()=>{
      setState('speaking');
      const r='Acknowledged. Processing your request now.';
      showTurn(r,'voice',false);
      S.turnHistory.push({role:'assistant',modality:'typed',text:r});
      setTimeout(()=>{setState('idle');resetTurn();showSuggestions();},4000);
    },1500);
    return;
  }
  if(!S.isMuted)runDemo();
});

attachBtn.addEventListener('click',()=>{S.hasAttach=!S.hasAttach;attachChip.classList.toggle('visible',S.hasAttach);});
chipRemove.addEventListener('click',()=>{S.hasAttach=false;attachChip.classList.remove('visible');});
demoBtn.addEventListener('click',runDemo);
threadBtn.addEventListener('click',()=>{renderThread();threadPanel.classList.add('open');});
closeThread.addEventListener('click',()=>threadPanel.classList.remove('open'));

setState('idle');renderSuggestions();renderThread();
setTimeout(runDemo,2200);
</script>
