<!-- concept-D11-L3 | direction: Zen Single-Line Minimal | look: Warm Editorial Paper | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D11 · Zen Single-Line Minimal · Warm Editorial Paper</title>
<style>
:root{
  --bg:#F6F1E7;
  --surface:#FFFDF8;
  --surface-2:#F0E8D9;
  --border:#E2D8C6;
  --text:#23201A;
  --text-muted:#7A7163;
  --accent:#C8643C;
  --accent-2:#4F6B57;
  --danger:#B23A48;
  --radius:14px;
  --radius-sm:10px;
  --font:"Iowan Old Style","Palatino Linotype","Georgia","Times New Roman",serif;
  --font-ui:"Avenir Next","Segoe UI",system-ui,sans-serif;
  --shadow:0 6px 24px rgba(60,45,25,0.10);
  --shadow-sm:0 2px 8px rgba(60,45,25,0.07);
  --ease:cubic-bezier(.4,.0,.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:var(--font);
  background:var(--bg);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* Subtle paper texture via CSS */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    radial-gradient(ellipse at 20% 80%, rgba(200,100,60,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(79,107,87,0.04) 0%, transparent 50%);
  pointer-events:none;
}

.device{
  position:relative;
  width:420px;height:760px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* Ruled top border */
.device::before{
  content:'';
  position:absolute;top:0;left:0;right:0;
  height:3px;
  background:var(--accent);
  z-index:1;
}

/* Header */
.header{
  padding:28px 32px 20px;
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.header-title{
  font-family:var(--font-ui);
  font-size:11px;font-weight:600;
  letter-spacing:0.12em;text-transform:uppercase;
  color:var(--text-muted);
}
.header-right{display:flex;align-items:center;gap:12px;}
.demo-btn{
  font-family:var(--font-ui);
  font-size:11px;font-weight:500;
  letter-spacing:0.06em;
  color:var(--accent);
  background:none;border:none;cursor:pointer;
  padding:4px 0;
  border-bottom:1px solid var(--accent);
  transition:all 500ms var(--ease);
}
.demo-btn:hover{color:var(--text);border-color:var(--text);}
.icon-btn{
  width:28px;height:28px;
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);
  transition:color 400ms var(--ease);
}
.icon-btn:hover{color:var(--text);}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}

/* Avatar area */
.avatar-area{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px 48px;
  position:relative;
}

/* Ink stroke avatar */
.orb-wrap{
  position:relative;
  margin-bottom:28px;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
}
.ink-mark{
  width:120px;height:48px;
  position:relative;
}
canvas#inkCanvas{
  width:120px;height:48px;
}

.mute-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--danger);
  margin-top:8px;
  opacity:0;transition:opacity 500ms;
}
.mute-label{
  font-family:var(--font-ui);
  font-size:10px;color:var(--danger);
  letter-spacing:0.06em;
  margin-top:4px;opacity:0;
  transition:opacity 500ms var(--ease);
  text-align:center;
}
.state-badge{
  font-family:var(--font-ui);
  font-size:10px;color:var(--text-muted);
  letter-spacing:0.06em;
  min-height:14px;text-align:center;
  margin-top:6px;
  transition:all 400ms var(--ease);
  font-style:italic;
}

/* Listening indicator */
.listening-indicator{
  display:flex;align-items:center;gap:8px;
  padding:6px 14px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--surface);
  box-shadow:var(--shadow-sm);
  margin-bottom:16px;
  opacity:0;transform:translateY(5px);
  transition:all 500ms var(--ease);
  pointer-events:none;
}
.listening-indicator.visible{opacity:1;transform:translateY(0);}
.listening-indicator svg{width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:1.5;stroke-linecap:round;}
.listening-indicator span{
  font-family:var(--font-ui);
  font-size:11px;color:var(--accent);
  font-style:italic;
}
.listen-heartbeat{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  animation:heartbeat 1.4s ease-in-out infinite;
}
@keyframes heartbeat{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:0.5;}}

/* Current turn */
.current-turn{
  text-align:center;
  min-height:56px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:10px;
  padding:0 8px;
  width:100%;
}
.turn-line{
  font-size:21px;font-weight:400;
  color:var(--text);
  line-height:1.45;
  font-style:normal;
  opacity:1;
  transition:all 600ms var(--ease);
  text-align:center;
  max-width:100%;
}
.turn-line.fading{opacity:0;transform:translateY(-10px);}
.turn-line.partial{opacity:0.38;font-style:italic;}
.turn-line.empty{
  color:var(--text-muted);
  font-size:17px;font-style:italic;font-weight:400;
}
.turn-meta{
  display:flex;align-items:center;gap:6px;
  font-family:var(--font-ui);
  font-size:10px;color:var(--text-muted);
  letter-spacing:0.05em;text-transform:uppercase;
}
.turn-meta svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.5;}
.turn-meta.voice-meta{color:var(--accent);}

/* Rule separator */
.rule{
  width:40px;height:1px;
  background:var(--border);
  margin:0 auto;
}

/* Suggestion */
.suggestion{
  margin-top:20px;
  font-family:var(--font-ui);
  font-size:13px;color:var(--text-muted);
  cursor:pointer;
  font-style:italic;
  padding:4px 0;
  border-bottom:1px dashed var(--border);
  transition:all 500ms var(--ease);
  opacity:1;text-align:center;
}
.suggestion:hover{color:var(--accent);border-color:var(--accent);}
.suggestion.hidden{opacity:0;pointer-events:none;}

/* Inline card */
.inline-card{
  margin-top:24px;
  width:100%;max-width:280px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  opacity:0;transform:translateY(14px);
  transition:all 700ms var(--ease);
}
.inline-card.visible{opacity:1;transform:translateY(0);}
.card-header{
  padding:12px 16px 8px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.card-icon{
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.card-title{
  font-family:var(--font-ui);
  font-size:12px;font-weight:600;
  color:var(--text);
  letter-spacing:0.04em;text-transform:uppercase;
}
.card-sub{
  font-family:var(--font-ui);
  font-size:10px;color:var(--text-muted);
}
.card-expand{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:0.35;}
.card-expand svg{width:11px;height:11px;stroke:var(--text-muted);fill:none;stroke-width:1.5;}
.card-body{padding:12px 16px;}
.weather-main{display:flex;align-items:baseline;gap:12px;justify-content:center;}
.weather-temp{
  font-size:40px;font-weight:300;
  color:var(--text);letter-spacing:-0.02em;
}
.weather-right{display:flex;flex-direction:column;gap:2px;}
.weather-desc{
  font-family:var(--font-ui);
  font-size:13px;color:var(--text-muted);
}
.weather-loc{
  font-family:var(--font-ui);
  font-size:11px;color:var(--text-muted);
}
.card-actions{
  padding:6px 16px 12px;
  display:flex;gap:8px;
}
.card-btn{
  flex:1;padding:7px;
  border-radius:var(--radius-sm);
  font-family:var(--font-ui);
  font-size:11px;font-weight:500;
  border:1px solid var(--border);
  background:none;
  color:var(--accent);cursor:pointer;
  letter-spacing:0.04em;text-transform:uppercase;
  transition:all 400ms var(--ease);
}
.card-btn:hover{background:var(--surface-2);}
.card-btn.secondary{color:var(--text-muted);}

/* Bottom */
.bottom-area{
  padding:0 24px 32px;
  display:flex;flex-direction:column;gap:10px;
  border-top:1px solid var(--border);
  padding-top:16px;
}
.thread-hint{
  text-align:center;
  font-family:var(--font-ui);
  font-size:10px;color:var(--text-muted);
  letter-spacing:0.05em;
  font-style:italic;
  opacity:0.65;
}

/* Composer */
.composer{
  display:flex;align-items:center;gap:8px;
  padding:6px 0;
  border-bottom:1px solid var(--border);
  transition:border-color 400ms var(--ease);
}
.composer:focus-within{border-color:var(--accent);}

.attach-btn{
  width:26px;height:26px;
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);flex-shrink:0;
  transition:color 400ms;
}
.attach-btn:hover{color:var(--accent);}
.attach-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}

.attachment-chip{
  display:flex;align-items:center;gap:5px;
  background:rgba(200,100,60,0.08);
  border:1px solid rgba(200,100,60,0.25);
  border-radius:6px;
  padding:3px 8px;
  font-family:var(--font-ui);
  font-size:11px;color:var(--accent);
  opacity:0;max-width:0;overflow:hidden;
  transition:all 400ms var(--ease);
}
.attachment-chip.visible{opacity:1;max-width:150px;}
.chip-remove{
  background:none;border:none;cursor:pointer;
  color:var(--accent);font-size:11px;opacity:0.6;
}

.composer-input{
  flex:1;background:none;border:none;outline:none;
  font-family:var(--font);font-size:16px;font-weight:400;
  color:var(--text);line-height:1.5;
  caret-color:var(--accent);
}
.composer-input::placeholder{color:var(--text-muted);font-style:italic;}

/* Action button */
.action-btn{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);
  transition:all 400ms var(--ease);flex-shrink:0;
  position:relative;overflow:hidden;
}
.action-btn svg{
  width:15px;height:15px;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  position:absolute;
  transition:all 400ms var(--ease);
}

.action-btn.mic-mode{border-color:var(--accent);}
.action-btn.mic-mode:hover{background:rgba(200,100,60,0.06);}
.action-btn.mic-mode .mic-icon{opacity:1;stroke:var(--accent);}
.action-btn.mic-mode .send-icon{opacity:0;transform:scale(0.4);}
.action-btn.mic-mode .stop-icon{opacity:0;transform:scale(0.4);}

.action-btn.send-mode{background:var(--accent);border-color:var(--accent);}
.action-btn.send-mode .mic-icon{opacity:0;transform:scale(0.4);}
.action-btn.send-mode .send-icon{opacity:1;stroke:white;}
.action-btn.send-mode .stop-icon{opacity:0;transform:scale(0.4);}

.action-btn.stop-mode{border-color:var(--danger);}
.action-btn.stop-mode .mic-icon{opacity:0;transform:scale(0.4);}
.action-btn.stop-mode .send-icon{opacity:0;transform:scale(0.4);}
.action-btn.stop-mode .stop-icon{opacity:1;stroke:var(--danger);}

/* Thread panel */
.thread-panel{
  position:absolute;inset:0;
  background:var(--surface);
  border-radius:4px;
  z-index:10;display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform 600ms var(--ease);
  overflow:hidden;
}
.thread-panel.open{transform:translateX(0);}
.thread-header{
  padding:28px 28px 16px;
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.thread-title{
  font-family:var(--font);
  font-size:18px;font-weight:400;
  color:var(--text);font-style:italic;
}
.close-thread{
  font-family:var(--font-ui);font-size:11px;color:var(--text-muted);
  background:none;border:none;cursor:pointer;
  letter-spacing:0.06em;text-transform:uppercase;
}
.close-thread:hover{color:var(--accent);}
.thread-list{flex:1;overflow-y:auto;padding:20px 28px;display:flex;flex-direction:column;gap:14px;}
.thread-turn{display:flex;flex-direction:column;gap:4px;}
.thread-bubble{
  padding:10px 14px;
  border-radius:var(--radius-sm);
  font-size:14px;line-height:1.6;
  font-family:var(--font);
  max-width:85%;
}
.thread-bubble.user{
  background:rgba(200,100,60,0.07);
  border:1px solid rgba(200,100,60,0.15);
  color:var(--text);align-self:flex-end;
}
.thread-bubble.assistant{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);align-self:flex-start;
}
.thread-bubble.interrupted{opacity:0.55;border-style:dashed;}
.thread-meta{
  font-family:var(--font-ui);
  font-size:10px;color:var(--text-muted);
  display:flex;align-items:center;gap:4px;
  padding:0 2px;font-style:italic;
}
.thread-meta.user-meta{align-self:flex-end;}
.thread-meta svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:1.5;}
.interrupted-badge{
  font-size:9px;color:var(--danger);
  border-radius:3px;padding:1px 4px;
  background:rgba(178,58,72,0.08);
}

@media(min-width:600px){
  body{background:#EDE8DC;}
  .device{box-shadow:0 20px 60px rgba(60,45,25,0.15);}
}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="thread-panel" id="threadPanel">
    <div class="thread-header">
      <span class="thread-title">Conversation</span>
      <button class="close-thread" id="closeThread">Close</button>
    </div>
    <div class="thread-list" id="threadList"></div>
  </div>

  <div class="header">
    <span class="header-title">Eliza</span>
    <div class="header-right">
      <button class="demo-btn" id="demoBtn">▷ Play demo</button>
      <button class="icon-btn" id="threadBtn">
        <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h8M2 12h10"/></svg>
      </button>
    </div>
  </div>

  <div class="avatar-area" id="avatarArea">

    <div class="listening-indicator" id="listeningIndicator">
      <svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>
      <div class="listen-heartbeat"></div>
      <span>Listening…</span>
    </div>

    <div class="orb-wrap" id="orbWrap" title="Tap to mute">
      <div class="ink-mark">
        <canvas id="inkCanvas" width="240" height="96"></canvas>
      </div>
      <div class="mute-dot" id="muteDot"></div>
    </div>
    <div class="mute-label" id="muteLabel">Muted</div>
    <div class="state-badge" id="stateBadge"></div>

    <div class="current-turn">
      <div class="turn-line empty" id="turnLine">Ask me anything…</div>
      <div class="turn-meta" id="turnMeta" style="opacity:0"></div>
    </div>

    <div class="rule"></div>

    <div class="suggestion" id="suggestion" data-text="What's the weather like today?">
      What's the weather like today?
    </div>

    <div class="inline-card" id="inlineCard">
      <div class="card-header">
        <div class="card-icon">🌤</div>
        <div>
          <div class="card-title">Weather</div>
          <div class="card-sub">San Francisco, CA</div>
        </div>
        <div class="card-expand"><svg viewBox="0 0 16 16"><path d="M10 2h4v4M14 2l-6 6M6 14H2v-4M2 14l6-6"/></svg></div>
      </div>
      <div class="card-body">
        <div class="weather-main">
          <div class="weather-temp">64°</div>
          <div class="weather-right">
            <div class="weather-desc">Partly cloudy</div>
            <div class="weather-loc">Feels like 61°</div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="card-btn">7-day forecast</button>
        <button class="card-btn secondary">Dismiss</button>
      </div>
    </div>

  </div>

  <div class="bottom-area">
    <div class="thread-hint">↑ swipe to read full conversation</div>
    <div class="composer" id="composer">
      <button class="attach-btn" id="attachBtn">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
      <div class="attachment-chip" id="attachChip">
        <span>📎 photo.jpg</span>
        <button class="chip-remove" id="chipRemove">×</button>
      </div>
      <input class="composer-input" id="composerInput" type="text" placeholder="Write or speak…" autocomplete="off">
      <button class="action-btn mic-mode" id="actionBtn">
        <svg class="mic-icon" viewBox="0 0 20 20"><path d="M10 1a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V4a3 3 0 0 1 3-3z"/><path d="M4 10a6 6 0 0 0 12 0"/><line x1="10" y1="16" x2="10" y2="19"/></svg>
        <svg class="send-icon" viewBox="0 0 20 20"><path d="M10 15V5M5 10l5-5 5 5"/></svg>
        <svg class="stop-icon" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ─── Ink stroke avatar ────────────────────────────────────────────────────────
const canvas=document.getElementById('inkCanvas');
const ctx=canvas.getContext('2d');
let inkT=0;let inkState='idle';let inkAmp=0;let inkMuted=false;
let inkRaf=null;

function drawInk(){
  ctx.clearRect(0,0,240,96);
  inkT+=0.025;

  const cx=120,cy=48;
  const W=180,H=16;

  ctx.save();
  ctx.beginPath();

  const pts=[];
  const segments=80;
  for(let i=0;i<=segments;i++){
    const t=i/segments;
    const x=cx-W/2+t*W;
    let y=cy;

    if(inkMuted){
      y=cy;
    } else if(inkState==='idle'){
      y=cy+Math.sin(inkT*1.4+t*Math.PI*2)*3;
    } else if(inkState==='listening'){
      const amp=inkAmp*H;
      y=cy+Math.sin(inkT*5+t*Math.PI*4)*amp*0.6
         +Math.sin(inkT*3.2+t*Math.PI*2)*amp*0.4;
    } else if(inkState==='thinking'){
      y=cy+Math.sin(inkT*2.8+t*Math.PI*3)*8
         +Math.sin(inkT*1.2+t*Math.PI)*4;
    } else if(inkState==='speaking'){
      const amp=inkAmp*H;
      y=cy+Math.sin(inkT*6+t*Math.PI*4)*amp*0.7
         +Math.sin(inkT*3.5+t*Math.PI*2)*amp*0.3;
    }
    pts.push({x,y});
  }

  // draw smooth curve
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i].x+pts[i+1].x)/2;
    const my=(pts[i].y+pts[i+1].y)/2;
    ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
  }
  ctx.quadraticCurveTo(pts[pts.length-2].x,pts[pts.length-2].y,
                        pts[pts.length-1].x,pts[pts.length-1].y);

  if(inkMuted){
    ctx.strokeStyle='rgba(178,58,72,0.4)';
    ctx.lineWidth=1.5;
  } else if(inkState==='idle'){
    ctx.strokeStyle='rgba(35,32,26,0.35)';
    ctx.lineWidth=1.5;
  } else if(inkState==='listening'){
    ctx.strokeStyle='rgba(200,100,60,0.8)';
    ctx.lineWidth=2;
  } else if(inkState==='thinking'){
    const g=ctx.createLinearGradient(cx-W/2,0,cx+W/2,0);
    g.addColorStop(0,'rgba(200,100,60,0.6)');
    g.addColorStop(0.5,'rgba(79,107,87,0.6)');
    g.addColorStop(1,'rgba(200,100,60,0.6)');
    ctx.strokeStyle=g;
    ctx.lineWidth=2;
  } else if(inkState==='speaking'){
    ctx.strokeStyle='rgba(35,32,26,0.7)';
    ctx.lineWidth=2.5;
  }

  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.stroke();

  // end dot
  if(!inkMuted){
    ctx.beginPath();
    ctx.arc(pts[pts.length-1].x,pts[pts.length-1].y,3,0,Math.PI*2);
    ctx.fillStyle=inkState==='listening'||inkState==='speaking'?'rgba(200,100,60,0.9)':'rgba(35,32,26,0.5)';
    ctx.fill();
  }

  ctx.restore();
  inkRaf=requestAnimationFrame(drawInk);
}
inkRaf=requestAnimationFrame(drawInk);

// ─── App state ────────────────────────────────────────────────────────────────
const S={
  appState:'idle',isMuted:false,hasText:false,hasAttach:false,ampT:0,
  turnHistory:[
    {role:'assistant',modality:'typed',text:'Good morning. What would you like to explore today?',interrupted:false},
    {role:'user',modality:'voice',text:"What's the weather like in San Francisco?",interrupted:false},
    {role:'assistant',modality:'typed',text:"It's 64° and partly cloudy — a typical San Francisco afternoon.",interrupted:true},
  ]
};

const device=document.getElementById('device');
const muteDot=document.getElementById('muteDot');
const muteLabel=document.getElementById('muteLabel');
const stateBadge=document.getElementById('stateBadge');
const listeningIndicator=document.getElementById('listeningIndicator');
const turnLine=document.getElementById('turnLine');
const turnMeta=document.getElementById('turnMeta');
const suggestion=document.getElementById('suggestion');
const inlineCard=document.getElementById('inlineCard');
const composerInput=document.getElementById('composerInput');
const actionBtn=document.getElementById('actionBtn');
const attachBtn=document.getElementById('attachBtn');
const attachChip=document.getElementById('attachChip');
const chipRemove=document.getElementById('chipRemove');
const demoBtn=document.getElementById('demoBtn');
const threadBtn=document.getElementById('threadBtn');
const threadPanel=document.getElementById('threadPanel');
const closeThread=document.getElementById('closeThread');
const threadList=document.getElementById('threadList');
const orbWrap=document.getElementById('orbWrap');

let ampRaf=null;
function animateAmp(){
  S.ampT+=0.05;
  const v=Math.sin(S.ampT*2.2)*0.5+Math.sin(S.ampT*4.1)*0.3+Math.random()*0.2;
  inkAmp=Math.max(0,Math.min(1,(v+0.5)*0.65));
  ampRaf=requestAnimationFrame(animateAmp);
}
function stopAmp(){if(ampRaf){cancelAnimationFrame(ampRaf);ampRaf=null;}inkAmp=0;}

function setState(s){
  S.appState=s;inkState=s;
  const badges={idle:'',listening:'Listening…',thinking:'Thinking…',speaking:'',muted:'Muted'};
  stateBadge.textContent=badges[s]||'';
  stateBadge.style.color=s==='muted'?'var(--danger)':s==='thinking'?'var(--text-muted)':'var(--text-muted)';
  listeningIndicator.classList.toggle('visible',s==='listening');
  updateActionBtn();
  if(s==='listening'||s==='speaking'){animateAmp();}else{stopAmp();}
}

function updateActionBtn(){
  if(S.appState==='thinking'||S.appState==='speaking'){actionBtn.className='action-btn stop-mode';}
  else if(S.hasText){actionBtn.className='action-btn send-mode';}
  else{actionBtn.className='action-btn mic-mode';}
}

function showTurn(text,modality,partial=false){
  turnLine.classList.add('fading');
  setTimeout(()=>{
    turnLine.className='turn-line'+(partial?' partial':'');
    turnLine.textContent=text;turnLine.classList.remove('fading');
    if(modality){
      turnMeta.style.opacity='1';
      turnMeta.className='turn-meta'+(modality==='voice'?' voice-meta':'');
      turnMeta.innerHTML=modality==='voice'
        ?`<svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg><span>Voice</span>`
        :`<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 7h6M5 10h4"/></svg><span>Written</span>`;
    }else{turnMeta.style.opacity='0';}
  },350);
}
function resetTurn(){turnLine.className='turn-line empty';turnLine.textContent='Ask me anything…';turnMeta.style.opacity='0';}

function renderThread(){
  threadList.innerHTML='';
  S.turnHistory.forEach(t=>{
    const div=document.createElement('div');div.className='thread-turn';
    const bubble=document.createElement('div');
    bubble.className='thread-bubble '+t.role+(t.interrupted?' interrupted':'');
    bubble.textContent=t.text;
    const meta=document.createElement('div');
    meta.className='thread-meta'+(t.role==='user'?' user-meta':'');
    const icon=t.modality==='voice'
      ?`<svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>`
      :`<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 7h6M5 10h4"/></svg>`;
    meta.innerHTML=icon+`<span>${t.modality==='voice'?'Voice':'Written'}${t.interrupted?' <span class="interrupted-badge">interrupted</span>':''}</span>`;
    div.appendChild(bubble);div.appendChild(meta);
    threadList.appendChild(div);
  });
}

orbWrap.addEventListener('click',()=>{
  S.isMuted=!S.isMuted;inkMuted=S.isMuted;
  if(S.isMuted){stopAmp();setState('muted');muteDot.style.opacity='1';muteLabel.style.opacity='1';}
  else{muteDot.style.opacity='0';muteLabel.style.opacity='0';setState('idle');}
});

let demoTimers=[];
function clearDemo(){demoTimers.forEach(t=>clearTimeout(t));demoTimers=[];}
const DEMO=[
  {d:0,fn(){setState('listening');showTurn('…','voice',true);suggestion.classList.add('hidden');}},
  {d:2000,fn(){showTurn('What is the weather like today…','voice',true);}},
  {d:3600,fn(){
    S.turnHistory.push({role:'user',modality:'voice',text:'What is the weather like today?',interrupted:false});
    showTurn('What is the weather like today?','voice',false);
  }},
  {d:3900,fn(){setState('thinking');showTurn('…',null,true);}},
  {d:5500,fn(){
    setState('speaking');
    showTurn('Currently 64° and partly cloudy in San Francisco.','voice',false);
  }},
  {d:6000,fn(){
    inlineCard.classList.add('visible');
    S.turnHistory.push({role:'assistant',modality:'typed',text:'Currently 64° and partly cloudy in San Francisco.',interrupted:false});
  }},
  {d:9500,fn(){
    setState('listening');showTurn('…','voice',true);
    inlineCard.classList.remove('visible');
  }},
  {d:10500,fn(){showTurn('And what about tomorrow?','voice',true);}},
  {d:11800,fn(){
    S.turnHistory.push({role:'user',modality:'voice',text:'And what about tomorrow?',interrupted:false});
    setState('thinking');showTurn('…',null,true);
  }},
  {d:13200,fn(){
    setState('speaking');
    const r='Tomorrow brings clear skies — sunshine and a pleasant high of 68°.';
    showTurn(r,'voice',false);
    S.turnHistory.push({role:'assistant',modality:'typed',text:r,interrupted:false});
  }},
  {d:17000,fn(){setState('idle');resetTurn();suggestion.classList.remove('hidden');}},
];
function runDemo(){
  clearDemo();inlineCard.classList.remove('visible');resetTurn();
  suggestion.classList.remove('hidden');setState('idle');
  S.isMuted=false;inkMuted=false;
  muteDot.style.opacity='0';muteLabel.style.opacity='0';
  DEMO.forEach(({d,fn})=>demoTimers.push(setTimeout(fn,d)));
}

composerInput.addEventListener('input',()=>{
  S.hasText=composerInput.value.trim().length>0;
  updateActionBtn();
  if(S.hasText)suggestion.classList.add('hidden');
  else if(S.appState==='idle')suggestion.classList.remove('hidden');
});
actionBtn.addEventListener('click',()=>{
  if(actionBtn.classList.contains('stop-mode')){setState('idle');resetTurn();suggestion.classList.remove('hidden');return;}
  if(actionBtn.classList.contains('send-mode')){
    const txt=composerInput.value.trim();if(!txt)return;
    S.turnHistory.push({role:'user',modality:'typed',text:txt});
    showTurn(txt,'typed',false);
    composerInput.value='';S.hasText=false;S.hasAttach=false;
    attachChip.classList.remove('visible');updateActionBtn();suggestion.classList.add('hidden');
    setState('thinking');
    setTimeout(()=>{
      setState('speaking');
      const r="I've made a note of that. Is there anything else you'd like to explore?";
      showTurn(r,'voice',false);S.turnHistory.push({role:'assistant',modality:'typed',text:r});
      setTimeout(()=>{setState('idle');resetTurn();suggestion.classList.remove('hidden');},4500);
    },1800);
    return;
  }
  if(!S.isMuted)runDemo();
});
attachBtn.addEventListener('click',()=>{S.hasAttach=!S.hasAttach;attachChip.classList.toggle('visible',S.hasAttach);});
chipRemove.addEventListener('click',()=>{S.hasAttach=false;attachChip.classList.remove('visible');});
suggestion.addEventListener('click',()=>{
  composerInput.value=suggestion.dataset.text;S.hasText=true;updateActionBtn();
  suggestion.classList.add('hidden');composerInput.focus();
});
demoBtn.addEventListener('click',runDemo);
threadBtn.addEventListener('click',()=>{renderThread();threadPanel.classList.add('open');});
closeThread.addEventListener('click',()=>threadPanel.classList.remove('open'));

setState('idle');renderThread();
setTimeout(runDemo,1000);
</script>
</body>
</html>
