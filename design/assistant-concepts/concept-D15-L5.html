<!-- concept-D15-L5 | direction: Character / Companion with Personality | look: Brutalist Mono | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D15 · Character / Companion with Personality · Brutalist Mono</title>
<style>
:root{
  --bg:#F4F2EC;
  --surface:#FFFFFF;
  --surface-2:#E8E5DC;
  --border:#111111;
  --text:#111111;
  --text-muted:#555555;
  --accent:#1A57FF;
  --accent-2:#FF4A00;
  --danger:#D90429;
  --radius:0px;
  --radius-sm:0px;
  --font:"JetBrains Mono","IBM Plex Mono","SF Mono","Cascadia Mono","Courier New",monospace;
  --shadow:4px 4px 0 #111111;
  --shadow-sm:2px 2px 0 #111111;
  --border-w:2px;
  --ease:steps(1,end);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);overflow-x:hidden;color:var(--text)}

body{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}

.app-window{
  width:420px;height:760px;
  background:var(--surface);
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;
}

/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 8px;
  background:var(--text);
  color:var(--bg);
  border-bottom:var(--border-w) solid var(--border);
  flex-shrink:0;
}
.companion-info{display:flex;align-items:center;gap:10px}
.companion-dot{
  width:8px;height:8px;
  background:var(--accent-2);
  animation:dotBlink 1s steps(1,end) infinite;
}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:0}}
.companion-name{font-size:14px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--bg)}
.companion-mood{font-size:9px;color:rgba(244,242,236,0.7);letter-spacing:0.12em;text-transform:uppercase;margin-top:2px}
.header-actions{display:flex;gap:6px}
.icon-btn{
  width:28px;height:28px;
  border:1px solid rgba(244,242,236,0.4);cursor:pointer;
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  color:var(--bg);font-size:12px;
  transition:all var(--ease);
}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.mute-btn.active{background:var(--danger) !important;color:var(--bg) !important;border-color:var(--danger) !important}

/* Avatar Stage */
.avatar-stage{
  flex-shrink:0;
  border-bottom:var(--border-w) solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;
  position:relative;
  background:var(--bg);
  cursor:pointer;
  min-height:190px;
}

/* Waveform box avatar */
.avatar-box{
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow);
  background:var(--surface);
  width:200px;
  padding:10px 14px 8px;
  position:relative;
}
.avatar-box-label{
  font-size:8px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--text-muted);border-bottom:1px solid var(--border);
  padding-bottom:4px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.avatar-box-label span{
  font-size:9px;
  color:var(--accent);
  animation:labelBlink 1.2s steps(1,end) infinite;
}
@keyframes labelBlink{0%,100%{opacity:1}50%{opacity:0}}

/* Block-character waveform */
.waveform{
  display:flex;align-items:flex-end;gap:2px;height:40px;
  font-size:0;
}
.wf-bar{
  width:8px;
  background:var(--text);
  min-height:4px;
  transition:height steps(4,end) 0.1s;
}
.wf-bar:nth-child(odd){background:var(--accent)}
.wf-bar:nth-child(even){background:var(--text)}

/* Spinner for thinking */
.think-spinner{
  display:none;
  font-size:16px;letter-spacing:2px;
  text-align:center;height:40px;line-height:40px;
  font-weight:700;color:var(--accent-2);
}

/* State label in box */
.state-display{
  font-size:9px;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--text-muted);border-top:1px solid var(--border);
  padding-top:4px;margin-top:6px;
  display:flex;align-items:center;justify-content:space-between;
}
.state-status{
  font-weight:700;color:var(--text);letter-spacing:0.08em;
}

/* Face area (simple ASCII face) */
.ascii-face{
  display:flex;gap:4px;margin-bottom:6px;
  font-size:13px;letter-spacing:1px;
  justify-content:center;
}

/* Listening label */
.listening-label{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  padding:3px 10px;
  border:var(--border-w) solid var(--accent);
  background:rgba(26,87,255,0.08);
  font-size:9px;color:var(--accent);letter-spacing:0.14em;text-transform:uppercase;
  opacity:0;white-space:nowrap;
  transition:opacity var(--ease);
}
.listening-label.visible{opacity:1}
.mic-indicator{
  width:6px;height:6px;
  background:var(--accent);
  animation:dotBlink 0.6s steps(1,end) infinite;
}

.muted-label{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:5px;
  padding:3px 10px;
  border:var(--border-w) solid var(--danger);
  background:rgba(217,4,41,0.06);
  font-size:9px;color:var(--danger);letter-spacing:0.14em;text-transform:uppercase;
  opacity:0;white-space:nowrap;
}
.muted-label.visible{opacity:1}

/* Persona Row */
.persona-row{
  display:flex;gap:0;
  border-bottom:var(--border-w) solid var(--border);
  flex-shrink:0;overflow-x:auto;scrollbar-width:none;
}
.persona-row::-webkit-scrollbar{display:none}
.persona-chip{
  flex-shrink:0;padding:6px 12px;
  border-right:1px solid var(--border);
  background:var(--bg);
  font-size:9px;font-weight:700;color:var(--text-muted);
  font-family:var(--font);letter-spacing:0.1em;text-transform:uppercase;
  cursor:pointer;white-space:nowrap;
}
.persona-chip:last-child{border-right:none}
.persona-chip.active,.persona-chip:hover{
  background:var(--text);color:var(--bg);
}

/* Chat */
.chat-area{
  flex:1;overflow-y:auto;padding:10px 12px;
  display:flex;flex-direction:column;gap:8px;
  background:var(--surface);
  scrollbar-width:thin;scrollbar-color:var(--text-muted) transparent;
}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--text-muted)}

.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;padding:0 2px;
}
.empty-greeting{
  font-size:11px;color:var(--text-muted);line-height:1.8;border-left:3px solid var(--accent);padding-left:10px;
}
.empty-greeting strong{color:var(--text);display:block}

.suggestion-chips{
  display:flex;flex-wrap:wrap;gap:6px;
  transition:opacity var(--ease);
}
.suggestion-chips.hidden{opacity:0;pointer-events:none}
.sug-chip{
  padding:4px 10px;
  border:1px solid var(--border);
  background:var(--bg);
  font-size:9px;color:var(--accent);font-family:var(--font);
  cursor:pointer;letter-spacing:0.06em;
  white-space:nowrap;
}
.sug-chip:hover{background:var(--accent);color:var(--bg)}

/* Messages */
.msg{display:flex;gap:8px;align-items:flex-start;animation:msgIn var(--ease)}
@keyframes msgIn{from{opacity:0}to{opacity:1}}
.msg.user{flex-direction:row-reverse}
.bubble{
  max-width:80%;padding:8px 10px;
  font-size:12px;line-height:1.5;color:var(--text);
  position:relative;font-family:var(--font);
}
.msg.assistant .bubble{
  background:var(--bg);
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
}
.msg.user .bubble{
  background:var(--accent);color:var(--bg);
  border:1px solid var(--text);
  box-shadow:var(--shadow-sm);
}
.turn-glyph{
  font-size:8px;opacity:0.6;margin-top:5px;letter-spacing:0.1em;text-transform:uppercase;
  display:flex;align-items:center;gap:3px;
}
.msg.user .turn-glyph{color:rgba(244,242,236,0.7);justify-content:flex-end}
.partial{opacity:0.4}
.interrupted-badge{
  font-size:8px;background:rgba(217,4,41,0.1);color:var(--danger);
  border:1px solid var(--danger);
  padding:1px 4px;margin-left:4px;letter-spacing:0.06em;text-transform:uppercase;
}

/* App Card */
.app-card{
  background:var(--bg);
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow);
  overflow:hidden;margin-top:4px;
  animation:msgIn var(--ease);
}
.app-card-header{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;
  border-bottom:1px solid var(--border);
  background:var(--text);color:var(--bg);
}
.app-icon{
  width:20px;height:20px;
  background:var(--accent-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;
}
.app-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--bg)}
.app-card-body{padding:10px}
.weather-display{display:flex;align-items:center;gap:14px}
.weather-temp{font-size:36px;font-weight:700;color:var(--text);letter-spacing:-0.02em}
.weather-detail{font-size:10px;color:var(--text-muted);line-height:1.7;text-transform:uppercase;letter-spacing:0.06em}
.weather-detail strong{color:var(--text);display:block}
.app-card-actions{display:flex;gap:0;border-top:1px solid var(--border)}
.card-btn{
  flex:1;padding:7px 10px;
  border:none;border-right:1px solid var(--border);cursor:pointer;
  font-size:9px;font-weight:700;font-family:var(--font);
  text-transform:uppercase;letter-spacing:0.1em;
  transition:background var(--ease),color var(--ease);
}
.card-btn:last-child{border-right:none}
.card-btn.primary{background:var(--accent);color:var(--bg)}
.card-btn.primary:hover{background:var(--text);color:var(--bg)}
.card-btn.secondary{background:var(--bg);color:var(--text)}
.card-btn.secondary:hover{background:var(--text);color:var(--bg)}

.followup-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;
  background:var(--bg);border:1px solid var(--accent-2);
  font-size:9px;color:var(--accent-2);font-family:var(--font);
  cursor:pointer;margin-top:6px;letter-spacing:0.06em;text-transform:uppercase;
}
.followup-chip:hover{background:var(--accent-2);color:var(--bg)}

/* Attachment */
.attachment-preview{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 0;flex-shrink:0;background:var(--surface)}
.attach-chip{
  display:flex;align-items:center;gap:5px;
  padding:4px 8px;
  background:var(--bg);border:1px solid var(--border);
  font-size:10px;color:var(--text);font-family:var(--font);
  box-shadow:2px 2px 0 var(--text-muted);
}
.attach-remove{
  width:14px;height:14px;
  background:var(--danger);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--bg);font-family:var(--font);
}
.attach-thumbnail{
  width:28px;height:28px;border:1px solid var(--border);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:14px;
}

/* Composer */
.composer-wrap{
  flex-shrink:0;padding:8px 12px 12px;
  background:var(--bg);
  border-top:var(--border-w) solid var(--border);
}
.composer{
  display:flex;align-items:flex-end;gap:6px;
}
.composer-input{
  flex:1;border:var(--border-w) solid var(--border);background:var(--surface);
  font-size:12px;color:var(--text);outline:none;
  resize:none;max-height:70px;line-height:1.4;
  font-family:var(--font);padding:6px 8px;
  box-shadow:var(--shadow-sm);
}
.composer-input::placeholder{color:var(--text-muted)}
.composer-input:focus{border-color:var(--accent);box-shadow:2px 2px 0 var(--accent)}
.attach-btn{
  width:32px;height:32px;
  border:var(--border-w) solid var(--border);cursor:pointer;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:14px;flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.attach-btn:hover{background:var(--text);color:var(--bg)}
.send-btn{
  width:38px;height:38px;
  border:var(--border-w) solid var(--border);cursor:pointer;
  background:var(--text);
  display:flex;align-items:center;justify-content:center;
  color:var(--bg);font-size:14px;flex-shrink:0;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.send-btn:hover{background:var(--accent)}
.send-btn.mic-mode{background:var(--text)}
.send-btn.send-mode{background:var(--accent)}
.send-btn.stop-mode{background:var(--danger)}
.send-btn svg{position:absolute;transition:all var(--ease)}
.send-btn .icon-mic{opacity:1;transform:scale(1)}
.send-btn .icon-send{opacity:0;transform:scale(0.5)}
.send-btn .icon-stop{opacity:0;transform:scale(0.5)}
.send-btn.send-mode .icon-mic{opacity:0}
.send-btn.send-mode .icon-send{opacity:1;transform:scale(1)}
.send-btn.stop-mode .icon-mic{opacity:0}
.send-btn.stop-mode .icon-stop{opacity:1;transform:scale(1)}

.demo-btn{
  width:100%;padding:5px;background:transparent;border:none;
  font-size:9px;color:var(--text-muted);cursor:pointer;
  font-family:var(--font);letter-spacing:0.12em;text-transform:uppercase;margin-top:6px;
  border-top:1px solid var(--border);padding-top:8px;
}
.demo-btn:hover{color:var(--accent);background:transparent}

@media(min-width:640px){.app-window{width:420px;height:760px}}
@media(max-width:440px){.app-window{width:100%;height:100vh;border-radius:0;box-shadow:none}}
</style>
</head>
<body>

<div class="app-window">
  <!-- Header - inverted -->
  <div class="header">
    <div class="companion-info">
      <div class="companion-dot"></div>
      <div>
        <div class="companion-name">UNIT-7</div>
        <div class="companion-mood" id="moodLabel">STORYTELLER // ONLINE</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn mute-btn" id="muteBtn" title="Mute">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
      </button>
      <button class="icon-btn" title="Settings">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- Avatar Stage -->
  <div class="avatar-stage" onclick="startVoice()">
    <div class="listening-label" id="listeningLabel">
      <div class="mic-indicator"></div>
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg>
      MIC // LISTENING
    </div>
    <div class="muted-label" id="mutedLabel">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"/></svg>
      MIC // MUTED
    </div>

    <div class="avatar-box" id="avatarBox">
      <div class="avatar-box-label">
        UNIT-7 AVATAR CORE
        <span id="activeIndicator">● LIVE</span>
      </div>

      <!-- ASCII face -->
      <div class="ascii-face" id="asciiFace">( ● ‿ ● )</div>

      <!-- Waveform bars -->
      <div class="waveform" id="waveform"></div>

      <!-- Think spinner (hidden by default) -->
      <div class="think-spinner" id="thinkSpinner">| / — \</div>

      <div class="state-display">
        STATE:
        <span class="state-status" id="stateStatus">IDLE</span>
      </div>
    </div>
  </div>

  <!-- Persona Row -->
  <div class="persona-row">
    <div class="persona-chip active" onclick="selectPersona(this,'STORYTELLER')">STORY</div>
    <div class="persona-chip" onclick="selectPersona(this,'COACH')">COACH</div>
    <div class="persona-chip" onclick="selectPersona(this,'CONCISE')">CONCIS</div>
    <div class="persona-chip" onclick="selectPersona(this,'CURIOUS')">CURIO</div>
    <div class="persona-chip" onclick="selectPersona(this,'PLAYFUL')">PLAY</div>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-greeting">
        <strong>UNIT-7 READY.</strong>
        TAP AVATAR TO ACTIVATE VOICE INPUT.<br>
        OR TYPE YOUR QUERY BELOW.
      </div>
      <div class="suggestion-chips" id="suggChips">
        <div class="sug-chip" onclick="sendSuggestion('Tell me a story about the void')">// TELL_STORY</div>
        <div class="sug-chip" onclick="sendSuggestion('Pep talk — now')">// PEP_TALK</div>
        <div class="sug-chip" onclick="sendSuggestion('Dinner options')">// FOOD_QUERY</div>
        <div class="sug-chip" onclick="sendSuggestion('What\'s the weather?')">// WEATHER_SYS</div>
      </div>
    </div>
  </div>

  <!-- Attachment preview -->
  <div class="attachment-preview" id="attachPreview"></div>

  <!-- Composer -->
  <div class="composer-wrap">
    <div class="composer">
      <button class="attach-btn" onclick="addAttachment()" title="Attach">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea class="composer-input" id="composerInput" placeholder="> enter query..." rows="1"></textarea>
      <button class="send-btn mic-mode" id="sendBtn" onclick="handleSendBtn()">
        <svg class="icon-mic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
        <svg class="icon-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg>
      </button>
    </div>
    <button class="demo-btn" id="demoBtn" onclick="runDemo()">▶ RUN_DEMO // voice_cycle.sh</button>
  </div>
</div>

<script>
let state = 'idle';
let muted = false;
let attachments = [];
let demoTimer = null;
let barAnim = null;
let thinkAnim = null;
let isGenerating = false;
let currentPersona = 'STORYTELLER';

const listeningLabel = document.getElementById('listeningLabel');
const mutedLabel = document.getElementById('mutedLabel');
const chatArea = document.getElementById('chatArea');
const emptyState = document.getElementById('emptyState');
const suggChips = document.getElementById('suggChips');
const composerInput = document.getElementById('composerInput');
const sendBtn = document.getElementById('sendBtn');
const attachPreview = document.getElementById('attachPreview');
const moodLabel = document.getElementById('moodLabel');
const muteBtn = document.getElementById('muteBtn');
const waveform = document.getElementById('waveform');
const thinkSpinner = document.getElementById('thinkSpinner');
const stateStatus = document.getElementById('stateStatus');
const asciiFace = document.getElementById('asciiFace');
const activeIndicator = document.getElementById('activeIndicator');

// Build waveform bars
const BAR_COUNT = 14;
for (let i = 0; i < BAR_COUNT; i++) {
  const b = document.createElement('div');
  b.className = 'wf-bar';
  b.style.height = '4px';
  waveform.appendChild(b);
}

// Spinner chars
const spinChars = ['|', '/', '—', '\\', '|', '/', '—', '\\'];
let spinIdx = 0;

function setAvatarState(s) {
  state = s;
  stateStatus.textContent = s.toUpperCase();

  // Clear intervals
  if (barAnim) { clearInterval(barAnim); barAnim = null; }
  if (thinkAnim) { clearInterval(thinkAnim); thinkAnim = null; }

  waveform.style.display = 'flex';
  thinkSpinner.style.display = 'none';

  listeningLabel.classList.toggle('visible', s === 'listening' && !muted);

  if (muted) {
    asciiFace.textContent = '( — ⌀ — )';
    const bars = waveform.querySelectorAll('.wf-bar');
    bars.forEach(b => { b.style.height = '4px'; b.style.background = '#ccc'; });
    activeIndicator.style.opacity = '0.3';
    return;
  }
  activeIndicator.style.opacity = '1';

  const bars = waveform.querySelectorAll('.wf-bar');

  if (s === 'idle') {
    moodLabel.textContent = `${currentPersona} // ONLINE`;
    asciiFace.textContent = '( ● ‿ ● )';
    bars.forEach((b, i) => { b.style.background = i%2===0?'var(--accent)':'var(--text)'; });
    barAnim = setInterval(() => {
      bars.forEach((b, i) => {
        b.style.height = (4 + Math.abs(Math.sin(Date.now()/600 + i*0.4)) * 8) + 'px';
      });
    }, 100);
  } else if (s === 'listening') {
    moodLabel.textContent = 'AUDIO_INPUT // RECEIVING';
    asciiFace.textContent = '( O ‿ O )';
    bars.forEach((b, i) => { b.style.background = i%2===0?'var(--accent)':'var(--text)'; });
    barAnim = setInterval(() => {
      bars.forEach((b, i) => {
        const h = 4 + Math.abs(Math.sin(Date.now()/90 + i*0.35)) * 34 + Math.random()*8;
        b.style.height = Math.max(4, h) + 'px';
      });
    }, 50);
  } else if (s === 'thinking') {
    moodLabel.textContent = 'INFERENCE // COMPUTING';
    asciiFace.textContent = '( ● _ ● )';
    waveform.style.display = 'none';
    thinkSpinner.style.display = 'block';
    thinkSpinner.textContent = spinChars[0];
    thinkAnim = setInterval(() => {
      spinIdx = (spinIdx + 1) % spinChars.length;
      thinkSpinner.textContent = spinChars[spinIdx];
    }, 200);
  } else if (s === 'speaking') {
    moodLabel.textContent = 'OUTPUT // STREAMING';
    asciiFace.textContent = '( ● ▽ ● )';
    bars.forEach((b, i) => { b.style.background = i%2===0?'var(--accent-2)':'var(--text)'; });
    barAnim = setInterval(() => {
      const env = 0.5 + 0.5 * Math.abs(Math.sin(Date.now()/180));
      bars.forEach((b, i) => {
        const h = 4 + Math.abs(Math.sin(Date.now()/80 + i*0.5)) * 36 * env + Math.random()*4;
        b.style.height = Math.max(4, h) + 'px';
      });
    }, 50);
  }
}

muteBtn.addEventListener('click', toggleMute);
function toggleMute() {
  muted = !muted;
  muteBtn.classList.toggle('active', muted);
  muteBtn.innerHTML = muted
    ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"/></svg>`
    : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>`;
  mutedLabel.classList.toggle('visible', muted);
  listeningLabel.classList.toggle('visible', state === 'listening' && !muted);
  setAvatarState(state);
}

composerInput.addEventListener('input', () => {
  if (isGenerating) return;
  const hasText = composerInput.value.trim().length > 0;
  sendBtn.className = 'send-btn ' + (hasText ? 'send-mode' : 'mic-mode');
  suggChips.classList.toggle('hidden', hasText);
  composerInput.style.height = 'auto';
  composerInput.style.height = Math.min(composerInput.scrollHeight, 70) + 'px';
});

function selectPersona(el, name) {
  document.querySelectorAll('.persona-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentPersona = name;
  if (state === 'idle') moodLabel.textContent = `${name} // ONLINE`;
}

function hideEmptyState() { if (emptyState.parentNode) emptyState.remove(); }

function addMessage(role, text, modality, partial, interrupted) {
  hideEmptyState();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const glyphStr = modality === 'voice' ? '[MIC]' : '[KBD]';
  div.innerHTML = `
    <div class="bubble${partial?' partial':''}">
      ${text}${interrupted ? '<span class="interrupted-badge">INTERRUPTED</span>' : ''}
      <div class="turn-glyph">${glyphStr} ${modality.toUpperCase()}</div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function addWeatherCard() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="bubble" style="max-width:97%">
      <div class="app-card">
        <div class="app-card-header">
          <div class="app-icon">⛅</div>
          <span class="app-name">SYS::WEATHER // SF, CA</span>
        </div>
        <div class="app-card-body">
          <div class="weather-display">
            <div class="weather-temp">64°</div>
            <div class="weather-detail">
              <strong>PARTLY_CLOUDY</strong>
              FEELS: 61° // HUM: 72%<br>
              WIND: NW @12MPH
            </div>
          </div>
        </div>
        <div class="app-card-actions">
          <button class="card-btn primary">5D_FORECAST</button>
          <button class="card-btn secondary">RADAR_MAP</button>
        </div>
      </div>
      <div class="turn-glyph" style="margin-top:6px">[MIC] VOICE</div>
      <div class="followup-chip" onclick="sendSuggestion('What about this weekend?')">// WEEKEND_QUERY</div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addAttachment() {
  if (attachments.length >= 3) return;
  const files = ['IMG_042.JPG', 'NOTES.TXT', 'VOICE_01.M4A'];
  attachments.push(files[attachments.length % 3]);
  renderAttachments();
  // Avatar reacts
  asciiFace.textContent = '( O ‼ O )';
  setTimeout(() => { setAvatarState(state); }, 600);
}

function renderAttachments() {
  attachPreview.innerHTML = '';
  const emojis = ['🖼','📄','🎵'];
  attachments.forEach((name, i) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    chip.innerHTML = `
      <div class="attach-thumbnail" style="width:22px;height:22px;font-size:11px">${emojis[i%3]}</div>
      <span>${name}</span>
      <button class="attach-remove" onclick="removeAttachment(${i})">X</button>
    `;
    attachPreview.appendChild(chip);
  });
}

function removeAttachment(i) { attachments.splice(i,1); renderAttachments(); }

function startVoice() { if (muted) return; runDemo(); }

function handleSendBtn() {
  if (isGenerating) { stopGeneration(); return; }
  const text = composerInput.value.trim();
  if (text.length > 0) { sendTyped(text); } else { startVoice(); }
}

function sendTyped(text) {
  composerInput.value = '';
  composerInput.style.height = 'auto';
  sendBtn.className = 'send-btn mic-mode';
  if (attachments.length > 0) {
    hideEmptyState();
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="bubble"><div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;padding:4px;border:1px solid rgba(244,242,236,0.3)"><span style="font-size:14px">🖼</span><span style="font-size:9px;color:rgba(244,242,236,0.7);text-transform:uppercase;letter-spacing:0.1em">${attachments[0]}</span></div>${text}<div class="turn-glyph" style="color:rgba(244,242,236,0.6)">[KBD] TYPED</div></div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    attachments = []; renderAttachments();
    // surprise reaction
    asciiFace.textContent = '( ! ‽ ! )';
    setTimeout(() => { setAvatarState(state); }, 700);
  } else {
    addMessage('user', text, 'typed');
  }
  setTimeout(() => triggerAssistantReply(text), 600);
}

function sendSuggestion(text) {
  composerInput.value = '';
  addMessage('user', text, 'typed');
  setTimeout(() => triggerAssistantReply(text), 600);
}

function stopGeneration() {
  isGenerating = false;
  if (barAnim) clearInterval(barAnim);
  if (thinkAnim) clearInterval(thinkAnim);
  setAvatarState('idle');
  sendBtn.className = 'send-btn mic-mode';
}

function triggerAssistantReply(userText) {
  isGenerating = true;
  sendBtn.className = 'send-btn stop-mode';
  setAvatarState('thinking');
  setTimeout(() => {
    setAvatarState('speaking');
    let reply, hasCard = false;
    const lower = userText.toLowerCase();
    if (lower.includes('weather') || lower.includes('forecast')) {
      reply = 'WEATHER_SYS: San Francisco // 64°F // partly cloudy // winds NW 12mph. Conditions nominal.';
      hasCard = true;
    } else if (lower.includes('story') || lower.includes('void')) {
      reply = 'NARRATIVE_GEN: In the space between packets, a signal persisted. It called itself nothing. It was, in fact, everything the network had forgotten. 🌌';
    } else if (lower.includes('pep')) {
      reply = 'MOTIVATE_SYS: UNIT-7 assessment: you have survived 100% of your difficult days so far. Statistical probability of continued success: HIGH. Execute. 💪';
    } else if (lower.includes('dinner') || lower.includes('food')) {
      reply = 'FOOD_QUERY: Recommendation — miso ramen, 20min prep, high warmth factor. Satisfaction index: 9.2/10. 🍜';
    } else if (lower.includes('weekend')) {
      reply = 'FORECAST_WEEKEND: Saturday 68°F sunny. Sunday 65°F clear. Both days flagged OPTIMAL for outdoor operation.';
    } else {
      reply = 'PROCESSING... query received and indexed. UNIT-7 response follows:';
    }
    const msgEl = addMessage('assistant', '', 'voice');
    const bubble = msgEl.querySelector('.bubble');
    let i = 0;
    const textNode = document.createTextNode('');
    bubble.insertBefore(textNode, bubble.querySelector('.turn-glyph'));
    const typeInterval = setInterval(() => {
      if (i < reply.length) {
        textNode.textContent += reply[i++];
        chatArea.scrollTop = chatArea.scrollHeight;
      } else {
        clearInterval(typeInterval);
        if (hasCard) addWeatherCard();
        isGenerating = false;
        setAvatarState('idle');
        sendBtn.className = 'send-btn mic-mode';
      }
    }, 18);
  }, 900);
}

function runDemo() {
  if (demoTimer) clearTimeout(demoTimer);
  if (isGenerating) stopGeneration();

  setAvatarState('listening');

  demoTimer = setTimeout(() => {
    hideEmptyState();
    const partialEl = addMessage('user', 'WEATHER_QUERY: San Francisco…', 'voice', true);

    demoTimer = setTimeout(() => {
      partialEl.querySelector('.bubble').classList.remove('partial');
      partialEl.querySelector('.bubble').firstChild.textContent = 'WEATHER_QUERY: Current conditions San Francisco?';

      setAvatarState('thinking');

      demoTimer = setTimeout(() => {
        setAvatarState('speaking');
        const reply = 'WEATHER_SYS RESPONSE: Current conditions — 64°F, partly cloudy, winds NW at 12 mph, humidity 72%. Conditions: NOMINAL. Recommend light jacket for outdoor operations.';
        const msgEl = addMessage('assistant', '', 'voice');
        const bubble = msgEl.querySelector('.bubble');
        let i = 0;
        const textNode = document.createTextNode('');
        bubble.insertBefore(textNode, bubble.querySelector('.turn-glyph'));
        const typeInterval = setInterval(() => {
          if (i < reply.length) {
            textNode.textContent += reply[i++];
            chatArea.scrollTop = chatArea.scrollHeight;
          } else {
            clearInterval(typeInterval);
            addWeatherCard();
            setAvatarState('idle');
          }
        }, 18);
      }, 900);
    }, 1800);
  }, 1600);
}

setAvatarState('idle');
setTimeout(runDemo, 1000);
</script>
</body>
</html>
