<!-- concept-D09-L1 | direction: Conversation-as-Vertical-Timeline | look: Soft Aurora Glass | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D09 · Conversation-as-Vertical-Timeline · Soft Aurora Glass</title>
<style>
:root {
  --bg:#EAF0FB;
  --bg-aurora:radial-gradient(120% 90% at 18% 12%,#F3E9FB 0%,transparent 55%),radial-gradient(120% 90% at 82% 88%,#E6F7F4 0%,transparent 55%),linear-gradient(160deg,#EAF0FB,#EFEAFB);
  --surface:rgba(255,255,255,0.55);
  --surface-2:rgba(255,255,255,0.72);
  --border:rgba(255,255,255,0.65);
  --text:#1B2233;
  --text-muted:#5A6582;
  --accent:#6E8BFF;
  --accent-2:#9C6CF0;
  --accent-3:#5FE3C0;
  --danger:#FF6B8B;
  --radius:22px;
  --radius-sm:14px;
  --font:"SF Pro Display","Segoe UI Variable","Helvetica Neue",system-ui,sans-serif;
  --shadow:0 12px 40px rgba(80,90,160,0.18);
  --shadow-sm:0 4px 16px rgba(80,90,160,0.12);
  --blur:saturate(1.4) blur(24px);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);overflow:hidden}

body {
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg-aurora);
  animation:aurora-drift 30s ease-in-out infinite alternate;
}

@keyframes aurora-drift {
  0%{background-position:0% 0%,100% 100%,0 0}
  50%{background-position:20% 10%,80% 90%,0 0}
  100%{background-position:5% 20%,95% 80%,0 0}
}

.app-window {
  width:420px;
  height:760px;
  display:flex;
  flex-direction:column;
  background:rgba(234,240,251,0.7);
  backdrop-filter:var(--blur);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.8);
  overflow:hidden;
  position:relative;
}

/* Header */
.header {
  padding:16px 20px 12px;
  background:var(--surface);
  backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
  position:relative;
  z-index:10;
}

.header-orb-wrap {
  position:relative;
  width:40px;
  height:40px;
  flex-shrink:0;
}

.orb {
  width:40px;
  height:40px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #a8b8ff 0%, #6E8BFF 35%, #9C6CF0 65%, #5FE3C0 100%);
  box-shadow:0 0 20px rgba(110,139,255,0.4), 0 0 40px rgba(156,108,240,0.2);
  position:relative;
  transition:all 0.4s var(--ease);
  animation:orb-idle 3.5s ease-in-out infinite;
}
.orb::before {
  content:'';
  position:absolute;
  top:5px;left:6px;
  width:12px;height:8px;
  background:rgba(255,255,255,0.7);
  border-radius:50%;
  filter:blur(3px);
}
.orb::after {
  content:'';
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:1.5px solid rgba(110,139,255,0.2);
  animation:orb-halo 3.5s ease-in-out infinite;
}

@keyframes orb-idle {
  0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(110,139,255,0.4),0 0 40px rgba(156,108,240,0.2)}
  50%{transform:scale(1.04);box-shadow:0 0 28px rgba(110,139,255,0.5),0 0 55px rgba(156,108,240,0.25)}
}
@keyframes orb-halo {
  0%,100%{opacity:0.4;transform:scale(1)}
  50%{opacity:0.8;transform:scale(1.08)}
}
@keyframes orb-listening {
  0%,100%{transform:scale(1)}
  25%{transform:scale(1.08)}
  75%{transform:scale(0.97)}
}
@keyframes orb-thinking {
  0%{filter:hue-rotate(0deg) brightness(1)}
  100%{filter:hue-rotate(360deg) brightness(1.1)}
}
@keyframes orb-speaking {
  0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(110,139,255,0.4)}
  20%{transform:scale(1.06);box-shadow:0 0 35px rgba(95,227,192,0.6)}
  60%{transform:scale(1.02);box-shadow:0 0 25px rgba(156,108,240,0.5)}
}

.orb.listening {animation:orb-listening 0.4s ease-in-out infinite;background:radial-gradient(circle at 35% 35%,#c0ffee 0%,#5FE3C0 35%,#6E8BFF 100%)}
.orb.thinking {animation:orb-thinking 2s linear infinite}
.orb.speaking {animation:orb-speaking 0.6s ease-in-out infinite}

.header-info {flex:1}
.header-title {font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.header-sub {font-size:12px;color:var(--text-muted);margin-top:1px}

.header-actions {display:flex;gap:8px}
.icon-btn {
  width:32px;height:32px;
  border-radius:50%;
  border:none;
  background:var(--surface-2);
  backdrop-filter:var(--blur);
  color:var(--text-muted);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  transition:all 0.25s var(--ease);
  border:1px solid var(--border);
}
.icon-btn:hover{background:rgba(110,139,255,0.12);color:var(--accent)}

/* Timeline area */
.timeline-area {
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  display:flex;
  position:relative;
  padding:16px 0;
}
.timeline-area::-webkit-scrollbar{width:3px}
.timeline-area::-webkit-scrollbar-track{background:transparent}
.timeline-area::-webkit-scrollbar-thumb{background:rgba(110,139,255,0.3);border-radius:99px}

/* Time rail */
.time-rail {
  width:56px;
  flex-shrink:0;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:4px;
}
.rail-line {
  position:absolute;
  top:0;bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  background:linear-gradient(to bottom, transparent, rgba(110,139,255,0.3) 5%, rgba(110,139,255,0.3) 95%, transparent);
}
.rail-time {
  font-size:9px;
  color:var(--text-muted);
  letter-spacing:0.04em;
  text-transform:uppercase;
  writing-mode:horizontal-tb;
  position:absolute;
  left:4px;
  background:transparent;
  z-index:2;
}

/* Events */
.events-col {
  flex:1;
  padding-right:16px;
  display:flex;
  flex-direction:column;
  gap:0;
}

.event-row {
  display:flex;
  align-items:flex-start;
  position:relative;
  margin-bottom:4px;
}

.event-node {
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--accent);
  border:2px solid rgba(255,255,255,0.8);
  flex-shrink:0;
  margin-top:10px;
  margin-left:-5px;
  margin-right:10px;
  box-shadow:0 0 8px rgba(110,139,255,0.4);
  position:relative;
  z-index:2;
}
.event-node.user-node{background:var(--accent-2);box-shadow:0 0 8px rgba(156,108,240,0.4)}
.event-node.voice-node{background:var(--accent-3);box-shadow:0 0 8px rgba(95,227,192,0.4)}

.event-bubble {
  flex:1;
  background:var(--surface-2);
  backdrop-filter:saturate(1.2) blur(16px);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  box-shadow:var(--shadow-sm);
  position:relative;
  margin-bottom:8px;
}
.event-bubble.user-bubble {
  background:rgba(110,139,255,0.12);
  border-color:rgba(110,139,255,0.25);
}
.event-bubble.partial {
  opacity:0.55;
}

.bubble-header {
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:5px;
}
.modality-glyph {
  font-size:10px;
  opacity:0.7;
  display:inline-flex;
  align-items:center;
  gap:3px;
  color:var(--text-muted);
}
.bubble-ts {
  font-size:9px;
  color:var(--text-muted);
  letter-spacing:0.04em;
  margin-left:auto;
}
.bubble-role {
  font-size:10px;
  font-weight:600;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:0.06em;
}
.bubble-text {
  font-size:13.5px;
  line-height:1.5;
  color:var(--text);
}
.interrupted-badge {
  display:inline-block;
  font-size:9px;
  color:var(--danger);
  border:1px solid rgba(255,107,139,0.3);
  border-radius:6px;
  padding:1px 5px;
  margin-left:6px;
  letter-spacing:0.04em;
}

/* App card */
.app-card {
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
  margin-top:8px;
}
.app-card-header {
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.4);
}
.app-icon {
  width:20px;height:20px;
  border-radius:6px;
  background:linear-gradient(135deg,#6E8BFF,#9C6CF0);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;
}
.app-name {font-size:11px;font-weight:600;color:var(--text);letter-spacing:0.02em}
.app-expand-btn {
  margin-left:auto;
  font-size:10px;
  color:var(--accent);
  cursor:pointer;
  background:none;border:none;font-family:var(--font);
}
.app-card-body {padding:12px}
.weather-display {
  display:flex;align-items:center;gap:12px;
  margin-bottom:8px;
}
.weather-temp {font-size:28px;font-weight:300;color:var(--text);letter-spacing:-0.02em}
.weather-icon {font-size:24px}
.weather-desc {font-size:12px;color:var(--text-muted)}
.weather-detail {font-size:11px;color:var(--text-muted);margin-top:2px}
.card-actions {display:flex;gap:8px;margin-top:10px}
.card-btn {
  flex:1;
  padding:7px 12px;
  border-radius:var(--radius-sm);
  border:1px solid var(--accent);
  background:rgba(110,139,255,0.1);
  color:var(--accent);
  font-size:12px;font-weight:500;
  cursor:pointer;
  font-family:var(--font);
  transition:all 0.2s var(--ease);
}
.card-btn:hover{background:rgba(110,139,255,0.2)}
.card-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.card-btn.primary:hover{background:#5a7bee}

/* Attachment sub-node */
.attach-sub {
  display:flex;align-items:center;gap:6px;
  margin-top:6px;
  padding:5px 8px;
  background:rgba(110,139,255,0.06);
  border:1px solid rgba(110,139,255,0.15);
  border-radius:10px;
  font-size:11px;color:var(--text-muted);
  width:fit-content;
}

/* Ghost suggestion nodes */
.ghost-node {
  display:flex;align-items:center;gap:8px;
  padding:4px 0;
}
.ghost-chip {
  background:rgba(110,139,255,0.08);
  border:1px dashed rgba(110,139,255,0.35);
  border-radius:20px;
  padding:5px 12px;
  font-size:12px;
  color:var(--accent);
  cursor:pointer;
  transition:all 0.25s var(--ease);
}
.ghost-chip:hover{background:rgba(110,139,255,0.16)}

/* Now marker */
.now-marker {
  position:relative;
  flex-shrink:0;
  padding:0 16px 0 0;
  margin-top:4px;
}
.now-line {
  position:absolute;
  left:28px;
  top:12px;
  right:0;
  height:1px;
  background:linear-gradient(to right, rgba(110,139,255,0.6), transparent);
}
.now-label {
  position:absolute;
  left:52px;
  top:4px;
  font-size:9px;
  font-weight:600;
  color:var(--accent);
  letter-spacing:0.08em;
  text-transform:uppercase;
}

/* Listening indicator */
.listening-indicator {
  display:none;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  background:rgba(95,227,192,0.15);
  border:1px solid rgba(95,227,192,0.35);
  border-radius:20px;
  font-size:11px;
  color:var(--accent-3);
  font-weight:500;
  margin:0 16px 4px;
  width:fit-content;
}
.listening-indicator.active{display:flex}
.listening-dot {
  width:6px;height:6px;
  border-radius:50%;
  background:var(--accent-3);
  animation:blink-dot 0.8s ease-in-out infinite;
}
@keyframes blink-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}

.muted-indicator {
  display:none;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  background:rgba(255,107,139,0.1);
  border:1px solid rgba(255,107,139,0.3);
  border-radius:20px;
  font-size:11px;
  color:var(--danger);
  font-weight:500;
  margin:0 16px 4px;
  width:fit-content;
}
.muted-indicator.active{display:flex}

/* Composer */
.composer-area {
  flex-shrink:0;
  padding:8px 16px 16px;
  background:var(--surface);
  backdrop-filter:var(--blur);
  border-top:1px solid var(--border);
}

.suggestions-row {
  display:flex;
  gap:6px;
  margin-bottom:8px;
  overflow-x:auto;
  padding-bottom:2px;
}
.suggestions-row::-webkit-scrollbar{display:none}
.suggestion-chip {
  white-space:nowrap;
  padding:5px 12px;
  border-radius:20px;
  background:var(--surface-2);
  border:1px solid var(--border);
  font-size:11.5px;
  color:var(--text-muted);
  cursor:pointer;
  transition:all 0.25s var(--ease);
  flex-shrink:0;
}
.suggestion-chip:hover{background:rgba(110,139,255,0.1);color:var(--accent);border-color:rgba(110,139,255,0.3)}

.staged-attachments {
  display:none;
  gap:6px;
  margin-bottom:6px;
  flex-wrap:wrap;
}
.staged-attachments.has-items{display:flex}
.attach-chip {
  display:flex;align-items:center;gap:5px;
  background:rgba(156,108,240,0.1);
  border:1px solid rgba(156,108,240,0.25);
  border-radius:10px;
  padding:4px 8px;
  font-size:11px;
  color:var(--accent-2);
}
.attach-chip-remove {
  cursor:pointer;
  opacity:0.6;
  margin-left:2px;
  font-size:13px;
  line-height:1;
}
.attach-chip-remove:hover{opacity:1;color:var(--danger)}

.composer-row {
  display:flex;
  align-items:flex-end;
  gap:8px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:8px 8px 8px 14px;
  box-shadow:var(--shadow-sm);
}

.composer-input {
  flex:1;
  border:none;
  background:transparent;
  font-family:var(--font);
  font-size:14px;
  color:var(--text);
  outline:none;
  resize:none;
  max-height:96px;
  line-height:1.45;
  min-height:24px;
}
.composer-input::placeholder{color:var(--text-muted)}

.attach-btn {
  width:32px;height:32px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
  transition:all 0.2s var(--ease);
  flex-shrink:0;
}
.attach-btn:hover{color:var(--accent);border-color:rgba(110,139,255,0.4);background:rgba(110,139,255,0.08)}

.morph-btn {
  width:38px;height:38px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  transition:all 0.3s var(--ease);
  flex-shrink:0;
  box-shadow:0 4px 14px rgba(110,139,255,0.4);
  position:relative;
  overflow:hidden;
}
.morph-btn:hover{transform:scale(1.06);box-shadow:0 6px 20px rgba(110,139,255,0.5)}
.morph-btn.send-mode{background:var(--accent)}
.morph-btn.stop-mode{background:var(--danger)}
.morph-btn.mute-mode{background:rgba(255,107,139,0.2);border:1.5px solid var(--danger);color:var(--danger)}
.morph-btn svg{position:absolute;transition:all 0.3s var(--ease)}
.morph-btn .icon-mic{opacity:1;transform:scale(1)}
.morph-btn .icon-send{opacity:0;transform:scale(0.4) rotate(20deg)}
.morph-btn .icon-stop{opacity:0;transform:scale(0.4)}
.morph-btn.send-mode .icon-mic{opacity:0;transform:scale(0.4) rotate(-20deg)}
.morph-btn.send-mode .icon-send{opacity:1;transform:scale(1) rotate(0)}
.morph-btn.stop-mode .icon-mic{opacity:0;transform:scale(0.4)}
.morph-btn.stop-mode .icon-send{opacity:0;transform:scale(0.4)}
.morph-btn.stop-mode .icon-stop{opacity:1;transform:scale(1)}

/* Mute btn */
.mute-btn {
  width:28px;height:28px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
  transition:all 0.2s var(--ease);
  flex-shrink:0;
}
.mute-btn.muted{color:var(--danger);border-color:rgba(255,107,139,0.4);background:rgba(255,107,139,0.1)}

/* Demo button */
.demo-btn {
  position:absolute;
  top:12px;right:12px;
  padding:5px 12px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--accent);
  font-size:11px;font-weight:600;
  cursor:pointer;
  font-family:var(--font);
  z-index:20;
  box-shadow:var(--shadow-sm);
  transition:all 0.2s var(--ease);
  letter-spacing:0.02em;
}
.demo-btn:hover{background:rgba(110,139,255,0.1)}

/* Partial text */
.partial-cursor {
  display:inline-block;
  width:2px;height:13px;
  background:var(--accent);
  border-radius:1px;
  margin-left:2px;
  vertical-align:middle;
  animation:blink-dot 0.7s ease-in-out infinite;
}

/* Scrub overlay hint */
.scrub-hint {
  position:absolute;
  left:0;right:0;top:50%;
  transform:translateY(-50%);
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:5;
}
.scrub-pill {
  background:rgba(110,139,255,0.9);
  color:#fff;
  font-size:11px;font-weight:500;
  padding:6px 14px;
  border-radius:20px;
  letter-spacing:0.02em;
  box-shadow:0 4px 16px rgba(110,139,255,0.3);
}

@media (min-width: 700px) {
  body{background:linear-gradient(160deg,#dbe4f8,#f0e8fb,#ddf4ef)}
  .app-window{
    width:440px;height:720px;
    box-shadow:0 32px 80px rgba(80,90,160,0.22),0 0 0 1px rgba(255,255,255,0.5);
  }
}
</style>
</head>
<body>

<div class="app-window" id="appWindow">
  <!-- Demo button (floating on header) -->
  <button class="demo-btn" id="demoBtn" onclick="runDemo()">▶ Play demo</button>

  <!-- Header -->
  <div class="header">
    <div class="header-orb-wrap">
      <div class="orb" id="orb"></div>
    </div>
    <div class="header-info">
      <div class="header-title">Eliza</div>
      <div class="header-sub" id="statusLabel">Ready · today</div>
    </div>
    <div class="header-actions">
      <button class="mute-btn" id="muteBtn" title="Mute" onclick="toggleMute()">🎤</button>
      <button class="icon-btn" title="Settings">⚙</button>
    </div>
  </div>

  <!-- Listening / muted indicator -->
  <div class="listening-indicator" id="listeningIndicator">
    <div class="listening-dot"></div>
    <span>Listening…</span>
  </div>
  <div class="muted-indicator" id="mutedIndicator">
    🚫 Muted
  </div>

  <!-- Timeline -->
  <div class="timeline-area" id="timelineArea">
    <div class="time-rail" id="timeRail">
      <div class="rail-line"></div>
    </div>
    <div class="events-col" id="eventsCol">
      <!-- Events injected by JS -->
    </div>
  </div>

  <!-- Composer -->
  <div class="composer-area">
    <div class="suggestions-row" id="suggestionsRow"></div>
    <div class="staged-attachments" id="stagedAttachments"></div>
    <div class="composer-row">
      <button class="attach-btn" title="Attach" onclick="stageAttachment()">📎</button>
      <textarea class="composer-input" id="composerInput" placeholder="Message Eliza…" rows="1"></textarea>
      <button class="morph-btn" id="morphBtn" onclick="handleMorph()">
        <svg class="icon-mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
        <svg class="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let appState = 'idle'; // idle | listening | thinking | speaking
let isMuted = false;
let hasText = false;
let demoTimer = null;
let animFrame = null;
let synthAmplitude = 0;
let ampTarget = 0;
let ampPhase = 0;

// ── Initial conversation data ──────────────────────────────────────────────
const initialEvents = [
  {
    id:'e1',type:'assistant',time:'2:14 PM',text:'Good afternoon! What would you like to explore today?',
    partial:false
  },
  {
    id:'e2',type:'user',time:'2:15 PM',text:'Can you check the weather for the weekend?',
    modality:'typed',partial:false
  },
  {
    id:'e3',type:'assistant',time:'2:15 PM',text:"Here's the forecast for this weekend:",
    partial:false,card:{
      icon:'🌤',name:'Weather',
      temp:'72°F',desc:'Partly Cloudy',detail:'Sat: 72° / Sun: 68° · 20% rain chance',
      actions:['5-day forecast','Hourly detail']
    }
  },
  {
    id:'e4',type:'user',time:'2:17 PM',text:'Perfect! Can we plan a hike? I was thinking—',
    modality:'voice',partial:false,interrupted:true
  },
  {
    id:'e5',type:'assistant',time:'2:17 PM',text:'Happy to help plan a hike! Which trails are you interested in — something local or willing to drive up to two hours?',
    partial:false
  },
  {
    id:'e6',type:'user',time:'2:18 PM',text:"Within an hour's drive would be ideal, preferably with good views.",
    modality:'typed',partial:false,
    attachment:{name:'trail-photo.jpg',emoji:'🖼'}
  },
  {
    id:'e7',type:'assistant',time:'2:19 PM',text:'Great criteria. I know a few excellent options — let me pull those up for you…',
    partial:true
  }
];

// ── DOM helpers ────────────────────────────────────────────────────────────
const orb = document.getElementById('orb');
const statusLabel = document.getElementById('statusLabel');
const morphBtn = document.getElementById('morphBtn');
const muteBtn = document.getElementById('muteBtn');
const listeningIndicator = document.getElementById('listeningIndicator');
const mutedIndicator = document.getElementById('mutedIndicator');
const eventsCol = document.getElementById('eventsCol');
const timeRail = document.getElementById('timeRail');
const composerInput = document.getElementById('composerInput');
const suggestionsRow = document.getElementById('suggestionsRow');
const stagedAttachments = document.getElementById('stagedAttachments');

// ── Render initial events ──────────────────────────────────────────────────
function renderEvent(ev) {
  const row = document.createElement('div');
  row.className = 'event-row';
  row.id = 'row-' + ev.id;

  const nodeClass = ev.type === 'user'
    ? (ev.modality === 'voice' ? 'event-node voice-node' : 'event-node user-node')
    : 'event-node';

  let modalityGlyph = '';
  if (ev.modality === 'voice') modalityGlyph = '<span class="modality-glyph">🎙 Voice</span>';
  else if (ev.modality === 'typed') modalityGlyph = '<span class="modality-glyph">⌨ Typed</span>';

  let cardHtml = '';
  if (ev.card) {
    cardHtml = `<div class="app-card">
      <div class="app-card-header">
        <div class="app-icon">${ev.card.icon}</div>
        <span class="app-name">${ev.card.name}</span>
        <button class="app-expand-btn" onclick="expandCard(this)">⤢ Expand</button>
      </div>
      <div class="app-card-body">
        <div class="weather-display">
          <span class="weather-icon">🌤</span>
          <span class="weather-temp">${ev.card.temp}</span>
          <div><div class="weather-desc">${ev.card.desc}</div></div>
        </div>
        <div class="weather-detail">${ev.card.detail}</div>
        <div class="card-actions">
          <button class="card-btn" onclick="cardAction(this)">${ev.card.actions[0]}</button>
          <button class="card-btn primary" onclick="cardAction(this)">${ev.card.actions[1]}</button>
        </div>
      </div>
    </div>`;
  }

  let interruptedBadge = ev.interrupted ? '<span class="interrupted-badge">interrupted</span>' : '';

  let attachHtml = '';
  if (ev.attachment) {
    attachHtml = `<div class="attach-sub">${ev.attachment.emoji} ${ev.attachment.name}</div>`;
  }

  let partialCursor = ev.partial ? '<span class="partial-cursor"></span>' : '';

  row.innerHTML = `
    <div class="${nodeClass}" style="margin-top:14px;"></div>
    <div class="event-bubble ${ev.type === 'user' ? 'user-bubble' : ''} ${ev.partial ? 'partial' : ''}">
      <div class="bubble-header">
        ${modalityGlyph}
        <span class="bubble-role">${ev.type === 'user' ? 'You' : 'Eliza'}</span>
        ${interruptedBadge}
        <span class="bubble-ts">${ev.time}</span>
      </div>
      <div class="bubble-text">${ev.text}${partialCursor}</div>
      ${cardHtml}
      ${attachHtml}
    </div>`;

  eventsCol.appendChild(row);
}

function renderTimeLabel(time, topPct) {
  const label = document.createElement('div');
  label.className = 'rail-time';
  label.style.top = topPct;
  label.textContent = time;
  timeRail.appendChild(label);
}

function initTimeline() {
  initialEvents.forEach(renderEvent);
  renderTimeLabel('2:14', '10%');
  renderTimeLabel('2:17', '42%');
  renderTimeLabel('2:19', '75%');
  renderSuggestions();
  scrollToBottom();
}

// ── Suggestions ────────────────────────────────────────────────────────────
const idleSuggestions = [
  'What can you do?', 'Set a reminder', 'Play some music', 'Check my calendar'
];
const followUpSuggestions = [
  'Book the trail', 'Show me photos', 'Add to my calendar'
];

function renderSuggestions(chips) {
  suggestionsRow.innerHTML = '';
  (chips || followUpSuggestions).forEach(s => {
    const ch = document.createElement('button');
    ch.className = 'suggestion-chip';
    ch.textContent = s;
    ch.onclick = () => { composerInput.value = s; updateMorphBtn(); suggestionsRow.style.opacity='0'; };
    suggestionsRow.appendChild(ch);
  });
  suggestionsRow.style.opacity = '1';
}

// ── Attachment ─────────────────────────────────────────────────────────────
let pendingAttachment = null;
function stageAttachment() {
  pendingAttachment = {name:'photo.jpg', emoji:'🖼'};
  stagedAttachments.innerHTML = `
    <div class="attach-chip">
      🖼 photo.jpg
      <span class="attach-chip-remove" onclick="removeAttachment()">×</span>
    </div>`;
  stagedAttachments.classList.add('has-items');
}
function removeAttachment() {
  pendingAttachment = null;
  stagedAttachments.innerHTML = '';
  stagedAttachments.classList.remove('has-items');
}

// ── Orb state ──────────────────────────────────────────────────────────────
function setOrbState(state) {
  orb.className = 'orb' + (state !== 'idle' ? ' ' + state : '');
  if (state === 'listening') orb.style.animationDuration = '0.5s';
  else orb.style.animationDuration = '';
}

// ── App state transitions ──────────────────────────────────────────────────
function setState(newState) {
  appState = newState;
  setOrbState(newState);

  listeningIndicator.classList.toggle('active', newState === 'listening' && !isMuted);

  const labels = {idle:'Ready · today', listening:'Listening…', thinking:'Thinking…', speaking:'Speaking…'};
  statusLabel.textContent = isMuted ? 'Muted' : (labels[newState] || 'Ready');
}

// ── Amplitude simulation ───────────────────────────────────────────────────
function tickAmplitude() {
  ampPhase += 0.09;
  if (appState === 'listening' && !isMuted) {
    ampTarget = 0.4 + 0.55 * Math.abs(Math.sin(ampPhase * 1.7)) * Math.random();
  } else if (appState === 'speaking') {
    ampTarget = 0.3 + 0.45 * Math.abs(Math.sin(ampPhase));
  } else {
    ampTarget = 0;
  }
  synthAmplitude += (ampTarget - synthAmplitude) * 0.18;

  if ((appState === 'listening' || appState === 'speaking') && !isMuted) {
    const s = 1 + synthAmplitude * 0.3;
    orb.style.transform = `scale(${s})`;
  } else {
    orb.style.transform = '';
  }
  animFrame = requestAnimationFrame(tickAmplitude);
}
tickAmplitude();

// ── Morph button ───────────────────────────────────────────────────────────
function updateMorphBtn() {
  hasText = composerInput.value.trim().length > 0;
  if (appState === 'thinking' || appState === 'speaking') {
    morphBtn.className = 'morph-btn stop-mode';
    morphBtn.title = 'Stop';
  } else if (hasText) {
    morphBtn.className = 'morph-btn send-mode';
    morphBtn.title = 'Send';
  } else {
    morphBtn.className = 'morph-btn';
    morphBtn.title = 'Voice';
  }

  // Fade suggestions when typing
  if (hasText) {
    suggestionsRow.style.opacity = '0';
    suggestionsRow.style.pointerEvents = 'none';
  } else {
    suggestionsRow.style.opacity = '1';
    suggestionsRow.style.pointerEvents = '';
  }
}

composerInput.addEventListener('input', () => {
  updateMorphBtn();
  composerInput.style.height = 'auto';
  composerInput.style.height = Math.min(composerInput.scrollHeight, 96) + 'px';
});

composerInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTypedMessage(); }
});

function handleMorph() {
  if (appState === 'thinking' || appState === 'speaking') {
    stopGeneration();
  } else if (hasText) {
    sendTypedMessage();
  } else {
    startVoiceDemo();
  }
}

// ── Send typed message ─────────────────────────────────────────────────────
let msgCounter = 100;
function sendTypedMessage() {
  const text = composerInput.value.trim();
  if (!text) return;

  const ev = {
    id: 'u' + (++msgCounter),
    type: 'user',
    time: nowTime(),
    text,
    modality: 'typed',
    partial: false
  };
  if (pendingAttachment) {
    ev.attachment = pendingAttachment;
    removeAttachment();
  }
  renderEvent(ev);
  composerInput.value = '';
  composerInput.style.height = '';
  updateMorphBtn();
  scrollToBottom();

  // Trigger assistant response
  setTimeout(() => triggerAssistantReply('typed'), 800);
}

function triggerAssistantReply(modality) {
  setState('thinking');
  updateMorphBtn();

  const replies = [
    "I'd recommend Mount Tamalpais — stunning bay views, roughly 45 min from the city. The Steep Ravine trail is a local favourite.",
    "Sure! I can add that to your calendar. Which day works best for the hike?",
    "Got it. Trail conditions look good for the weekend — pack layers, it gets breezy at the summit."
  ];

  setTimeout(() => {
    setState('speaking');
    updateMorphBtn();
    const text = replies[Math.floor(Math.random() * replies.length)];
    addPartialAssistantTurn(text, modality);
  }, 1100);
}

function addPartialAssistantTurn(text, modality) {
  const id = 'a' + (++msgCounter);
  const ev = {id, type:'assistant', time:nowTime(), text:'', partial:true};
  renderEvent(ev);
  scrollToBottom();

  const bubble = document.querySelector('#row-' + id + ' .bubble-text');
  let i = 0;
  const step = () => {
    if (i <= text.length) {
      bubble.innerHTML = text.slice(0, i) + (i < text.length ? '<span class="partial-cursor"></span>' : '');
      i += 2;
      scrollToBottom();
      setTimeout(step, 28);
    } else {
      // Finalize
      document.querySelector('#row-' + id + ' .event-bubble').classList.remove('partial');
      bubble.innerHTML = text;
      setState('idle');
      updateMorphBtn();
      renderSuggestions();
      scrollToBottom();
    }
  };
  step();
}

function stopGeneration() {
  setState('idle');
  updateMorphBtn();
}

// ── Mute ──────────────────────────────────────────────────────────────────
function toggleMute() {
  isMuted = !isMuted;
  muteBtn.className = 'mute-btn' + (isMuted ? ' muted' : '');
  muteBtn.textContent = isMuted ? '🔇' : '🎤';
  mutedIndicator.classList.toggle('active', isMuted);
  listeningIndicator.classList.toggle('active', !isMuted && appState === 'listening');
  statusLabel.textContent = isMuted ? 'Muted' : 'Ready · today';
  if (isMuted && appState !== 'idle') {
    setState('idle');
    updateMorphBtn();
  }
}

// ── Demo cycle ─────────────────────────────────────────────────────────────
function startVoiceDemo() {
  runDemo();
}

function runDemo() {
  clearTimers();
  setState('idle');
  updateMorphBtn();

  // Add "now" voice event (partial)
  const id = 'demo' + Date.now();
  const partialEv = {id, type:'user', time:nowTime(), text:'What are some good Italian restaurants nearby?', modality:'voice', partial:true};
  renderEvent(partialEv);
  scrollToBottom();

  const partialBubble = document.querySelector('#row-' + id + ' .bubble-text');
  const partialBubbleEl = document.querySelector('#row-' + id + ' .event-bubble');

  // Listening phase
  setState('listening');
  updateMorphBtn();

  let t1 = setTimeout(() => {
    // Finalize user voice turn
    partialBubbleEl.classList.remove('partial');
    partialBubble.innerHTML = 'What are some good Italian restaurants nearby?';

    // Thinking
    setState('thinking');
    updateMorphBtn();

    let t2 = setTimeout(() => {
      setState('speaking');
      updateMorphBtn();

      const replyText = "There are several great options within a mile. Osteria Morini has excellent handmade pasta, and Trattoria Roma is known for their wood-fired pizza. Both have strong reviews and take reservations.";
      addPartialAssistantTurn(replyText, 'voice');
    }, 1200);
    demoTimer = t2;
  }, 2200);
  demoTimer = t1;
}

function clearTimers() {
  if (demoTimer) clearTimeout(demoTimer);
}

// ── Expand card ────────────────────────────────────────────────────────────
function expandCard(btn) {
  btn.textContent = btn.textContent === '⤢ Expand' ? '⤡ Collapse' : '⤢ Expand';
}

function cardAction(btn) {
  btn.animate(
    [{transform:'scale(1)'},{transform:'scale(0.94)'},{transform:'scale(1)'}],
    {duration:220, easing:'ease-out'}
  );
}

// ── Scroll & time ─────────────────────────────────────────────────────────
function scrollToBottom() {
  const area = document.getElementById('timelineArea');
  requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
}

function nowTime() {
  const d = new Date();
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0') + (d.getHours() >= 12 ? ' PM' : ' AM');
}

// ── Init ──────────────────────────────────────────────────────────────────
initTimeline();
updateMorphBtn();

// Autostart demo after 1.5s
setTimeout(runDemo, 1500);
</script>
</body>
</html>
