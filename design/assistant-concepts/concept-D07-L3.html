<!-- concept-D07-L3 | direction: Spatial 3D Depth | look: Warm Editorial Paper | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D07 · Spatial 3D Depth · Warm Editorial Paper</title>
<style>
:root {
  --bg:#F6F1E7;
  --surface:#FFFDF8;
  --surface-2:#F0E8D9;
  --border:#E2D8C6;
  --text:#23201A;
  --text-muted:#7A7163;
  --accent:#C8643C;
  --accent-2:#4F6B57;
  --danger:#B23A48;
  --radius:14px;
  --radius-sm:10px;
  --font:"Iowan Old Style","Palatino Linotype","Georgia","Times New Roman",serif;
  --font-ui:"Avenir Next","Segoe UI",system-ui,sans-serif;
  --shadow:0 6px 24px rgba(60,45,25,0.10);
  --shadow-sm:0 2px 8px rgba(60,45,25,0.07);
  --ease:cubic-bezier(.4,.0,.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body {
  font-family: var(--font);
  background: #DDD5C4;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

.outer { position: relative; display: flex; flex-direction: column; align-items: center; }

.app-window {
  width: 420px;
  height: 760px;
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  background: var(--bg);
  box-shadow: 0 24px 64px rgba(60,45,25,0.22), 0 0 0 1px rgba(226,216,198,0.8);
}

/* Subtle paper texture */
.app-window::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.03;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(100,80,50,0.5) 3px, rgba(100,80,50,0.5) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 8px, rgba(100,80,50,0.2) 8px, rgba(100,80,50,0.2) 9px);
  pointer-events: none;
  z-index: 100;
}

/* Header */
.header {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.header-brand {
  display: flex;
  flex-direction: column;
}

.header-title {
  font-family: var(--font);
  font-size: 20px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1;
}

.header-subtitle {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 3px;
}

.header-right { display: flex; gap: 12px; align-items: center; }

.icon-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 14px;
  transition: all 0.4s var(--ease);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { display: block; }
.mute-glyph { display: flex; align-items: center; justify-content: center; }

.mute-btn.muted {
  background: rgba(178,58,72,0.08);
  border-color: rgba(178,58,72,0.3);
  color: var(--danger);
}
.muted-label {
  position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-ui);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--danger);
  color: white;
  padding: 2px 6px;
  border-radius: 4px;
  opacity: 0;
  transition: opacity 0.4s;
  white-space: nowrap;
}
.mute-btn { position: relative; }
.mute-btn.muted .muted-label { opacity: 1; }

/* Chat area */
.chat-area {
  position: absolute;
  top: 64px; left: 0; right: 0; bottom: 120px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 24px 60px;
  scroll-behavior: smooth;
}
.chat-area::-webkit-scrollbar { width: 3px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Orb space */
.orb-space {
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Avatar — editorial ink mark / organic blob */
.orb-wrap {
  position: relative;
  width: 100px;
  height: 100px;
  transition: transform 0.6s var(--ease);
}

.orb-mark {
  width: 100%;
  height: 100%;
  position: relative;
  transition: transform 0.5s var(--ease), filter 0.5s var(--ease);
}

/* SVG ink blob */
.orb-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Clay blob path — animated morphing */
.blob-path {
  fill: var(--accent);
  transition: fill 0.6s var(--ease), opacity 0.6s var(--ease);
  transform-origin: center;
}

.blob-path.thinking { fill: var(--accent-2); }
.blob-path.muted { fill: var(--text-muted); opacity: 0.4; }

/* Listening indicator */
.listening-indicator {
  position: absolute;
  top: calc(100% + 16px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  transition: opacity 0.4s var(--ease);
  white-space: nowrap;
}
.listening-indicator.visible { opacity: 1; }
.listening-indicator .mic-icon {
  font-size: 13px;
  color: var(--accent);
}
.listening-indicator .listen-text {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}

/* Ink strokes / waveform */
.waveform {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 16px;
}
.wave-bar {
  width: 2px;
  background: var(--accent);
  border-radius: 1px;
  height: 3px;
  transition: height 0.12s var(--ease);
  opacity: 0.7;
}

/* State label under orb */
.state-label {
  position: absolute;
  bottom: 8px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-ui);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.4s;
}

/* Turn cards */
.turn { margin-bottom: 20px; animation: paperRise 0.5s var(--ease) both; opacity: 0; }
@keyframes paperRise {
  0% { opacity:0; transform:translateY(16px); filter:blur(2px); }
  100% { opacity:1; transform:none; filter:none; }
}

.turn.user { display:flex; flex-direction:column; align-items:flex-end; }
.turn.assistant { display:flex; flex-direction:column; align-items:flex-start; }

.turn-meta {
  display: flex; align-items: center; gap: 5px;
  margin-bottom: 6px;
  font-family: var(--font-ui);
  font-size: 10px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.modality-glyph { font-size: 10px; }

.interrupted-badge {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 9px;
  letter-spacing: 0.05em;
  color: var(--danger);
  border-bottom: 1px solid var(--danger);
  margin-left: 6px;
  opacity: 0.8;
}

.turn-bubble {
  max-width: 88%;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.65;
  font-family: var(--font);
  position: relative;
}

.turn.user .turn-bubble {
  background: var(--surface-2);
  border-top: 2px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) var(--radius);
  color: var(--text);
}

.turn.assistant .turn-bubble {
  background: var(--surface);
  border-top: 2px solid var(--border);
  border-radius: var(--radius) 0 var(--radius) var(--radius);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.turn-bubble.partial { color: var(--text-muted); }

.attach-chip-turn {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 9px;
  font-family: var(--font-ui); font-size: 11px; color: var(--text-muted);
  margin-top: 6px;
}

/* App card */
.app-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 2px solid var(--accent);
  border-radius: var(--radius);
  overflow: hidden;
  margin-top: 10px;
  box-shadow: var(--shadow);
  animation: paperRise 0.5s 0.1s var(--ease) both;
}
.app-card-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.app-icon { font-size: 14px; }
.app-card-title {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
  flex: 1;
}
.expand-btn {
  font-family: var(--font-ui); font-size: 11px; color: var(--accent);
  background: none; border: none; cursor: pointer; text-decoration: underline;
  text-underline-offset: 2px;
}
.expand-btn:hover { opacity: 0.7; }

.app-card-body { padding: 14px; }
.weather-row { display:flex; align-items:center; justify-content:space-between; }
.weather-temp {
  font-family: var(--font);
  font-size: 44px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: -2px;
}
.weather-icon-big { font-size: 36px; }
.weather-desc { font-family: var(--font-ui); font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.weather-details { display:flex; gap:12px; margin-top:10px; font-family:var(--font-ui); font-size:11px; color:var(--text-muted); }
.app-card-actions {
  display: flex; gap: 8px; padding: 10px 14px;
  border-top: 1px solid var(--border);
}
.card-btn {
  flex:1; padding:8px;
  font-family:var(--font-ui); font-size:12px; letter-spacing:0.04em;
  cursor:pointer; transition:all 0.35s var(--ease);
  border-radius:var(--radius-sm);
}
.card-btn-primary { background:var(--accent); color:white; border:none; }
.card-btn-primary:hover { filter:brightness(1.1); }
.card-btn-ghost { background:transparent; color:var(--accent); border:1px solid var(--border); }
.card-btn-ghost:hover { background:var(--surface-2); }

/* Suggestions */
.suggestions {
  display:flex; flex-wrap:wrap; gap:8px;
  padding:14px 24px 12px;
  position:absolute; bottom:120px; left:0; right:0;
  z-index:5;
  background:linear-gradient(to top, var(--bg) 55%, rgba(246,241,231,0) 100%);
  transition:opacity 0.4s var(--ease), transform 0.4s var(--ease);
}
.suggestions.hidden { opacity:0; pointer-events:none; transform:translateY(4px); }

.chip {
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:6px 14px;
  font-family:var(--font-ui); font-size:12px; color:var(--text-muted);
  cursor:pointer; transition:all 0.35s var(--ease);
}
.chip:hover { background:var(--surface-2); color:var(--accent); border-color:rgba(200,100,60,0.3); }

/* Composer */
.composer {
  position:absolute; bottom:0; left:0; right:0;
  padding:10px 20px 18px;
  background:var(--surface);
  border-top:1px solid var(--border);
  z-index:10;
}
.staged-attachments { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.staged-chip {
  display:flex; align-items:center; gap:5px;
  background:rgba(200,100,60,0.08); border:1px solid rgba(200,100,60,0.2);
  border-radius:8px; padding:3px 8px;
  font-family:var(--font-ui); font-size:11px; color:var(--accent);
  animation:chipDock 0.35s var(--ease);
}
@keyframes chipDock{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.staged-chip-remove { cursor:pointer; color:var(--text-muted); font-size:14px; padding:0 2px; transition:color 0.2s; }
.staged-chip-remove:hover { color:var(--danger); }

.composer-row {
  display:flex; align-items:center; gap:8px;
  background:var(--bg); border:1px solid var(--border);
  border-radius:var(--radius); padding:8px 8px 8px 14px;
  transition:border-color 0.35s var(--ease), box-shadow 0.35s;
}
.composer-row:focus-within { border-color:rgba(200,100,60,0.4); box-shadow:0 0 0 3px rgba(200,100,60,0.08); }

.attach-btn {
  background:none; border:none; color:var(--text-muted); font-size:17px;
  cursor:pointer; padding:3px; border-radius:6px; transition:color 0.3s; flex-shrink:0;
}
.attach-btn:hover { color:var(--accent); }

.composer-input {
  flex:1; border:none; background:none; font-family:var(--font); font-size:15px;
  color:var(--text); outline:none; resize:none; line-height:1.5;
  max-height:100px; min-height:22px;
}
.composer-input::placeholder { color:var(--text-muted); font-style:italic; }

.action-btn {
  width:38px; height:38px; border-radius:50%; border:none;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; flex-shrink:0;
  transition:all 0.4s var(--ease);
}
.action-btn.mic { background:var(--accent); color:white; box-shadow:0 4px 12px rgba(200,100,60,0.3); }
.action-btn.send { background:var(--accent); color:white; animation:paperPop 0.35s var(--ease); }
.action-btn.stop { background:var(--danger); color:white; animation:paperPop 0.35s var(--ease); }
@keyframes paperPop{0%{transform:scale(0.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.action-btn:hover { transform:scale(1.06); }
.action-btn svg { display:block; }
.attach-btn svg { display:block; }
.mic-icon svg, .listening-indicator svg { display:block; }

/* Demo */
.demo-bar {
  position:absolute; bottom:-52px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:20; white-space:nowrap;
}
.demo-btn {
  background:var(--surface); border:1px solid var(--accent);
  border-radius:20px; padding:8px 18px;
  font-family:var(--font-ui); font-size:12px; font-weight:600;
  color:var(--accent); cursor:pointer;
  box-shadow:var(--shadow-sm); transition:all 0.3s var(--ease);
}
.demo-btn:hover { background:var(--surface-2); transform:translateY(-1px); }

@media(max-width:440px){ .app-window{width:100vw;height:100vh;border-radius:0;} }
</style>
</head>
<body>
<div class="outer">
<div class="app-window" id="app">

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <div class="header-title">Eliza</div>
      <div class="header-subtitle">Your assistant</div>
    </div>
    <div class="header-right">
      <button class="icon-btn mute-btn" id="muteBtn" onclick="toggleMute()" title="Mute microphone" aria-label="Mute microphone">
        <span class="mute-glyph" id="muteGlyph"></span>
        <div class="muted-label">Muted</div>
      </button>
      <button class="icon-btn" title="More" aria-label="More options">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea">

    <!-- Orb space -->
    <div class="orb-space">
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;">
        <div class="orb-wrap" id="orbWrap">
          <div class="orb-mark" id="orbMark">
            <svg class="orb-svg" id="orbSvg" viewBox="0 0 100 100">
              <defs>
                <filter id="blur-sm">
                  <feGaussianBlur stdDeviation="1.5"/>
                </filter>
              </defs>
              <!-- Shadow -->
              <ellipse cx="50" cy="88" rx="26" ry="5" fill="rgba(35,32,26,0.08)" filter="url(#blur-sm)"/>
              <!-- Main blob -->
              <path class="blob-path" id="blobPath"
                d="M50,15 C65,15 80,28 82,43 C84,58 76,72 62,78 C48,84 32,80 24,68 C16,56 20,36 32,26 C38,21 43,15 50,15 Z"/>
              <!-- Inner highlight -->
              <path d="M38,28 C44,22 56,23 60,32" stroke="rgba(255,255,255,0.45)" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <!-- Listening indicator below blob -->
        <div class="listening-indicator" id="listeningIndicator" style="position:relative;top:auto;left:auto;transform:none;margin-top:12px;">
          <span class="mic-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
          </span>
          <div class="waveform" id="waveform">
            <div class="wave-bar" id="wb1"></div>
            <div class="wave-bar" id="wb2"></div>
            <div class="wave-bar" id="wb3"></div>
            <div class="wave-bar" id="wb4"></div>
            <div class="wave-bar" id="wb5"></div>
          </div>
          <span class="listen-text">Listening…</span>
        </div>

        <div class="state-label" id="stateLabel"></div>
      </div>
    </div>

    <div id="turnList"></div>
  </div>

  <!-- Suggestions -->
  <div class="suggestions" id="suggestions">
    <div class="chip" onclick="useChip(this,'What\'s the weather today?')">☀️ Today's weather</div>
    <div class="chip" onclick="useChip(this,'Remind me at 3pm')">🔔 Set a reminder</div>
    <div class="chip" onclick="useChip(this,'Read my latest email')">✉️ Recent email</div>
    <div class="chip" onclick="useChip(this,'Play something calm')">🎶 Calm music</div>
  </div>

  <!-- Composer -->
  <div class="composer">
    <div class="staged-attachments" id="stagedAttachments"></div>
    <div class="composer-row">
      <button class="attach-btn" onclick="addAttachment()" title="Attach a file" aria-label="Attach a file">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.05 12.25 20.2a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.19 9.2a1 1 0 0 1-1.42-1.42l8.49-8.49"/></svg>
      </button>
      <textarea class="composer-input" id="composerInput"
        placeholder="Write a message…"
        rows="1" oninput="onInput(this)" onkeydown="onKeydown(event)"></textarea>
      <button class="action-btn mic" id="actionBtn" onclick="onActionBtn()" title="Speak" aria-label="Speak"></button>
    </div>
  </div>
</div>

<div class="demo-bar">
  <button class="demo-btn" onclick="runDemo()">▶ Play Demo</button>
</div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let appState = 'idle';
let isMuted = false;
let inputHasText = false;
let isGenerating = false;
let stagedFiles = [];
let demoTimer = null;
let waveAnimFrame = null;
let blobAnimFrame = null;
let blobPhase = 0;

// DOM
const orbWrap = document.getElementById('orbWrap');
const blobPath = document.getElementById('blobPath');
const listeningIndicator = document.getElementById('listeningIndicator');
const stateLabel = document.getElementById('stateLabel');
const muteBtn = document.getElementById('muteBtn');
const actionBtn = document.getElementById('actionBtn');
const composerInput = document.getElementById('composerInput');
const chatArea = document.getElementById('chatArea');
const turnList = document.getElementById('turnList');
const suggestions = document.getElementById('suggestions');
const stagedAttachments = document.getElementById('stagedAttachments');
const muteGlyph = document.getElementById('muteGlyph');
const waveBars = [1,2,3,4,5].map(i=>document.getElementById('wb'+i));

// ─── Inline icons (crisp at any size, no emoji-font dependency) ─────────────────
const ICONS = {
  mic:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21.5"/><line x1="8.5" y1="21.5" x2="15.5" y2="21.5"/></svg>',
  micMuted:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3.5" y1="3.5" x2="20.5" y2="20.5"/><path d="M15 9.3V5a3 3 0 0 0-5.66-1.4"/><path d="M9 9v2a3 3 0 0 0 4.3 2.7"/><path d="M5 11a7 7 0 0 0 10.3 6.2M19 11a7 7 0 0 1-1 3.6"/><line x1="12" y1="18" x2="12" y2="21.5"/><line x1="8.5" y1="21.5" x2="15.5" y2="21.5"/></svg>',
  send:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5.5"/><polyline points="6,11 12,5 18,11"/></svg>',
  stop:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2.2"/></svg>',
  micHeader:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21.5"/><line x1="8.5" y1="21.5" x2="15.5" y2="21.5"/></svg>',
  micHeaderMuted:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3.5" y1="3.5" x2="20.5" y2="20.5"/><path d="M15 9.3V5a3 3 0 0 0-5.66-1.4"/><path d="M9 9v2a3 3 0 0 0 4.3 2.7"/><path d="M5 11a7 7 0 0 0 10.3 6.2M19 11a7 7 0 0 1-1 3.6"/><line x1="12" y1="18" x2="12" y2="21.5"/><line x1="8.5" y1="21.5" x2="15.5" y2="21.5"/></svg>'
};
muteGlyph.innerHTML = ICONS.micHeader;

// ─── Blob morphing ────────────────────────────────────────────────────────────
function getBlobPath(t, state, amp) {
  // Organic, slowly morphing blob based on sin/cos
  const base = 50;
  const r = (angle, phase) => {
    const noise = Math.sin(angle * 3 + phase) * 6 + Math.cos(angle * 2 + phase * 0.7) * 4;
    let baseR = 34;
    if (state === 'listening') baseR = 34 + amp * 8;
    if (state === 'speaking')  baseR = 32 + Math.sin(t * 4) * 5;
    if (state === 'muted')     baseR = 26;
    return baseR + noise;
  };
  const pts = [];
  const n = 8;
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    const rad = r(angle, t);
    const x = base + Math.cos(angle) * rad;
    const y = base + Math.sin(angle) * rad;
    pts.push({x, y});
  }
  // Catmull-Rom to SVG path
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length; i++) {
    const p0 = pts[(i - 1 + n) % n];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[(i + 2) % n];
    const cp1x = p1.x + (p2.x - p0.x) / 5;
    const cp1y = p1.y + (p2.y - p0.y) / 5;
    const cp2x = p2.x - (p3.x - p1.x) / 5;
    const cp2y = p2.y - (p3.y - p1.y) / 5;
    d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  d += 'Z';
  return d;
}

let blobAmp = 0, blobTargetAmp = 0;
function blobLoop() {
  blobPhase += 0.008 * (appState === 'thinking' ? 2.5 : appState === 'speaking' ? 1.8 : 1);
  blobTargetAmp = appState === 'listening' ? 0.3 + 0.7 * Math.abs(Math.sin(Date.now() / 200)) : appState === 'speaking' ? 0.4 + 0.5 * Math.abs(Math.sin(Date.now() / 280)) : 0;
  blobAmp += (blobTargetAmp - blobAmp) * 0.08;
  blobPath.setAttribute('d', getBlobPath(blobPhase, isMuted ? 'muted' : appState, blobAmp));

  // Color
  const fillMap = { idle:'#C8643C', listening:'#C8643C', thinking:'#4F6B57', speaking:'#A05030', muted:'#999' };
  blobPath.style.fill = fillMap[isMuted ? 'muted' : appState] || '#C8643C';
  blobPath.style.opacity = isMuted ? '0.35' : '1';

  blobAnimFrame = requestAnimationFrame(blobLoop);
}

// ─── Set state ─────────────────────────────────────────────────────────────────
function setOrbState(state) {
  appState = state;
  const eff = isMuted ? 'muted' : state;

  listeningIndicator.classList.toggle('visible', state === 'listening' && !isMuted);

  const labelMap = { thinking:'Thinking…', muted:'Muted', speaking:'Speaking…' };
  stateLabel.textContent = labelMap[eff] || '';
  stateLabel.style.opacity = (eff === 'thinking' || eff === 'muted' || eff === 'speaking') ? '1' : '0';

  if (state === 'listening' && !isMuted) {
    orbWrap.style.transform = 'scale(1.08)';
    startWaveAnim();
  } else if (state === 'thinking') {
    orbWrap.style.transform = 'scale(0.97)';
    stopWaveAnim();
  } else if (state === 'speaking') {
    orbWrap.style.transform = 'scale(1.04)';
    stopWaveAnim();
  } else if (isMuted) {
    orbWrap.style.transform = 'scale(0.85) translateY(8px)';
    stopWaveAnim();
  } else {
    orbWrap.style.transform = 'scale(1)';
    stopWaveAnim();
  }
}

// ─── Waveform ─────────────────────────────────────────────────────────────────
function startWaveAnim() {
  if (waveAnimFrame) return;
  function frame() {
    waveBars.forEach((b,i)=>{
      b.style.height = (3 + Math.abs(Math.sin(Date.now()/120+i*0.9)) * 11 * (0.5+0.5*Math.random())) + 'px';
    });
    waveAnimFrame = requestAnimationFrame(frame);
  }
  waveAnimFrame = requestAnimationFrame(frame);
}
function stopWaveAnim() {
  if(waveAnimFrame){cancelAnimationFrame(waveAnimFrame);waveAnimFrame=null;}
  waveBars.forEach(b=>b.style.height='3px');
}

// ─── Mute ─────────────────────────────────────────────────────────────────────
function toggleMute() {
  isMuted = !isMuted;
  muteBtn.classList.toggle('muted', isMuted);
  muteGlyph.innerHTML = isMuted ? ICONS.micHeaderMuted : ICONS.micHeader;
  muteBtn.setAttribute('aria-label', isMuted ? 'Unmute microphone' : 'Mute microphone');
  setOrbState(isMuted ? 'muted' : 'idle');
}

// ─── Input ────────────────────────────────────────────────────────────────────
function onInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight,100)+'px';
  const has = el.value.trim().length > 0;
  if (has !== inputHasText) { inputHasText = has; updateActionBtn(); suggestions.classList.toggle('hidden', has); }
}
function onKeydown(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();onActionBtn();} }
function updateActionBtn() {
  if(isGenerating){actionBtn.className='action-btn stop';actionBtn.innerHTML=ICONS.stop;actionBtn.title='Stop';actionBtn.setAttribute('aria-label','Stop');}
  else if(inputHasText){actionBtn.className='action-btn send';actionBtn.innerHTML=ICONS.send;actionBtn.title='Send';actionBtn.setAttribute('aria-label','Send message');}
  else{actionBtn.className='action-btn mic';actionBtn.innerHTML=ICONS.mic;actionBtn.title='Speak';actionBtn.setAttribute('aria-label','Speak');}
}
function onActionBtn() {
  if(isGenerating){stopGeneration();return;}
  if(inputHasText){sendTypedMessage();return;}
  runVoiceCycle();
}

// ─── Attach ───────────────────────────────────────────────────────────────────
const mockFiles=['📷 photo.jpg','📄 notes.pdf','🎵 voice.m4a'];
let fileIdx=0;
function addAttachment(){stagedFiles.push(mockFiles[fileIdx++%mockFiles.length]);renderStagedAttachments();}
function renderStagedAttachments(){
  stagedAttachments.innerHTML='';
  stagedFiles.forEach((f,i)=>{
    const c=document.createElement('div');c.className='staged-chip';
    c.innerHTML=`<span>${f}</span><span class="staged-chip-remove" onclick="removeStaged(${i})">×</span>`;
    stagedAttachments.appendChild(c);
  });
}
function removeStaged(i){stagedFiles.splice(i,1);renderStagedAttachments();}
function useChip(el,text){composerInput.value=text;onInput(composerInput);composerInput.focus();}

// ─── Send ─────────────────────────────────────────────────────────────────────
function sendTypedMessage(){
  const text=composerInput.value.trim();if(!text)return;
  const atts=[...stagedFiles];stagedFiles=[];renderStagedAttachments();
  composerInput.value='';composerInput.style.height='auto';
  inputHasText=false;updateActionBtn();suggestions.classList.remove('hidden');
  addTurn({role:'user',text,modality:'typed',attachments:atts});
  triggerAssistantReply(text);
}

// ─── Turn ─────────────────────────────────────────────────────────────────────
function addTurn({role,text,modality='typed',attachments=[],partial=false,interrupted=false,card=null}){
  const turn=document.createElement('div');turn.className=`turn ${role}`;
  const meta=document.createElement('div');meta.className='turn-meta';
  const glyph=modality==='voice'?(role==='user'?'🎙':'🔊'):(role==='user'?'⌨':'✦');
  meta.innerHTML=`<span class="modality-glyph">${glyph}</span> ${role==='user'?'You':'Eliza'}`;
  if(interrupted)meta.innerHTML+=`<span class="interrupted-badge">interrupted</span>`;
  const bubble=document.createElement('div');bubble.className=`turn-bubble${partial?' partial':''}`;bubble.textContent=text;
  turn.appendChild(meta);turn.appendChild(bubble);
  attachments.forEach(a=>{
    const c=document.createElement('div');c.className='attach-chip-turn';c.textContent=a;turn.appendChild(c);
  });
  if(card)turn.appendChild(buildCard(card));
  turnList.appendChild(turn);scrollToBottom();
  return{turn,bubble,meta};
}

// ─── Reply ────────────────────────────────────────────────────────────────────
function triggerAssistantReply(userText,isVoice=false){
  isGenerating=true;updateActionBtn();setOrbState('thinking');
  const resp=getResponse(userText);
  setTimeout(()=>{
    setOrbState('speaking');
    const{turn,bubble}=addTurn({role:'assistant',text:'',modality:isVoice?'voice':'typed',partial:true});
    let i=0;
    function stream(){
      if(i<resp.text.length){
        bubble.textContent=resp.text.slice(0,i+1);i+=2;scrollToBottom();
        if(isGenerating)setTimeout(stream,20);
      } else {
        bubble.classList.remove('partial');bubble.textContent=resp.text;
        isGenerating=false;updateActionBtn();setOrbState('idle');
        if(resp.card){turn.appendChild(buildCard(resp.card));scrollToBottom();}
        addFollowUpChips(resp.followups);
      }
    }stream();
  },850);
}
function stopGeneration(){isGenerating=false;updateActionBtn();setOrbState('idle');}

// ─── Voice cycle ──────────────────────────────────────────────────────────────
function runVoiceCycle(){
  if(isMuted)return;
  setOrbState('listening');
  setTimeout(()=>{
    setOrbState('thinking');
    setTimeout(()=>{
      setOrbState('speaking');
      const{bubble}=addTurn({role:'user',text:"What's the weather today?",modality:'voice',partial:true});
      setTimeout(()=>{
        bubble.textContent="What's the weather today?";bubble.classList.remove('partial');
        triggerAssistantReply('weather',true);
      },600);
    },900);
  },2400);
}

// ─── Data ─────────────────────────────────────────────────────────────────────
function getResponse(text){
  const t=text.toLowerCase();
  if(t.includes('weather'))return{text:"Gentle sun today — 72° with a few afternoon clouds. A fine day to spend some time outdoors. Tomorrow brings a light shower.",card:{type:'weather'},followups:['Tomorrow','Hourly view','Pack umbrella?']};
  if(t.includes('remind'))return{text:"I've noted that. I'll remind you at 3 this afternoon.",card:null,followups:['Change time','Add note','Cancel']};
  if(t.includes('email'))return{text:"Your most recent message is from Maya: \"The draft looks wonderful — let's schedule a call?\" Would you like to reply?",card:null,followups:['Reply','Archive','Next email']};
  if(t.includes('music')||t.includes('calm'))return{text:"Playing Erik Satie's Gymnopédies. Soft, unhurried — just right for quiet work.",card:null,followups:['Next piece','Pause','Discover more']};
  return{text:"I'm here — unhurried and attentive. What's on your mind?",card:null,followups:['Tell me a story','Check my tasks']};
}

function buildCard(data){
  if(data.type==='weather'){
    const card=document.createElement('div');card.className='app-card';
    card.innerHTML=`
      <div class="app-card-header">
        <span class="app-icon">⛅</span>
        <div class="app-card-title">Weather · San Francisco</div>
        <button class="expand-btn">View full →</button>
      </div>
      <div class="app-card-body">
        <div class="weather-row">
          <div><div class="weather-temp">72°</div><div class="weather-desc">Partly cloudy · Feels like 70°</div></div>
          <div class="weather-icon-big">⛅</div>
        </div>
        <div class="weather-details">
          <span>💧 62% humidity</span><span>💨 12 mph</span><span>🌅 6:42 am</span>
        </div>
      </div>
      <div class="app-card-actions">
        <button class="card-btn card-btn-primary">7-day Forecast</button>
        <button class="card-btn card-btn-ghost">Hourly</button>
      </div>`;
    return card;
  }
  return document.createElement('div');
}

function addFollowUpChips(chips){
  if(!chips||!chips.length)return;
  suggestions.innerHTML='';
  chips.forEach(t=>{
    const c=document.createElement('div');c.className='chip';c.textContent=t;
    c.onclick=()=>useChip(c,t);suggestions.appendChild(c);
  });
}

function scrollToBottom(){chatArea.scrollTop=chatArea.scrollHeight;}

// ─── Demo ─────────────────────────────────────────────────────────────────────
function runDemo(){
  cancelDemo();
  setOrbState('idle');
  composerInput.value='';inputHasText=false;updateActionBtn();
  suggestions.classList.remove('hidden');
  if(!turnList.children.length)seedHistory();

  demoTimer=setTimeout(()=>{
    setOrbState('listening');
    demoTimer=setTimeout(()=>{
      setOrbState('thinking');
      demoTimer=setTimeout(()=>{
        const{turn,bubble}=addTurn({role:'user',text:"Today's weather?",modality:'voice',partial:true});
        demoTimer=setTimeout(()=>{
          bubble.textContent="What's the weather looking like today?";bubble.classList.remove('partial');
          setOrbState('speaking');
          isGenerating=true;updateActionBtn();
          const{turn:at,bubble:ab}=addTurn({role:'assistant',text:'',modality:'voice',partial:true});
          const reply="Gentle sun today, 72 degrees with a few clouds drifting in by afternoon. A fine day to spend some time outside.";
          let i=0;
          function sv(){
            if(i<reply.length){ab.textContent=reply.slice(0,i+1);scrollToBottom();i+=3;demoTimer=setTimeout(sv,16);}
            else{ab.classList.remove('partial');ab.textContent=reply;isGenerating=false;updateActionBtn();setOrbState('speaking');at.appendChild(buildCard({type:'weather'}));scrollToBottom();addFollowUpChips(['Tomorrow','Hourly','Pack a jacket?']);demoTimer=setTimeout(()=>setOrbState('idle'),1600);}
          }sv();
        },420);
      },700);
    },1500);
  },500);
}

function seedHistory(){
  addTurn({role:'user',text:'Good morning.',modality:'typed'});
  addTurn({role:'assistant',text:'Good morning! A pleasant Saturday ahead. What would you like to do?',modality:'typed'});
  addTurn({role:'user',text:'Play something soft, please.',modality:'voice'});
  addTurn({role:'assistant',text:"Playing Debussy's Clair de Lune. Take your time.",modality:'voice',interrupted:true});
}
function cancelDemo(){if(demoTimer)clearTimeout(demoTimer);demoTimer=null;isGenerating=false;stopWaveAnim();}

// ─── Init ─────────────────────────────────────────────────────────────────────
setOrbState('idle');
updateActionBtn();
blobLoop();
demoTimer=setTimeout(runDemo,2200);
</script>
