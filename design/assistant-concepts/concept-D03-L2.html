<!-- concept-D03-L2 | direction: Classic Chat + Voice Dock | look: OLED Neon Cyber | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D03 · Classic Chat + Voice Dock · OLED Neon Cyber</title>
<style>
:root{
  --bg:#000000;
  --surface:#0B0E14;
  --surface-2:#131826;
  --border:rgba(0,229,255,0.28);
  --text:#E8FBFF;
  --text-muted:#6B7A90;
  --accent:#00E5FF;
  --accent-2:#FF3DCB;
  --accent-3:#B6FF3D;
  --danger:#FF2E4D;
  --radius:8px;
  --radius-sm:5px;
  --font:"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono","Cascadia Mono",ui-monospace,monospace;
  --shadow:0 0 0 1px rgba(0,229,255,0.25),0 0 24px rgba(0,229,255,0.35);
  --shadow-sm:0 0 12px rgba(0,229,255,0.25);
  --glow-cyan:0 0 16px rgba(0,229,255,0.6);
  --glow-magenta:0 0 16px rgba(255,61,203,0.6);
  --ease:cubic-bezier(.2,.8,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:var(--font);
  background:#000;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}

/* Scanline shimmer overlay */
body::before{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,0.015) 2px,rgba(0,229,255,0.015) 4px);
  pointer-events:none;
  z-index:1000;
}

/* Neon background glow */
body::after{
  content:'';
  position:fixed;
  width:600px;height:600px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,229,255,0.04) 0%,transparent 70%);
  top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;
}

.app-window{
  width:420px;
  height:760px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:0 0 0 1px rgba(0,229,255,0.15),0 0 60px rgba(0,229,255,0.08);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  z-index:1;
}

/* Header */
.header{
  padding:14px 16px 12px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.header-avatar{
  width:32px;height:32px;
  border-radius:50%;
  position:relative;
  flex-shrink:0;
}
.header-orb-canvas{
  width:32px;height:32px;
  border-radius:50%;
}
.header-info{flex:1;}
.header-name{
  font-size:13px;font-weight:600;
  color:var(--accent);
  letter-spacing:0.08em;
  text-transform:uppercase;
  font-family:var(--font-mono);
  text-shadow:var(--glow-cyan);
}
.header-status{
  font-size:11px;color:var(--text-muted);
  font-family:var(--font-mono);
  letter-spacing:0.05em;
}
.header-btn{
  padding:5px 10px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:11px;font-family:var(--font-mono);
  color:var(--text-muted);cursor:pointer;
  transition:all 0.15s var(--ease);
}
.header-btn:hover{color:var(--accent);border-color:var(--accent);text-shadow:var(--glow-cyan);}

/* Thread */
.thread{
  flex:1;overflow-y:auto;
  padding:14px 14px 8px;
  scroll-behavior:smooth;
  display:flex;flex-direction:column;gap:2px;
}
.thread::-webkit-scrollbar{width:2px;}
.thread::-webkit-scrollbar-thumb{background:rgba(0,229,255,0.3);}

/* Empty state */
.empty-state{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;padding:24px;text-align:center;
}
.empty-title{
  font-size:14px;font-weight:600;
  color:var(--accent);font-family:var(--font-mono);
  text-transform:uppercase;letter-spacing:0.1em;
  text-shadow:var(--glow-cyan);
}
.empty-subtitle{font-size:12px;color:var(--text-muted);line-height:1.6;font-family:var(--font-mono);}

/* Avatar canvas */
#avatar-canvas{
  display:block;margin:0 auto;
}

/* Chips */
.chips-row{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
}
.chip{
  padding:6px 12px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:11px;font-family:var(--font-mono);
  color:var(--text-muted);cursor:pointer;
  transition:all 0.12s var(--ease);
  white-space:nowrap;
  letter-spacing:0.04em;
}
.chip:hover{
  background:rgba(0,229,255,0.1);
  border-color:var(--accent);
  color:var(--accent);
  text-shadow:var(--glow-cyan);
}
.chip.followup{border-color:rgba(0,229,255,0.2);font-size:10.5px;}

/* Messages */
.msg-group{
  margin-bottom:10px;
  animation:msgIn 0.15s var(--ease);
}
@keyframes msgIn{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}

.msg-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:2px;}
.msg-row.user{flex-direction:row-reverse;}

.bubble{
  max-width:72%;
  padding:9px 13px;
  font-size:13px;line-height:1.55;
  position:relative;
}
.bubble.assistant{
  background:var(--surface);
  border:1px solid rgba(0,229,255,0.2);
  border-radius:var(--radius-sm) var(--radius-sm) var(--radius-sm) 2px;
  color:var(--text);
  box-shadow:0 0 8px rgba(0,229,255,0.1);
}
.bubble.user{
  background:rgba(0,229,255,0.12);
  border:1px solid rgba(0,229,255,0.4);
  border-radius:var(--radius-sm) var(--radius-sm) 2px var(--radius-sm);
  color:var(--accent);
  box-shadow:var(--glow-cyan);
}
.bubble.partial{color:var(--text-muted);}

.msg-meta{
  display:flex;align-items:center;gap:5px;
  font-size:9px;color:var(--text-muted);
  padding:0 3px;
  font-family:var(--font-mono);
  letter-spacing:0.06em;
}
.msg-meta.user{flex-direction:row-reverse;}
.modality-glyph{
  padding:1px 4px;
  border:1px solid rgba(0,229,255,0.2);
  border-radius:2px;
  font-size:8px;
  color:var(--accent);
  font-family:var(--font-mono);
}

.interrupted-badge{
  display:inline-block;
  background:rgba(255,46,77,0.15);
  border:1px solid rgba(255,46,77,0.4);
  color:var(--danger);
  font-size:9px;font-family:var(--font-mono);
  padding:2px 6px;border-radius:2px;
  margin-top:4px;letter-spacing:0.06em;
}

.msg-attachment{
  width:54px;height:54px;border-radius:4px;
  background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;margin-top:4px;
}

/* App card */
.app-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;margin-top:8px;
  box-shadow:0 0 16px rgba(0,229,255,0.1);
  max-width:260px;
}
.app-card-header{
  display:flex;align-items:center;gap:6px;
  padding:8px 10px;
  border-bottom:1px solid var(--border);
  background:rgba(0,229,255,0.05);
}
.app-icon{
  width:20px;height:20px;border-radius:3px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#000;
}
.app-card-name{font-size:10px;font-weight:600;color:var(--accent);font-family:var(--font-mono);letter-spacing:0.08em;text-transform:uppercase;}
.app-card-body{padding:10px;}
.weather-big{font-size:32px;font-weight:300;color:var(--text);font-family:var(--font-mono);line-height:1;}
.weather-desc{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono);}
.weather-detail{font-size:10px;color:var(--text-muted);margin-top:6px;display:flex;gap:10px;font-family:var(--font-mono);}
.app-card-actions{
  padding:7px 10px;
  border-top:1px solid var(--border);
  display:flex;gap:6px;
}
.card-btn{
  flex:1;padding:5px;
  border-radius:3px;
  font-size:10px;font-weight:600;font-family:var(--font-mono);
  border:1px solid rgba(0,229,255,0.3);
  background:transparent;
  color:var(--text-muted);cursor:pointer;
  transition:all 0.12s var(--ease);text-align:center;
  letter-spacing:0.05em;
}
.card-btn.primary{
  background:rgba(0,229,255,0.15);
  border-color:var(--accent);
  color:var(--accent);
  text-shadow:var(--glow-cyan);
}
.card-btn:hover{border-color:var(--accent);color:var(--accent);}
.card-expand{font-size:9px;color:var(--accent);text-align:right;padding:3px 10px 6px;cursor:pointer;font-family:var(--font-mono);letter-spacing:0.06em;}

/* Voice Dock */
.voice-dock{
  background:var(--surface);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}

.dock-orb{
  width:40px;height:40px;
  border-radius:50%;
  flex-shrink:0;
  cursor:pointer;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
#dock-canvas{display:block;}

.dock-info{flex:1;min-width:0;}
.dock-label{
  font-size:11px;font-weight:600;font-family:var(--font-mono);
  color:var(--text);text-transform:uppercase;letter-spacing:0.08em;
  display:flex;align-items:center;gap:6px;
}
.dock-sublabel{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px;}
.live-indicator{
  display:none;align-items:center;gap:4px;
  font-size:10px;font-weight:700;font-family:var(--font-mono);
  color:var(--accent-3);letter-spacing:0.1em;
  text-shadow:0 0 8px rgba(182,255,61,0.6);
}
.live-indicator.visible{display:flex;}
.live-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent-3);
  box-shadow:0 0 6px rgba(182,255,61,0.8);
  animation:livePulse 0.8s ease-in-out infinite;
}
@keyframes livePulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.muted-label{
  display:none;font-size:10px;font-weight:700;
  color:var(--danger);font-family:var(--font-mono);
  letter-spacing:0.08em;text-shadow:0 0 8px rgba(255,46,77,0.5);
}
.muted-label.visible{display:block;}

/* Waveform bars */
.waveform{display:flex;align-items:center;gap:2px;height:16px;margin-top:3px;}
.wave-bar{
  width:2px;border-radius:1px;
  background:var(--accent);
  box-shadow:0 0 4px rgba(0,229,255,0.6);
  transition:height 0.08s linear;
}

.dock-controls{display:flex;align-items:center;gap:6px;}
.dock-btn{
  padding:5px 9px;
  border:1px solid rgba(0,229,255,0.25);
  border-radius:var(--radius-sm);
  font-size:11px;font-family:var(--font-mono);
  color:var(--text-muted);cursor:pointer;
  transition:all 0.12s var(--ease);
  background:transparent;
}
.dock-btn:hover{border-color:var(--accent);color:var(--accent);}
.dock-btn.danger:hover{border-color:var(--danger);color:var(--danger);}
.dock-btn.muted-active{
  border-color:var(--danger);color:var(--danger);
  background:rgba(255,46,77,0.1);
  box-shadow:0 0 8px rgba(255,46,77,0.3);
}

/* Composer */
.composer{
  padding:8px 14px 14px;
  background:var(--surface);
  flex-shrink:0;
}
.attach-chips{
  display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap;
}
.attach-chip{
  display:flex;align-items:center;gap:4px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:3px 7px 3px 5px;
  font-size:10px;color:var(--text-muted);font-family:var(--font-mono);
}
.attach-thumb{
  width:24px;height:24px;border-radius:3px;
  background:rgba(0,229,255,0.15);
  border:1px solid rgba(0,229,255,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;
}
.attach-remove{cursor:pointer;color:var(--text-muted);font-size:11px;}
.attach-remove:hover{color:var(--danger);}

.composer-row{display:flex;align-items:flex-end;gap:7px;}
.attach-btn{
  padding:7px 10px;
  border:1px solid rgba(0,229,255,0.2);
  border-radius:var(--radius-sm);
  font-size:15px;font-weight:300;
  color:var(--text-muted);cursor:pointer;
  flex-shrink:0;background:transparent;
  transition:all 0.12s var(--ease);line-height:1;
}
.attach-btn:hover{border-color:var(--accent);color:var(--accent);}

.input-wrap{
  flex:1;
  background:var(--surface-2);
  border:1px solid rgba(0,229,255,0.2);
  border-radius:var(--radius-sm);
  display:flex;align-items:flex-end;
  padding:7px 9px 7px 12px;
  transition:border-color 0.15s;
}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 8px rgba(0,229,255,0.2);}

textarea#composer-input{
  flex:1;border:none;background:transparent;
  font-family:var(--font-mono);font-size:12px;
  color:var(--text);resize:none;outline:none;
  min-height:18px;max-height:72px;line-height:1.5;
}
textarea#composer-input::placeholder{color:var(--text-muted);}

.send-btn{
  padding:7px 12px;
  border:1px solid;border-radius:var(--radius-sm);
  font-size:11px;font-weight:700;font-family:var(--font-mono);
  cursor:pointer;flex-shrink:0;
  transition:all 0.15s var(--ease);
  text-transform:uppercase;letter-spacing:0.08em;
  line-height:1;
}
.send-btn.mic{
  background:transparent;
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:var(--glow-cyan);
}
.send-btn.send{
  background:rgba(0,229,255,0.15);
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:var(--glow-cyan);
}
.send-btn.stop{
  background:rgba(255,46,77,0.15);
  border-color:var(--danger);
  color:var(--danger);
  box-shadow:0 0 10px rgba(255,46,77,0.4);
}

.typing-chips{
  display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;
  transition:opacity 0.15s;
}
.typing-chips.hidden{opacity:0;pointer-events:none;}

.time-divider{
  text-align:center;font-size:10px;
  color:var(--text-muted);padding:6px 0;
  font-family:var(--font-mono);letter-spacing:0.1em;
  text-transform:uppercase;
}

.demo-btn{
  position:fixed;bottom:20px;right:20px;
  padding:8px 16px;
  background:var(--surface);
  border:1px solid var(--accent);
  border-radius:var(--radius-sm);
  font-family:var(--font-mono);font-size:11px;font-weight:700;
  color:var(--accent);cursor:pointer;
  box-shadow:var(--glow-cyan);
  text-transform:uppercase;letter-spacing:0.1em;
  transition:all 0.15s var(--ease);z-index:100;
}
.demo-btn:hover{background:rgba(0,229,255,0.1);}

@media(min-width:900px){body{align-items:center;}}
</style>
</head>
<body>

<div class="app-window">
  <div class="header">
    <canvas id="header-canvas" width="32" height="32" class="header-orb-canvas"></canvas>
    <div class="header-info">
      <div class="header-name">ELIZA.AI</div>
      <div class="header-status" id="header-status">SYS::READY</div>
    </div>
    <div class="header-btn">[ ··· ]</div>
  </div>

  <div class="thread" id="thread">
    <div class="empty-state" id="empty-state">
      <canvas id="avatar-canvas" width="72" height="72"></canvas>
      <div class="empty-title">// ELIZA ONLINE</div>
      <div class="empty-subtitle">Speech-to-speech session ready.<br>Barge-in enabled. Latency: 80ms</div>
      <div class="chips-row" id="starter-chips">
        <div class="chip" onclick="useChip(this)">> weather_now()</div>
        <div class="chip" onclick="useChip(this)">> my_schedule()</div>
        <div class="chip" onclick="useChip(this)">> play(ambient)</div>
        <div class="chip" onclick="useChip(this)">> ideate()</div>
      </div>
    </div>
  </div>

  <div class="voice-dock" id="voice-dock">
    <div class="dock-orb" id="dock-orb" onclick="toggleVoice()">
      <canvas id="dock-canvas" width="40" height="40"></canvas>
    </div>

    <div class="dock-info">
      <div class="dock-label">
        <span id="dock-label-text">STANDBY</span>
        <div class="live-indicator" id="live-indicator">
          <div class="live-dot"></div>
          <span>LISTENING</span>
        </div>
      </div>
      <div class="dock-sublabel" id="dock-sublabel">TAP TO ACTIVATE</div>
      <div class="muted-label" id="muted-label">[MIC MUTED]</div>
      <div class="waveform" id="waveform" style="display:none;margin-top:4px;">
        <div class="wave-bar" style="height:3px;" id="wb1"></div>
        <div class="wave-bar" style="height:6px;" id="wb2"></div>
        <div class="wave-bar" style="height:10px;" id="wb3"></div>
        <div class="wave-bar" style="height:5px;" id="wb4"></div>
        <div class="wave-bar" style="height:8px;" id="wb5"></div>
        <div class="wave-bar" style="height:3px;" id="wb6"></div>
        <div class="wave-bar" style="height:7px;" id="wb7"></div>
        <div class="wave-bar" style="height:4px;" id="wb8"></div>
        <div class="wave-bar" style="height:9px;" id="wb9"></div>
      </div>
    </div>

    <div class="dock-controls">
      <div class="dock-btn" id="mute-btn" onclick="toggleMute()">MIC</div>
      <div class="dock-btn danger" id="end-btn" onclick="endVoice()">END</div>
    </div>
  </div>

  <div class="composer">
    <div class="attach-chips" id="attach-chips" style="display:none;"></div>
    <div class="composer-row">
      <div class="attach-btn" onclick="addAttachment()" title="Attach">+</div>
      <div class="input-wrap">
        <textarea id="composer-input" placeholder="// type or speak…" rows="1"></textarea>
      </div>
      <button class="send-btn mic" id="send-btn" onclick="handleSendBtn()">MIC</button>
    </div>
    <div class="typing-chips" id="typing-chips">
      <div class="chip followup" onclick="useChip(this)">--concise</div>
      <div class="chip followup" onclick="useChip(this)">--expand</div>
    </div>
  </div>
</div>

<button class="demo-btn" onclick="runDemo()">▶ DEMO</button>

<script>
// ===== Canvas rendering =====
let voiceState = 'idle';
let isMuted = false;
let isGenerating = false;
let pendingAttachments = [];
let demoTimers = [];
let waveformTimer = null;
let hasMessages = false;
let animFrame = null;
let time = 0;
let micLevel = 0;
let ttsLevel = 0;

// Canvas contexts
const headerCanvas = document.getElementById('header-canvas');
const hCtx = headerCanvas.getContext('2d');
const avatarCanvas = document.getElementById('avatar-canvas');
const aCtx = avatarCanvas.getContext('2d');
const dockCanvas = document.getElementById('dock-canvas');
const dCtx = dockCanvas.getContext('2d');

function drawNeonOrb(ctx, w, h, state, t, mic, tts){
  ctx.clearRect(0,0,w,h);
  const cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 3;

  if(state === 'idle'){
    // Sparse rotating particles
    const pulse = 0.85 + 0.1 * Math.sin(t*0.5);
    ctx.strokeStyle = 'rgba(0,229,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx,cy,r*pulse,0,Math.PI*2);
    ctx.stroke();
    // Dots
    for(let i=0;i<12;i++){
      const a = (i/12)*Math.PI*2 + t*0.3;
      const dr = r * (0.5 + 0.3*Math.sin(t*0.4 + i));
      const x = cx + Math.cos(a)*dr;
      const y = cy + Math.sin(a)*dr;
      const alpha = 0.3 + 0.4*Math.sin(t*0.5 + i*0.5);
      ctx.fillStyle = `rgba(0,229,255,${alpha})`;
      ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();
    }
  } else if(state === 'listening'){
    // Bars reacting to mic
    const bars = 16;
    for(let i=0;i<bars;i++){
      const a = (i/bars)*Math.PI*2 - Math.PI/2;
      const amp = mic * (0.5 + 0.5*Math.abs(Math.sin(t*3 + i)));
      const inner = r*0.35;
      const outer = inner + r*0.45*amp + r*0.08;
      const x1 = cx + Math.cos(a)*inner;
      const y1 = cy + Math.sin(a)*inner;
      const x2 = cx + Math.cos(a)*outer;
      const y2 = cy + Math.sin(a)*outer;
      const alpha = 0.5 + 0.5*amp;
      ctx.strokeStyle = `rgba(0,229,255,${alpha})`;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 6;
      ctx.shadowColor = 'rgba(0,229,255,0.8)';
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
    ctx.shadowBlur = 0;
  } else if(state === 'thinking'){
    // Magenta inner churn
    ctx.strokeStyle = 'rgba(255,61,203,0.6)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 8;ctx.shadowColor = 'rgba(255,61,203,0.8)';
    for(let ring=0;ring<3;ring++){
      const rr = r*(0.3 + ring*0.2);
      const offset = t*(0.8 + ring*0.3);
      ctx.beginPath();
      for(let i=0;i<=60;i++){
        const a = (i/60)*Math.PI*2;
        const noise = 0.9 + 0.1*Math.sin(a*4 + offset + ring);
        const x = cx + Math.cos(a)*rr*noise;
        const y = cy + Math.sin(a)*rr*noise;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.stroke();
    }
    ctx.shadowBlur = 0;
  } else if(state === 'speaking'){
    // TTS envelope bars
    const bars = 20;
    for(let i=0;i<bars;i++){
      const a = (i/bars)*Math.PI*2 - Math.PI/2;
      const envelope = tts * (0.4 + 0.6*Math.abs(Math.sin(t*8 + i*0.8)));
      const inner = r*0.3;
      const outer = inner + r*0.5*envelope + r*0.06;
      const x1 = cx + Math.cos(a)*inner;
      const y1 = cy + Math.sin(a)*inner;
      const x2 = cx + Math.cos(a)*outer;
      const y2 = cy + Math.sin(a)*outer;
      // Alternate cyan/magenta
      const col = i % 3 === 0 ? 'rgba(255,61,203' : 'rgba(0,229,255';
      ctx.strokeStyle = `${col},${0.5 + 0.5*envelope})`;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 5;ctx.shadowColor = 'rgba(0,229,255,0.5)';
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
    ctx.shadowBlur = 0;
  } else if(state === 'muted'){
    // Static grey ring
    ctx.strokeStyle = 'rgba(107,122,144,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();ctx.arc(cx,cy,r*0.7,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle = 'rgba(107,122,144,0.4)';
    ctx.font = `${Math.floor(r*0.5)}px monospace`;
    ctx.textAlign = 'center';ctx.textBaseline = 'middle';
    ctx.fillText('✕',cx,cy);
  }
}

function animLoop(){
  time += 0.04;
  // Simulated levels
  if(voiceState === 'listening'){
    micLevel = 0.3 + 0.7*Math.abs(Math.sin(time*2.3 + Math.random()*0.3));
  } else micLevel = 0;
  if(voiceState === 'speaking'){
    ttsLevel = 0.4 + 0.6*Math.abs(Math.sin(time*4 + 0.1));
  } else ttsLevel = 0;

  const state = isMuted ? 'muted' : voiceState;
  drawNeonOrb(hCtx,32,32,state,time,micLevel,ttsLevel);
  drawNeonOrb(aCtx,72,72,state,time,micLevel,ttsLevel);
  drawNeonOrb(dCtx,40,40,state,time,micLevel,ttsLevel);

  // Waveform bars
  if(voiceState === 'listening' || voiceState === 'speaking'){
    const bars = ['wb1','wb2','wb3','wb4','wb5','wb6','wb7','wb8','wb9'];
    bars.forEach((id,i) => {
      const el = document.getElementById(id);
      if(!el) return;
      const amp = voiceState==='listening'
        ? (micLevel * (2 + Math.abs(Math.sin(time*3+i))*12))
        : (ttsLevel * (3 + Math.abs(Math.sin(time*5+i*0.7))*12));
      el.style.height = Math.max(3, amp) + 'px';
      el.style.background = voiceState==='speaking' ? 'var(--accent-2)' : 'var(--accent)';
      el.style.boxShadow = voiceState==='speaking'
        ? '0 0 4px rgba(255,61,203,0.7)'
        : '0 0 4px rgba(0,229,255,0.6)';
    });
  }

  animFrame = requestAnimationFrame(animLoop);
}
animLoop();

// ===== Messages =====
function hideEmpty(){
  if(!hasMessages){
    const es = document.getElementById('empty-state');
    if(es) es.style.display = 'none';
    hasMessages = true;
  }
}
function scrollThread(){
  const t = document.getElementById('thread');
  t.scrollTop = t.scrollHeight;
}
function addTypedMessage(role, text, animate){
  hideEmpty();
  const thread = document.getElementById('thread');
  const group = document.createElement('div');
  group.className = 'msg-group';
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.textContent = text;
  const meta = document.createElement('div');
  meta.className = `msg-meta ${role}`;
  const glyph = document.createElement('div');
  glyph.className = 'modality-glyph';
  glyph.textContent = 'KBD';
  const ts = document.createElement('span');
  ts.textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  meta.appendChild(glyph);meta.appendChild(ts);
  row.appendChild(bubble);
  group.appendChild(row);group.appendChild(meta);

  if(pendingAttachments.length && role === 'user'){
    pendingAttachments.forEach(a => {
      const att = document.createElement('div');
      att.className = 'msg-attachment';
      att.textContent = a;
      row.insertBefore(att, bubble);
    });
    pendingAttachments = [];
    clearAttachChips();
  }
  thread.appendChild(group);
  scrollThread();
  return bubble;
}

function addVoiceMessage(role, text, finalized, interrupted, animate){
  hideEmpty();
  const thread = document.getElementById('thread');
  const group = document.createElement('div');
  group.className = 'msg-group';
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}${finalized ? '' : ' partial'}`;
  bubble.textContent = text;
  if(interrupted){
    const badge = document.createElement('div');
    badge.className = 'interrupted-badge';
    badge.textContent = '[BARGE-IN DETECTED]';
    bubble.appendChild(document.createElement('br'));
    bubble.appendChild(badge);
  }
  const meta = document.createElement('div');
  meta.className = `msg-meta ${role}`;
  const glyph = document.createElement('div');
  glyph.className = 'modality-glyph';
  glyph.textContent = 'MIC';
  const ts = document.createElement('span');
  ts.textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  meta.appendChild(glyph);meta.appendChild(ts);
  row.appendChild(bubble);group.appendChild(row);group.appendChild(meta);
  thread.appendChild(group);
  scrollThread();
  return bubble;
}

function addAssistantMessage(text, withCard, cardType){
  hideEmpty();
  const thread = document.getElementById('thread');
  const group = document.createElement('div');
  group.className = 'msg-group';
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble assistant';
  bubble.textContent = text;

  if(withCard && cardType === 'weather'){
    const card = document.createElement('div');
    card.className = 'app-card';
    card.innerHTML = `
      <div class="app-card-header">
        <div class="app-icon">◈</div>
        <span class="app-card-name">WEATHER::SF</span>
      </div>
      <div class="app-card-body">
        <div class="weather-big">68°F</div>
        <div class="weather-desc">// partly_cloudy, wind: 12mph</div>
        <div class="weather-detail">
          <span>HUM: 42%</span><span>UV: 4</span><span>VIS: OK</span>
        </div>
      </div>
      <div class="app-card-actions">
        <div class="card-btn">5d forecast</div>
        <div class="card-btn primary">set_alert()</div>
      </div>
    `;
    const expand = document.createElement('div');
    expand.className = 'card-expand';
    expand.textContent = '[ EXPAND → FULLSCREEN ]';
    expand.onclick = () => {};
    bubble.appendChild(card);
    bubble.appendChild(expand);
  }

  const meta = document.createElement('div');
  meta.className = 'msg-meta assistant';
  const glyph = document.createElement('div');
  glyph.className = 'modality-glyph';
  glyph.textContent = 'SYS';
  const ts = document.createElement('span');
  ts.textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  meta.appendChild(glyph);meta.appendChild(ts);
  row.appendChild(bubble);group.appendChild(row);group.appendChild(meta);
  thread.appendChild(group);
  scrollThread();
  return bubble;
}

function addFollowupChips(){
  const thread = document.getElementById('thread');
  const cr = document.createElement('div');
  cr.className = 'chips-row';
  cr.style.justifyContent = 'flex-start';
  cr.innerHTML = `
    <div class="chip followup" onclick="useChip(this)">> show_map()</div>
    <div class="chip followup" onclick="useChip(this)">> save_trail()</div>
    <div class="chip followup" onclick="useChip(this)">> nav(start)</div>
  `;
  thread.appendChild(cr);scrollThread();
}

function useChip(el){
  const text = el.textContent.trim();
  el.closest('.chips-row') && el.closest('.chips-row').remove();
  document.getElementById('composer-input').value = text;
  handleInputChange();
  document.getElementById('composer-input').focus();
}

// ===== Attachment =====
function addAttachment(){
  const items = ['📷','📄','📊','🎵'];
  pendingAttachments.push(items[Math.floor(Math.random()*items.length)]);
  renderAttachChips();
}
function renderAttachChips(){
  const c = document.getElementById('attach-chips');
  c.style.display = 'flex';c.innerHTML = '';
  pendingAttachments.forEach((a,i) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    chip.innerHTML = `<div class="attach-thumb">${a}</div><span>file_${i+1}</span><span class="attach-remove" onclick="removeAttach(${i})">✕</span>`;
    c.appendChild(chip);
  });
}
function removeAttach(i){
  pendingAttachments.splice(i,1);
  if(!pendingAttachments.length) clearAttachChips(); else renderAttachChips();
}
function clearAttachChips(){
  document.getElementById('attach-chips').style.display = 'none';
  document.getElementById('attach-chips').innerHTML = '';
}

// ===== Voice state =====
function setVoiceState(state){
  voiceState = state;
  const liveInd = document.getElementById('live-indicator');
  const wf = document.getElementById('waveform');
  const labelText = document.getElementById('dock-label-text');
  const sublabel = document.getElementById('dock-sublabel');
  const headerStatus = document.getElementById('header-status');
  const mutedLabel = document.getElementById('muted-label');

  liveInd.className = `live-indicator ${state === 'listening' && !isMuted ? 'visible' : ''}`;
  mutedLabel.className = `muted-label ${isMuted ? 'visible' : ''}`;

  if(state === 'listening' && !isMuted){
    labelText.textContent = 'HOT MIC';
    sublabel.textContent = '';
    wf.style.display = 'flex';
    headerStatus.textContent = 'SYS::LISTENING';
  } else if(state === 'thinking'){
    labelText.textContent = 'PROCESSING';
    sublabel.textContent = '';
    wf.style.display = 'none';
    headerStatus.textContent = 'SYS::THINKING';
  } else if(state === 'speaking'){
    labelText.textContent = 'OUTPUT';
    sublabel.textContent = 'TAP TO INTERRUPT';
    wf.style.display = 'flex';
    headerStatus.textContent = 'SYS::SPEAKING';
  } else {
    labelText.textContent = 'STANDBY';
    sublabel.textContent = isMuted ? '// MIC MUTED' : 'TAP TO ACTIVATE';
    wf.style.display = 'none';
    headerStatus.textContent = isMuted ? 'SYS::MUTED' : 'SYS::READY';
  }
}

function toggleVoice(){
  if(isGenerating) return;
  if(voiceState === 'idle') runDemo();
  else endVoice();
}
function endVoice(){
  cancelDemoTimers();
  setVoiceState('idle');
  isGenerating = false;
  updateSendBtn();
}
function toggleMute(){
  isMuted = !isMuted;
  const btn = document.getElementById('mute-btn');
  btn.className = isMuted ? 'dock-btn muted-active' : 'dock-btn';
  btn.textContent = isMuted ? 'MUTE' : 'MIC';
  setVoiceState(voiceState);
}

// ===== Composer =====
const inputEl = document.getElementById('composer-input');
inputEl.addEventListener('input', handleInputChange);
inputEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleSendBtn(); }
});
function handleInputChange(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 72) + 'px';
  updateSendBtn();
  document.getElementById('typing-chips').className = inputEl.value.trim() ? 'typing-chips hidden' : 'typing-chips';
}
function updateSendBtn(){
  const btn = document.getElementById('send-btn');
  if(isGenerating){ btn.className='send-btn stop';btn.textContent='STOP'; }
  else if(inputEl.value.trim()){ btn.className='send-btn send';btn.textContent='SEND'; }
  else { btn.className='send-btn mic';btn.textContent='MIC'; }
}
function handleSendBtn(){
  if(isGenerating){ stopGeneration(); return; }
  const text = inputEl.value.trim();
  if(text){ sendTypedMessage(text); return; }
  runDemo();
}
function sendTypedMessage(text){
  inputEl.value = '';handleInputChange();
  addTypedMessage('user',text,true);
  isGenerating = true;updateSendBtn();
  setVoiceState('thinking');
  setTimeout(() => {
    addAssistantMessage('Acknowledged. Here is the data you requested.', false, null);
    addFollowupChips();
    isGenerating = false;setVoiceState('idle');updateSendBtn();
  }, 1100);
}
function stopGeneration(){
  cancelDemoTimers();
  isGenerating = false;setVoiceState('idle');updateSendBtn();
}

// ===== Demo =====
function cancelDemoTimers(){
  demoTimers.forEach(t => clearTimeout(t));
  demoTimers = [];
}
function runDemo(){
  cancelDemoTimers();endVoice();
  setVoiceState('listening');
  isGenerating = true;updateSendBtn();

  demoTimers.push(setTimeout(() => {
    if(voiceState !== 'listening') return;
    setVoiceState('thinking');
    addVoiceMessage('user','What is the weather forecast for this weekend?',true,false,true);
  }, 2000));

  demoTimers.push(setTimeout(() => {
    if(voiceState !== 'thinking') return;
    setVoiceState('speaking');
    const bubble = addVoiceMessage('assistant','PARSING REQUEST — ', false, false, true);
    const words = ['Saturday:', '71°F', 'clear.', 'Sunday:', 'foggy', 'AM,', 'clears', 'by', '1300.', 'Optimal', 'outdoor', 'window:', 'SAT 09:00–17:00.'];
    let wi = 0;
    const si = setInterval(() => {
      if(wi < words.length){ bubble.textContent = bubble.textContent + words[wi++] + ' '; scrollThread(); }
      else { clearInterval(si); bubble.className = 'bubble assistant'; }
    }, 160);
    demoTimers.push(setTimeout(() => {
      clearInterval(si);
      bubble.className = 'bubble assistant';
      addFollowupChips();
      isGenerating = false;setVoiceState('idle');updateSendBtn();
    }, 3500));
  }, 3000));
}

// ===== Init =====
window.addEventListener('load', () => {
  addTypedMessage('user','Show me SF weather',true);
  addAssistantMessage('Pulling live conditions for San Francisco.',true,'weather');
  addVoiceMessage('assistant','Also, the weekend has a great hiking window on Saturday morning.',true,false,true);
  addVoiceMessage('assistant','I was going to add more details but you can ask.',false,true,true);
  addTypedMessage('user','Tell me about trails near the city',true);
  addAssistantMessage('Top picks: Marin Headlands (6mi, coastal), Muir Woods (redwoods, 4mi), Tennessee Valley (easy, dog-friendly).', false, null);
  addFollowupChips();
  setTimeout(runDemo, 1000);
});
</script>
