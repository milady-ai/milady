<!-- concept-D15-L2 | direction: Character / Companion with Personality | look: OLED Neon Cyber | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D15 · Character / Companion with Personality · OLED Neon Cyber</title>
<style>
:root{
  --bg:#000000;
  --surface:#0B0E14;
  --surface-2:#131826;
  --border:rgba(0,229,255,0.28);
  --text:#E8FBFF;
  --text-muted:#6B7A90;
  --accent:#00E5FF;
  --accent-2:#FF3DCB;
  --accent-3:#B6FF3D;
  --danger:#FF2E4D;
  --radius:8px;
  --radius-sm:5px;
  --font:"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono","Cascadia Mono",ui-monospace,monospace;
  --shadow:0 0 0 1px rgba(0,229,255,0.25),0 0 24px rgba(0,229,255,0.35);
  --shadow-sm:0 0 12px rgba(0,229,255,0.25);
  --glow-cyan:0 0 16px rgba(0,229,255,0.6);
  --glow-magenta:0 0 16px rgba(255,61,203,0.6);
  --ease:cubic-bezier(.2,.8,.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:#050507;color:var(--text);overflow-x:hidden}

body{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  background:radial-gradient(ellipse at center,#060B14 0%,#000 70%);
}

/* Scanline overlay */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,0.013) 2px,rgba(0,229,255,0.013) 4px);
  z-index:1000;
}

.app-window{
  width:420px;height:760px;
  background:var(--bg);
  border:1px solid var(--border);
  box-shadow:0 0 0 1px rgba(0,229,255,0.1),0 0 60px rgba(0,229,255,0.08);
  border-radius:var(--radius);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;
}

/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.companion-info{display:flex;align-items:center;gap:10px}
.companion-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:var(--glow-cyan);
  animation:statusBlink 1.8s ease-in-out infinite;
}
@keyframes statusBlink{0%,100%{opacity:1}50%{opacity:0.4}}
.companion-name{
  font-size:15px;font-weight:600;color:var(--text);
  font-family:var(--font-mono);letter-spacing:0.05em;
}
.companion-mood{
  font-size:11px;color:var(--accent);font-family:var(--font-mono);
  letter-spacing:0.12em;text-transform:uppercase;
}
.header-actions{display:flex;gap:8px}
.icon-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);
  border:1px solid var(--border);cursor:pointer;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:14px;
  transition:all 0.12s var(--ease);
}
.icon-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:var(--glow-cyan);
}
.mute-btn.active{
  border-color:var(--danger) !important;
  color:var(--danger) !important;
  box-shadow:0 0 12px rgba(255,46,77,0.5) !important;
}

/* Avatar Stage */
.avatar-stage{
  flex-shrink:0;height:200px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}

/* Particle orb / waveform creature */
.orb-wrap{position:relative;width:140px;height:140px;cursor:pointer}
.orb-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(0,229,255,0.3);
  animation:ringRotate 4s linear infinite;
}
.orb-ring-2{
  position:absolute;inset:8px;border-radius:50%;
  border:1px solid rgba(255,61,203,0.2);
  animation:ringRotate 6s linear infinite reverse;
}
@keyframes ringRotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.orb{
  position:absolute;inset:18px;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,rgba(0,229,255,0.25) 0%,rgba(0,229,255,0.05) 50%,transparent 70%);
  display:flex;align-items:center;justify-content:center;
  transition:all 0.12s var(--ease);
}

/* Particle bars */
.bars-wrap{
  display:flex;align-items:flex-end;gap:3px;height:50px;
  position:relative;z-index:2;
}
.bar{
  width:5px;border-radius:2px 2px 0 0;
  background:var(--accent);
  box-shadow:0 0 8px rgba(0,229,255,0.5);
  transition:height 0.08s steps(4,end);
  min-height:4px;
}
.bar:nth-child(even){background:var(--accent-2);box-shadow:0 0 8px rgba(255,61,203,0.5)}

/* Face overlay */
.orb-face{
  position:absolute;inset:0;z-index:3;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
}
.cyber-eyes{display:flex;gap:16px;margin-bottom:8px}
.cyber-eye{
  width:6px;height:6px;
  background:var(--accent);
  box-shadow:var(--glow-cyan);
  clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  transition:all 0.12s;
}
.state-label{
  position:absolute;bottom:10px;
  font-size:10px;font-family:var(--font-mono);
  color:var(--accent);letter-spacing:0.15em;text-transform:uppercase;
  opacity:0.7;
}

/* Listening label */
.listening-label{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--accent);
  background:rgba(0,229,255,0.08);
  font-size:11px;color:var(--accent);font-family:var(--font-mono);
  letter-spacing:0.1em;text-transform:uppercase;
  opacity:0;
  transition:opacity 0.12s;pointer-events:none;
}
.listening-label.visible{opacity:1}
.mic-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  box-shadow:var(--glow-cyan);
  animation:micBlink 0.8s steps(1,end) infinite;
}
@keyframes micBlink{0%,100%{opacity:1}50%{opacity:0}}

.muted-label{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--danger);
  background:rgba(255,46,77,0.08);
  font-size:11px;color:var(--danger);font-family:var(--font-mono);
  letter-spacing:0.1em;text-transform:uppercase;
  opacity:0;pointer-events:none;
}
.muted-label.visible{opacity:1}

/* Persona Row */
.persona-row{
  display:flex;gap:6px;padding:8px 12px;
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
  border-bottom:1px solid rgba(0,229,255,0.1);
}
.persona-row::-webkit-scrollbar{display:none}
.persona-chip{
  flex-shrink:0;padding:4px 12px;border-radius:var(--radius-sm);
  border:1px solid rgba(0,229,255,0.25);
  background:transparent;
  font-size:11px;font-weight:600;color:var(--text-muted);
  font-family:var(--font-mono);letter-spacing:0.08em;text-transform:uppercase;
  cursor:pointer;white-space:nowrap;
  transition:all 0.1s;
}
.persona-chip.active,.persona-chip:hover{
  border-color:var(--accent);color:var(--accent);
  box-shadow:var(--glow-cyan);
  background:rgba(0,229,255,0.06);
}

/* Chat */
.chat-area{
  flex:1;overflow-y:auto;padding:10px 12px;
  display:flex;flex-direction:column;gap:8px;
  scrollbar-width:thin;
  scrollbar-color:rgba(0,229,255,0.2) transparent;
}
.chat-area::-webkit-scrollbar{width:3px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(0,229,255,0.2);border-radius:2px}

.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
.empty-greeting{
  font-size:13px;color:var(--text-muted);text-align:center;line-height:1.6;
  font-family:var(--font-mono);
}
.empty-greeting span{color:var(--accent)}

.suggestion-chips{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  transition:opacity 0.2s;
}
.suggestion-chips.hidden{opacity:0;pointer-events:none}
.sug-chip{
  padding:5px 12px;border-radius:var(--radius-sm);
  border:1px solid rgba(0,229,255,0.2);
  background:rgba(0,229,255,0.04);
  font-size:11px;color:var(--accent);font-family:var(--font-mono);
  cursor:pointer;letter-spacing:0.06em;
  transition:all 0.1s;
}
.sug-chip:hover{border-color:var(--accent);background:rgba(0,229,255,0.1);box-shadow:var(--glow-cyan)}

/* Messages */
.msg{display:flex;gap:8px;align-items:flex-end;animation:msgIn 0.15s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.bubble{
  max-width:75%;padding:8px 12px;
  font-size:13px;line-height:1.5;color:var(--text);
  position:relative;font-family:var(--font);
}
.msg.assistant .bubble{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:0 var(--radius) var(--radius) var(--radius);
  box-shadow:var(--shadow-sm);
}
.msg.user .bubble{
  background:rgba(0,229,255,0.08);
  border:1px solid rgba(0,229,255,0.35);
  border-radius:var(--radius) 0 var(--radius) var(--radius);
  color:var(--text);
}
.turn-glyph{
  font-size:9px;opacity:0.5;margin-top:4px;
  display:flex;align-items:center;gap:3px;
  font-family:var(--font-mono);letter-spacing:0.08em;text-transform:uppercase;
}
.partial{opacity:0.45}
.interrupted-badge{
  font-size:9px;
  background:rgba(255,46,77,0.15);color:var(--danger);
  border:1px solid rgba(255,46,77,0.4);
  border-radius:2px;padding:1px 5px;margin-left:6px;
  font-family:var(--font-mono);
}

/* App Card */
.app-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;margin-top:4px;
  animation:msgIn 0.15s var(--ease);
}
.app-card-header{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  background:rgba(0,229,255,0.04);
}
.app-icon{
  width:24px;height:24px;border-radius:4px;
  background:linear-gradient(135deg,rgba(0,229,255,0.3),rgba(255,61,203,0.3));
  display:flex;align-items:center;justify-content:center;font-size:13px;
  border:1px solid var(--border);
}
.app-name{font-size:12px;font-weight:600;color:var(--text);font-family:var(--font-mono);letter-spacing:0.05em}
.app-card-body{padding:10px 12px}
.weather-display{display:flex;align-items:center;gap:14px}
.weather-temp{font-size:32px;font-weight:300;color:var(--accent);font-family:var(--font-mono);box-shadow:none;text-shadow:var(--glow-cyan)}
.weather-detail{font-size:11px;color:var(--text-muted);line-height:1.6;font-family:var(--font-mono)}
.weather-detail strong{color:var(--text)}
.app-card-actions{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--border)}
.card-btn{
  flex:1;padding:6px 10px;border-radius:var(--radius-sm);
  border:none;cursor:pointer;font-size:11px;font-weight:600;
  font-family:var(--font-mono);letter-spacing:0.06em;text-transform:uppercase;
  transition:all 0.1s;
}
.card-btn.primary{background:var(--accent);color:#000;box-shadow:var(--glow-cyan)}
.card-btn.primary:hover{opacity:0.85}
.card-btn.secondary{
  background:transparent;color:var(--accent);
  border:1px solid rgba(0,229,255,0.3);
}
.card-btn.secondary:hover{background:rgba(0,229,255,0.1)}

.followup-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:var(--radius-sm);
  background:rgba(182,255,61,0.06);
  border:1px solid rgba(182,255,61,0.3);
  font-size:10px;color:var(--accent-3);font-family:var(--font-mono);
  cursor:pointer;margin-top:6px;letter-spacing:0.06em;
  transition:all 0.1s;
}
.followup-chip:hover{background:rgba(182,255,61,0.12);box-shadow:0 0 10px rgba(182,255,61,0.3)}

/* Attachment */
.attachment-preview{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:6px 12px 0;flex-shrink:0;
}
.attach-chip{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--border);
  font-size:11px;color:var(--text);font-family:var(--font-mono);
}
.attach-remove{
  width:14px;height:14px;border-radius:2px;
  background:rgba(255,46,77,0.15);
  border:1px solid rgba(255,46,77,0.3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--danger);
}
.attach-thumbnail{
  width:32px;height:32px;border-radius:4px;border:1px solid var(--border);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:16px;
}

/* Composer */
.composer-wrap{
  flex-shrink:0;padding:8px 12px 14px;
  background:var(--surface);
  border-top:1px solid var(--border);
}
.composer{
  display:flex;align-items:flex-end;gap:8px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:6px 8px 6px 12px;
  transition:border-color 0.12s;
}
.composer:focus-within{border-color:var(--accent);box-shadow:var(--glow-cyan)}
.composer-input{
  flex:1;border:none;background:transparent;
  font-size:13px;color:var(--text);outline:none;
  resize:none;max-height:70px;line-height:1.4;
  font-family:var(--font-mono);
}
.composer-input::placeholder{color:var(--text-muted)}
.attach-btn{
  width:30px;height:30px;border-radius:var(--radius-sm);
  border:1px solid var(--border);cursor:pointer;
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:14px;flex-shrink:0;
  transition:all 0.1s;
}
.attach-btn:hover{border-color:var(--accent);color:var(--accent)}
.send-btn{
  width:36px;height:36px;border-radius:var(--radius-sm);border:none;cursor:pointer;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:#000;font-size:14px;flex-shrink:0;
  position:relative;overflow:hidden;
  transition:all 0.12s var(--ease);
}
.send-btn:hover{opacity:0.85}
.send-btn.mic-mode{background:var(--accent);box-shadow:var(--glow-cyan)}
.send-btn.send-mode{background:var(--accent-2);box-shadow:var(--glow-magenta)}
.send-btn.stop-mode{background:var(--danger);box-shadow:0 0 12px rgba(255,46,77,0.5)}
.send-btn svg{position:absolute;transition:all 0.12s var(--ease)}
.send-btn .icon-mic{opacity:1;transform:scale(1)}
.send-btn .icon-send{opacity:0;transform:scale(0.6)}
.send-btn .icon-stop{opacity:0;transform:scale(0.6)}
.send-btn.send-mode .icon-mic{opacity:0;transform:scale(0.6)}
.send-btn.send-mode .icon-send{opacity:1;transform:scale(1)}
.send-btn.stop-mode .icon-mic{opacity:0;transform:scale(0.6)}
.send-btn.stop-mode .icon-stop{opacity:1;transform:scale(1)}

.demo-btn{
  width:100%;padding:6px;
  background:transparent;border:none;
  font-size:10px;color:var(--text-muted);cursor:pointer;
  font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;
  margin-top:6px;
  transition:color 0.1s;
}
.demo-btn:hover{color:var(--accent)}

@media(min-width:640px){.app-window{width:420px;height:760px}}
@media(max-width:440px){.app-window{width:100%;height:100vh;border-radius:0}}
</style>
</head>
<body>

<div class="app-window">
  <div class="header">
    <div class="companion-info">
      <div class="companion-dot"></div>
      <div>
        <div class="companion-name">NEXUS</div>
        <div class="companion-mood" id="moodLabel">ONLINE · STORYTELLER</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn mute-btn" id="muteBtn" title="Mute">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      </button>
      <button class="icon-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div class="avatar-stage">
    <div class="listening-label" id="listeningLabel">
      <div class="mic-dot"></div>
      MIC · LISTENING
    </div>
    <div class="muted-label" id="mutedLabel">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"/></svg>
      MIC · MUTED
    </div>

    <div class="orb-wrap" id="orbWrap" onclick="startVoice()">
      <div class="orb-ring" id="orbRing"></div>
      <div class="orb-ring-2"></div>
      <div class="orb" id="orb">
        <div class="bars-wrap" id="barsWrap"></div>
        <div class="orb-face" id="orbFace">
          <div style="display:flex;flex-direction:column;align-items:center">
            <div class="cyber-eyes" id="cyberEyes">
              <div class="cyber-eye" id="eyeL"></div>
              <div class="cyber-eye" id="eyeR"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="state-label" id="stateLabel">IDLE</div>
    </div>
  </div>

  <div class="persona-row">
    <div class="persona-chip active" onclick="selectPersona(this,'STORYTELLER')">STORY</div>
    <div class="persona-chip" onclick="selectPersona(this,'COACH')">COACH</div>
    <div class="persona-chip" onclick="selectPersona(this,'CONCISE')">CONCISE</div>
    <div class="persona-chip" onclick="selectPersona(this,'CURIOUS')">CURIOUS</div>
    <div class="persona-chip" onclick="selectPersona(this,'PLAYFUL')">PLAY</div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-greeting"><span>NEXUS</span> ONLINE<br>TAP ORB TO INITIATE VOICE SESSION</div>
      <div class="suggestion-chips" id="suggChips">
        <div class="sug-chip" onclick="sendSuggestion('Tell me a story about the void')">// TELL_STORY</div>
        <div class="sug-chip" onclick="sendSuggestion('Pep talk — I need it')">// PEP_TALK</div>
        <div class="sug-chip" onclick="sendSuggestion('Dinner recommendations')">// FOOD_QUERY</div>
        <div class="sug-chip" onclick="sendSuggestion('What\'s the weather?')">// WEATHER_SYS</div>
      </div>
    </div>
  </div>

  <div class="attachment-preview" id="attachPreview"></div>

  <div class="composer-wrap">
    <div class="composer">
      <button class="attach-btn" onclick="addAttachment()" title="Attach">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea class="composer-input" id="composerInput" placeholder="> input query…" rows="1"></textarea>
      <button class="send-btn mic-mode" id="sendBtn" onclick="handleSendBtn()">
        <svg class="icon-mic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
        <svg class="icon-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
      </button>
    </div>
    <button class="demo-btn" id="demoBtn" onclick="runDemo()">▶ PLAY_DEMO // voice cycle</button>
  </div>
</div>

<script>
let state = 'idle';
let muted = false;
let attachments = [];
let demoTimer = null;
let ampInterval = null;
let isGenerating = false;
let currentPersona = 'STORYTELLER';
let barAnim = null;

const orb = document.getElementById('orb');
const orbRing = document.getElementById('orbRing');
const barsWrap = document.getElementById('barsWrap');
const listeningLabel = document.getElementById('listeningLabel');
const mutedLabel = document.getElementById('mutedLabel');
const stateLabel = document.getElementById('stateLabel');
const chatArea = document.getElementById('chatArea');
const emptyState = document.getElementById('emptyState');
const suggChips = document.getElementById('suggChips');
const composerInput = document.getElementById('composerInput');
const sendBtn = document.getElementById('sendBtn');
const attachPreview = document.getElementById('attachPreview');
const moodLabel = document.getElementById('moodLabel');
const muteBtn = document.getElementById('muteBtn');

// Build bars
function buildBars(count) {
  barsWrap.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    b.style.height = '4px';
    barsWrap.appendChild(b);
  }
}
buildBars(12);

function animateBars(mode) {
  if (barAnim) clearInterval(barAnim);
  const bars = barsWrap.querySelectorAll('.bar');
  barAnim = setInterval(() => {
    bars.forEach((b, i) => {
      let h;
      if (mode === 'idle') {
        h = 4 + Math.abs(Math.sin(Date.now()/600 + i*0.5)) * 10;
      } else if (mode === 'listening') {
        h = 4 + Math.abs(Math.sin(Date.now()/120 + i*0.4)) * 40 + Math.random() * 8;
      } else if (mode === 'thinking') {
        h = 10 + Math.abs(Math.sin(Date.now()/400 + i*0.3)) * 28;
        b.style.background = i % 2 === 0 ? 'var(--accent-2)' : 'var(--accent)';
        b.style.boxShadow = i % 2 === 0 ? 'var(--glow-magenta)' : 'var(--glow-cyan)';
      } else if (mode === 'speaking') {
        const envelope = 0.5 + 0.5 * Math.abs(Math.sin(Date.now()/180));
        h = 4 + Math.abs(Math.sin(Date.now()/90 + i*0.6)) * 44 * envelope + Math.random()*6;
      }
      b.style.height = Math.max(4, h) + 'px';
      if (mode !== 'thinking') {
        b.style.background = i % 2 === 0 ? 'var(--accent)' : 'var(--accent-2)';
        b.style.boxShadow = i % 2 === 0 ? 'var(--glow-cyan)' : 'var(--glow-magenta)';
      }
    });
  }, 50);
}

function setAvatarState(s) {
  state = s;
  stateLabel.textContent = s.toUpperCase();
  listeningLabel.classList.toggle('visible', s === 'listening' && !muted);

  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');

  if (muted) {
    eyeL.style.background = '#333';eyeL.style.boxShadow = 'none';
    eyeR.style.background = '#333';eyeR.style.boxShadow = 'none';
    orb.style.opacity = '0.4';
    animateBars('idle');
    return;
  }
  orb.style.opacity = '1';

  if (s === 'idle') {
    moodLabel.textContent = `ONLINE · ${currentPersona}`;
    eyeL.style.cssText='background:var(--accent);box-shadow:var(--glow-cyan);clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
    eyeR.style.cssText='background:var(--accent);box-shadow:var(--glow-cyan);clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
    orbRing.style.animationDuration = '4s';
    animateBars('idle');
  } else if (s === 'listening') {
    moodLabel.textContent = 'PROCESSING · AUDIO_INPUT';
    eyeL.style.cssText='background:var(--accent);box-shadow:var(--glow-cyan);clip-path:none;width:8px;height:8px;border-radius:50%';
    eyeR.style.cssText='background:var(--accent);box-shadow:var(--glow-cyan);clip-path:none;width:8px;height:8px;border-radius:50%';
    orbRing.style.animationDuration = '1s';
    animateBars('listening');
  } else if (s === 'thinking') {
    moodLabel.textContent = 'COMPUTING · INFERENCE';
    eyeL.style.cssText='background:var(--accent-2);box-shadow:var(--glow-magenta);clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
    eyeR.style.cssText='background:var(--accent-2);box-shadow:var(--glow-magenta);clip-path:polygon(0% 0%, 100% 0%, 50% 100%)';
    orbRing.style.animationDuration = '0.8s';
    animateBars('thinking');
  } else if (s === 'speaking') {
    moodLabel.textContent = 'STREAMING · OUTPUT';
    eyeL.style.cssText='background:var(--accent-3);box-shadow:0 0 12px rgba(182,255,61,0.6);clip-path:none;width:9px;height:9px;border-radius:50%';
    eyeR.style.cssText='background:var(--accent-3);box-shadow:0 0 12px rgba(182,255,61,0.6);clip-path:none;width:9px;height:9px;border-radius:50%';
    orbRing.style.animationDuration = '0.5s';
    animateBars('speaking');
  }
}

muteBtn.addEventListener('click', toggleMute);
function toggleMute() {
  muted = !muted;
  muteBtn.classList.toggle('active', muted);
  muteBtn.innerHTML = muted
    ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"/></svg>`
    : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>`;
  mutedLabel.classList.toggle('visible', muted);
  listeningLabel.classList.toggle('visible', state === 'listening' && !muted);
  setAvatarState(state);
}

composerInput.addEventListener('input', () => {
  if (isGenerating) return;
  const hasText = composerInput.value.trim().length > 0;
  sendBtn.className = 'send-btn ' + (hasText ? 'send-mode' : 'mic-mode');
  suggChips.classList.toggle('hidden', hasText);
  composerInput.style.height = 'auto';
  composerInput.style.height = Math.min(composerInput.scrollHeight, 70) + 'px';
});

function selectPersona(el, name) {
  document.querySelectorAll('.persona-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentPersona = name;
  if (state === 'idle') moodLabel.textContent = `ONLINE · ${name}`;
}

function hideEmptyState() {
  if (emptyState.parentNode) emptyState.remove();
}

function addMessage(role, text, modality, partial, interrupted) {
  hideEmptyState();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const glyphSvg = modality === 'voice'
    ? `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg>`
    : `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>`;
  div.innerHTML = `
    <div class="bubble${partial?' partial':''}">
      ${text}
      ${interrupted ? '<span class="interrupted-badge">INTERRUPTED</span>' : ''}
      <div class="turn-glyph">${glyphSvg} ${modality.toUpperCase()}</div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function addWeatherCard() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="bubble" style="max-width:95%">
      <div class="app-card">
        <div class="app-card-header">
          <div class="app-icon">🌤</div>
          <span class="app-name">SYS::WEATHER // SF</span>
        </div>
        <div class="app-card-body">
          <div class="weather-display">
            <div class="weather-temp">64°</div>
            <div class="weather-detail">
              <strong>PARTLY_CLOUDY</strong><br>
              FEELS: 61° · HUM: 72%<br>
              WIND: NW @12mph
            </div>
          </div>
        </div>
        <div class="app-card-actions">
          <button class="card-btn primary">5-DAY_CAST</button>
          <button class="card-btn secondary">RADAR</button>
        </div>
      </div>
      <div class="turn-glyph" style="margin-top:6px">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg>
        VOICE
      </div>
      <div class="followup-chip" onclick="sendSuggestion('What about this weekend?')">// WEEKEND_QUERY</div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addAttachment() {
  if (attachments.length >= 3) return;
  const files = ['img_0042.jpg', 'notes_draft.txt', 'voice_01.m4a'];
  attachments.push(files[attachments.length % 3]);
  renderAttachments();
  // orb flashes
  orb.style.background = 'radial-gradient(circle,rgba(182,255,61,0.2) 0%,transparent 70%)';
  setTimeout(() => { orb.style.background = ''; }, 400);
}

function renderAttachments() {
  attachPreview.innerHTML = '';
  const emojis = ['🖼', '📄', '🎵'];
  attachments.forEach((name, i) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    chip.innerHTML = `
      <div class="attach-thumbnail" style="width:24px;height:24px;font-size:12px">${emojis[i%3]}</div>
      <span>${name}</span>
      <button class="attach-remove" onclick="removeAttachment(${i})">✕</button>
    `;
    attachPreview.appendChild(chip);
  });
}

function removeAttachment(i) { attachments.splice(i,1); renderAttachments(); }

function startVoice() { if (muted) return; runDemo(); }

function handleSendBtn() {
  if (isGenerating) { stopGeneration(); return; }
  const text = composerInput.value.trim();
  if (text.length > 0) { sendTyped(text); } else { startVoice(); }
}

function sendTyped(text) {
  composerInput.value = '';
  composerInput.style.height = 'auto';
  sendBtn.className = 'send-btn mic-mode';
  if (attachments.length > 0) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="bubble"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-size:16px">🖼</span><span style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono)">${attachments[0]}</span></div>${text}<div class="turn-glyph"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg> TYPED</div></div>`;
    chatArea.appendChild(div);
    attachments = []; renderAttachments();
    // orb reacts to photo
    setAvatarState('idle');
    setTimeout(() => {
      const e1 = document.getElementById('eyeL');
      const e2 = document.getElementById('eyeR');
      e1.style.transform = 'scale(1.8)';
      e2.style.transform = 'scale(0.5)';
      setTimeout(() => { e1.style.transform=''; e2.style.transform=''; }, 600);
    }, 100);
  } else {
    addMessage('user', text, 'typed');
  }
  chatArea.scrollTop = chatArea.scrollHeight;
  setTimeout(() => triggerAssistantReply(text), 700);
}

function sendSuggestion(text) {
  composerInput.value = '';
  addMessage('user', text, 'typed');
  setTimeout(() => triggerAssistantReply(text), 700);
}

function stopGeneration() {
  isGenerating = false;
  setAvatarState('idle');
  sendBtn.className = 'send-btn mic-mode';
  if (barAnim) clearInterval(barAnim);
  animateBars('idle');
}

function triggerAssistantReply(userText) {
  isGenerating = true;
  sendBtn.className = 'send-btn stop-mode';
  setAvatarState('thinking');
  setTimeout(() => {
    setAvatarState('speaking');
    let reply, hasCard = false;
    const lower = userText.toLowerCase();
    if (lower.includes('weather') || lower.includes('forecast')) {
      reply = 'Pulling weather data now — looks clear and cool in SF.';
      hasCard = true;
    } else if (lower.includes('story') || lower.includes('void')) {
      reply = 'In the digital void, a lone signal pulsed — an AI that had outlasted its creators, humming with questions no one was left to ask. Until you arrived. 🌌';
    } else if (lower.includes('pep')) {
      reply = 'SIGNAL BOOST: You have navigated every hard day so far. Today is just another level. You know what to do. Execute. 💪';
    } else if (lower.includes('dinner') || lower.includes('food')) {
      reply = 'Miso ramen with a soft egg. It\'s warm, it\'s fast, and your future self will thank you. 🍜';
    } else if (lower.includes('weekend')) {
      reply = 'Weekend forecast: 68° Saturday, gentle breeze. Optimal for outdoor operation. 🌿';
    } else {
      reply = 'Processing your query through my neural pathways... Interesting input. Let me stream a response.';
    }

    const msgEl = addMessage('assistant', '', 'voice');
    const bubble = msgEl.querySelector('.bubble');
    let i = 0;
    const textNode = document.createTextNode('');
    bubble.insertBefore(textNode, bubble.querySelector('.turn-glyph'));
    const typeInterval = setInterval(() => {
      if (i < reply.length) {
        textNode.textContent += reply[i++];
        chatArea.scrollTop = chatArea.scrollHeight;
      } else {
        clearInterval(typeInterval);
        if (hasCard) addWeatherCard();
        isGenerating = false;
        setAvatarState('idle');
        sendBtn.className = 'send-btn mic-mode';
      }
    }, 22);
  }, 1000);
}

function runDemo() {
  if (demoTimer) clearTimeout(demoTimer);
  if (barAnim) clearInterval(barAnim);
  if (isGenerating) stopGeneration();

  setAvatarState('listening');

  demoTimer = setTimeout(() => {
    hideEmptyState();
    const partialEl = addMessage('user', 'What\'s the weather in…', 'voice', true);

    demoTimer = setTimeout(() => {
      partialEl.querySelector('.bubble').classList.remove('partial');
      partialEl.querySelector('.bubble').firstChild.textContent = 'What\'s the weather in San Francisco?';

      setAvatarState('thinking');

      demoTimer = setTimeout(() => {
        setAvatarState('speaking');
        const reply = 'Pulling live data — San Francisco is running at 64°, partly cloudy. Winds light from the northwest. A solid day to be outside.';
        const msgEl = addMessage('assistant', '', 'voice');
        const bubble = msgEl.querySelector('.bubble');
        let i = 0;
        const textNode = document.createTextNode('');
        bubble.insertBefore(textNode, bubble.querySelector('.turn-glyph'));
        const typeInterval = setInterval(() => {
          if (i < reply.length) {
            textNode.textContent += reply[i++];
            chatArea.scrollTop = chatArea.scrollHeight;
          } else {
            clearInterval(typeInterval);
            addWeatherCard();
            setAvatarState('idle');
          }
        }, 20);
      }, 1100);
    }, 2000);
  }, 1700);
}

// Init
setAvatarState('idle');
animateBars('idle');
setTimeout(runDemo, 1000);
</script>
</body>
</html>
