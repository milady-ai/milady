<!-- concept-D02-L1 | direction: Full-Screen Avatar + Floating Captions | look: Soft Aurora Glass | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D02 · Full-Screen Avatar + Floating Captions · Soft Aurora Glass</title>
<style>
:root {
  --bg:#EAF0FB;
  --bg-aurora:radial-gradient(120% 90% at 18% 12%,#F3E9FB 0%,transparent 55%),radial-gradient(120% 90% at 82% 88%,#E6F7F4 0%,transparent 55%),linear-gradient(160deg,#EAF0FB,#EFEAFB);
  --surface:rgba(255,255,255,0.55);
  --surface-2:rgba(255,255,255,0.72);
  --border:rgba(255,255,255,0.65);
  --text:#1B2233;
  --text-muted:#5A6582;
  --accent:#6E8BFF;
  --accent-2:#9C6CF0;
  --accent-3:#5FE3C0;
  --danger:#FF6B8B;
  --radius:22px;
  --radius-sm:14px;
  --font:"SF Pro Display","Segoe UI Variable","Helvetica Neue",system-ui,sans-serif;
  --shadow:0 12px 40px rgba(80,90,160,0.18);
  --shadow-sm:0 4px 16px rgba(80,90,160,0.12);
  --blur:saturate(1.4) blur(24px);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg-aurora), var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Animated aurora background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(110,139,255,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 80% 70%, rgba(156,108,240,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 70% at 50% 50%, rgba(95,227,192,0.10) 0%, transparent 60%);
  animation: auroraShift 30s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}

@keyframes auroraShift {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  33% { transform: scale(1.05) rotate(2deg); opacity: 0.85; }
  66% { transform: scale(0.97) rotate(-1deg); opacity: 0.95; }
}

.app-frame {
  width: 420px;
  height: 760px;
  position: relative;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 40px 80px rgba(80,90,160,0.25), 0 0 0 1px rgba(255,255,255,0.5);
  background: var(--bg-aurora), var(--bg);
  display: flex;
  flex-direction: column;
  z-index: 1;
}

/* Avatar canvas fills entire frame */
.avatar-stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 400ms var(--ease);
  z-index: 1;
}

.avatar-stage.feed-active {
  transform: scale(0.45) translate(-90px, 80px);
}

/* The orb itself */
.orb {
  width: 240px;
  height: 240px;
  position: relative;
  border-radius: 50%;
  transition: all 400ms var(--ease);
}

.orb-core {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #a8bdff 0%, #8b9fff 20%, #7B6CF0 50%, #9C6CF0 75%, #5FE3C0 100%);
  box-shadow:
    0 0 60px rgba(110,139,255,0.5),
    0 0 120px rgba(156,108,240,0.3),
    inset 0 0 40px rgba(255,255,255,0.2);
  animation: idlePulse 4s ease-in-out infinite;
  position: relative;
  overflow: hidden;
}

/* Specular highlight */
.orb-core::before {
  content: '';
  position: absolute;
  width: 40%;
  height: 30%;
  top: 12%;
  left: 15%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.7) 0%, transparent 70%);
  border-radius: 50%;
}

/* Halo ring */
.orb-halo {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  border: 2px solid rgba(110,139,255,0.3);
  box-shadow: 0 0 30px rgba(110,139,255,0.2);
  animation: haloIdle 4s ease-in-out infinite;
}

.orb-halo-2 {
  position: absolute;
  inset: -35px;
  border-radius: 50%;
  border: 1px solid rgba(156,108,240,0.15);
  animation: haloIdle2 5s ease-in-out infinite;
}

@keyframes idlePulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(110,139,255,0.5), 0 0 120px rgba(156,108,240,0.3), inset 0 0 40px rgba(255,255,255,0.2); }
  50% { transform: scale(1.04); box-shadow: 0 0 80px rgba(110,139,255,0.6), 0 0 140px rgba(156,108,240,0.35), inset 0 0 50px rgba(255,255,255,0.25); }
}

@keyframes haloIdle {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.08); opacity: 1; }
}

@keyframes haloIdle2 {
  0%, 100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(1.12); opacity: 0.6; }
}

/* Listening state */
.orb-core.listening {
  animation: none;
}

/* Speaking state */
.orb-core.speaking {
  animation: speakPulse 0.6s ease-in-out infinite;
}

@keyframes speakPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 80px rgba(110,139,255,0.7), 0 0 160px rgba(156,108,240,0.4), inset 0 0 60px rgba(255,255,255,0.3); }
  50% { transform: scale(1.06); box-shadow: 0 0 100px rgba(110,139,255,0.8), 0 0 180px rgba(156,108,240,0.5), inset 0 0 70px rgba(255,255,255,0.35); }
}

/* Thinking state */
.orb-core.thinking {
  animation: thinkHue 3s linear infinite;
}

@keyframes thinkHue {
  0% { filter: hue-rotate(0deg) brightness(1); }
  50% { filter: hue-rotate(40deg) brightness(1.1); }
  100% { filter: hue-rotate(0deg) brightness(1); }
}

/* Caption box - floats in middle for audio-only, top when feed active */
.caption-box {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 340px;
  background: var(--surface);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 18px;
  transition: all 400ms var(--ease);
  z-index: 10;
  top: 50%;
  margin-top: -60px;
}

.caption-box.feed-active {
  top: 60px;
  margin-top: 0;
}

.caption-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.caption-text {
  font-size: 15px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.5;
  min-height: 60px;
}

/* Inline attachment preview inside the live caption (user turn) */
.caption-attachment {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding: 6px 10px 6px 6px;
  background: linear-gradient(135deg, rgba(110,139,255,0.16), rgba(156,108,240,0.12));
  border: 1px solid rgba(110,139,255,0.3);
  border-radius: var(--radius-sm);
  width: fit-content;
}

.caption-attachment.visible { display: flex; }

.caption-attachment .att-thumb {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.caption-attachment .att-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
}

/* Inline app-card surfaced live below the caption */
.caption-card {
  display: none;
  margin-top: 12px;
  animation: cardRise 360ms var(--ease) both;
}

.caption-card.visible { display: block; }

@keyframes cardRise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Suggestion chips */
.chips-area {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 360px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  z-index: 10;
  transition: all 400ms var(--ease);
  bottom: 140px;
}

.chips-area.feed-active {
  bottom: 140px;
}

.chip {
  background: var(--surface-2);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 14px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  transition: all 240ms var(--ease);
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
}

.chip:hover {
  background: rgba(110,139,255,0.15);
  border-color: rgba(110,139,255,0.4);
  transform: translateY(-1px);
}

.chip.dismiss {
  opacity: 0;
  transform: scale(0.8);
  pointer-events: none;
}

/* Listening indicator */
.listen-indicator {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-2);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(110,139,255,0.3);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  opacity: 0;
  transition: opacity 300ms var(--ease);
  z-index: 20;
  box-shadow: 0 0 20px rgba(110,139,255,0.2);
}

.listen-indicator.visible {
  opacity: 1;
}

.listen-indicator.muted {
  color: var(--danger);
  border-color: rgba(255,107,139,0.3);
  box-shadow: 0 0 20px rgba(255,107,139,0.2);
}

.mic-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: blink 1s ease-in-out infinite;
}

.listen-indicator.muted .mic-dot {
  background: var(--danger);
  animation: none;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Muted banner */
.muted-banner {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,107,139,0.15);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,107,139,0.3);
  border-radius: var(--radius-sm);
  padding: 6px 14px;
  font-size: 12px;
  color: var(--danger);
  font-weight: 500;
  display: none;
  z-index: 20;
}

.muted-banner.visible {
  display: block;
}

/* Bottom controls */
.controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px 24px 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: linear-gradient(to top, rgba(234,240,251,0.9) 0%, transparent 100%);
  backdrop-filter: blur(10px);
  z-index: 15;
}

.ctrl-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface-2);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 240ms var(--ease);
  box-shadow: var(--shadow-sm);
  font-size: 20px;
  color: var(--text);
  outline: none;
}

.ctrl-btn:hover {
  transform: scale(1.08);
  box-shadow: var(--shadow);
}

.ctrl-btn.active {
  background: rgba(110,139,255,0.2);
  border-color: rgba(110,139,255,0.5);
  color: var(--accent);
}

.ctrl-btn.muted-btn {
  background: rgba(255,107,139,0.15);
  border-color: rgba(255,107,139,0.4);
  color: var(--danger);
}

.ctrl-btn.end-btn {
  background: rgba(255,107,139,0.12);
  border-color: rgba(255,107,139,0.3);
  color: var(--danger);
}

/* Main voice/mic button */
.mic-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 2px solid rgba(110,139,255,0.5);
  background: linear-gradient(135deg, rgba(110,139,255,0.3), rgba(156,108,240,0.3));
  backdrop-filter: blur(20px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 300ms var(--ease);
  box-shadow: 0 0 30px rgba(110,139,255,0.4), var(--shadow);
  position: relative;
  font-size: 24px;
  outline: none;
}

.mic-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 40px rgba(110,139,255,0.5), var(--shadow);
}

.mic-btn.listening {
  border-color: var(--accent);
  box-shadow: 0 0 40px rgba(110,139,255,0.6), 0 0 80px rgba(110,139,255,0.3);
  background: linear-gradient(135deg, rgba(110,139,255,0.5), rgba(156,108,240,0.4));
}

.mic-btn.stop-btn {
  background: linear-gradient(135deg, rgba(255,107,139,0.3), rgba(255,107,139,0.2));
  border-color: rgba(255,107,139,0.5);
  box-shadow: 0 0 30px rgba(255,107,139,0.3);
}

/* Composer overlay */
.composer-overlay {
  position: absolute;
  bottom: 90px;
  left: 24px;
  right: 24px;
  background: var(--surface-2);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px 16px;
  display: none;
  gap: 10px;
  align-items: flex-end;
  z-index: 20;
  transition: all 300ms var(--ease);
}

.composer-overlay.visible {
  display: flex;
}

.composer-overlay textarea {
  flex: 1;
  border: none;
  background: transparent;
  font-family: var(--font);
  font-size: 15px;
  color: var(--text);
  resize: none;
  outline: none;
  line-height: 1.4;
  max-height: 100px;
  min-height: 36px;
}

.composer-overlay textarea::placeholder {
  color: var(--text-muted);
}

.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 200ms var(--ease);
  flex-shrink: 0;
  font-size: 16px;
}

.send-btn:hover { transform: scale(1.1); }
.send-btn.mic-mode { background: transparent; border: 1.5px solid rgba(110,139,255,0.4); color: var(--accent); }
.send-btn.send-mode { background: var(--accent); color: white; }
.send-btn.stop-mode { background: rgba(255,107,139,0.2); border: 1.5px solid var(--danger); color: var(--danger); }

/* Chat log / transcript (shown at session end) */
.transcript-panel {
  position: absolute;
  inset: 0;
  background: var(--surface-2);
  backdrop-filter: var(--blur);
  border-radius: 40px;
  overflow-y: auto;
  padding: 20px 16px 100px;
  z-index: 30;
  display: none;
  flex-direction: column;
  gap: 12px;
}

.transcript-panel.visible {
  display: flex;
}

.transcript-header {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-align: center;
  padding: 8px 0 4px;
  border-bottom: 1px solid rgba(90,101,130,0.15);
  margin-bottom: 8px;
}

.turn {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.turn.user { align-items: flex-end; }
.turn.assistant { align-items: flex-start; }

.turn-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-muted);
}

.turn-bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.turn.user .turn-bubble {
  background: linear-gradient(135deg, rgba(110,139,255,0.2), rgba(156,108,240,0.15));
  border-color: rgba(110,139,255,0.3);
}

.turn-bubble.partial {
  opacity: 0.5;
  font-style: italic;
}

/* Attachment thumbnail inside a transcript user turn */
.turn-attachment {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 80%;
  margin-top: 2px;
  padding: 6px 12px 6px 6px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(110,139,255,0.18), rgba(156,108,240,0.12));
  border: 1px solid rgba(110,139,255,0.3);
}

.turn-attachment .att-thumb {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.turn-attachment .att-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
}

.turn-bubble.interrupted {
  position: relative;
}

.turn-bubble.interrupted::after {
  content: '↩ interrupted';
  font-size: 10px;
  color: var(--accent-2);
  margin-left: 6px;
}

/* App card */
.app-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow-sm);
  max-width: 90%;
}

.app-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.app-icon {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.weather-display {
  text-align: center;
  padding: 8px 0;
}

.weather-temp {
  font-size: 36px;
  font-weight: 300;
  color: var(--text);
}

.weather-cond {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 2px;
}

.weather-row {
  display: flex;
  justify-content: space-around;
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-muted);
}

.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.card-btn {
  flex: 1;
  padding: 8px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(110,139,255,0.3);
  background: rgba(110,139,255,0.1);
  color: var(--accent);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  transition: all 200ms var(--ease);
}

.card-btn:hover { background: rgba(110,139,255,0.2); }

/* Attach chip */
.attach-chips {
  position: absolute;
  bottom: 160px;
  left: 24px;
  right: 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  z-index: 20;
  pointer-events: none;
}

.attach-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-size: 12px;
  color: var(--text);
  backdrop-filter: blur(12px);
  pointer-events: all;
}

.attach-chip button {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0;
}

/* Play demo button */
.demo-btn {
  position: absolute;
  top: 18px;
  right: 18px;
  background: var(--surface-2);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 13px;
  font-size: 12px;
  font-family: var(--font);
  color: var(--accent);
  cursor: pointer;
  z-index: 25;
  box-shadow: var(--shadow-sm);
  transition: all 200ms var(--ease);
  font-weight: 500;
}

.demo-btn:hover { transform: scale(1.05); box-shadow: var(--shadow); }

/* Keyboard toggle */
.kbd-btn {
  position: absolute;
  bottom: 100px;
  right: 24px;
  background: var(--surface);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 20;
  font-size: 16px;
  box-shadow: var(--shadow-sm);
  transition: all 200ms var(--ease);
}

/* Waveform bars for listening */
.waveform-bars {
  position: absolute;
  bottom: -30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 3px;
  align-items: flex-end;
  height: 24px;
  opacity: 0;
  transition: opacity 300ms var(--ease);
}

.waveform-bars.visible { opacity: 1; }

.bar {
  width: 3px;
  background: var(--accent);
  border-radius: 2px;
  min-height: 3px;
  transition: height 80ms ease;
}

/* Feed placeholder */
.feed-window {
  position: absolute;
  top: 60px;
  right: 16px;
  width: 180px;
  height: 120px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
  backdrop-filter: blur(8px);
  display: none;
  overflow: hidden;
  z-index: 12;
  box-shadow: var(--shadow);
}

.feed-window.visible { display: block; }

.feed-label {
  position: absolute;
  top: 6px;
  left: 8px;
  font-size: 10px;
  color: white;
  font-weight: 600;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

.feed-dots {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  opacity: 0.3;
}

/* Sharing indicator */
.sharing-badge {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(95,227,192,0.2);
  border: 1px solid rgba(95,227,192,0.4);
  border-radius: 10px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--accent-3);
  font-weight: 600;
  display: none;
  z-index: 20;
  backdrop-filter: blur(10px);
  animation: sharingPulse 2s ease-in-out infinite;
}

.sharing-badge.visible { display: block; }

@keyframes sharingPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* State label in orb */
.state-label {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: all 300ms var(--ease);
  white-space: nowrap;
}

@media (min-width: 600px) {
  .app-frame {
    width: 420px;
    height: 760px;
  }
  body {
    background-attachment: fixed;
  }
}

@media (max-width: 440px) {
  .app-frame {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
  }
}
</style>
</head>
<body>
<div class="app-frame" id="appFrame">
  <!-- Play Demo Button -->
  <button class="demo-btn" id="demoBtn">▶ Play demo</button>

  <!-- Sharing indicator -->
  <div class="sharing-badge" id="sharingBadge">⬤ Sharing screen</div>

  <!-- Listening indicator -->
  <div class="listen-indicator" id="listenIndicator">
    <div class="mic-dot"></div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
    <span id="listenText">Listening…</span>
  </div>

  <!-- Muted warning banner -->
  <div class="muted-banner" id="mutedBanner">🔇 Mic muted — camera still streaming</div>

  <!-- Avatar Stage -->
  <div class="avatar-stage" id="avatarStage">
    <div class="orb" id="orb">
      <div class="orb-core" id="orbCore"></div>
      <div class="orb-halo"></div>
      <div class="orb-halo-2"></div>
      <!-- Waveform bars for listening -->
      <div class="waveform-bars" id="waveformBars">
        <div class="bar" id="b1" style="height:4px"></div>
        <div class="bar" id="b2" style="height:4px"></div>
        <div class="bar" id="b3" style="height:4px"></div>
        <div class="bar" id="b4" style="height:4px"></div>
        <div class="bar" id="b5" style="height:4px"></div>
        <div class="bar" id="b6" style="height:4px"></div>
        <div class="bar" id="b7" style="height:4px"></div>
      </div>
    </div>
    <div class="state-label" id="stateLabel">Ready</div>
  </div>

  <!-- Screen feed window -->
  <div class="feed-window" id="feedWindow">
    <div class="feed-label">Your screen</div>
    <div class="feed-dots">🖥</div>
  </div>

  <!-- Caption Box -->
  <div class="caption-box" id="captionBox">
    <div class="caption-label">Eliza</div>
    <div class="caption-text" id="captionText">Hi! I'm here and ready to chat. What's on your mind?</div>
    <div class="caption-attachment" id="captionAttachment"></div>
    <div class="caption-card" id="captionCard"></div>
  </div>

  <!-- Suggestion chips -->
  <div class="chips-area" id="chipsArea">
    <div class="chip" onclick="useChip(this, 'What can you help me with?')">What can you help me with?</div>
    <div class="chip" onclick="useChip(this, 'Tell me today\'s weather')">Today's weather 🌤</div>
    <div class="chip" onclick="useChip(this, 'Help me write something')">Help me write something</div>
  </div>

  <!-- Attach chips above controls -->
  <div class="attach-chips" id="attachChips"></div>

  <!-- Keyboard toggle -->
  <button class="kbd-btn" id="kbdBtn" title="Open keyboard">⌨️</button>

  <!-- Composer overlay -->
  <div class="composer-overlay" id="composerOverlay">
    <textarea id="composerInput" rows="1" placeholder="Type a message…"></textarea>
    <button class="send-btn mic-mode" id="sendBtn" title="Send or record">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
  </div>

  <!-- Bottom controls -->
  <div class="controls">
    <button class="ctrl-btn" id="muteBtn" title="Mute mic" onclick="toggleMute()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="cameraBtn" title="Camera" onclick="toggleFeed('camera')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M15 8v8H5V8h10m1-2H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4V7c0-.55-.45-1-1-1z"/>
      </svg>
    </button>
    <button class="mic-btn" id="mainMicBtn" onclick="toggleVoice()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="mainMicIcon">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="screenBtn" title="Share screen" onclick="toggleFeed('screen')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h3l-1 1v1h12v-1l-1-1h3c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 13H4V5h16v11z"/>
      </svg>
    </button>
    <button class="ctrl-btn end-btn" title="End session" onclick="endSession()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="attachBtn" title="Attach" onclick="addAttachment()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
      </svg>
    </button>
  </div>

  <!-- Transcript panel (shown on session end) -->
  <div class="transcript-panel" id="transcriptPanel">
    <div class="transcript-header">Session Transcript</div>
    <!-- Populated by JS -->
  </div>
</div>

<script>
// ===== STATE =====
let state = 'idle'; // idle | listening | thinking | speaking
let isMuted = false;
let feedActive = false;
let feedType = null;
let composerVisible = false;
let demoTimers = [];
let amplitude = 0;
let animFrame = null;
let sessionLog = [];
let isGenerating = false;
let pendingAttachments = [];

// DOM refs
const orbCore = document.getElementById('orbCore');
const orbEl = document.getElementById('orb');
const avatarStage = document.getElementById('avatarStage');
const captionBox = document.getElementById('captionBox');
const captionText = document.getElementById('captionText');
const listenIndicator = document.getElementById('listenIndicator');
const listenText = document.getElementById('listenText');
const mutedBanner = document.getElementById('mutedBanner');
const chipsArea = document.getElementById('chipsArea');
const composerOverlay = document.getElementById('composerOverlay');
const composerInput = document.getElementById('composerInput');
const sendBtn = document.getElementById('sendBtn');
const mainMicBtn = document.getElementById('mainMicBtn');
const muteBtn = document.getElementById('muteBtn');
const feedWindow = document.getElementById('feedWindow');
const sharingBadge = document.getElementById('sharingBadge');
const transcriptPanel = document.getElementById('transcriptPanel');
const attachChips = document.getElementById('attachChips');
const captionAttachment = document.getElementById('captionAttachment');
const captionCard = document.getElementById('captionCard');
const stateLabel = document.getElementById('stateLabel');
const waveformBars = document.getElementById('waveformBars');
const bars = [document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3'),document.getElementById('b4'),document.getElementById('b5'),document.getElementById('b6'),document.getElementById('b7')];

// ===== AMPLITUDE ANIMATION =====
let ampPhase = 0;
let targetAmp = 0;
let currentAmp = 0;

function animateBars() {
  if (state === 'listening' && !isMuted) {
    ampPhase += 0.12;
    targetAmp = 0.3 + 0.7 * Math.abs(Math.sin(ampPhase * 1.3) * Math.cos(ampPhase * 0.7) + 0.3 * Math.random());
    currentAmp += (targetAmp - currentAmp) * 0.15;
    bars.forEach((b, i) => {
      const h = 3 + currentAmp * 20 * (0.4 + 0.6 * Math.abs(Math.sin(ampPhase + i * 0.8)));
      b.style.height = h + 'px';
      b.style.opacity = 0.5 + currentAmp * 0.5;
    });
    // Scale orb with amplitude
    const scl = 1 + currentAmp * 0.08;
    orbEl.style.transform = `scale(${scl})`;
    orbEl.style.filter = `drop-shadow(0 0 ${20 + currentAmp * 40}px rgba(110,139,255,${0.4 + currentAmp * 0.4}))`;
  } else if (state === 'speaking') {
    ampPhase += 0.08;
    const spk = 0.5 + 0.5 * Math.abs(Math.sin(ampPhase * 2.1 + Math.sin(ampPhase * 0.5) * 0.8));
    const scl = 1 + spk * 0.05;
    orbEl.style.transform = `scale(${scl})`;
    orbEl.style.filter = `drop-shadow(0 0 ${40 + spk * 30}px rgba(110,139,255,${0.5 + spk * 0.3}))`;
  } else {
    orbEl.style.transform = '';
    orbEl.style.filter = '';
  }
  animFrame = requestAnimationFrame(animateBars);
}
animateBars();

// ===== STATE MACHINE =====
function setState(s) {
  state = s;
  orbCore.className = 'orb-core ' + s;
  stateLabel.textContent = {idle:'Ready', listening:'Listening', thinking:'Thinking…', speaking:'Speaking'}[s] || s;

  // Listen indicator
  if (s === 'listening' && !isMuted) {
    listenIndicator.classList.add('visible');
    listenIndicator.classList.remove('muted');
    listenText.textContent = 'Listening…';
    waveformBars.classList.add('visible');
  } else if (s === 'listening' && isMuted) {
    listenIndicator.classList.add('visible','muted');
    listenText.textContent = 'Muted';
    waveformBars.classList.remove('visible');
  } else {
    listenIndicator.classList.remove('visible','muted');
    waveformBars.classList.remove('visible');
  }
}

// ===== TOGGLE VOICE =====
function toggleVoice() {
  if (demoTimers.length) { clearDemoTimers(); setState('idle'); return; }
  if (state === 'idle') {
    runDemoOnce();
  }
}

// ===== MUTE =====
function toggleMute() {
  isMuted = !isMuted;
  muteBtn.classList.toggle('muted-btn', isMuted);
  mutedBanner.classList.toggle('visible', isMuted && feedActive);
  // Avatar freezes on mute
  if (isMuted) {
    orbCore.style.animationPlayState = 'paused';
    muteBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.34 3 3 3 .23 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c.57-.08 1.12-.24 1.64-.46L19.73 21 21 19.73 4.27 3z"/></svg>`;
    muteBtn.style.color = 'var(--danger)';
    if (state === 'listening') {
      listenIndicator.classList.add('visible','muted');
      listenText.textContent = 'Muted';
      waveformBars.classList.remove('visible');
    }
  } else {
    orbCore.style.animationPlayState = '';
    muteBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;
    muteBtn.style.color = '';
    mutedBanner.classList.remove('visible');
    if (state === 'listening') setState('listening');
  }
}

// ===== FEED TOGGLE =====
function toggleFeed(type) {
  if (feedActive && feedType === type) {
    // Turn off
    feedActive = false;
    feedType = null;
    feedWindow.classList.remove('visible');
    avatarStage.classList.remove('feed-active');
    captionBox.classList.remove('feed-active');
    sharingBadge.classList.remove('visible');
    // Update chips
    updateChips('idle');
    // Restore screen btn
    document.getElementById('screenBtn').classList.remove('active');
    document.getElementById('cameraBtn').classList.remove('active');
  } else {
    feedActive = true;
    feedType = type;
    feedWindow.classList.add('visible');
    feedWindow.querySelector('.feed-label').textContent = type === 'camera' ? 'Camera' : 'Your screen';
    feedWindow.querySelector('.feed-dots').textContent = type === 'camera' ? '📷' : '🖥';
    avatarStage.classList.add('feed-active');
    captionBox.classList.add('feed-active');
    if (type === 'screen') sharingBadge.classList.add('visible');
    // Update chips
    updateChips('feed');
    if (type === 'screen') {
      document.getElementById('screenBtn').classList.add('active');
      document.getElementById('cameraBtn').classList.remove('active');
      mutedBanner.classList.toggle('visible', isMuted);
    } else {
      document.getElementById('cameraBtn').classList.add('active');
      document.getElementById('screenBtn').classList.remove('active');
    }
  }
}

function updateChips(mode) {
  if (mode === 'feed') {
    chipsArea.innerHTML = `
      <div class="chip" onclick="useChip(this,'Ask about screen')">Ask about screen</div>
      <div class="chip" onclick="useChip(this,'Summarise what I see')">Summarise what I see</div>
    `;
  } else {
    chipsArea.innerHTML = `
      <div class="chip" onclick="useChip(this,'What can you help me with?')">What can you help me with?</div>
      <div class="chip" onclick="useChip(this,'Tell me today\'s weather')">Today's weather 🌤</div>
      <div class="chip" onclick="useChip(this,'Help me write something')">Help me write something</div>
    `;
  }
}

// ===== CHIPS =====
function useChip(el, text) {
  el.classList.add('dismiss');
  setTimeout(() => {
    composerInput.value = text;
    updateSendBtn();
    sendMessage();
  }, 200);
}

// ===== COMPOSER =====
document.getElementById('kbdBtn').onclick = () => {
  composerVisible = !composerVisible;
  composerOverlay.classList.toggle('visible', composerVisible);
  if (composerVisible) composerInput.focus();
};

composerInput.addEventListener('input', updateSendBtn);
composerInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function updateSendBtn() {
  const val = composerInput.value.trim();
  if (isGenerating) {
    sendBtn.className = 'send-btn stop-mode';
    sendBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
  } else if (val.length > 0) {
    sendBtn.className = 'send-btn send-mode';
    sendBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;
  } else {
    sendBtn.className = 'send-btn mic-mode';
    sendBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;
  }
}

sendBtn.onclick = () => {
  if (isGenerating) { stopGeneration(); return; }
  sendMessage();
};

function sendMessage() {
  const val = composerInput.value.trim();
  const attachments = pendingAttachments.slice();
  if (!val && attachments.length === 0) return;
  const userText = val || (attachments.length === 1 ? 'Sent an attachment' : 'Sent ' + attachments.length + ' attachments');
  sessionLog.push({ role:'user', text:userText, modality:'typed', attachments });
  // Reflect the sent user turn (text + attachment) in the live caption
  showUserCaption(userText, attachments);
  composerInput.value = '';
  pendingAttachments = [];
  renderAttachChips();
  updateSendBtn();
  // Show thinking, then respond
  isGenerating = true;
  setState('thinking');
  captionText.textContent = '…';
  // Pick a response
  const responses = [
    { text:"Sure! San Francisco is looking partly cloudy today, around 64°F with a light breeze from the west.", hasCard:true },
    { text:"Of course, I'd be happy to help you write. What kind of content are you working on?", hasCard:false },
    { text:"I can help with coding, writing, research, analysis, planning — pretty much anything. Just ask!", hasCard:false },
    { text:"Great question! Let me pull up the details for you right away.", hasCard:false },
  ];
  const resp = responses[Math.floor(Math.random() * responses.length)];
  const delay = 1200 + Math.random() * 600;
  setTimeout(() => {
    if (!isGenerating) return;
    setState('speaking');
    clearCaptionExtras();
    streamCaption(resp.text, () => {
      isGenerating = false;
      updateSendBtn();
      setState('idle');
      if (resp.hasCard) showInlineCard();
      sessionLog.push({ role:'assistant', text:resp.text, modality:'text', hasCard:resp.hasCard });
      // Add in-context chip after reply
      addFollowUpChip();
    });
  }, delay);
}

// Show the user's just-sent turn (text + any attachment) in the live caption
function showUserCaption(text, attachments) {
  captionBox.querySelector('.caption-label').textContent = 'You';
  captionText.textContent = text;
  captionCard.classList.remove('visible');
  captionCard.innerHTML = '';
  if (attachments && attachments.length) {
    const att = attachments[0];
    captionAttachment.innerHTML = '';
    const thumb = document.createElement('div');
    thumb.className = 'att-thumb';
    thumb.textContent = att.icon;
    const name = document.createElement('span');
    name.className = 'att-name';
    name.textContent = attachments.length === 1 ? att.name : att.name + ' +' + (attachments.length - 1);
    captionAttachment.append(thumb, name);
    captionAttachment.classList.add('visible');
  } else {
    captionAttachment.classList.remove('visible');
  }
}

function clearCaptionExtras() {
  captionBox.querySelector('.caption-label').textContent = 'Eliza';
  captionAttachment.classList.remove('visible');
  captionAttachment.innerHTML = '';
}

// Surface an inline weather app-card live in the caption flow
function showInlineCard() {
  captionCard.innerHTML = '';
  captionCard.appendChild(buildWeatherCard());
  captionCard.classList.add('visible');
}

function addFollowUpChip() {
  const existing = chipsArea.querySelectorAll('.chip');
  const fc = document.createElement('div');
  fc.className = 'chip';
  fc.style.background = 'rgba(110,139,255,0.12)';
  fc.style.borderColor = 'rgba(110,139,255,0.3)';
  fc.textContent = 'Tell me more';
  fc.onclick = () => useChip(fc, 'Tell me more about that');
  chipsArea.appendChild(fc);
}

function stopGeneration() {
  isGenerating = false;
  setState('idle');
  updateSendBtn();
  captionText.textContent = 'Stopped.';
}

function streamCaption(text, onDone) {
  captionText.textContent = '';
  let i = 0;
  const words = text.split(' ');
  function next() {
    if (!isGenerating && onDone) { onDone(); return; }
    if (i >= words.length) { if (onDone) setTimeout(onDone, 300); return; }
    captionText.textContent += (i > 0 ? ' ' : '') + words[i++];
    setTimeout(next, 80 + Math.random() * 60);
  }
  next();
}

// ===== ATTACHMENT =====
const MOCK_ATTACHMENTS = [
  { icon:'📷', name:'photo.jpg' },
  { icon:'📄', name:'notes.pdf' },
  { icon:'🖼', name:'screenshot.png' },
];

function addAttachment() {
  const att = MOCK_ATTACHMENTS[pendingAttachments.length % MOCK_ATTACHMENTS.length];
  const id = 'att-' + Date.now() + '-' + pendingAttachments.length;
  pendingAttachments.push({ ...att, id });
  renderAttachChips();
  // Reveal composer so the staged attachment reads as part of the next message
  if (!composerVisible) {
    composerVisible = true;
    composerOverlay.classList.add('visible');
  }
  composerInput.focus();
}

function removeAttachment(id) {
  pendingAttachments = pendingAttachments.filter(a => a.id !== id);
  renderAttachChips();
}

function renderAttachChips() {
  attachChips.innerHTML = '';
  pendingAttachments.forEach(att => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    const icon = document.createElement('span');
    icon.textContent = att.icon;
    const name = document.createElement('span');
    name.textContent = att.name;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.title = 'Remove attachment';
    btn.onclick = () => removeAttachment(att.id);
    chip.append(icon, name, btn);
    attachChips.appendChild(chip);
  });
}

// ===== END SESSION =====
function endSession() {
  clearDemoTimers();
  setState('idle');
  // Show transcript
  transcriptPanel.classList.add('visible');
  renderTranscript();
}

function renderTranscript() {
  transcriptPanel.innerHTML = '<div class="transcript-header">Session Transcript</div>';
  if (sessionLog.length === 0) {
    // Demo log
    sessionLog = [
      { role:'user', text:"What's the weather today?", modality:'voice' },
      { role:'assistant', text:'San Francisco is partly cloudy, around 64°F with a light westerly breeze — perfect for a walk!', modality:'text', hasCard:true },
      { role:'user', text:'Does this outfit work for that?', modality:'typed', attachments:[{ icon:'📷', name:'photo.jpg', id:'demo-att' }] },
      { role:'assistant', text:'That looks great for mild weather — maybe bring a light layer for the evening breeze.', modality:'text' },
      { role:'user', text:'Will it rain this week?', modality:'typed' },
      { role:'assistant', text:'Light showers are expected Thursday and Friday, but the weekend looks clear.', modality:'text', interrupted:true },
    ];
  }
  sessionLog.forEach(turn => {
    const div = document.createElement('div');
    div.className = `turn ${turn.role}`;
    const meta = document.createElement('div');
    meta.className = 'turn-meta';
    if (turn.role === 'user') {
      meta.innerHTML = turn.modality === 'voice'
        ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="color:var(--accent)"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg> You · ${turn.modality}`
        : `⌨ You · typed`;
    } else {
      meta.innerHTML = `✦ Eliza`;
    }
    const bubble = document.createElement('div');
    bubble.className = 'turn-bubble' + (turn.interrupted ? ' interrupted' : '');
    bubble.textContent = turn.text;
    div.appendChild(meta);
    div.appendChild(bubble);
    // Render any attachments sent with this user turn
    if (turn.attachments && turn.attachments.length) {
      turn.attachments.forEach(att => {
        const a = document.createElement('div');
        a.className = 'turn-attachment';
        const thumb = document.createElement('div');
        thumb.className = 'att-thumb';
        thumb.textContent = att.icon;
        const name = document.createElement('span');
        name.className = 'att-name';
        name.textContent = att.name;
        a.append(thumb, name);
        div.appendChild(a);
      });
    }
    if (turn.hasCard) {
      div.appendChild(buildWeatherCard());
    }
    transcriptPanel.appendChild(div);
  });
  // Close button
  const closeBtn = document.createElement('button');
  closeBtn.style.cssText = 'margin:16px auto 0;display:block;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 24px;font-family:var(--font);font-size:14px;color:var(--text);cursor:pointer;';
  closeBtn.textContent = 'Close transcript';
  closeBtn.onclick = () => { transcriptPanel.classList.remove('visible'); sessionLog = []; };
  transcriptPanel.appendChild(closeBtn);
}

function buildWeatherCard() {
  const card = document.createElement('div');
  card.className = 'app-card';
  card.innerHTML = `
    <div class="app-card-header">
      <div class="app-icon">🌤</div>
      Weather · San Francisco
    </div>
    <div class="weather-display">
      <div class="weather-temp">64°F</div>
      <div class="weather-cond">Partly Cloudy</div>
      <div class="weather-row">
        <span>💧 72%</span>
        <span>💨 12 mph W</span>
        <span>🌡 High 68°</span>
      </div>
    </div>
    <div class="card-actions">
      <button class="card-btn">7-day forecast</button>
      <button class="card-btn">Set reminder</button>
    </div>
  `;
  return card;
}

// ===== DEMO CYCLE =====
function clearDemoTimers() {
  demoTimers.forEach(clearTimeout);
  demoTimers = [];
}

function runDemoOnce() {
  clearDemoTimers();
  isGenerating = false;
  clearCaptionExtras();
  captionCard.classList.remove('visible');
  captionCard.innerHTML = '';

  // IDLE
  setState('idle');
  captionText.textContent = 'Hi! I\'m here and ready to chat.';

  const t1 = setTimeout(() => {
    // LISTENING — live mic, waveform reacts to faked amplitude
    setState('listening');
    clearCaptionExtras();
    captionText.textContent = '…';
    sessionLog.push({ role:'user', text:"What's the weather today in San Francisco?", modality:'voice' });
  }, 700);

  const t2 = setTimeout(() => {
    // Show partial transcript in caption
    captionText.textContent = '"What\'s the weather…" ';
  }, 1700);

  const t3 = setTimeout(() => {
    // THINKING
    setState('thinking');
    captionText.textContent = '…';
  }, 2700);

  const t4 = setTimeout(() => {
    // SPEAKING — stream the reply into the caption
    setState('speaking');
    isGenerating = true;
    const reply = "San Francisco is looking lovely today — partly cloudy skies, around 64°F. There's a light westerly breeze, perfect for heading outside!";
    streamCaption(reply, () => {
      isGenerating = false;
      // Surface the weather app-card inline, in the live conversation flow
      showInlineCard();
      sessionLog.push({ role:'assistant', text:reply, modality:'text', hasCard:true });
    });
  }, 3400);

  const t5 = setTimeout(() => {
    // IDLE; add a contextual follow-up chip
    setState('idle');
    const fc = document.createElement('div');
    fc.className = 'chip';
    fc.style.borderColor = 'rgba(110,139,255,0.35)';
    fc.textContent = 'What about the weekend?';
    fc.onclick = () => useChip(fc, 'What about the weekend?');
    chipsArea.appendChild(fc);
  }, 9000);

  const t6 = setTimeout(() => {
    // Barge-in: user speaks again
    setState('listening');
    captionCard.classList.remove('visible');
    captionCard.innerHTML = '';
    captionText.textContent = '"Will it rain this week?" ';
    sessionLog.push({ role:'user', text:'Will it rain this week?', modality:'voice' });
  }, 11000);

  const t7 = setTimeout(() => {
    setState('thinking');
    captionText.textContent = '…';
  }, 12500);

  const t8 = setTimeout(() => {
    setState('speaking');
    isGenerating = true;
    const r2 = "Thursday and Friday have a chance of light showers, but the weekend is looking sunny and clear — great timing for outdoor plans!";
    streamCaption(r2, () => {
      isGenerating = false;
      sessionLog.push({ role:'assistant', text:r2, modality:'text', interrupted:false });
    });
  }, 13800);

  const t9 = setTimeout(() => {
    setState('idle');
    captionText.textContent = 'Let me know if you need anything else!';
    document.getElementById('demoBtn').textContent = '↺ Replay demo';
    isGenerating = false;
  }, 19000);

  demoTimers = [t1,t2,t3,t4,t5,t6,t7,t8,t9];
}

// Let the idle/breathing state settle first, then auto-run the scripted demo.
let autoRunTimer = setTimeout(runDemoOnce, 2200);

// Replay/demo button — cancels the pending auto-run so the two can't race.
document.getElementById('demoBtn').onclick = () => {
  clearTimeout(autoRunTimer);
  transcriptPanel.classList.remove('visible');
  sessionLog = [];
  runDemoOnce();
};
</script>
</body>
</html>
