<!-- concept-D01-L2 | direction: Giant Centered Orb (Voice-First) | look: OLED Neon Cyber | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D01 · Giant Centered Orb (Voice-First) · OLED Neon Cyber</title>
<style>
:root {
  --bg:#000000;
  --surface:#0B0E14;
  --surface-2:#131826;
  --border:rgba(0,229,255,0.28);
  --text:#E8FBFF;
  --text-muted:#6B7A90;
  --accent:#00E5FF;
  --accent-2:#FF3DCB;
  --accent-3:#B6FF3D;
  --danger:#FF2E4D;
  --radius:8px;
  --radius-sm:5px;
  --font:"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono","Cascadia Mono",ui-monospace,monospace;
  --shadow:0 0 0 1px rgba(0,229,255,0.25),0 0 24px rgba(0,229,255,0.35);
  --shadow-sm:0 0 12px rgba(0,229,255,0.25);
  --glow-cyan:0 0 16px rgba(0,229,255,0.6);
  --glow-magenta:0 0 16px rgba(255,61,203,0.6);
  --ease:cubic-bezier(.2,.8,.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  font-family: var(--font);
  background: #050508;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.device {
  width: 420px;
  height: 760px;
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid rgba(0,229,255,0.2);
  box-shadow: 0 0 0 1px rgba(0,229,255,0.12), 0 0 60px rgba(0,229,255,0.12);
  flex-shrink: 0;
}

@media (max-width: 480px) {
  body { background: #000; }
  .device { width:100vw; height:100vh; border-radius:0; border:none; box-shadow:none; }
}
@media (min-width:900px) and (max-height:700px) {
  .device { width:380px; height:640px; border-radius:20px; }
}

/* Scanline shimmer on load */
.scanline {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,229,255,0.015) 3px, rgba(0,229,255,0.015) 4px);
  pointer-events: none;
  z-index: 100;
}

.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Header */
.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 0;
  z-index: 10;
}

.agent-name {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-shadow: var(--glow-cyan);
}

.cc-toggle {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.12s var(--ease);
  user-select: none;
}
.cc-toggle:hover { color: var(--accent); border-color: var(--accent); box-shadow: var(--shadow-sm); }
.cc-toggle.active { color: var(--accent); border-color: var(--accent); box-shadow: var(--shadow-sm); }
.cc-toggle svg { width: 12px; height: 12px; }

/* Orb stage */
.orb-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
}

/* Listening indicator */
.listening-indicator {
  position: absolute;
  top: 58px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  z-index: 30;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transition: opacity 0.15s var(--ease);
  pointer-events: none;
  text-shadow: var(--glow-cyan);
}
.listening-indicator.visible { opacity: 1; }
.listening-indicator.muted { color: var(--danger); border-color: rgba(255,46,77,0.4); box-shadow: 0 0 12px rgba(255,46,77,0.25); text-shadow: 0 0 8px rgba(255,46,77,0.6); }
.listening-indicator svg { width: 12px; height: 12px; }
.blink { animation: blink 1.1s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.45} }

/* THE ORB — particle/bar field */
.orb-wrapper {
  position: relative;
  width: 220px;
  height: 220px;
  cursor: pointer;
}

/* Canvas for the particle/waveform orb */
#orbCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
}

/* Outer glow ring */
.orb-ring {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.3);
  box-shadow: 0 0 24px rgba(0,229,255,0.2), inset 0 0 24px rgba(0,229,255,0.05);
  pointer-events: none;
}
.orb-ring-2 {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.12);
  pointer-events: none;
}

/* Ripple rings for listening */
.ripple-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.4);
  animation: none;
  opacity: 0;
  pointer-events: none;
}
.orb-wrapper.listening .ripple-ring {
  animation: cyberRipple 1.2s ease-out infinite;
  box-shadow: 0 0 10px rgba(0,229,255,0.3);
}
.orb-wrapper.listening .ripple-ring:nth-child(2) { animation-delay: 0.4s; }
.orb-wrapper.listening .ripple-ring:nth-child(3) { animation-delay: 0.8s; }
@keyframes cyberRipple {
  0% { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(1.9); opacity: 0; }
}

/* Caption */
.caption-area {
  height: 56px;
  width: 88%;
  margin-top: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s;
}
.caption-area.visible { opacity: 1; }
.caption-text {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.5;
}
.caption-text .word { opacity: 0.35; display: inline; }
.caption-text .word.final { opacity: 1; color: var(--text); }

/* Suggestion chips */
.chips-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  width: 90%;
  margin-top: 18px;
  transition: opacity 0.15s, transform 0.15s;
}
.chips-row.hidden { opacity: 0; pointer-events: none; transform: translateY(6px); }

.chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 13px;
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--accent);
  cursor: pointer;
  text-transform: lowercase;
  letter-spacing: 0.02em;
  transition: all 0.1s var(--ease);
  user-select: none;
}
.chip:hover {
  background: rgba(0,229,255,0.08);
  box-shadow: var(--shadow-sm);
  color: var(--text);
}
.chip.followup { color: var(--accent-2); border-color: rgba(255,61,203,0.28); }

/* Controls */
.controls {
  width: 100%;
  padding: 0 32px 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}

.ctrl-btn {
  width: 50px;
  height: 50px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.12s var(--ease);
  color: var(--text-muted);
  flex-shrink: 0;
}
.ctrl-btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: var(--shadow-sm); }
.ctrl-btn:active { transform: scale(0.93); }
.ctrl-btn svg { width: 18px; height: 18px; }

.ctrl-btn.muted-btn { color: var(--danger); border-color: rgba(255,46,77,0.4); box-shadow: 0 0 12px rgba(255,46,77,0.25); }
.ctrl-btn.end-btn:hover { color: var(--danger); border-color: rgba(255,46,77,0.4); }

.talk-btn {
  width: 68px;
  height: 68px;
  border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: rgba(0,229,255,0.07);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.12s var(--ease);
  position: relative;
  flex-shrink: 0;
}
.talk-btn:hover { background: rgba(0,229,255,0.14); box-shadow: 0 0 0 1px rgba(0,229,255,0.5),0 0 32px rgba(0,229,255,0.5); }
.talk-btn:active { transform: scale(0.94); }
.talk-btn svg { color: var(--accent); width: 24px; height: 24px; filter: drop-shadow(var(--glow-cyan)); }
.talk-btn.active { border-color: var(--accent-3); background: rgba(182,255,61,0.07); box-shadow: 0 0 0 1px rgba(182,255,61,0.3),0 0 24px rgba(182,255,61,0.3); }
.talk-btn.active svg { color: var(--accent-3); filter: drop-shadow(0 0 8px rgba(182,255,61,0.6)); }

/* Show text */
.show-text-btn {
  position: absolute;
  bottom: 138px;
  right: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  transition: all 0.12s;
  z-index: 10;
}
.show-text-btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: var(--shadow-sm); }

/* Text view */
.text-view {
  position: absolute;
  inset: 0;
  background: var(--bg);
  z-index: 50;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.18s var(--ease);
  border-radius: 28px;
  overflow: hidden;
  border: 1px solid rgba(0,229,255,0.15);
}
.text-view.open { transform: translateX(0); }

.text-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid rgba(0,229,255,0.15);
  background: var(--surface);
}
.text-header h2 {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-shadow: var(--glow-cyan);
}
.close-text {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  cursor: pointer;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: all 0.1s;
}
.close-text:hover { color: var(--accent); border-color: var(--accent); }

.log {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.log::-webkit-scrollbar { width: 3px; }
.log::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); }

.bubble { display:flex; flex-direction:column; gap:3px; }
.bubble.user { align-items:flex-end; }
.bubble.assistant { align-items:flex-start; }

.bubble-meta {
  display:flex; align-items:center; gap:4px;
  font-size:10px; font-family:var(--font-mono);
  color:var(--text-muted); padding:0 4px;
  letter-spacing:0.06em; text-transform:uppercase;
}
.bubble-meta svg { width:9px; height:9px; }
.bubble-meta.interrupted { color:var(--danger); }

.bubble-body {
  max-width:84%;
  padding:9px 13px;
  font-size:13px;
  line-height:1.55;
  color:var(--text);
  border-radius:var(--radius);
  font-family:var(--font);
}
.bubble.user .bubble-body {
  background:rgba(0,229,255,0.1);
  border:1px solid rgba(0,229,255,0.3);
  color:var(--text);
  box-shadow:var(--shadow-sm);
}
.bubble.assistant .bubble-body {
  background:var(--surface);
  border:1px solid rgba(0,229,255,0.15);
}
.bubble-body.partial { opacity:0.4; font-style:italic; }

.attach-chip {
  display:inline-flex; align-items:center; gap:5px;
  background:rgba(0,229,255,0.08);
  border:1px solid rgba(0,229,255,0.2);
  border-radius:4px; padding:4px 8px;
  font-size:11px; font-family:var(--font-mono);
  color:var(--accent); margin-top:5px;
}

/* App card */
.app-card {
  max-width:92%;
  margin:0 4px;
  background:var(--surface);
  border:1px solid rgba(0,229,255,0.2);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 0 20px rgba(0,229,255,0.1);
}
.app-card-header {
  display:flex; align-items:center; gap:8px;
  padding:10px 14px;
  border-bottom:1px solid rgba(0,229,255,0.12);
}
.app-icon {
  width:26px; height:26px;
  border-radius:5px;
  background:rgba(0,229,255,0.15);
  border:1px solid rgba(0,229,255,0.3);
  display:flex; align-items:center; justify-content:center;
  font-size:13px;
}
.app-card-title {
  font-size:11px; font-weight:600;
  font-family:var(--font-mono);
  color:var(--accent);
  letter-spacing:0.08em; text-transform:uppercase;
  text-shadow:var(--glow-cyan);
}
.app-card-body { padding:12px 14px; }
.weather-main { display:flex; align-items:baseline; gap:4px; margin-bottom:6px; }
.weather-temp { font-size:32px; font-weight:300; font-family:var(--font-mono); color:var(--text); }
.weather-unit { font-size:16px; color:var(--text-muted); font-family:var(--font-mono); }
.weather-desc { font-size:12px; color:var(--text-muted); margin-bottom:8px; font-family:var(--font-mono); }
.weather-row { display:flex; gap:14px; }
.weather-item { font-size:11px; font-family:var(--font-mono); color:var(--text-muted); }
.weather-item strong { color:var(--accent-3); }
.card-actions { display:flex; gap:6px; padding:10px 14px; border-top:1px solid rgba(0,229,255,0.12); }
.card-action {
  flex:1; padding:7px;
  border-radius:var(--radius-sm);
  border:1px solid rgba(0,229,255,0.25);
  background:transparent;
  font-size:11px; font-family:var(--font-mono);
  color:var(--accent); cursor:pointer;
  text-align:center; letter-spacing:0.06em;
  text-transform:uppercase;
  transition:all 0.1s;
}
.card-action:hover { background:rgba(0,229,255,0.1); box-shadow:var(--shadow-sm); }
.card-action.primary {
  background:rgba(0,229,255,0.15);
  border-color:var(--accent);
  box-shadow:var(--shadow-sm);
}

/* Composer */
.composer-area {
  padding:10px 16px 20px;
  background:var(--surface);
  border-top:1px solid rgba(0,229,255,0.12);
}
.attach-staged { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
.attach-staged-chip {
  display:flex; align-items:center; gap:5px;
  background:rgba(0,229,255,0.08);
  border:1px solid rgba(0,229,255,0.25);
  border-radius:4px; padding:4px 8px;
  font-size:11px; font-family:var(--font-mono); color:var(--accent);
}
.attach-remove {
  background:none; border:none; cursor:pointer;
  color:var(--text-muted); font-size:13px; line-height:1; padding:0; font-family:var(--font-mono);
}
.composer { display:flex; align-items:center; gap:6px; }
.attach-btn {
  width:36px; height:36px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:transparent;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; transition:all 0.1s;
  color:var(--text-muted);
}
.attach-btn svg { width:14px; height:14px; }
.attach-btn:hover { color:var(--accent); border-color:var(--accent); box-shadow:var(--shadow-sm); }

.text-input {
  flex:1;
  border:1px solid rgba(0,229,255,0.2);
  background:rgba(0,229,255,0.04);
  border-radius:var(--radius-sm);
  padding:8px 12px;
  font-size:13px;
  font-family:var(--font-mono);
  color:var(--text);
  outline:none;
  transition:all 0.12s;
  resize:none;
  min-height:36px;
  max-height:90px;
  caret-color:var(--accent);
}
.text-input:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(0,229,255,0.1); }
.text-input::placeholder { color:var(--text-muted); }

.send-btn {
  width:36px; height:36px;
  border-radius:var(--radius-sm);
  border:1px solid var(--accent);
  background:rgba(0,229,255,0.1);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; transition:all 0.12s;
  color:var(--accent); box-shadow:var(--shadow-sm);
}
.send-btn:hover { background:rgba(0,229,255,0.2); box-shadow:var(--shadow); }
.send-btn:active { transform:scale(0.92); }
.send-btn svg { width:14px; height:14px; filter:drop-shadow(var(--glow-cyan)); }
.send-btn.mic-mode { border-color:rgba(0,229,255,0.25); background:transparent; color:var(--text-muted); box-shadow:none; }
.send-btn.mic-mode svg { filter:none; }
.send-btn.stop-mode { border-color:rgba(255,46,77,0.4); background:rgba(255,46,77,0.1); color:var(--danger); }
.send-btn.stop-mode svg { filter:drop-shadow(0 0 6px rgba(255,46,77,0.6)); }

.show-text-btn2 { display:none; }

/* Demo btn */
.demo-btn {
  position:absolute; top:18px; left:50%; transform:translateX(-50%);
  background:var(--surface);
  border:1px solid rgba(0,229,255,0.3);
  border-radius:var(--radius-sm);
  padding:6px 14px;
  font-size:11px; font-family:var(--font-mono);
  font-weight:600; color:var(--accent);
  cursor:pointer; z-index:20;
  letter-spacing:0.08em; text-transform:uppercase;
  box-shadow:var(--shadow-sm);
  transition:all 0.1s;
  white-space:nowrap;
  text-shadow:var(--glow-cyan);
}
.demo-btn:hover { background:rgba(0,229,255,0.1); box-shadow:var(--shadow); }
</style>
</head>
<body>
<div class="device">
  <div class="scanline"></div>

  <div class="scene" id="voiceScene">
    <div class="header">
      <div class="agent-name">ELIZA_v2</div>
      <button class="cc-toggle" id="ccToggle" onclick="toggleCC()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="6" width="20" height="12" rx="2"/>
          <path d="M7 10.5h3m-3 3h5m1-3h3m0 3h-3"/>
        </svg>
        CC
      </button>
    </div>

    <div class="listening-indicator" id="listenIndicator">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      </svg>
      <span id="listenLabel" class="blink">LISTENING</span>
    </div>

    <div class="orb-stage">
      <div class="orb-wrapper" id="orbWrapper" onclick="handleOrbTap()">
        <div class="ripple-ring"></div>
        <div class="ripple-ring"></div>
        <div class="ripple-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring-2"></div>
        <canvas id="orbCanvas" width="220" height="220"></canvas>
      </div>

      <div class="caption-area" id="captionArea">
        <div class="caption-text" id="captionText"></div>
      </div>

      <div class="chips-row" id="idleChips">
        <div class="chip" onclick="handleChip(this)">// weather query</div>
        <div class="chip" onclick="handleChip(this)">// set_reminder</div>
        <div class="chip" onclick="handleChip(this)">// system status</div>
        <div class="chip followup" onclick="handleChip(this)" id="followupChip" style="display:none">→ expand</div>
      </div>
    </div>

    <button class="show-text-btn" onclick="openTextView()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      LOG
    </button>

    <div class="controls">
      <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" title="Mute">
        <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>

      <button class="talk-btn" id="talkBtn" onclick="startDemo()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>

      <button class="ctrl-btn end-btn" onclick="endSession()" title="End">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Text view -->
  <div class="text-view" id="textView">
    <div class="text-header">
      <h2>// TRANSCRIPT</h2>
      <button class="close-text" onclick="closeTextView()">← BACK</button>
    </div>
    <div class="log" id="chatLog"></div>
    <div class="composer-area">
      <div class="attach-staged" id="attachStaged" style="display:none"></div>
      <div class="composer">
        <button class="attach-btn" onclick="handleAttach()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </button>
        <input class="text-input" id="textInput" placeholder="// query..." oninput="handleInput(this)" onkeydown="handleKeydown(event)">
        <button class="send-btn mic-mode" id="sendBtn" onclick="handleSend()">
          <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <button class="demo-btn" id="demoBtn" onclick="startDemo()" style="display:none">▶ RUN_DEMO</button>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let appState = 'idle';
let isMuted = false;
let ccOn = false;
let demoRunning = false;
let generatingReply = false;
let stagedAttach = null;
let demoTimer = null;
let rafId = null;
let currentAmp = 0;
let targetAmp = 0;

// Canvas orb
const canvas = document.getElementById('orbCanvas');
const ctx = canvas.getContext('2d');
const W = 220, H = 220, CX = W/2, CY = H/2, R = 88;

// DOM
const orb = document.getElementById('orbWrapper');
const listenIndicator = document.getElementById('listenIndicator');
const listenLabel = document.getElementById('listenLabel');
const captionArea = document.getElementById('captionArea');
const captionText = document.getElementById('captionText');
const idleChips = document.getElementById('idleChips');
const muteBtn = document.getElementById('muteBtn');
const muteIcon = document.getElementById('muteIcon');
const talkBtn = document.getElementById('talkBtn');
const ccToggle = document.getElementById('ccToggle');
const chatLogEl = document.getElementById('chatLog');
const textView = document.getElementById('textView');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const sendIcon = document.getElementById('sendIcon');
const attachStaged = document.getElementById('attachStaged');
const followupChip = document.getElementById('followupChip');

const VOICE_REPLY = ["Right","now","in","San","Francisco","it's","62°F","with","partly","cloudy","skies.","Great","day","for","a","walk","outside!"];
const TYPED_REPLY = "Reminder set for 15:00. I'll alert you 10 minutes early. Anything else?";

// ── Canvas orb renderer ───────────────────────────────────────────────────
let tick = 0;
function drawOrb() {
  rafId = requestAnimationFrame(drawOrb);
  tick += 0.03;
  currentAmp += (targetAmp - currentAmp) * 0.12;
  ctx.clearRect(0, 0, W, H);

  const s = appState;

  if (s === 'idle') drawParticleOrb(0.05 + Math.abs(Math.sin(tick * 0.5)) * 0.04);
  else if (s === 'listening') drawBarOrb(currentAmp);
  else if (s === 'thinking') drawThinkOrb();
  else if (s === 'speaking') drawBarOrb(currentAmp, true);
  else drawParticleOrb(0.03); // muted
}

function drawParticleOrb(amp) {
  // Draw glow base
  const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);
  grd.addColorStop(0, 'rgba(0,229,255,0.18)');
  grd.addColorStop(0.6, 'rgba(0,229,255,0.06)');
  grd.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();

  // Rotating sparse particles
  const count = 28;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + tick * 0.4;
    const r = R * (0.4 + Math.sin(i * 1.7 + tick * 0.8) * 0.35);
    const x = CX + Math.cos(angle) * r;
    const y = CY + Math.sin(angle) * r;
    const a = 0.15 + Math.abs(Math.sin(i * 0.9 + tick)) * 0.4;
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,229,255,${a})`;
    ctx.fill();
  }
}

function drawBarOrb(amp, isSpeaking = false) {
  const color1 = isSpeaking ? '182,255,61' : '0,229,255';
  const color2 = isSpeaking ? '0,229,255' : '95,227,192';
  const bars = 32;
  // Glow base
  const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);
  grd.addColorStop(0, `rgba(${color1},0.12)`);
  grd.addColorStop(1, 'transparent');
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI*2); ctx.fillStyle = grd; ctx.fill();

  for (let i = 0; i < bars; i++) {
    const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
    const noiseAmp = amp * (0.6 + Math.abs(Math.sin(i * 1.3 + tick * (isSpeaking ? 5 : 3))) * 0.8);
    const barH = noiseAmp * 36 + 6;
    const x1 = CX + Math.cos(angle) * (R - barH);
    const y1 = CY + Math.sin(angle) * (R - barH);
    const x2 = CX + Math.cos(angle) * R;
    const y2 = CY + Math.sin(angle) * R;
    const a = 0.4 + noiseAmp * 0.6;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(${color1},${Math.min(a, 1)})`;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = `rgba(${color1},0.5)`;
    ctx.shadowBlur = 4;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawThinkOrb() {
  // Magenta churn
  const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);
  grd.addColorStop(0, 'rgba(255,61,203,0.2)');
  grd.addColorStop(0.7, 'rgba(0,229,255,0.06)');
  grd.addColorStop(1, 'transparent');
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI*2); ctx.fillStyle = grd; ctx.fill();

  const count = 20;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + tick * 1.5;
    const r = R * (0.25 + Math.sin(i * 2.1 + tick * 2) * 0.5);
    const x = CX + Math.cos(angle) * r;
    const y = CY + Math.sin(angle) * r;
    const a = 0.3 + Math.abs(Math.sin(i * 1.1 + tick * 2)) * 0.5;
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI*2);
    ctx.fillStyle = i % 2 === 0 ? `rgba(255,61,203,${a})` : `rgba(0,229,255,${a * 0.7})`;
    ctx.fill();
  }
}

drawOrb();

// ── Amplitude simulation ─────────────────────────────────────────────────
let ampInterval = null;
function startAmp(isSpeaking) {
  stopAmpSim();
  ampInterval = setInterval(() => {
    targetAmp = Math.random() * (isSpeaking ? 0.7 : 0.8);
  }, isSpeaking ? 80 : 100);
}
function stopAmpSim() {
  if (ampInterval) { clearInterval(ampInterval); ampInterval = null; }
  targetAmp = 0;
}

// ── State machine ─────────────────────────────────────────────────────────
function setState(s) {
  appState = s;
  orb.className = 'orb-wrapper ' + (isMuted ? 'muted' : s);

  if (s === 'listening' && !isMuted) {
    listenIndicator.classList.add('visible');
    listenIndicator.classList.remove('muted');
    listenLabel.textContent = 'LISTENING';
    listenLabel.classList.add('blink');
  } else if (isMuted) {
    listenIndicator.classList.add('visible','muted');
    listenLabel.textContent = 'MUTED';
    listenLabel.classList.remove('blink');
  } else {
    listenIndicator.classList.remove('visible');
  }

  if (s === 'idle') { idleChips.classList.remove('hidden'); }
  else { idleChips.classList.add('hidden'); }

  if (s !== 'speaking') captionArea.classList.remove('visible');
}

function toggleMute() {
  isMuted = !isMuted;
  if (isMuted) {
    muteBtn.classList.add('muted-btn');
    muteIcon.innerHTML = `<line x1="2" y1="2" x2="22" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2m-7-7a3 3 0 0 1 3 3v5.27m-3.27 3.73A3 3 0 0 1 9 12V5"/><path d="M5 10v2a7 7 0 0 0 9.2 6.65M17 16.95A7 7 0 0 0 19 12"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>`;
    listenIndicator.classList.add('visible','muted');
    listenLabel.textContent = 'MUTED';
    listenLabel.classList.remove('blink');
    stopAmpSim();
  } else {
    muteBtn.classList.remove('muted-btn');
    muteIcon.innerHTML = `<path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>`;
    listenIndicator.classList.remove('muted');
    if (appState !== 'listening') listenIndicator.classList.remove('visible');
    setState(appState);
  }
}

function toggleCC() {
  ccOn = !ccOn;
  ccToggle.classList.toggle('active', ccOn);
  if (!ccOn) captionArea.classList.remove('visible');
}

// ── Demo ──────────────────────────────────────────────────────────────────
function clearDemoTimers() {
  if (demoTimer) { clearTimeout(demoTimer); demoTimer = null; }
}

function startDemo() {
  if (demoRunning) return;
  clearDemoTimers();
  demoRunning = true;
  captionText.innerHTML = '';
  document.getElementById('demoBtn').style.display = 'none';

  setState('listening');
  startAmp(false);

  demoTimer = setTimeout(() => {
    stopAmpSim();
    setState('thinking');

    demoTimer = setTimeout(() => {
      setState('speaking');
      startAmp(true);
      streamCaption();

      demoTimer = setTimeout(() => {
        stopAmpSim();
        setState('idle');
        captionText.innerHTML = '';
        captionArea.classList.remove('visible');

        addLogBubble('user', "What's the weather in San Francisco?", 'voice');
        addWeatherCard();
        addLogBubble('assistant', VOICE_REPLY.join(' '), 'voice');
        followupChip.style.display = '';

        demoRunning = false;
        document.getElementById('demoBtn').style.display = 'block';
      }, VOICE_REPLY.length * 140 + 700);
    }, 1100);
  }, 2200);
}

function streamCaption() {
  if (ccOn) captionArea.classList.add('visible');
  let idx = 0;
  captionText.innerHTML = '';
  const words = VOICE_REPLY;
  function addWord() {
    if (idx >= words.length) return;
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = words[idx] + ' ';
    captionText.appendChild(span);
    setTimeout(() => span.classList.add('final'), 60);
    idx++;
    demoTimer = setTimeout(addWord, 140);
  }
  addWord();
}

// ── Log ───────────────────────────────────────────────────────────────────
function addLogBubble(role, text, modality, opts = {}) {
  const div = document.createElement('div');
  div.className = `bubble ${role}`;
  const meta = document.createElement('div');
  meta.className = 'bubble-meta';
  if (opts.interrupted) meta.classList.add('interrupted');
  if (modality === 'voice') {
    meta.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg> VOICE${opts.interrupted ? ' · INT' : ''}`;
  } else {
    meta.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> TEXT`;
  }
  div.appendChild(meta);
  const body = document.createElement('div');
  body.className = 'bubble-body' + (opts.partial ? ' partial' : '');
  body.textContent = text;
  if (opts.attach) {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    chip.innerHTML = `// ${opts.attach}`;
    body.appendChild(chip);
  }
  div.appendChild(body);
  chatLogEl.appendChild(div);
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
  return div;
}

function addWeatherCard() {
  const wrap = document.createElement('div');
  wrap.className = 'bubble assistant';
  const card = document.createElement('div');
  card.className = 'app-card';
  card.innerHTML = `
    <div class="app-card-header">
      <div class="app-icon">🌡</div>
      <span class="app-card-title">SYS::WEATHER // SAN_FRANCISCO</span>
    </div>
    <div class="app-card-body">
      <div class="weather-main"><span class="weather-temp">62</span><span class="weather-unit">°F</span></div>
      <div class="weather-desc">// PARTLY_CLOUDY · WEST_BREEZE</div>
      <div class="weather-row">
        <div class="weather-item">HIGH <strong>67°</strong></div>
        <div class="weather-item">LOW <strong>55°</strong></div>
        <div class="weather-item">WIND <strong>8mph</strong></div>
      </div>
    </div>
    <div class="card-actions">
      <button class="card-action">FORECAST_5D</button>
      <button class="card-action primary">OPEN_MAP</button>
    </div>`;
  wrap.appendChild(card);
  chatLogEl.appendChild(wrap);
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

// ── Input morph ───────────────────────────────────────────────────────────
const MIC_SVG = `<path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>`;
const SEND_SVG = `<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>`;
const STOP_SVG = `<rect x="6" y="6" width="12" height="12" rx="1"/>`;

function handleInput(el) {
  updateSendBtn(el.value.trim());
  if (el.value.trim()) idleChips.classList.add('hidden');
  else idleChips.classList.remove('hidden');
}
function updateSendBtn(val) {
  if (generatingReply) { sendBtn.className = 'send-btn stop-mode'; sendIcon.innerHTML = STOP_SVG; }
  else if (val) { sendBtn.className = 'send-btn'; sendIcon.innerHTML = SEND_SVG; }
  else { sendBtn.className = 'send-btn mic-mode'; sendIcon.innerHTML = MIC_SVG; }
}
function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
}
function handleSend() {
  if (generatingReply) { generatingReply = false; updateSendBtn(''); return; }
  const val = textInput.value.trim();
  if (!val && !stagedAttach) { startDemo(); return; }
  if (!val) return;
  const attach = stagedAttach; stagedAttach = null;
  attachStaged.style.display = 'none'; attachStaged.innerHTML = '';
  addLogBubble('user', val, 'text', attach ? { attach } : {});
  textInput.value = ''; updateSendBtn('');
  generatingReply = true; updateSendBtn('x');
  const partial = addLogBubble('assistant', 'processing...', 'text', { partial: true });
  setTimeout(() => { partial.remove(); generatingReply = false; addLogBubble('assistant', TYPED_REPLY, 'text'); updateSendBtn(''); followupChip.style.display = ''; }, 1500);
}
function handleAttach() {
  const names = ['capture_01.jpg', 'report.pdf', 'data.csv'];
  const c = names[Math.floor(Math.random() * names.length)];
  stagedAttach = c;
  attachStaged.style.display = 'flex';
  attachStaged.innerHTML = `<div class="attach-staged-chip">// ${c} <button class="attach-remove" onclick="removeAttach()">×</button></div>`;
}
function removeAttach() { stagedAttach = null; attachStaged.style.display = 'none'; attachStaged.innerHTML = ''; }

// ── Views ─────────────────────────────────────────────────────────────────
function openTextView() { textView.classList.add('open'); }
function closeTextView() { textView.classList.remove('open'); }
function handleOrbTap() {
  if (appState === 'idle') startDemo();
  else if (appState === 'speaking') {
    clearDemoTimers(); stopAmpSim();
    setState('listening'); startAmp(false);
    const metas = chatLogEl.querySelectorAll('.bubble.assistant .bubble-meta');
    if (metas.length) {
      const last = metas[metas.length-1];
      last.classList.add('interrupted');
      last.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:9px;height:9px"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg> VOICE · INT`;
    }
    setTimeout(() => { stopAmpSim(); setState('idle'); demoRunning = false; document.getElementById('demoBtn').style.display = 'block'; }, 2000);
  }
}
function handleChip(el) { el.style.opacity='0'; setTimeout(()=>el.style.display='none',200); startDemo(); }
function endSession() { clearDemoTimers(); stopAmpSim(); demoRunning=false; setState('idle'); captionText.innerHTML=''; captionArea.classList.remove('visible'); }

// Seed
(function() {
  addLogBubble('assistant', 'System online. Voice ready. Just talk.', 'text');
  const p = addLogBubble('assistant', 'Fetching that data for you...', 'voice', { partial: true });
  setTimeout(() => { const m = p.querySelector('.bubble-meta'); m.classList.add('interrupted'); m.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:9px;height:9px"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg> VOICE · INT`; }, 100);
})();

setTimeout(() => { document.getElementById('demoBtn').style.display = 'block'; }, 400);
setTimeout(startDemo, 700);
</script>
</body>
</html>
