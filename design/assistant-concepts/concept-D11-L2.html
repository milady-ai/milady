<!-- concept-D11-L2 | direction: Zen Single-Line Minimal | look: OLED Neon Cyber | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D11 · Zen Single-Line Minimal · OLED Neon Cyber</title>
<style>
:root{
  --bg:#000000;
  --surface:#0B0E14;
  --surface-2:#131826;
  --border:rgba(0,229,255,0.28);
  --text:#E8FBFF;
  --text-muted:#6B7A90;
  --accent:#00E5FF;
  --accent-2:#FF3DCB;
  --accent-3:#B6FF3D;
  --danger:#FF2E4D;
  --radius:8px;
  --radius-sm:5px;
  --font:"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono","Cascadia Mono",ui-monospace,monospace;
  --shadow:0 0 0 1px rgba(0,229,255,0.25),0 0 24px rgba(0,229,255,0.35);
  --shadow-sm:0 0 12px rgba(0,229,255,0.25);
  --glow-cyan:0 0 16px rgba(0,229,255,0.6);
  --glow-magenta:0 0 16px rgba(255,61,203,0.6);
  --ease:cubic-bezier(.2,.8,.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:var(--font);
  background:#000;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* Scanline overlay */
body::before{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,229,255,0.015) 2px,
    rgba(0,229,255,0.015) 4px
  );
  pointer-events:none;z-index:9999;
}

.device{
  position:relative;
  width:420px;height:760px;
  background:var(--bg);
  border:1px solid rgba(0,229,255,0.35);
  border-radius:var(--radius);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(0,229,255,0.1),
    0 0 40px rgba(0,229,255,0.15),
    0 0 80px rgba(0,229,255,0.08);
}

/* Neon corner accents */
.device::before,.device::after{
  content:'';position:absolute;
  width:20px;height:20px;
  border-color:var(--accent);border-style:solid;
}
.device::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:var(--radius) 0 0 0;}
.device::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 var(--radius) 0;}

/* Header */
.header{
  padding:20px 20px 0;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(0,229,255,0.12);
  padding-bottom:14px;
}
.header-title{
  font-family:var(--font-mono);
  font-size:11px;font-weight:400;
  letter-spacing:0.14em;text-transform:uppercase;
  color:var(--accent);
  text-shadow:var(--glow-cyan);
}
.header-meta{
  font-family:var(--font-mono);
  font-size:10px;color:var(--text-muted);
  letter-spacing:0.06em;
}
.icon-btn{
  width:28px;height:28px;border-radius:var(--radius-sm);
  background:var(--surface);
  border:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 120ms var(--ease);
}
.icon-btn:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
.icon-btn svg{width:13px;height:13px;stroke:var(--text-muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.icon-btn:hover svg{stroke:var(--accent);}

/* Avatar — particle/waveform */
.avatar-area{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:28px 40px 8px;
  position:relative;
}

.orb-container{
  position:relative;
  width:100px;height:100px;
  margin-bottom:24px;
  cursor:pointer;
}

canvas#orbCanvas{
  width:100px;height:100px;
  position:absolute;inset:0;
}

.mute-dot{
  position:absolute;bottom:0;right:0;
  width:14px;height:14px;border-radius:50%;
  background:var(--danger);
  border:2px solid var(--bg);
  box-shadow:0 0 8px var(--danger);
  opacity:0;transition:opacity 200ms;
  z-index:2;
}
.mute-label{
  font-family:var(--font-mono);
  font-size:10px;color:var(--danger);
  letter-spacing:0.1em;text-transform:uppercase;
  margin-top:6px;
  opacity:0;transition:opacity 200ms;
  text-shadow:0 0 8px var(--danger);
  text-align:center;
}

/* State label */
.state-badge{
  font-family:var(--font-mono);
  font-size:10px;color:var(--text-muted);
  letter-spacing:0.1em;text-transform:uppercase;
  min-height:14px;
  text-align:center;
  transition:all 120ms var(--ease);
  margin-top:4px;
}

/* Listening indicator */
.listening-indicator{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;
  background:rgba(0,229,255,0.06);
  border:1px solid rgba(0,229,255,0.35);
  border-radius:4px;
  margin-bottom:14px;
  opacity:0;
  transition:all 120ms var(--ease);
  pointer-events:none;
}
.listening-indicator.visible{opacity:1;}
.listening-indicator svg{width:11px;height:11px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;}
.listening-indicator span{
  font-family:var(--font-mono);
  font-size:10px;color:var(--accent);
  letter-spacing:0.08em;text-transform:uppercase;
  text-shadow:var(--glow-cyan);
}
.listen-pulse{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 6px var(--accent);
  animation:neonBlink 0.9s ease-in-out infinite;
}
@keyframes neonBlink{0%,100%{opacity:1;}50%{opacity:0.2;}}

/* Current line */
.current-turn{
  text-align:center;
  min-height:52px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;
  padding:0 16px;
  width:100%;
}
.turn-line{
  font-size:18px;font-weight:300;
  color:var(--text);
  line-height:1.4;
  letter-spacing:0.01em;
  opacity:1;
  transition:all 200ms var(--ease);
  text-align:center;
  max-width:100%;
}
.turn-line.fading{opacity:0;transform:translateY(-10px);}
.turn-line.partial{opacity:0.45;font-style:italic;}
.turn-line.empty{
  color:var(--text-muted);
  font-size:15px;
  font-family:var(--font-mono);
  letter-spacing:0.04em;
}
.turn-meta{
  display:flex;align-items:center;gap:5px;
  font-family:var(--font-mono);
  font-size:10px;color:var(--text-muted);
  letter-spacing:0.06em;text-transform:uppercase;
}
.turn-meta svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8;}
.turn-meta.voice-meta{color:var(--accent);}
.turn-meta.voice-meta svg{stroke:var(--accent);filter:drop-shadow(0 0 3px var(--accent));}
.turn-attach{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(0,229,255,0.08);
  border:1px solid rgba(0,229,255,0.25);
  border-radius:3px;
  padding:3px 8px;
  font-family:var(--font-mono);
  font-size:10px;color:var(--accent);
  letter-spacing:0.04em;
}
.turn-attach svg{width:10px;height:10px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* Suggestion chips */
.suggestion-row{
  margin-top:18px;
  display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;justify-content:center;
  max-width:300px;
  transition:opacity 160ms var(--ease);
}
.suggestion-row.hidden{opacity:0;pointer-events:none;}
.suggestion{
  padding:6px 14px;
  background:rgba(0,229,255,0.05);
  border:1px solid rgba(0,229,255,0.22);
  border-radius:4px;
  font-size:12px;color:var(--text-muted);
  cursor:pointer;
  font-family:var(--font-mono);
  letter-spacing:0.04em;
  white-space:nowrap;
  transition:all 120ms var(--ease);
}
.suggestion:hover{
  background:rgba(0,229,255,0.1);
  color:var(--accent);
  border-color:var(--accent);
  box-shadow:var(--shadow-sm);
}

/* Inline card */
.inline-card{
  margin-top:20px;
  width:100%;max-width:300px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  opacity:0;transform:translateY(12px);
  transition:all 220ms var(--ease);
  box-shadow:var(--shadow);
}
.inline-card.visible{opacity:1;transform:translateY(0);}
.card-header{
  padding:10px 14px 8px;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid rgba(0,229,255,0.15);
  position:relative;
}
.card-icon{
  width:24px;height:24px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
  background:rgba(0,229,255,0.1);
  border:1px solid rgba(0,229,255,0.25);
}
.card-title{
  font-size:12px;font-weight:600;color:var(--accent);
  font-family:var(--font-mono);
  letter-spacing:0.04em;text-transform:uppercase;
  text-shadow:var(--glow-cyan);
}
.card-sub{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);}
.card-expand{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:0.4;}
.card-expand svg{width:11px;height:11px;stroke:var(--text-muted);fill:none;stroke-width:2;}
.card-body{padding:10px 14px;}
.weather-row{display:flex;align-items:center;justify-content:space-between;}
.weather-temp{
  font-family:var(--font-mono);
  font-size:32px;font-weight:300;
  color:var(--accent);
  text-shadow:var(--glow-cyan);
}
.weather-info{text-align:right;}
.weather-desc{font-size:13px;color:var(--text);}
.weather-feels{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
.card-actions{
  padding:6px 14px 10px;
  display:flex;gap:6px;
}
.card-btn{
  flex:1;padding:6px;
  border-radius:var(--radius-sm);
  font-size:11px;font-weight:500;
  font-family:var(--font-mono);
  border:1px solid rgba(0,229,255,0.35);
  background:rgba(0,229,255,0.08);
  color:var(--accent);cursor:pointer;
  letter-spacing:0.04em;
  transition:all 120ms var(--ease);
}
.card-btn:hover{background:rgba(0,229,255,0.16);box-shadow:var(--shadow-sm);}
.card-btn.secondary{background:transparent;color:var(--text-muted);border-color:rgba(255,255,255,0.1);}
.card-btn.secondary:hover{color:var(--text);border-color:rgba(255,255,255,0.25);}

/* Bottom */
.bottom-area{
  padding:0 16px 24px;
  display:flex;flex-direction:column;gap:10px;
}
.thread-hint{
  text-align:center;
  font-family:var(--font-mono);
  font-size:10px;color:var(--text-muted);
  letter-spacing:0.08em;text-transform:uppercase;
  opacity:0.5;
}

/* Composer */
.composer{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  display:flex;align-items:center;gap:8px;
  padding:6px 6px 6px 10px;
  transition:all 150ms var(--ease);
}
.composer:focus-within{
  border-color:var(--accent);
  box-shadow:var(--glow-cyan);
}

.attach-btn{
  width:28px;height:28px;border-radius:var(--radius-sm);
  background:transparent;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 120ms;flex-shrink:0;
}
.attach-btn:hover{background:rgba(0,229,255,0.08);}
.attach-btn svg{width:14px;height:14px;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.attachment-chip{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,229,255,0.08);
  border:1px solid rgba(0,229,255,0.25);
  border-radius:3px;
  padding:3px 7px;
  font-family:var(--font-mono);
  font-size:10px;color:var(--accent);
  opacity:0;max-width:0;overflow:hidden;
  transition:all 200ms var(--ease);
}
.attachment-chip.visible{opacity:1;max-width:140px;}
.chip-remove{
  background:none;border:none;cursor:pointer;
  color:var(--accent);font-size:10px;
  opacity:0.6;
}
.chip-remove:hover{opacity:1;}

.composer-input{
  flex:1;background:transparent;border:none;outline:none;
  font-family:var(--font);font-size:14px;font-weight:300;
  color:var(--text);line-height:1.4;
  caret-color:var(--accent);
}
.composer-input::placeholder{color:var(--text-muted);}

/* Action button */
.action-btn{
  width:36px;height:36px;border-radius:var(--radius-sm);
  border:1px solid;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 150ms var(--ease);flex-shrink:0;
  position:relative;overflow:hidden;
}
.action-btn svg{
  width:16px;height:16px;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  position:absolute;
  transition:all 150ms var(--ease);
}

.action-btn.mic-mode{
  background:rgba(0,229,255,0.12);
  border-color:rgba(0,229,255,0.5);
  box-shadow:var(--glow-cyan);
}
.action-btn.mic-mode .mic-icon{opacity:1;stroke:var(--accent);}
.action-btn.mic-mode .send-icon{opacity:0;transform:scale(0.4);}
.action-btn.mic-mode .stop-icon{opacity:0;transform:scale(0.4);}

.action-btn.send-mode{
  background:rgba(0,229,255,0.18);
  border-color:var(--accent);
  box-shadow:var(--glow-cyan);
}
.action-btn.send-mode .mic-icon{opacity:0;transform:scale(0.4);}
.action-btn.send-mode .send-icon{opacity:1;stroke:var(--accent);}
.action-btn.send-mode .stop-icon{opacity:0;transform:scale(0.4);}

.action-btn.stop-mode{
  background:rgba(255,46,77,0.12);
  border-color:rgba(255,46,77,0.5);
  box-shadow:0 0 12px rgba(255,46,77,0.4);
}
.action-btn.stop-mode .mic-icon{opacity:0;transform:scale(0.4);}
.action-btn.stop-mode .send-icon{opacity:0;transform:scale(0.4);}
.action-btn.stop-mode .stop-icon{opacity:1;stroke:var(--danger);}

.action-btn:hover{transform:scale(1.05);}
.action-btn:active{transform:scale(0.95);}

/* Thread panel */
.thread-panel{
  position:absolute;inset:0;border-radius:var(--radius);
  background:var(--bg);
  border:1px solid var(--border);
  z-index:10;display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform 200ms var(--ease);
}
.thread-panel.open{transform:translateX(0);}
.thread-header{
  padding:20px 20px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(0,229,255,0.15);
}
.thread-title{
  font-family:var(--font-mono);font-size:11px;
  color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;
  text-shadow:var(--glow-cyan);
}
.close-thread{
  width:24px;height:24px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.close-thread svg{width:10px;height:10px;stroke:var(--text-muted);fill:none;stroke-width:2;}
.thread-list{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.thread-turn{display:flex;flex-direction:column;gap:3px;}
.thread-bubble{
  padding:8px 12px;border-radius:var(--radius-sm);
  font-size:13px;line-height:1.5;max-width:85%;
}
.thread-bubble.user{
  background:rgba(0,229,255,0.08);
  border:1px solid rgba(0,229,255,0.2);
  color:var(--text);align-self:flex-end;
}
.thread-bubble.assistant{
  background:var(--surface);
  border:1px solid rgba(255,255,255,0.06);
  color:var(--text);align-self:flex-start;
}
.thread-bubble.interrupted{opacity:0.55;border-style:dashed;}
.thread-meta{
  font-family:var(--font-mono);
  font-size:10px;color:var(--text-muted);
  display:flex;align-items:center;gap:4px;
  letter-spacing:0.05em;
  padding:0 2px;
}
.thread-meta.user-meta{align-self:flex-end;}
.thread-meta svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;}
.interrupted-badge{
  font-size:9px;color:var(--accent-2);
  background:rgba(255,61,203,0.1);
  border-radius:2px;padding:1px 4px;
  text-shadow:var(--glow-magenta);
}
.thread-attach{
  align-self:flex-end;
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(0,229,255,0.08);
  border:1px solid rgba(0,229,255,0.25);
  border-radius:3px;
  padding:3px 8px;
  font-family:var(--font-mono);
  font-size:10px;color:var(--accent);
  letter-spacing:0.04em;
}
.thread-attach svg{width:10px;height:10px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* Demo btn */
.demo-btn{
  padding:4px 10px;
  background:rgba(0,229,255,0.08);
  border:1px solid rgba(0,229,255,0.3);
  border-radius:4px;
  font-family:var(--font-mono);font-size:10px;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--accent);cursor:pointer;
  transition:all 120ms;
}
.demo-btn:hover{background:rgba(0,229,255,0.16);box-shadow:var(--shadow-sm);}

@media(min-width:600px){
  body{background:#070A10;}
  .device{box-shadow:0 0 80px rgba(0,229,255,0.12),0 0 0 1px rgba(0,229,255,0.2);}
}
</style>
</head>
<body>
<div class="device" id="device">

  <!-- Thread panel -->
  <div class="thread-panel" id="threadPanel">
    <div class="thread-header">
      <span class="thread-title">// Transcript</span>
      <button class="close-thread" id="closeThread">
        <svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg>
      </button>
    </div>
    <div class="thread-list" id="threadList"></div>
  </div>

  <!-- Header -->
  <div class="header">
    <div>
      <span class="header-title">ELIZA_AI</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="header-meta" id="clockEl">00:00:00</span>
      <button class="demo-btn" id="demoBtn">▶ DEMO</button>
      <button class="icon-btn" id="threadBtn">
        <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h8M2 12h10"/></svg>
      </button>
    </div>
  </div>

  <div class="avatar-area" id="avatarArea">

    <div class="listening-indicator" id="listeningIndicator">
      <svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>
      <div class="listen-pulse"></div>
      <span>LISTENING</span>
    </div>

    <div class="orb-container" id="orbContainer" title="Tap to mute">
      <canvas id="orbCanvas" width="100" height="100"></canvas>
      <div class="mute-dot" id="muteDot"></div>
    </div>
    <div class="mute-label" id="muteLabel">[ MUTED ]</div>
    <div class="state-badge" id="stateBadge"></div>

    <div class="current-turn" id="currentTurn">
      <div class="turn-line empty" id="turnLine">// awaiting input…</div>
      <div class="turn-meta" id="turnMeta" style="opacity:0"></div>
    </div>

    <div class="suggestion-row" id="suggestionRow">
      <div class="suggestion" data-text="What's the weather like today?">&gt; What's the weather?</div>
      <div class="suggestion" data-text="Set a timer for 10 minutes.">&gt; Set a timer</div>
      <div class="suggestion" data-text="What's on my calendar tomorrow?">&gt; My calendar</div>
    </div>

    <div class="inline-card" id="inlineCard">
      <div class="card-header">
        <div class="card-icon">🌤</div>
        <div>
          <div class="card-title">WEATHER.SYS</div>
          <div class="card-sub">San Francisco, CA</div>
        </div>
        <div class="card-expand">
          <svg viewBox="0 0 16 16"><path d="M10 2h4v4M14 2l-6 6M6 14H2v-4M2 14l6-6"/></svg>
        </div>
      </div>
      <div class="card-body">
        <div class="weather-row">
          <div class="weather-temp">64°</div>
          <div class="weather-info">
            <div class="weather-desc">Partly Cloudy</div>
            <div class="weather-feels">FEELS_LIKE: 61°F</div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="card-btn">7-DAY FORECAST</button>
        <button class="card-btn secondary">DISMISS</button>
      </div>
    </div>

  </div>

  <div class="bottom-area">
    <div class="thread-hint">↑ SCROLL FOR TRANSCRIPT</div>
    <div class="composer" id="composer">
      <button class="attach-btn" id="attachBtn">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
      <div class="attachment-chip" id="attachChip">
        <span>PHOTO.JPG</span>
        <button class="chip-remove" id="chipRemove">×</button>
      </div>
      <input class="composer-input" id="composerInput" type="text" placeholder="type command or speak…" autocomplete="off">
      <button class="action-btn mic-mode" id="actionBtn">
        <svg class="mic-icon" viewBox="0 0 20 20"><path d="M10 1a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V4a3 3 0 0 1 3-3z"/><path d="M4 10a6 6 0 0 0 12 0"/><line x1="10" y1="16" x2="10" y2="19"/></svg>
        <svg class="send-icon" viewBox="0 0 20 20"><path d="M10 15V5M5 10l5-5 5 5"/></svg>
        <svg class="stop-icon" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ─── Clock ────────────────────────────────────────────────────────────────────
const clockEl=document.getElementById('clockEl');
function updateClock(){
  const n=new Date();
  clockEl.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
}
updateClock();setInterval(updateClock,1000);

// ─── Canvas orb (particle waveform) ───────────────────────────────────────────
const canvas=document.getElementById('orbCanvas');
const ctx=canvas.getContext('2d');
let orbState='idle';
let orbAmp=0;
let orbT=0;
let orbMuted=false;
let orbRaf=null;

function drawOrb(){
  ctx.clearRect(0,0,100,100);
  const cx=50,cy=50,r=32;
  orbT+=0.04;

  if(orbMuted){
    // grey static ring
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle='rgba(107,122,144,0.4)';
    ctx.lineWidth=1;
    ctx.stroke();
    // slash
    ctx.beginPath();
    ctx.moveTo(cx-r*0.6,cy-r*0.6);
    ctx.lineTo(cx+r*0.6,cy+r*0.6);
    ctx.strokeStyle='rgba(255,46,77,0.7)';
    ctx.lineWidth=2;
    ctx.stroke();
    orbRaf=requestAnimationFrame(drawOrb);return;
  }

  const numBars=36;
  for(let i=0;i<numBars;i++){
    const angle=(i/numBars)*Math.PI*2;
    let barH;
    if(orbState==='idle'){
      barH=2+Math.sin(orbT*1.2+i*0.4)*2;
    } else if(orbState==='listening'){
      const wave=Math.sin(orbT*4+i*0.5)*0.5+0.5;
      barH=3+wave*orbAmp*20+Math.random()*orbAmp*5;
    } else if(orbState==='thinking'){
      barH=2+Math.sin(orbT*3+i*0.7)*4+Math.sin(orbT*1.5+i*1.1)*3;
    } else if(orbState==='speaking'){
      const wave=Math.sin(orbT*5+i*0.6)*0.5+0.5;
      barH=3+wave*orbAmp*16+Math.sin(orbT*2+i*0.3)*3;
    }

    const x1=cx+Math.cos(angle)*r;
    const y1=cy+Math.sin(angle)*r;
    const x2=cx+Math.cos(angle)*(r+barH);
    const y2=cy+Math.sin(angle)*(r+barH);

    let color;
    if(orbState==='listening'){
      const t=i/numBars;
      const r255=Math.round(0+t*0),g255=Math.round(229),b255=Math.round(255);
      color=`rgba(${r255},${g255},${b255},0.8)`;
    } else if(orbState==='thinking'){
      const t=((i/numBars)+orbT*0.1)%1;
      color=t<0.5?`rgba(0,229,255,0.7)`:`rgba(255,61,203,0.7)`;
    } else if(orbState==='speaking'){
      color='rgba(0,229,255,0.9)';
    } else {
      color='rgba(0,229,255,0.35)';
    }

    ctx.beginPath();
    ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=color;
    ctx.lineWidth=orbState==='listening'||orbState==='speaking'?2:1.5;
    ctx.lineCap='round';
    ctx.stroke();
  }

  // center dot
  ctx.beginPath();
  ctx.arc(cx,cy,orbState==='idle'?3:4,0,Math.PI*2);
  ctx.fillStyle=orbState==='thinking'?'rgba(255,61,203,0.8)':'rgba(0,229,255,0.6)';
  ctx.shadowColor=orbState==='thinking'?'rgba(255,61,203,0.8)':'rgba(0,229,255,0.8)';
  ctx.shadowBlur=orbState==='idle'?6:12;
  ctx.fill();
  ctx.shadowBlur=0;

  orbRaf=requestAnimationFrame(drawOrb);
}
orbRaf=requestAnimationFrame(drawOrb);

// ─── State machine ────────────────────────────────────────────────────────────
const S={
  appState:'idle',isMuted:false,hasText:false,hasAttach:false,
  ampT:0,
  turnHistory:[
    {role:'assistant',modality:'typed',text:'Systems online. How can I assist you today?',interrupted:false},
    {role:'user',modality:'voice',text:'Show me the weather for San Francisco.',interrupted:false},
    {role:'assistant',modality:'typed',text:'Currently 64°F, partly cloudy. Winds at 12mph from the west.',interrupted:true},
  ]
};

const device=document.getElementById('device');
const muteDot=document.getElementById('muteDot');
const muteLabel=document.getElementById('muteLabel');
const stateBadge=document.getElementById('stateBadge');
const listeningIndicator=document.getElementById('listeningIndicator');
const turnLine=document.getElementById('turnLine');
const turnMeta=document.getElementById('turnMeta');
const suggestionRow=document.getElementById('suggestionRow');
const suggestions=Array.from(document.querySelectorAll('.suggestion'));
const inlineCard=document.getElementById('inlineCard');
const composerInput=document.getElementById('composerInput');
const actionBtn=document.getElementById('actionBtn');
const attachBtn=document.getElementById('attachBtn');
const attachChip=document.getElementById('attachChip');
const chipRemove=document.getElementById('chipRemove');
const demoBtn=document.getElementById('demoBtn');
const threadBtn=document.getElementById('threadBtn');
const threadPanel=document.getElementById('threadPanel');
const closeThread=document.getElementById('closeThread');
const threadList=document.getElementById('threadList');
const orbContainer=document.getElementById('orbContainer');

let ampRaf=null;
function animateAmp(){
  S.ampT+=0.08;
  const v=Math.sin(S.ampT*2.1)*0.5+Math.sin(S.ampT*5.3)*0.3+Math.random()*0.2;
  orbAmp=Math.max(0,Math.min(1,(v+0.5)*0.7));
  ampRaf=requestAnimationFrame(animateAmp);
}
function stopAmp(){if(ampRaf){cancelAnimationFrame(ampRaf);ampRaf=null;}orbAmp=0;}

function setState(s){
  S.appState=s;orbState=s;
  const badges={idle:'',listening:'[ LISTENING ]',thinking:'[ PROCESSING… ]',speaking:'[ SPEAKING ]',muted:'[ MUTED ]'};
  stateBadge.textContent=badges[s]||'';
  stateBadge.style.color=s==='listening'?'var(--accent)':s==='thinking'?'var(--accent-2)':s==='muted'?'var(--danger)':'var(--text-muted)';
  listeningIndicator.classList.toggle('visible',s==='listening');
  updateActionBtn();
  if(s==='listening'||s==='speaking'){animateAmp();}else{stopAmp();}
}

function updateActionBtn(){
  if(S.appState==='thinking'||S.appState==='speaking'){
    actionBtn.className='action-btn stop-mode';
  }else if(S.hasText){
    actionBtn.className='action-btn send-mode';
  }else{
    actionBtn.className='action-btn mic-mode';
  }
}

const ATTACH_SVG=`<svg viewBox="0 0 16 16"><path d="M11 5L6 10a2 2 0 0 0 3 3l5-5a3.5 3.5 0 0 0-5-5l-5 5a5 5 0 0 0 7 7l4-4"/></svg>`;
function showTurn(text,modality,partial=false,attachment){
  turnLine.classList.add('fading');
  setTimeout(()=>{
    turnLine.className='turn-line'+(partial?' partial':'');
    turnLine.textContent=text;
    turnLine.classList.remove('fading');
    if(modality){
      turnMeta.style.opacity='1';
      turnMeta.className='turn-meta'+(modality==='voice'?' voice-meta':'');
      const modalChip=modality==='voice'
        ?`<svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg><span>VOICE</span>`
        :`<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 7h6M5 10h4"/></svg><span>TYPED</span>`;
      const attachChipMeta=attachment
        ?`<span class="turn-attach">${ATTACH_SVG}${attachment}</span>`
        :'';
      turnMeta.innerHTML=modalChip+attachChipMeta;
    }else{turnMeta.style.opacity='0';turnMeta.innerHTML='';}
  },150);
}
function resetTurn(){
  turnLine.className='turn-line empty';
  turnLine.textContent='// awaiting input…';
  turnMeta.style.opacity='0';
}

function renderThread(){
  threadList.innerHTML='';
  S.turnHistory.forEach(t=>{
    const div=document.createElement('div');div.className='thread-turn';
    const bubble=document.createElement('div');
    bubble.className='thread-bubble '+t.role+(t.interrupted?' interrupted':'');
    bubble.textContent=t.text;
    const meta=document.createElement('div');
    meta.className='thread-meta'+(t.role==='user'?' user-meta':'');
    const icon=t.modality==='voice'
      ?`<svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>`
      :`<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 7h6M5 10h4"/></svg>`;
    meta.innerHTML=icon+`<span>${t.modality==='voice'?'VOICE':'TYPED'}${t.interrupted?' <span class="interrupted-badge">INTERRUPTED</span>':''}</span>`;
    div.appendChild(bubble);
    if(t.attachment){
      const att=document.createElement('div');
      att.className='thread-attach';
      att.innerHTML=ATTACH_SVG+`<span>${t.attachment}</span>`;
      div.appendChild(att);
    }
    div.appendChild(meta);
    threadList.appendChild(div);
  });
}

orbContainer.addEventListener('click',()=>{
  S.isMuted=!S.isMuted;
  orbMuted=S.isMuted;
  if(S.isMuted){
    stopAmp();setState('muted');
    muteDot.style.opacity='1';muteLabel.style.opacity='1';
  }else{
    muteDot.style.opacity='0';muteLabel.style.opacity='0';
    setState('idle');
  }
});

// Demo cycle
let demoTimers=[];
function clearDemo(){demoTimers.forEach(t=>clearTimeout(t));demoTimers=[];}
const DEMO=[
  {d:0,fn(){setState('listening');showTurn('_','voice',true);suggestionRow.classList.add('hidden');}},
  {d:2000,fn(){showTurn('Tell me about the weather today…','voice',true);}},
  {d:3400,fn(){
    S.turnHistory.push({role:'user',modality:'voice',text:'Tell me about the weather today.',interrupted:false});
    showTurn('Tell me about the weather today.','voice',false);
  }},
  {d:3600,fn(){setState('thinking');showTurn('…',null,true);}},
  {d:5000,fn(){
    setState('speaking');
    showTurn('Currently 64° and partly cloudy in San Francisco.','voice',false);
  }},
  {d:5400,fn(){
    inlineCard.classList.add('visible');
    S.turnHistory.push({role:'assistant',modality:'typed',text:'Currently 64° and partly cloudy in San Francisco.',interrupted:false});
  }},
  {d:8200,fn(){
    // barge-in
    setState('listening');showTurn('_','voice',true);
    inlineCard.classList.remove('visible');
  }},
  {d:9000,fn(){showTurn('What about tomorrow?','voice',true);}},
  {d:10200,fn(){
    S.turnHistory.push({role:'user',modality:'voice',text:'What about tomorrow?',interrupted:false});
    setState('thinking');showTurn('…',null,true);
  }},
  {d:11600,fn(){
    setState('speaking');
    const r='Tomorrow: clear skies and a high of 68°. Great day to be outside.';
    showTurn(r,'voice',false);
    S.turnHistory.push({role:'assistant',modality:'typed',text:r,interrupted:false});
  }},
  {d:15000,fn(){setState('idle');resetTurn();suggestionRow.classList.remove('hidden');}},
];

function runDemo(){
  clearDemo();inlineCard.classList.remove('visible');
  resetTurn();suggestionRow.classList.remove('hidden');
  setState('idle');S.isMuted=false;orbMuted=false;
  muteDot.style.opacity='0';muteLabel.style.opacity='0';
  DEMO.forEach(({d,fn})=>{demoTimers.push(setTimeout(fn,d));});
}

composerInput.addEventListener('input',()=>{
  S.hasText=composerInput.value.trim().length>0;
  updateActionBtn();
  if(S.hasText)suggestionRow.classList.add('hidden');
  else if(S.appState==='idle')suggestionRow.classList.remove('hidden');
});

actionBtn.addEventListener('click',()=>{
  if(actionBtn.classList.contains('stop-mode')){setState('idle');resetTurn();suggestionRow.classList.remove('hidden');return;}
  if(actionBtn.classList.contains('send-mode')){
    const txt=composerInput.value.trim();if(!txt)return;
    const attachment=S.hasAttach?'PHOTO.JPG':undefined;
    S.turnHistory.push({role:'user',modality:'typed',text:txt,attachment});
    showTurn(txt,'typed',false,attachment);
    composerInput.value='';S.hasText=false;S.hasAttach=false;
    attachChip.classList.remove('visible');updateActionBtn();
    suggestionRow.classList.add('hidden');
    setState('thinking');
    setTimeout(()=>{
      setState('speaking');
      const r='Understood. Let me pull that information for you.';
      showTurn(r,'voice',false);
      S.turnHistory.push({role:'assistant',modality:'typed',text:r,interrupted:false});
      setTimeout(()=>{setState('idle');resetTurn();suggestionRow.classList.remove('hidden');},4000);
    },1600);
    return;
  }
  if(!S.isMuted)runDemo();
});

attachBtn.addEventListener('click',()=>{
  S.hasAttach=!S.hasAttach;
  attachChip.classList.toggle('visible',S.hasAttach);
});
chipRemove.addEventListener('click',(e)=>{e.stopPropagation();S.hasAttach=false;attachChip.classList.remove('visible');});
suggestions.forEach(chip=>{
  chip.addEventListener('click',()=>{
    composerInput.value=chip.dataset.text;
    S.hasText=true;updateActionBtn();suggestionRow.classList.add('hidden');composerInput.focus();
  });
});
demoBtn.addEventListener('click',runDemo);
threadBtn.addEventListener('click',()=>{renderThread();threadPanel.classList.add('open');});
closeThread.addEventListener('click',()=>threadPanel.classList.remove('open'));

setState('idle');renderThread();
setTimeout(runDemo,1000);
</script>
</body>
</html>
