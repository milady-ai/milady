<!-- concept-D11-L4 | direction: Zen Single-Line Minimal | look: Clean System Light | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D11 · Zen Single-Line Minimal · Clean System Light</title>
<style>
:root{
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --surface-2:#FFFFFF;
  --border:rgba(60,60,67,0.18);
  --text:#1C1C1E;
  --text-secondary:rgba(60,60,67,0.60);
  --text-muted:#8E8E93;
  --accent:#0A84FF;
  --accent-2:#30D158;
  --danger:#FF3B30;
  --radius:13px;
  --radius-sm:9px;
  --font:"SF Pro Text",-apple-system,"Segoe UI Variable","Helvetica Neue",system-ui,sans-serif;
  --shadow:0 8px 30px rgba(0,0,0,0.12);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.10);
  --ease:cubic-bezier(.32,.72,0,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:var(--font);
  background:var(--bg);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

.device{
  position:relative;
  width:420px;height:760px;
  background:var(--bg);
  border-radius:44px;
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:var(--shadow),0 0 0 0.5px rgba(0,0,0,0.08);
}

/* Status bar */
.status-bar{
  padding:14px 28px 0;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.status-time{font-size:15px;font-weight:600;color:var(--text);}
.status-icons{display:flex;align-items:center;gap:6px;}
.status-icons svg{width:16px;height:11px;fill:var(--text);}

/* Header card */
.header{
  margin:10px 16px 0;
  padding:14px 16px 14px;
  background:var(--surface);
  border-radius:var(--radius);
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-sm);
}
.header-title{font-size:17px;font-weight:600;color:var(--text);}
.header-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:30px;height:30px;border-radius:50%;
  background:var(--bg);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 200ms var(--ease);
}
.icon-btn:hover{background:rgba(0,0,0,0.06);}
.icon-btn:active{transform:scale(0.94);}
.icon-btn svg{width:14px;height:14px;stroke:var(--text-muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* Avatar area */
.avatar-area{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 32px;
  position:relative;
}

/* Siri-style orb */
.orb-wrap{
  position:relative;width:104px;height:104px;
  margin-bottom:26px;cursor:pointer;
}
.orb-wrap::before{
  content:'';position:absolute;inset:-22px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(10,132,255,0.10),rgba(10,132,255,0) 68%);
  pointer-events:none;
}
canvas#orbCanvas{width:104px;height:104px;position:relative;display:block;}
.mute-dot{
  position:absolute;bottom:0;right:0;
  width:18px;height:18px;border-radius:50%;
  background:var(--danger);
  border:2.5px solid var(--bg);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 250ms var(--ease);
}
.mute-dot::after{
  content:'×';color:white;font-size:9px;font-weight:700;line-height:1;
}
.mute-label{
  font-size:12px;color:var(--danger);font-weight:500;
  margin-top:8px;opacity:0;
  transition:opacity 250ms var(--ease);text-align:center;
}
.state-badge{
  font-size:12px;color:var(--text-muted);
  min-height:17px;text-align:center;
  margin-top:4px;
  transition:all 250ms var(--ease);
}

/* Listening indicator */
.listening-indicator{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px;
  background:rgba(10,132,255,0.08);
  border:0.5px solid rgba(10,132,255,0.25);
  border-radius:20px;
  margin-bottom:16px;
  opacity:0;
  transition:all 250ms var(--ease);
  pointer-events:none;
}
.listening-indicator.visible{opacity:1;}
.listening-indicator svg{width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;}
.listening-indicator span{font-size:12px;color:var(--accent);font-weight:500;}
.live-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--danger);
  animation:livePulse 1s ease-in-out infinite;
}
@keyframes livePulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:0.6;}}

/* Current turn */
.current-turn-wrap{
  width:100%;
  background:var(--surface);
  border-radius:var(--radius);
  padding:20px 20px;
  box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;
  align-items:center;gap:8px;
  min-height:80px;justify-content:center;
}
.turn-line{
  font-size:20px;font-weight:300;
  color:var(--text);
  line-height:1.4;
  letter-spacing:-0.01em;
  text-align:center;
  opacity:1;
  transition:all 300ms var(--ease);
  max-width:100%;
}
.turn-line.fading{opacity:0;transform:translateY(-8px);}
.turn-line.partial{opacity:0.4;}
.turn-line.empty{
  color:var(--text-muted);
  font-size:17px;
}
.turn-meta{
  display:flex;align-items:center;gap:5px;
  font-size:11px;color:var(--text-muted);
  font-weight:400;
}
.turn-meta svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
.turn-meta.voice-meta{color:var(--accent);}
.turn-meta.voice-meta svg{stroke:var(--accent);}

/* Suggestion */
.suggestion{
  margin-top:16px;
  padding:9px 18px;
  background:var(--surface);
  border-radius:20px;
  font-size:14px;color:var(--text-secondary);
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  border:0.5px solid var(--border);
  transition:all 250ms var(--ease);
  opacity:1;
}
.suggestion:hover{background:rgba(0,0,0,0.04);color:var(--text);}
.suggestion:active{transform:scale(0.97);}
.suggestion.hidden{opacity:0;pointer-events:none;transform:translateY(4px);}

/* Inline card */
.inline-card{
  margin-top:18px;
  width:100%;
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  border:0.5px solid var(--border);
  overflow:hidden;
  opacity:0;transform:translateY(12px) scale(0.98);
  transition:all 300ms var(--ease);
}
.inline-card.visible{opacity:1;transform:translateY(0) scale(1);}
.card-header{
  padding:12px 16px 8px;
  display:flex;align-items:center;gap:9px;
  border-bottom:0.5px solid var(--border);
  position:relative;
}
.card-icon{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,#74b0ff,#0A84FF);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.card-title{font-size:13px;font-weight:600;color:var(--text);}
.card-sub{font-size:11px;color:var(--text-muted);}
.card-expand{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:0.45;}
.card-expand svg{width:11px;height:11px;stroke:var(--text-muted);fill:none;stroke-width:2;}
.card-body{padding:12px 16px;}
.weather-row{display:flex;align-items:center;justify-content:space-between;}
.weather-temp{font-size:38px;font-weight:200;color:var(--text);letter-spacing:-1px;}
.weather-right{text-align:right;}
.weather-desc{font-size:14px;color:var(--text-secondary);}
.weather-sub{font-size:12px;color:var(--text-muted);}
.card-actions{
  padding:6px 12px 12px;
  display:flex;gap:8px;
}
.card-btn{
  flex:1;padding:8px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;
  font-family:var(--font);
  border:none;cursor:pointer;
  background:rgba(10,132,255,0.10);color:var(--accent);
  transition:all 200ms var(--ease);
}
.card-btn:hover{background:rgba(10,132,255,0.16);}
.card-btn:active{transform:scale(0.96);}
.card-btn.secondary{background:rgba(0,0,0,0.04);color:var(--text-muted);}

/* Bottom area */
.bottom-area{
  padding:0 16px 32px;
  display:flex;flex-direction:column;gap:10px;
}
.thread-hint{
  text-align:center;font-size:12px;color:var(--text-muted);
  opacity:0.7;
}

/* Composer */
.composer{
  background:var(--surface);
  border-radius:22px;
  border:0.5px solid var(--border);
  box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:8px;
  padding:6px 6px 6px 12px;
  transition:all 250ms var(--ease);
}
.composer:focus-within{
  border-color:rgba(10,132,255,0.4);
  box-shadow:0 0 0 3px rgba(10,132,255,0.08),var(--shadow-sm);
}

.attach-btn{
  width:30px;height:30px;border-radius:50%;
  background:var(--bg);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 200ms;
}
.attach-btn:hover{background:rgba(0,0,0,0.06);}
.attach-btn svg{width:14px;height:14px;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.attachment-chip{
  display:flex;align-items:center;gap:5px;
  background:rgba(10,132,255,0.08);
  border-radius:8px;
  padding:3px 8px;
  font-size:11px;color:var(--accent);
  opacity:0;max-width:0;overflow:hidden;
  transition:all 250ms var(--ease);
}
.attachment-chip.visible{opacity:1;max-width:140px;}
.chip-remove{
  background:none;border:none;cursor:pointer;
  color:var(--accent);font-size:11px;opacity:0.6;
}

.composer-input{
  flex:1;background:none;border:none;outline:none;
  font-family:var(--font);font-size:15px;
  color:var(--text);line-height:1.4;
  caret-color:var(--accent);
}
.composer-input::placeholder{color:var(--text-muted);}

.action-btn{
  width:38px;height:38px;border-radius:50%;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 250ms var(--ease);flex-shrink:0;
  position:relative;overflow:hidden;
}
.action-btn svg{
  width:17px;height:17px;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  position:absolute;
  transition:all 250ms var(--ease);
}

.action-btn.mic-mode{background:var(--accent);}
.action-btn.mic-mode .mic-icon{opacity:1;stroke:white;}
.action-btn.mic-mode .send-icon{opacity:0;transform:scale(0.4);}
.action-btn.mic-mode .stop-icon{opacity:0;transform:scale(0.4);}

.action-btn.send-mode{background:var(--accent);}
.action-btn.send-mode .mic-icon{opacity:0;transform:scale(0.4);}
.action-btn.send-mode .send-icon{opacity:1;stroke:white;}
.action-btn.send-mode .stop-icon{opacity:0;transform:scale(0.4);}

.action-btn.stop-mode{background:rgba(255,59,48,0.12);}
.action-btn.stop-mode .mic-icon{opacity:0;transform:scale(0.4);}
.action-btn.stop-mode .send-icon{opacity:0;transform:scale(0.4);}
.action-btn.stop-mode .stop-icon{opacity:1;stroke:var(--danger);}

.action-btn:hover{filter:brightness(0.92);}
.action-btn:active{transform:scale(0.92);}

/* Demo button */
.demo-btn{
  padding:5px 12px;
  background:rgba(10,132,255,0.08);
  border:none;border-radius:8px;
  font-size:12px;font-weight:500;
  color:var(--accent);cursor:pointer;
  font-family:var(--font);
  transition:all 200ms;
}
.demo-btn:hover{background:rgba(10,132,255,0.14);}
.demo-btn:active{transform:scale(0.96);}

/* Thread panel */
.thread-panel{
  position:absolute;inset:0;
  background:var(--bg);
  border-radius:44px;
  z-index:10;display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform 350ms var(--ease);
  overflow:hidden;
}
.thread-panel.open{transform:translateX(0);}
.thread-header{
  padding:20px 24px 14px;
  display:flex;align-items:center;justify-content:space-between;
}
.thread-title{font-size:20px;font-weight:700;color:var(--text);}
.close-thread{
  padding:5px 14px;border-radius:8px;
  background:rgba(0,0,0,0.05);
  border:none;cursor:pointer;
  font-size:14px;font-weight:500;color:var(--accent);
  font-family:var(--font);
}
.thread-list{flex:1;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:10px;}
.thread-turn{display:flex;flex-direction:column;gap:3px;}
.thread-bubble{
  padding:10px 14px;border-radius:var(--radius);
  font-size:14px;line-height:1.5;max-width:85%;
}
.thread-bubble.user{
  background:var(--accent);
  color:white;align-self:flex-end;
  border-radius:var(--radius) var(--radius) 3px var(--radius);
}
.thread-bubble.assistant{
  background:var(--surface);
  color:var(--text);align-self:flex-start;
  border:0.5px solid var(--border);
  border-radius:var(--radius) var(--radius) var(--radius) 3px;
}
.thread-bubble.interrupted{opacity:0.55;}
.thread-meta{
  font-size:11px;color:var(--text-muted);
  display:flex;align-items:center;gap:4px;padding:0 2px;
}
.thread-meta.user-meta{align-self:flex-end;}
.thread-meta svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;}
.interrupted-badge{
  font-size:9px;color:var(--danger);
  background:rgba(255,59,48,0.1);
  border-radius:4px;padding:1px 4px;
}

@media(min-width:600px){
  body{background:#E5E5EA;}
  .device{box-shadow:var(--shadow),0 40px 80px rgba(0,0,0,0.12);}
}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="thread-panel" id="threadPanel">
    <div class="thread-header">
      <span class="thread-title">Transcript</span>
      <button class="close-thread" id="closeThread">Done</button>
    </div>
    <div class="thread-list" id="threadList"></div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-time" id="statusTime">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 17 11"><rect x="0" y="3" width="3" height="8" rx="0.5"/><rect x="4.5" y="2" width="3" height="9" rx="0.5"/><rect x="9" y="0" width="3" height="11" rx="0.5"/><rect x="13.5" y="-1" width="3.5" height="12" rx="0.5" opacity="0.3"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <span class="header-title">Eliza</span>
    <div class="header-actions">
      <button class="demo-btn" id="demoBtn">▶ Demo</button>
      <button class="icon-btn" id="threadBtn">
        <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h8M2 12h10"/></svg>
      </button>
    </div>
  </div>

  <div class="avatar-area">

    <div class="listening-indicator" id="listeningIndicator">
      <svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>
      <div class="live-dot"></div>
      <span>Listening…</span>
    </div>

    <div class="orb-wrap" id="orbWrap" title="Tap to mute">
      <canvas id="orbCanvas" width="176" height="176"></canvas>
      <div class="mute-dot" id="muteDot"></div>
    </div>
    <div class="mute-label" id="muteLabel">Muted</div>
    <div class="state-badge" id="stateBadge"></div>

    <div class="current-turn-wrap">
      <div class="turn-line empty" id="turnLine">Ask me anything…</div>
      <div class="turn-meta" id="turnMeta" style="opacity:0"></div>
    </div>

    <div class="suggestion" id="suggestion" data-text="What's the weather like today?">
      What's the weather like today?
    </div>

    <div class="inline-card" id="inlineCard">
      <div class="card-header">
        <div class="card-icon">🌤</div>
        <div>
          <div class="card-title">Weather</div>
          <div class="card-sub">San Francisco, CA</div>
        </div>
        <div class="card-expand"><svg viewBox="0 0 16 16"><path d="M10 2h4v4M14 2l-6 6M6 14H2v-4M2 14l6-6"/></svg></div>
      </div>
      <div class="card-body">
        <div class="weather-row">
          <div class="weather-temp">64°</div>
          <div class="weather-right">
            <div class="weather-desc">Partly Cloudy</div>
            <div class="weather-sub">Feels like 61°</div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="card-btn">7-Day Forecast</button>
        <button class="card-btn secondary">Dismiss</button>
      </div>
    </div>

  </div>

  <div class="bottom-area">
    <div class="thread-hint">Swipe for full transcript</div>
    <div class="composer" id="composer">
      <button class="attach-btn" id="attachBtn">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
      <div class="attachment-chip" id="attachChip">
        <span>📎 photo.jpg</span>
        <button class="chip-remove" id="chipRemove">×</button>
      </div>
      <input class="composer-input" id="composerInput" type="text" placeholder="Type or speak…" autocomplete="off">
      <button class="action-btn mic-mode" id="actionBtn">
        <svg class="mic-icon" viewBox="0 0 20 20"><path d="M10 1a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V4a3 3 0 0 1 3-3z"/><path d="M4 10a6 6 0 0 0 12 0"/><line x1="10" y1="16" x2="10" y2="19"/></svg>
        <svg class="send-icon" viewBox="0 0 20 20"><path d="M10 15V5M5 10l5-5 5 5"/></svg>
        <svg class="stop-icon" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// Clock
const statusTime=document.getElementById('statusTime');
function updateClock(){
  const n=new Date();
  statusTime.textContent=n.getHours()+':'+(String(n.getMinutes()).padStart(2,'0'));
}
updateClock();setInterval(updateClock,30000);

// ─── Canvas orb (Siri-style multi-color glow) ─────────────────────────────────
const canvas=document.getElementById('orbCanvas');
const ctx=canvas.getContext('2d');
let orbState='idle';let orbAmp=0;let orbT=0;let orbMuted=false;

function drawOrb(){
  ctx.clearRect(0,0,176,176);
  orbT+=0.03;
  const cx=88,cy=88;

  if(orbMuted){
    // grey ring
    ctx.beginPath();ctx.arc(cx,cy,36,0,Math.PI*2);
    ctx.strokeStyle='rgba(142,142,147,0.35)';ctx.lineWidth=2;ctx.stroke();
    // red dot indicator
    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);
    ctx.fillStyle='rgba(255,59,48,0.7)';ctx.fill();
    requestAnimationFrame(drawOrb);return;
  }

  // Base glow palette (RGB triplets) per state
  const palette=orbState==='thinking'
    ?[[10,132,255],[48,209,88],[94,92,230]]
    :[[10,132,255],[110,139,255],[48,209,88]];

  // Ripple rings
  const numRings=orbState==='idle'?1:orbState==='listening'?3:orbState==='thinking'?2:4;
  for(let r=0;r<numRings;r++){
    let ringR,alpha;
    if(orbState==='idle'){
      ringR=32+Math.sin(orbT*1.5)*3;
      alpha=0.18;
    } else if(orbState==='listening'){
      ringR=28+r*12+orbAmp*20;
      alpha=Math.max(0.04,(0.4-r*0.12)*orbAmp+0.05);
    } else if(orbState==='thinking'){
      ringR=28+r*14+Math.sin(orbT*2+r)*6;
      alpha=0.2-r*0.04;
    } else {
      ringR=26+r*10+orbAmp*15+Math.sin(orbT*4+r)*4;
      alpha=Math.max(0.06,(0.45-r*0.09));
    }
    const grad=ctx.createRadialGradient(cx,cy,ringR*0.5,cx,cy,ringR);
    const [rr,gg,bb]=palette[r%palette.length];
    grad.addColorStop(0,`rgba(${rr},${gg},${bb},${alpha})`);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(cx,cy,ringR,0,Math.PI*2);
    ctx.fillStyle=grad;ctx.fill();
  }

  // Core sphere
  const coreR=orbState==='idle'?24:orbState==='listening'?22+orbAmp*8:orbState==='thinking'?24+Math.sin(orbT*3)*4:22+orbAmp*10;
  const coreGrad=ctx.createRadialGradient(cx-8,cy-8,2,cx,cy,coreR);
  if(orbState==='thinking'){
    const hue=(orbT*30)%360;
    coreGrad.addColorStop(0,`hsla(${hue},80%,70%,0.9)`);
    coreGrad.addColorStop(0.5,`hsla(${(hue+60)%360},70%,55%,0.7)`);
    coreGrad.addColorStop(1,`hsla(${(hue+120)%360},60%,45%,0.5)`);
  } else {
    coreGrad.addColorStop(0,'rgba(120,180,255,0.95)');
    coreGrad.addColorStop(0.4,'rgba(10,132,255,0.85)');
    coreGrad.addColorStop(1,'rgba(6,90,200,0.7)');
  }
  ctx.beginPath();ctx.arc(cx,cy,coreR,0,Math.PI*2);
  ctx.fillStyle=coreGrad;ctx.fill();

  // Specular
  ctx.beginPath();
  ctx.ellipse(cx-7,cy-7,coreR*0.35,coreR*0.22,Math.PI*0.8,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fill();

  requestAnimationFrame(drawOrb);
}
drawOrb();

// ─── App ─────────────────────────────────────────────────────────────────────
const S={
  appState:'idle',isMuted:false,hasText:false,hasAttach:false,ampT:0,
  turnHistory:[
    {role:'assistant',modality:'typed',text:'Good morning! How can I help you today?',interrupted:false},
    {role:'user',modality:'voice',text:"What's the weather like in San Francisco?",interrupted:false},
    {role:'assistant',modality:'typed',text:"It's 64° and partly cloudy — a lovely afternoon in SF.",interrupted:true},
  ]
};

const muteDot=document.getElementById('muteDot');
const muteLabel=document.getElementById('muteLabel');
const stateBadge=document.getElementById('stateBadge');
const listeningIndicator=document.getElementById('listeningIndicator');
const turnLine=document.getElementById('turnLine');
const turnMeta=document.getElementById('turnMeta');
const suggestion=document.getElementById('suggestion');
const inlineCard=document.getElementById('inlineCard');
const composerInput=document.getElementById('composerInput');
const actionBtn=document.getElementById('actionBtn');
const attachBtn=document.getElementById('attachBtn');
const attachChip=document.getElementById('attachChip');
const chipRemove=document.getElementById('chipRemove');
const demoBtn=document.getElementById('demoBtn');
const threadBtn=document.getElementById('threadBtn');
const threadPanel=document.getElementById('threadPanel');
const closeThread=document.getElementById('closeThread');
const threadList=document.getElementById('threadList');
const orbWrap=document.getElementById('orbWrap');

let ampRaf=null;
function animateAmp(){
  S.ampT+=0.07;
  orbAmp=Math.max(0,Math.min(1,(Math.sin(S.ampT*2.1)*0.5+Math.sin(S.ampT*5.3)*0.3+Math.random()*0.2+0.5)*0.7));
  ampRaf=requestAnimationFrame(animateAmp);
}
function stopAmp(){if(ampRaf){cancelAnimationFrame(ampRaf);ampRaf=null;}orbAmp=0;}

function setState(s){
  S.appState=s;orbState=s;
  const badges={idle:'',listening:'Listening…',thinking:'Thinking…',speaking:'',muted:'Muted'};
  stateBadge.textContent=badges[s]||'';
  stateBadge.style.color=s==='muted'?'var(--danger)':s==='listening'?'var(--accent)':'var(--text-muted)';
  listeningIndicator.classList.toggle('visible',s==='listening');
  updateActionBtn();
  if(s==='listening'||s==='speaking'){animateAmp();}else{stopAmp();}
}

function updateActionBtn(){
  if(S.appState==='thinking'||S.appState==='speaking'){actionBtn.className='action-btn stop-mode';}
  else if(S.hasText){actionBtn.className='action-btn send-mode';}
  else{actionBtn.className='action-btn mic-mode';}
}

function showTurn(text,modality,partial=false){
  turnLine.classList.add('fading');
  setTimeout(()=>{
    turnLine.className='turn-line'+(partial?' partial':'');
    turnLine.textContent=text;turnLine.classList.remove('fading');
    if(modality){
      turnMeta.style.opacity='1';
      turnMeta.className='turn-meta'+(modality==='voice'?' voice-meta':'');
      turnMeta.innerHTML=modality==='voice'
        ?`<svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg><span>Voice</span>`
        :`<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 7h6M5 10h4"/></svg><span>Typed</span>`;
    }else{turnMeta.style.opacity='0';}
  },200);
}
function resetTurn(){turnLine.className='turn-line empty';turnLine.textContent='Ask me anything…';turnMeta.style.opacity='0';}

function renderThread(){
  threadList.innerHTML='';
  S.turnHistory.forEach(t=>{
    const div=document.createElement('div');div.className='thread-turn';
    const bubble=document.createElement('div');
    bubble.className='thread-bubble '+t.role+(t.interrupted?' interrupted':'');
    bubble.textContent=t.text;
    const meta=document.createElement('div');
    meta.className='thread-meta'+(t.role==='user'?' user-meta':'');
    const icon=t.modality==='voice'
      ?`<svg viewBox="0 0 16 16"><path d="M8 1v8M5 4v2M11 4v2M2 8c0 3.3 2.7 6 6 6s6-2.7 6-6"/></svg>`
      :`<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 7h6M5 10h4"/></svg>`;
    meta.innerHTML=icon+`<span>${t.modality==='voice'?'Voice':'Typed'}${t.interrupted?' <span class="interrupted-badge">interrupted</span>':''}</span>`;
    div.appendChild(bubble);div.appendChild(meta);
    threadList.appendChild(div);
  });
}

orbWrap.addEventListener('click',()=>{
  S.isMuted=!S.isMuted;orbMuted=S.isMuted;
  if(S.isMuted){stopAmp();setState('muted');muteDot.style.opacity='1';muteLabel.style.opacity='1';}
  else{muteDot.style.opacity='0';muteLabel.style.opacity='0';setState('idle');}
});

let demoTimers=[];
function clearDemo(){demoTimers.forEach(t=>clearTimeout(t));demoTimers=[];}
const DEMO=[
  {d:0,fn(){setState('listening');showTurn('…','voice',true);suggestion.classList.add('hidden');}},
  {d:2000,fn(){showTurn('What is the weather today in San Francisco…','voice',true);}},
  {d:3500,fn(){
    S.turnHistory.push({role:'user',modality:'voice',text:'What is the weather today in San Francisco?',interrupted:false});
    showTurn('What is the weather today in San Francisco?','voice',false);
  }},
  {d:3700,fn(){setState('thinking');showTurn('…',null,true);}},
  {d:5200,fn(){setState('speaking');showTurn('Currently 64° and partly cloudy in San Francisco.','voice',false);}},
  {d:5600,fn(){
    inlineCard.classList.add('visible');
    S.turnHistory.push({role:'assistant',modality:'typed',text:'Currently 64° and partly cloudy in San Francisco.',interrupted:false});
  }},
  {d:9000,fn(){setState('listening');showTurn('…','voice',true);inlineCard.classList.remove('visible');}},
  {d:9800,fn(){showTurn('And tomorrow?','voice',true);}},
  {d:10800,fn(){
    S.turnHistory.push({role:'user',modality:'voice',text:'And tomorrow?',interrupted:false});
    setState('thinking');showTurn('…',null,true);
  }},
  {d:12200,fn(){
    setState('speaking');
    const r='Tomorrow should be clear with a high of 68°. A great day to be outside.';
    showTurn(r,'voice',false);
    S.turnHistory.push({role:'assistant',modality:'typed',text:r,interrupted:false});
  }},
  {d:16000,fn(){setState('idle');resetTurn();suggestion.classList.remove('hidden');}},
];
function runDemo(){
  clearDemo();inlineCard.classList.remove('visible');resetTurn();
  suggestion.classList.remove('hidden');setState('idle');
  S.isMuted=false;orbMuted=false;
  muteDot.style.opacity='0';muteLabel.style.opacity='0';
  DEMO.forEach(({d,fn})=>demoTimers.push(setTimeout(fn,d)));
}

composerInput.addEventListener('input',()=>{
  S.hasText=composerInput.value.trim().length>0;
  updateActionBtn();
  if(S.hasText)suggestion.classList.add('hidden');
  else if(S.appState==='idle')suggestion.classList.remove('hidden');
});
actionBtn.addEventListener('click',()=>{
  if(actionBtn.classList.contains('stop-mode')){setState('idle');resetTurn();suggestion.classList.remove('hidden');return;}
  if(actionBtn.classList.contains('send-mode')){
    const txt=composerInput.value.trim();if(!txt)return;
    S.turnHistory.push({role:'user',modality:'typed',text:txt});
    showTurn(txt,'typed',false);
    composerInput.value='';S.hasText=false;S.hasAttach=false;
    attachChip.classList.remove('visible');updateActionBtn();suggestion.classList.add('hidden');
    setState('thinking');
    setTimeout(()=>{
      setState('speaking');
      const r='Got it. Let me find that for you right away.';
      showTurn(r,'voice',false);S.turnHistory.push({role:'assistant',modality:'typed',text:r});
      setTimeout(()=>{setState('idle');resetTurn();suggestion.classList.remove('hidden');},4000);
    },1600);
    return;
  }
  if(!S.isMuted)runDemo();
});
attachBtn.addEventListener('click',()=>{S.hasAttach=!S.hasAttach;attachChip.classList.toggle('visible',S.hasAttach);});
chipRemove.addEventListener('click',()=>{S.hasAttach=false;attachChip.classList.remove('visible');});
suggestion.addEventListener('click',()=>{
  composerInput.value=suggestion.dataset.text;S.hasText=true;updateActionBtn();
  suggestion.classList.add('hidden');composerInput.focus();
});
demoBtn.addEventListener('click',runDemo);
threadBtn.addEventListener('click',()=>{renderThread();threadPanel.classList.add('open');});
closeThread.addEventListener('click',()=>threadPanel.classList.remove('open'));

setState('idle');renderThread();
setTimeout(runDemo,800);
</script>
</body>
</html>
