<!-- concept-D09-L4 | direction: Conversation-as-Vertical-Timeline | look: Clean System Light | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D09 · Conversation-as-Vertical-Timeline · Clean System Light</title>
<style>
:root {
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --surface-2:#FFFFFF;
  --border:rgba(60,60,67,0.18);
  --text:#1C1C1E;
  --text-secondary:rgba(60,60,67,0.60);
  --text-muted:#8E8E93;
  --accent:#0A84FF;
  --accent-2:#30D158;
  --danger:#FF3B30;
  --radius:13px;
  --radius-sm:9px;
  --font:"SF Pro Text",-apple-system,"Segoe UI Variable","Helvetica Neue",system-ui,sans-serif;
  --shadow:0 8px 30px rgba(0,0,0,0.12);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.10);
  --ease:cubic-bezier(.32,.72,0,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);overflow:hidden}

body{
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}

.app-window{
  width:420px;height:760px;
  display:flex;flex-direction:column;
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow),0 0 0 0.5px var(--border);
  overflow:hidden;
  position:relative;
}

/* Header / Nav */
.header{
  padding:14px 16px 10px;
  background:rgba(255,255,255,0.92);
  border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
}

/* Orb */
.orb-wrap{position:relative;width:36px;height:36px;flex-shrink:0}
.orb{
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 38% 38%,rgba(90,160,255,0.9) 0%,#0A84FF 45%,#5E5CE6 90%);
  box-shadow:0 2px 8px rgba(10,132,255,0.35);
  transition:all 0.3s var(--ease);
  animation:orb-idle-sys 3s ease-in-out infinite;
  position:relative;overflow:hidden;
}
.orb::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.6) 0%,transparent 55%);
}
.orb-ring{
  position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid rgba(10,132,255,0.0);
  transition:all 0.3s var(--ease);
}
.orb.listening .orb-ring{border-color:rgba(10,132,255,0.5);animation:ring-pulse 0.5s ease-in-out infinite}
.orb.thinking{animation:orb-think 2s linear infinite;background:radial-gradient(circle at 38% 38%,rgba(90,90,240,0.9) 0%,#5E5CE6 45%,#34aadc 90%)}
.orb.speaking{animation:orb-speak 0.55s ease-in-out infinite}
.orb.listening{animation:orb-listen 0.4s ease-in-out infinite}

@keyframes orb-idle-sys{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes orb-listen{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes orb-think{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(90deg)}}
@keyframes orb-speak{0%,100%{transform:scale(1);box-shadow:0 2px 8px rgba(10,132,255,0.35)}40%{transform:scale(1.07);box-shadow:0 4px 16px rgba(10,132,255,0.5)}70%{transform:scale(1.03)}}
@keyframes ring-pulse{0%,100%{transform:scale(1);opacity:0.8}50%{transform:scale(1.15);opacity:0.3}}

.header-info{flex:1;min-width:0}
.header-title{font-size:16px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.header-sub{font-size:12px;color:var(--text-muted);margin-top:1px}

.header-actions{display:flex;gap:6px;align-items:center}
.mute-btn{
  width:30px;height:30px;border-radius:50%;
  border:none;background:var(--bg);
  color:var(--text-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:all 0.25s var(--ease);
}
.mute-btn.muted{color:var(--danger);background:rgba(255,59,48,0.1)}
.icon-btn{
  width:30px;height:30px;border-radius:50%;
  border:none;background:var(--bg);
  color:var(--text-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:all 0.25s;
}
.icon-btn:hover{color:var(--accent)}

/* Status bar */
.status-bar{
  display:flex;align-items:center;padding:4px 16px;
  min-height:26px;border-bottom:0.5px solid var(--border);
  background:rgba(242,242,247,0.7);flex-shrink:0;
}
.listen-badge{
  display:none;align-items:center;gap:5px;
  font-size:11px;color:var(--accent-2);font-weight:500;
}
.listen-badge.active{display:flex}
.listen-dot{width:5px;height:5px;border-radius:50%;background:var(--accent-2);animation:dot-breath 0.8s ease-in-out infinite}
@keyframes dot-breath{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}
.muted-badge{
  display:none;align-items:center;gap:5px;
  font-size:11px;color:var(--danger);font-weight:500;
}
.muted-badge.active{display:flex}

/* Timeline area */
.timeline-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  display:flex;padding:12px 0 8px;
}
.timeline-area::-webkit-scrollbar{width:3px}
.timeline-area::-webkit-scrollbar-track{background:transparent}
.timeline-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.time-rail{
  width:52px;flex-shrink:0;position:relative;padding-top:4px;
}
.rail-line{
  position:absolute;top:0;bottom:0;left:50%;
  transform:translateX(-50%);width:0.5px;
  background:var(--border);
}
.rail-time{
  font-size:9px;color:var(--text-muted);
  position:absolute;left:4px;letter-spacing:0.02em;
}

.events-col{
  flex:1;padding-right:16px;
  display:flex;flex-direction:column;
}

.event-row{display:flex;align-items:flex-start;position:relative;margin-bottom:2px}

.event-node{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);border:2px solid var(--surface);
  flex-shrink:0;margin-top:14px;margin-left:-4px;margin-right:10px;
  box-shadow:0 0 0 2px rgba(10,132,255,0.12);
  position:relative;z-index:2;
}
.event-node.user-node{background:var(--text-secondary);box-shadow:0 0 0 2px rgba(60,60,67,0.08)}
.event-node.voice-node{background:var(--accent-2);box-shadow:0 0 0 2px rgba(48,209,88,0.15)}

.event-bubble{
  flex:1;background:var(--bg);
  border-radius:var(--radius-sm);
  padding:9px 12px;margin-bottom:8px;
  box-shadow:var(--shadow-sm),0 0 0 0.5px var(--border);
}
.event-bubble.user-bubble{
  background:rgba(10,132,255,0.06);
  box-shadow:var(--shadow-sm),0 0 0 0.5px rgba(10,132,255,0.2);
}
.event-bubble.partial{opacity:0.5}

.bubble-header{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.modality-glyph{font-size:10px;color:var(--text-muted);display:flex;align-items:center;gap:2px}
.bubble-role{font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:-0.01em}
.bubble-ts{font-size:10px;color:var(--text-muted);margin-left:auto}
.bubble-text{font-size:14px;line-height:1.48;color:var(--text)}
.interrupted-badge{
  font-size:10px;color:var(--danger);
  background:rgba(255,59,48,0.08);border-radius:5px;
  padding:1px 5px;letter-spacing:0.02em;
}

/* App card */
.app-card{
  margin-top:8px;border-radius:var(--radius-sm);overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow-sm),0 0 0 0.5px var(--border);
}
.app-card-header{
  display:flex;align-items:center;gap:7px;
  padding:8px 10px;border-bottom:0.5px solid var(--border);
  background:rgba(242,242,247,0.6);
}
.app-icon{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#0A84FF,#5E5CE6);display:flex;align-items:center;justify-content:center;font-size:10px}
.app-name{font-size:11px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.app-expand-btn{margin-left:auto;font-size:11px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:var(--font);font-weight:500}
.app-card-body{padding:10px 12px}
.weather-display{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.weather-temp{font-size:28px;font-weight:300;color:var(--text);letter-spacing:-0.02em}
.weather-icon{font-size:22px}
.weather-desc{font-size:12px;color:var(--text);font-weight:500}
.weather-detail{font-size:11px;color:var(--text-muted);margin-top:2px}
.card-actions{display:flex;gap:7px;margin-top:9px}
.card-btn{
  flex:1;padding:7px 12px;border-radius:var(--radius-sm);
  border:none;background:var(--bg);
  color:var(--accent);font-family:var(--font);font-size:12px;font-weight:500;
  cursor:pointer;transition:all 0.2s var(--ease);
}
.card-btn:hover{background:rgba(10,132,255,0.08)}
.card-btn.primary{background:var(--accent);color:#fff}
.card-btn.primary:hover{background:#0076ee}

.attach-sub{
  display:flex;align-items:center;gap:5px;margin-top:5px;
  padding:4px 8px;background:rgba(48,209,88,0.06);
  border-radius:7px;font-size:11px;color:var(--accent-2);width:fit-content;
}

/* Composer */
.composer-area{
  flex-shrink:0;padding:7px 14px 16px;
  background:rgba(255,255,255,0.92);
  border-top:0.5px solid var(--border);
  backdrop-filter:blur(20px) saturate(1.5);
}
.suggestions-row{display:flex;gap:6px;margin-bottom:7px;overflow-x:auto;padding-bottom:2px;transition:opacity 0.25s var(--ease)}
.suggestions-row::-webkit-scrollbar{display:none}
.suggestion-chip{
  white-space:nowrap;padding:5px 12px;border-radius:20px;
  background:var(--bg);border:0.5px solid var(--border);
  font-size:12px;color:var(--text-muted);cursor:pointer;flex-shrink:0;
  font-family:var(--font);transition:all 0.2s var(--ease);
}
.suggestion-chip:hover{background:rgba(10,132,255,0.08);color:var(--accent)}

.staged-attachments{display:none;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.staged-attachments.has-items{display:flex}
.attach-chip{
  display:flex;align-items:center;gap:4px;
  background:rgba(48,209,88,0.08);
  border-radius:7px;padding:3px 8px;
  font-size:11px;color:var(--accent-2);
  box-shadow:0 0 0 0.5px rgba(48,209,88,0.2);
}
.attach-chip-remove{cursor:pointer;opacity:0.5;margin-left:3px;font-size:12px;line-height:1}
.attach-chip-remove:hover{opacity:1;color:var(--danger)}

.composer-row{
  display:flex;align-items:flex-end;gap:7px;
  background:var(--bg);border-radius:var(--radius);
  padding:8px 8px 8px 13px;
  box-shadow:0 0 0 0.5px var(--border),var(--shadow-sm);
}
.composer-input{
  flex:1;border:none;background:transparent;
  font-family:var(--font);font-size:15px;color:var(--text);
  outline:none;resize:none;max-height:96px;line-height:1.45;min-height:24px;
}
.composer-input::placeholder{color:var(--text-muted)}

.attach-btn{
  width:30px;height:30px;border-radius:50%;border:none;
  background:transparent;color:var(--text-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:all 0.2s;flex-shrink:0;
}
.attach-btn:hover{color:var(--accent);background:rgba(10,132,255,0.08)}

.morph-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:var(--accent);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s var(--ease);flex-shrink:0;
  box-shadow:0 3px 10px rgba(10,132,255,0.35);
  position:relative;overflow:hidden;
}
.morph-btn:hover{transform:scale(1.06);box-shadow:0 5px 16px rgba(10,132,255,0.45)}
.morph-btn.stop-mode{background:var(--danger);box-shadow:0 3px 10px rgba(255,59,48,0.35)}
.morph-btn svg{position:absolute;transition:all 0.28s var(--ease)}
.morph-btn .icon-mic{opacity:1;transform:scale(1)}
.morph-btn .icon-send{opacity:0;transform:scale(0.3) rotate(15deg)}
.morph-btn .icon-stop{opacity:0;transform:scale(0.3)}
.morph-btn.send-mode .icon-mic{opacity:0;transform:scale(0.3) rotate(-15deg)}
.morph-btn.send-mode .icon-send{opacity:1;transform:scale(1) rotate(0)}
.morph-btn.stop-mode .icon-mic{opacity:0;transform:scale(0.3)}
.morph-btn.stop-mode .icon-send{opacity:0;transform:scale(0.3)}
.morph-btn.stop-mode .icon-stop{opacity:1;transform:scale(1)}

.demo-btn{
  position:absolute;top:12px;right:12px;
  padding:5px 13px;border-radius:20px;
  border:none;background:rgba(10,132,255,0.1);
  color:var(--accent);font-family:var(--font);font-size:12px;font-weight:500;
  cursor:pointer;z-index:20;transition:all 0.2s var(--ease);
  box-shadow:0 0 0 0.5px rgba(10,132,255,0.2);
}
.demo-btn:hover{background:rgba(10,132,255,0.16)}

.partial-cursor{
  display:inline-block;width:2px;height:13px;
  background:var(--accent);border-radius:1px;
  margin-left:2px;vertical-align:middle;
  animation:blink-sys 0.9s ease-in-out infinite;
}
@keyframes blink-sys{0%,100%{opacity:1}50%{opacity:0}}

@media (min-width:700px){
  body{background:#E5E5EA}
  .app-window{width:440px;height:720px;box-shadow:0 24px 72px rgba(0,0,0,0.16),0 0 0 0.5px var(--border)}
}
</style>
</head>
<body>
<div class="app-window" id="appWindow">
  <button class="demo-btn" onclick="runDemo()">▶ Play demo</button>

  <div class="header">
    <div class="orb-wrap">
      <div class="orb" id="orb">
        <div class="orb-ring" id="orbRing"></div>
      </div>
    </div>
    <div class="header-info">
      <div class="header-title">Eliza</div>
      <div class="header-sub" id="statusLabel">Ready</div>
    </div>
    <div class="header-actions">
      <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🎤</button>
      <button class="icon-btn">⚙</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="listen-badge" id="listenBadge">
      <div class="listen-dot"></div>
      Listening…
    </div>
    <div class="muted-badge" id="mutedBadge">
      🔇 Muted
    </div>
  </div>

  <div class="timeline-area" id="timelineArea">
    <div class="time-rail" id="timeRail">
      <div class="rail-line"></div>
    </div>
    <div class="events-col" id="eventsCol"></div>
  </div>

  <div class="composer-area">
    <div class="suggestions-row" id="suggestionsRow"></div>
    <div class="staged-attachments" id="stagedAttachments"></div>
    <div class="composer-row">
      <button class="attach-btn" onclick="stageAttachment()">📎</button>
      <textarea class="composer-input" id="composerInput" placeholder="Message" rows="1"></textarea>
      <button class="morph-btn" id="morphBtn" onclick="handleMorph()">
        <svg class="icon-mic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
        <svg class="icon-send" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <svg class="icon-stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
let appState='idle',isMuted=false,hasText=false,demoTimer=null,msgCounter=100;
let ampPhase=0,amp=0,ampT=0;

const orb=document.getElementById('orb');
const statusLabel=document.getElementById('statusLabel');
const morphBtn=document.getElementById('morphBtn');
const muteBtn=document.getElementById('muteBtn');
const listenBadge=document.getElementById('listenBadge');
const mutedBadge=document.getElementById('mutedBadge');
const eventsCol=document.getElementById('eventsCol');
const timeRail=document.getElementById('timeRail');
const composerInput=document.getElementById('composerInput');
const suggestionsRow=document.getElementById('suggestionsRow');
const stagedAttachments=document.getElementById('stagedAttachments');

// Amp animation
function tickAmp(){
  ampPhase+=0.07;
  if((appState==='listening'||appState==='speaking')&&!isMuted){
    ampT=0.4+0.55*Math.abs(Math.sin(ampPhase*1.8))*Math.random();
  } else{ampT=0}
  amp+=(ampT-amp)*0.18;
  if((appState==='listening'||appState==='speaking')&&!isMuted){
    const s=1+amp*0.22;
    orb.style.transform=`scale(${s})`;
  } else{orb.style.transform=''}
  requestAnimationFrame(tickAmp);
}
tickAmp();

// ── Initial events ─────────────────────────────────────────────────────────
const initialEvents=[
  {id:'e1',type:'assistant',time:'2:41 PM',text:'Hi! I\'m here to help. What can I do for you today?'},
  {id:'e2',type:'user',time:'2:42 PM',text:'What\'s the weather like this weekend?',modality:'typed'},
  {id:'e3',type:'assistant',time:'2:42 PM',text:'Here\'s the weekend forecast.',card:{icon:'🌤',name:'Weather',temp:'72°',desc:'Partly Cloudy',detail:'Sat 72° / Sun 68° · 20% chance of rain Sunday'}},
  {id:'e4',type:'user',time:'2:45 PM',text:'Great! I was thinking about going hiking on Saturday—',modality:'voice',interrupted:true},
  {id:'e5',type:'assistant',time:'2:45 PM',text:'A Saturday hike sounds great! How far are you willing to drive — within an hour, or further?'},
  {id:'e6',type:'user',time:'2:47 PM',text:'Within an hour. Somewhere with nice views.',modality:'typed',attachment:{name:'photo.heic',emoji:'🖼'}},
  {id:'e7',type:'assistant',time:'2:48 PM',text:'Looking for trails near you…',partial:true},
];

function renderEvent(ev){
  const row=document.createElement('div');
  row.className='event-row';row.id='row-'+ev.id;

  const nodeClass=ev.type==='user'
    ?(ev.modality==='voice'?'event-node voice-node':'event-node user-node')
    :'event-node';

  let mg='';
  if(ev.modality==='voice')mg='<span class="modality-glyph">🎙</span>';
  else if(ev.modality==='typed')mg='<span class="modality-glyph">⌨</span>';

  let card='';
  if(ev.card){
    card=`<div class="app-card">
      <div class="app-card-header">
        <div class="app-icon">${ev.card.icon}</div>
        <span class="app-name">${ev.card.name}</span>
        <button class="app-expand-btn" onclick="this.textContent=this.textContent==='Open'?'Done':'Open'">Open</button>
      </div>
      <div class="app-card-body">
        <div class="weather-display">
          <span class="weather-icon">${ev.card.icon}</span>
          <span class="weather-temp">${ev.card.temp}</span>
          <div><div class="weather-desc">${ev.card.desc}</div></div>
        </div>
        <div class="weather-detail">${ev.card.detail}</div>
        <div class="card-actions">
          <button class="card-btn">5-Day</button>
          <button class="card-btn primary">Hourly</button>
        </div>
      </div>
    </div>`;
  }

  const intBadge=ev.interrupted?'<span class="interrupted-badge">Interrupted</span>':'';
  const attHtml=ev.attachment?`<div class="attach-sub">${ev.attachment.emoji} ${ev.attachment.name}</div>`:'';
  const cursor=ev.partial?'<span class="partial-cursor"></span>':'';

  row.innerHTML=`
    <div class="event-node ${nodeClass}" style="margin-top:13px"></div>
    <div class="event-bubble ${ev.type==='user'?'user-bubble':''} ${ev.partial?'partial':''}">
      <div class="bubble-header">
        ${mg}
        <span class="bubble-role">${ev.type==='user'?'You':'Eliza'}</span>
        ${intBadge}
        <span class="bubble-ts">${ev.time}</span>
      </div>
      <div class="bubble-text">${ev.text}${cursor}</div>
      ${card}${attHtml}
    </div>`;
  eventsCol.appendChild(row);
}

function initTimeline(){
  initialEvents.forEach(renderEvent);
  addRailTime('2:41','9%');addRailTime('2:45','43%');addRailTime('2:48','73%');
  renderSuggestions();scrollToBottom();
}

function addRailTime(t,top){
  const el=document.createElement('div');
  el.className='rail-time';el.style.top=top;el.textContent=t;
  timeRail.appendChild(el);
}

// ── Suggestions ────────────────────────────────────────────────────────────
const followUps=['Book a trail','5-day forecast','Set a reminder'];
function renderSuggestions(chips){
  suggestionsRow.innerHTML='';
  (chips||followUps).forEach(s=>{
    const ch=document.createElement('button');
    ch.className='suggestion-chip';ch.textContent=s;
    ch.onclick=()=>{composerInput.value=s;updateMorphBtn();suggestionsRow.style.opacity='0'};
    suggestionsRow.appendChild(ch);
  });
  suggestionsRow.style.opacity='1';
}

// ── Attachment ─────────────────────────────────────────────────────────────
let pendingAttach=null;
function stageAttachment(){
  pendingAttach={name:'photo.heic',emoji:'🖼'};
  stagedAttachments.innerHTML=`<div class="attach-chip">🖼 photo.heic <span class="attach-chip-remove" onclick="removeAttachment()">×</span></div>`;
  stagedAttachments.classList.add('has-items');
}
function removeAttachment(){pendingAttach=null;stagedAttachments.innerHTML='';stagedAttachments.classList.remove('has-items')}

// ── setState ───────────────────────────────────────────────────────────────
function setState(s){
  appState=s;
  orb.className='orb'+(s!=='idle'?' '+s:'');
  const labels={idle:'Ready',listening:'Listening…',thinking:'Thinking…',speaking:'Speaking…'};
  statusLabel.textContent=isMuted?'Muted':labels[s];
  listenBadge.classList.toggle('active',s==='listening'&&!isMuted);
  mutedBadge.classList.toggle('active',isMuted);
}

// ── Morph ──────────────────────────────────────────────────────────────────
function updateMorphBtn(){
  hasText=composerInput.value.trim().length>0;
  if(appState==='thinking'||appState==='speaking')morphBtn.className='morph-btn stop-mode';
  else if(hasText)morphBtn.className='morph-btn send-mode';
  else morphBtn.className='morph-btn';
  suggestionsRow.style.opacity=hasText?'0':'1';
  suggestionsRow.style.pointerEvents=hasText?'none':'';
}

composerInput.addEventListener('input',()=>{
  updateMorphBtn();
  composerInput.style.height='auto';
  composerInput.style.height=Math.min(composerInput.scrollHeight,96)+'px';
});
composerInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});

function handleMorph(){
  if(appState==='thinking'||appState==='speaking')stopGen();
  else if(hasText)sendMsg();
  else runDemo();
}

// ── Send typed ─────────────────────────────────────────────────────────────
function sendMsg(){
  const text=composerInput.value.trim();if(!text)return;
  const ev={id:'u'+(++msgCounter),type:'user',time:nowTime(),text,modality:'typed'};
  if(pendingAttach){ev.attachment=pendingAttach;removeAttachment()}
  renderEvent(ev);
  composerInput.value='';composerInput.style.height='';updateMorphBtn();scrollToBottom();
  setTimeout(()=>triggerReply(),700);
}

const replies=[
  'Mount Tamalpais has incredible views of the Bay. The Steep Ravine trail is 2.5 miles and about 40 minutes away. Highly rated.',
  'Mission Peak is a great option — substantial elevation, panoramic views, starts right at Fremont BART.',
  "I've added Saturday to your calendar. I'll check trail conditions Friday and send you an update."
];

function triggerReply(){
  setState('thinking');updateMorphBtn();
  setTimeout(()=>{setState('speaking');updateMorphBtn();streamAssistant(replies[Math.floor(Math.random()*replies.length)])},1000);
}

function streamAssistant(text){
  const id='a'+(++msgCounter);
  renderEvent({id,type:'assistant',time:nowTime(),text:'',partial:true});
  scrollToBottom();
  const bEl=document.querySelector('#row-'+id+' .bubble-text');
  const bubEl=document.querySelector('#row-'+id+' .event-bubble');
  let i=0;
  const step=()=>{
    if(i<=text.length){
      bEl.innerHTML=text.slice(0,i)+(i<text.length?'<span class="partial-cursor"></span>':'');
      i+=3;scrollToBottom();setTimeout(step,20);
    } else{
      bubEl.classList.remove('partial');bEl.innerHTML=text;
      setState('idle');updateMorphBtn();renderSuggestions();scrollToBottom();
    }
  };step();
}

function stopGen(){setState('idle');updateMorphBtn()}

// ── Mute ──────────────────────────────────────────────────────────────────
function toggleMute(){
  isMuted=!isMuted;
  muteBtn.className='mute-btn'+(isMuted?' muted':'');
  muteBtn.textContent=isMuted?'🔇':'🎤';
  setState(isMuted?'idle':appState);updateMorphBtn();
}

// ── Demo ──────────────────────────────────────────────────────────────────
function runDemo(){
  if(demoTimer)clearTimeout(demoTimer);
  setState('idle');updateMorphBtn();

  const id='demo'+Date.now();
  renderEvent({id,type:'user',time:nowTime(),text:'Find Italian restaurants nearby',modality:'voice',partial:true});
  scrollToBottom();
  const bEl=document.querySelector('#row-'+id+' .bubble-text');
  const bubEl=document.querySelector('#row-'+id+' .event-bubble');

  setState('listening');updateMorphBtn();

  demoTimer=setTimeout(()=>{
    bubEl.classList.remove('partial');
    bEl.innerHTML='Find Italian restaurants nearby';
    setState('thinking');updateMorphBtn();
    demoTimer=setTimeout(()=>{
      setState('speaking');updateMorphBtn();
      streamAssistant("Osteria Morini is 0.3 miles away with excellent handmade pasta and an 4.7 rating. Trattoria Roma is 0.6 miles — great wood-fired pizza, open until 10 PM tonight.");
    },1000);
  },2000);
}

// ── Utils ─────────────────────────────────────────────────────────────────
function scrollToBottom(){const a=document.getElementById('timelineArea');requestAnimationFrame(()=>a.scrollTop=a.scrollHeight)}
function nowTime(){const d=new Date();return(d.getHours()>12?d.getHours()-12:d.getHours())+':'+String(d.getMinutes()).padStart(2,'0')+' '+(d.getHours()>=12?'PM':'AM')}

initTimeline();updateMorphBtn();
setTimeout(runDemo,1500);
</script>
