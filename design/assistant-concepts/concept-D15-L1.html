<!-- concept-D15-L1 | direction: Character / Companion with Personality | look: Soft Aurora Glass | targets: 420x760, 960x640 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D15 · Character / Companion with Personality · Soft Aurora Glass</title>
<style>
:root{
  --bg:#EAF0FB;
  --bg-aurora:radial-gradient(120% 90% at 18% 12%,#F3E9FB 0%,transparent 55%),radial-gradient(120% 90% at 82% 88%,#E6F7F4 0%,transparent 55%),linear-gradient(160deg,#EAF0FB,#EFEAFB);
  --surface:rgba(255,255,255,0.55);
  --surface-2:rgba(255,255,255,0.72);
  --border:rgba(255,255,255,0.65);
  --text:#1B2233;
  --text-muted:#5A6582;
  --accent:#6E8BFF;
  --accent-2:#9C6CF0;
  --accent-3:#5FE3C0;
  --danger:#FF6B8B;
  --radius:22px;
  --radius-sm:14px;
  --font:"SF Pro Display","Segoe UI Variable","Helvetica Neue",system-ui,sans-serif;
  --shadow:0 12px 40px rgba(80,90,160,0.18);
  --shadow-sm:0 4px 16px rgba(80,90,160,0.12);
  --blur:saturate(1.4) blur(24px);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);overflow-x:hidden}

body{
  background:var(--bg-aurora);
  background-color:var(--bg);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  animation:auroraShift 30s ease-in-out infinite alternate;
}

@keyframes auroraShift{
  0%{filter:hue-rotate(0deg)}
  50%{filter:hue-rotate(15deg)}
  100%{filter:hue-rotate(-10deg)}
}

.app-window{
  width:420px;height:760px;
  background:rgba(234,240,251,0.7);
  backdrop-filter:var(--blur);
  border-radius:36px;
  border:1.5px solid var(--border);
  box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,0.4) inset;
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;
}

/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 12px;
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.companion-info{display:flex;align-items:center;gap:10px}
.companion-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent-3);
  box-shadow:0 0 8px var(--accent-3);
  animation:statusPulse 2s ease-in-out infinite;
}
@keyframes statusPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(0.85)}}
.companion-name{font-size:17px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.companion-mood{font-size:12px;color:var(--text-muted);font-weight:400}
.header-actions{display:flex;gap:8px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:16px;
  transition:all 0.24s var(--ease);
  box-shadow:var(--shadow-sm);
}
.icon-btn:hover{background:rgba(255,255,255,0.8);color:var(--accent);transform:scale(1.05)}

/* Avatar Stage */
.avatar-stage{
  flex-shrink:0;height:220px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;padding:16px;
}

.avatar-tap-hint{
  font-size:11px;color:var(--text-muted);opacity:0;
  position:absolute;bottom:8px;
  transition:opacity 0.4s;letter-spacing:0.04em;text-transform:lowercase;
}
.avatar-stage:hover .avatar-tap-hint{opacity:1}

/* Orb */
.orb-wrap{position:relative;width:140px;height:140px;cursor:pointer}
.orb-halo{
  position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle,rgba(110,139,255,0.18) 0%,transparent 70%);
  animation:haloBreath 3.5s ease-in-out infinite;
}
@keyframes haloBreath{0%,100%{transform:scale(1);opacity:0.7}50%{transform:scale(1.12);opacity:1}}

.orb{
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#b8caff 0%,#8ba4ff 28%,#9c6cf0 62%,#5fe3c0 100%);
  box-shadow:0 8px 40px rgba(110,139,255,0.4),0 0 0 1px rgba(255,255,255,0.3) inset;
  position:relative;overflow:hidden;
  animation:orbIdle 3.5s ease-in-out infinite;
  transition:all 0.4s var(--ease);
}
.orb::before{
  content:'';position:absolute;
  top:15%;left:18%;width:35%;height:28%;
  background:radial-gradient(ellipse,rgba(255,255,255,0.75) 0%,transparent 80%);
  border-radius:50%;
}
.orb::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0%,rgba(156,108,240,0.15) 25%,transparent 50%,rgba(95,227,192,0.1) 75%,transparent 100%);
  animation:orbSwirl 8s linear infinite;
}
@keyframes orbIdle{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.04);filter:brightness(1.05)}}
@keyframes orbSwirl{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* Orb Face */
.orb-face{
  position:absolute;inset:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  z-index:2;
}
.face-eyes{display:flex;gap:20px;align-items:center;transform:translateY(-8px)}
.eye{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,0.9);
  box-shadow:0 0 6px rgba(255,255,255,0.5);
  transition:all 0.3s var(--ease);
}
.face-mouth{
  position:absolute;bottom:40%;left:50%;transform:translateX(-50%);
  width:24px;height:8px;
  border-bottom:2.5px solid rgba(255,255,255,0.7);
  border-radius:0 0 12px 12px;
  transition:all 0.3s var(--ease);
}

/* Avatar state classes */
.orb.listening{
  animation:orbListen 0.3s ease-in-out infinite alternate;
  background:radial-gradient(circle at 35% 32%,#c5d5ff 0%,#7ba0ff 28%,#5fe3c0 62%,#6e8bff 100%);
  box-shadow:0 8px 40px rgba(110,139,255,0.6),0 0 0 1px rgba(255,255,255,0.4) inset;
}
@keyframes orbListen{0%{transform:scale(1)}100%{transform:scale(1.06)}}
.orb.thinking{
  animation:orbThink 1.2s ease-in-out infinite;
  background:radial-gradient(circle at 35% 32%,#d4b8ff 0%,#9c6cf0 28%,#6e8bff 62%,#5fe3c0 100%);
}
@keyframes orbThink{
  0%{filter:hue-rotate(0deg) brightness(1)}
  33%{filter:hue-rotate(30deg) brightness(1.08)}
  66%{filter:hue-rotate(-20deg) brightness(1.04)}
  100%{filter:hue-rotate(0deg) brightness(1)}
}
.orb.speaking{
  animation:orbSpeak 0.5s ease-in-out infinite alternate;
  background:radial-gradient(circle at 35% 32%,#ffe0b8 0%,#ff9c6c 28%,#9c6cf0 62%,#6e8bff 100%);
}
@keyframes orbSpeak{0%{transform:scale(1)}100%{transform:scale(1.08)}}
.orb.muted{
  animation:none;
  filter:grayscale(0.7) brightness(0.7);
}
.orb.muted .eye{background:rgba(200,200,200,0.5)}

/* Listening Label */
.listening-label{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;
  background:rgba(110,139,255,0.15);
  backdrop-filter:blur(8px);
  border:1px solid rgba(110,139,255,0.3);
  border-radius:20px;
  font-size:12px;color:var(--accent);font-weight:500;
  position:absolute;bottom:14px;
  opacity:0;transform:translateY(6px);
  transition:all 0.3s var(--ease);
  pointer-events:none;
}
.listening-label.visible{opacity:1;transform:translateY(0)}
.listening-label svg{width:12px;height:12px;animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{0%,100%{opacity:1}50%{opacity:0.4}}

.muted-label{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;
  background:rgba(255,107,139,0.15);
  border:1px solid rgba(255,107,139,0.3);
  border-radius:20px;
  font-size:12px;color:var(--danger);font-weight:500;
  position:absolute;bottom:14px;
  opacity:0;
  transition:opacity 0.3s;
}
.muted-label.visible{opacity:1}

/* Persona Row */
.persona-row{
  display:flex;gap:8px;padding:0 16px 10px;
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
}
.persona-row::-webkit-scrollbar{display:none}
.persona-chip{
  flex-shrink:0;padding:6px 14px;border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface);
  backdrop-filter:blur(8px);
  font-size:12px;font-weight:500;color:var(--text-muted);
  cursor:pointer;white-space:nowrap;
  transition:all 0.24s var(--ease);
  box-shadow:var(--shadow-sm);
}
.persona-chip.active,.persona-chip:hover{
  background:var(--accent);color:#fff;
  border-color:var(--accent);
  box-shadow:0 4px 16px rgba(110,139,255,0.35);
}

/* Chat */
.chat-area{
  flex:1;overflow-y:auto;padding:12px 16px;
  display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;
  scrollbar-color:rgba(110,139,255,0.2) transparent;
}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(110,139,255,0.25);border-radius:4px}

.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:20px;
}
.empty-greeting{font-size:15px;color:var(--text-muted);text-align:center;line-height:1.5}

.suggestion-chips{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:8px 0;
  transition:opacity 0.3s;
}
.suggestion-chips.hidden{opacity:0;pointer-events:none}
.sug-chip{
  padding:8px 16px;border-radius:var(--radius-sm);
  background:var(--surface-2);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  font-size:13px;color:var(--accent-2);font-weight:500;
  cursor:pointer;
  transition:all 0.24s var(--ease);
  box-shadow:var(--shadow-sm);
}
.sug-chip:hover{background:var(--surface);transform:translateY(-2px);box-shadow:var(--shadow)}

/* Message bubbles */
.msg{display:flex;gap:8px;align-items:flex-end;animation:msgIn 0.3s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.bubble{
  max-width:75%;padding:10px 14px;
  font-size:14px;line-height:1.5;color:var(--text);
  position:relative;
}
.msg.assistant .bubble{
  background:var(--surface-2);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:var(--radius) var(--radius) var(--radius) 6px;
  box-shadow:var(--shadow-sm);
}
.msg.user .bubble{
  background:var(--accent);
  color:#fff;
  border-radius:var(--radius) var(--radius) 6px var(--radius);
  box-shadow:0 4px 16px rgba(110,139,255,0.3);
}
.turn-glyph{
  font-size:10px;opacity:0.6;margin-top:4px;
  display:flex;align-items:center;gap:3px;
}
.msg.user .turn-glyph{justify-content:flex-end;color:rgba(255,255,255,0.7)}
.msg.assistant .turn-glyph{color:var(--text-muted)}
.partial{opacity:0.55}
.interrupted-badge{
  font-size:10px;
  background:rgba(255,107,139,0.15);
  color:var(--danger);
  border:1px solid rgba(255,107,139,0.3);
  border-radius:6px;
  padding:2px 6px;margin-left:6px;
}

/* App Card */
.app-card{
  background:var(--surface-2);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  margin-top:4px;
  max-width:100%;
  animation:msgIn 0.35s var(--ease);
}
.app-card-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.3);
}
.app-icon{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.app-name{font-size:13px;font-weight:600;color:var(--text)}
.app-card-body{padding:12px 14px}
.weather-display{display:flex;align-items:center;gap:16px}
.weather-temp{font-size:36px;font-weight:300;color:var(--text);letter-spacing:-0.02em}
.weather-detail{font-size:13px;color:var(--text-muted);line-height:1.5}
.weather-detail strong{color:var(--text)}
.app-card-actions{
  display:flex;gap:8px;padding:10px 14px;
  border-top:1px solid var(--border);
}
.card-btn{
  flex:1;padding:8px 12px;border-radius:var(--radius-sm);
  border:none;cursor:pointer;font-size:13px;font-weight:500;
  transition:all 0.2s var(--ease);
  font-family:var(--font);
}
.card-btn.primary{background:var(--accent);color:#fff}
.card-btn.primary:hover{opacity:0.9}
.card-btn.secondary{background:rgba(110,139,255,0.1);color:var(--accent);border:1px solid rgba(110,139,255,0.2)}
.card-btn.secondary:hover{background:rgba(110,139,255,0.2)}

/* Follow-up chip */
.followup-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:20px;
  background:rgba(95,227,192,0.12);
  border:1px solid rgba(95,227,192,0.3);
  font-size:12px;color:var(--accent-3);font-weight:500;
  cursor:pointer;margin-top:6px;
  transition:all 0.2s var(--ease);
}
.followup-chip:hover{background:rgba(95,227,192,0.2)}

/* Attachment area */
.attachment-preview{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:8px 16px 0;
  flex-shrink:0;
}
.attach-chip{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:var(--radius-sm);
  background:var(--surface-2);
  border:1px solid var(--border);
  font-size:12px;color:var(--text);
  box-shadow:var(--shadow-sm);
}
.attach-remove{
  width:16px;height:16px;border-radius:50%;
  background:rgba(255,107,139,0.2);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--danger);
  transition:background 0.2s;
}
.attach-remove:hover{background:rgba(255,107,139,0.4)}
.attach-thumbnail{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,#f8c6d8,#c6d8f8);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}

/* Composer */
.composer-wrap{
  flex-shrink:0;padding:10px 16px 20px;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
}
.composer{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:26px;
  padding:8px 8px 8px 16px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow 0.3s;
}
.composer:focus-within{box-shadow:0 0 0 2px rgba(110,139,255,0.3),var(--shadow-sm)}
.composer-input{
  flex:1;border:none;background:transparent;
  font-size:15px;color:var(--text);outline:none;
  resize:none;max-height:80px;line-height:1.4;
  font-family:var(--font);
}
.composer-input::placeholder{color:var(--text-muted)}
.attach-btn{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(110,139,255,0.1);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:16px;flex-shrink:0;
  transition:all 0.2s var(--ease);
}
.attach-btn:hover{background:rgba(110,139,255,0.2);transform:scale(1.05)}
.send-btn{
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;flex-shrink:0;
  transition:all 0.3s var(--ease);
  box-shadow:0 4px 16px rgba(110,139,255,0.35);
  position:relative;overflow:hidden;
}
.send-btn:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(110,139,255,0.5)}
.send-btn.mic-mode{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.send-btn.send-mode{background:var(--accent)}
.send-btn.stop-mode{background:var(--danger)}
.send-btn svg{position:absolute;transition:all 0.25s var(--ease)}
.send-btn .icon-mic{opacity:1;transform:scale(1)}
.send-btn .icon-send{opacity:0;transform:scale(0.7) rotate(-20deg)}
.send-btn .icon-stop{opacity:0;transform:scale(0.7)}
.send-btn.send-mode .icon-mic{opacity:0;transform:scale(0.7)}
.send-btn.send-mode .icon-send{opacity:1;transform:scale(1) rotate(0deg)}
.send-btn.stop-mode .icon-mic{opacity:0;transform:scale(0.7)}
.send-btn.stop-mode .icon-stop{opacity:1;transform:scale(1)}

/* Demo button */
.demo-btn{
  width:100%;padding:8px;
  background:transparent;border:none;
  font-size:11px;color:var(--text-muted);cursor:pointer;
  font-family:var(--font);letter-spacing:0.04em;text-transform:uppercase;
  margin-top:8px;
  transition:color 0.2s;
}
.demo-btn:hover{color:var(--accent)}

/* Mute btn styling */
.mute-btn{color:var(--text-muted)}
.mute-btn.active{color:var(--danger) !important;background:rgba(255,107,139,0.12) !important}

@media(min-width:640px){
  body{padding:20px}
  .app-window{width:420px;height:760px}
}
@media(max-width:440px){
  .app-window{width:100%;height:100vh;border-radius:0}
}
</style>
</head>
<body>

<div class="app-window">
  <!-- Header -->
  <div class="header">
    <div class="companion-info">
      <div class="companion-dot"></div>
      <div>
        <div class="companion-name">Luna</div>
        <div class="companion-mood" id="moodLabel">Curious · Storyteller</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn mute-btn" id="muteBtn" title="Mute microphone">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button class="icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Avatar Stage -->
  <div class="avatar-stage">
    <div class="orb-wrap" id="orbWrap" onclick="startVoice()">
      <div class="orb-halo" id="orbHalo"></div>
      <div class="orb" id="orb">
        <div class="orb-face">
          <div>
            <div class="face-eyes">
              <div class="eye" id="eyeL"></div>
              <div class="eye" id="eyeR"></div>
            </div>
            <div class="face-mouth" id="facemouth"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="listening-label" id="listeningLabel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
      Listening…
    </div>
    <div class="muted-label" id="mutedLabel">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/></svg>
      Muted
    </div>
    <div class="avatar-tap-hint">tap to talk</div>
  </div>

  <!-- Persona Chips Row -->
  <div class="persona-row">
    <div class="persona-chip active" onclick="selectPersona(this,'Storyteller')">Storyteller ✨</div>
    <div class="persona-chip" onclick="selectPersona(this,'Coach')">Coach 💪</div>
    <div class="persona-chip" onclick="selectPersona(this,'Concise')">Concise ⚡</div>
    <div class="persona-chip" onclick="selectPersona(this,'Curious')">Curious 🔍</div>
    <div class="persona-chip" onclick="selectPersona(this,'Playful')">Playful 🎭</div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <!-- Empty state with suggestions -->
    <div class="empty-state" id="emptyState">
      <div class="empty-greeting">Hey! I'm Luna ✨<br>Tap the orb to talk, or try one of these—</div>
      <div class="suggestion-chips" id="suggChips">
        <div class="sug-chip" onclick="sendSuggestion('Tell me a story about the ocean')">🌊 Tell me a story</div>
        <div class="sug-chip" onclick="sendSuggestion('Give me a pep talk')">💫 Pep talk, please</div>
        <div class="sug-chip" onclick="sendSuggestion('What should I make for dinner?')">🍜 Dinner ideas</div>
        <div class="sug-chip" onclick="sendSuggestion('How\'s the weather today?')">🌤 Check weather</div>
      </div>
    </div>
  </div>

  <!-- Attachment preview area -->
  <div class="attachment-preview" id="attachPreview"></div>

  <!-- Composer -->
  <div class="composer-wrap">
    <div class="composer">
      <button class="attach-btn" id="attachBtn" onclick="addAttachment()" title="Attach">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea class="composer-input" id="composerInput" placeholder="Message Luna…" rows="1"></textarea>
      <button class="send-btn mic-mode" id="sendBtn" onclick="handleSendBtn()">
        <svg class="icon-mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <svg class="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <svg class="icon-stop" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
    <button class="demo-btn" id="demoBtn" onclick="runDemo()">▶ Play demo cycle</button>
  </div>
</div>

<script>
// ---- State ----
let state = 'idle'; // idle | listening | thinking | speaking
let muted = false;
let attachments = [];
let demoTimer = null;
let ampInterval = null;
let speakInterval = null;
let currentPersona = 'Storyteller';
let isGenerating = false;

const orb = document.getElementById('orb');
const orbHalo = document.getElementById('orbHalo');
const listeningLabel = document.getElementById('listeningLabel');
const mutedLabel = document.getElementById('mutedLabel');
const chatArea = document.getElementById('chatArea');
const emptyState = document.getElementById('emptyState');
const suggChips = document.getElementById('suggChips');
const composerInput = document.getElementById('composerInput');
const sendBtn = document.getElementById('sendBtn');
const attachPreview = document.getElementById('attachPreview');
const moodLabel = document.getElementById('moodLabel');
const muteBtn = document.getElementById('muteBtn');

// ---- Avatar State Machine ----
function setAvatarState(s) {
  state = s;
  orb.className = 'orb ' + s;
  listeningLabel.classList.toggle('visible', s === 'listening' && !muted);
  if (s === 'speaking') {
    moodLabel.textContent = 'Happy · Speaking…';
  } else if (s === 'listening') {
    moodLabel.textContent = 'Attentive · Listening…';
  } else if (s === 'thinking') {
    moodLabel.textContent = 'Thoughtful · Thinking…';
  } else {
    moodLabel.textContent = `${currentPersona} · Curious`;
  }
  // Face expressions
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const mouth = document.getElementById('facemouth');
  if (muted) {
    eyeL.style.cssText = 'width:8px;height:3px;border-radius:0 0 4px 4px;background:rgba(200,200,200,0.4)';
    eyeR.style.cssText = 'width:8px;height:3px;border-radius:0 0 4px 4px;background:rgba(200,200,200,0.4)';
    mouth.style.cssText = 'width:20px;height:4px;border:none;background:rgba(200,200,200,0.3);border-radius:4px;bottom:38%;';
    return;
  }
  if (s === 'listening') {
    eyeL.style.cssText = 'width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.95);box-shadow:0 0 8px rgba(255,255,255,0.6)';
    eyeR.style.cssText = 'width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.95);box-shadow:0 0 8px rgba(255,255,255,0.6)';
    mouth.style.cssText = 'width:20px;height:6px;border-bottom:2.5px solid rgba(255,255,255,0.7);border-radius:0 0 10px 10px;';
  } else if (s === 'thinking') {
    eyeL.style.cssText = 'width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.8)';
    eyeR.style.cssText = 'width:3px;height:8px;border-radius:2px;background:rgba(255,255,255,0.8)';
    mouth.style.cssText = 'width:16px;height:6px;border-bottom:2.5px solid rgba(255,255,255,0.5);border-radius:0 0 8px 8px;left:52%;';
  } else if (s === 'speaking') {
    eyeL.style.cssText = 'width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.9);box-shadow:0 0 10px rgba(255,255,255,0.5)';
    eyeR.style.cssText = 'width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.9);box-shadow:0 0 10px rgba(255,255,255,0.5)';
    mouth.style.cssText = 'width:28px;height:10px;border-bottom:2.5px solid rgba(255,255,255,0.7);border-radius:0 0 14px 14px;';
  } else {
    eyeL.style.cssText = '';
    eyeR.style.cssText = '';
    mouth.style.cssText = '';
  }
}

// Simulate amplitude-driven listening motion
function startListeningAnim() {
  if (ampInterval) clearInterval(ampInterval);
  ampInterval = setInterval(() => {
    if (state !== 'listening' || muted) return;
    const amp = 0.85 + Math.sin(Date.now()/120) * 0.08 + Math.random() * 0.07;
    orb.style.transform = `scale(${amp})`;
    orbHalo.style.transform = `scale(${1 + (amp-0.85)*3})`;
    orbHalo.style.opacity = 0.6 + (amp-0.85)*3;
  }, 50);
}
function stopListeningAnim() {
  if (ampInterval) clearInterval(ampInterval);
  orb.style.transform = '';
  orbHalo.style.transform = '';
}

function startSpeakingAnim() {
  if (speakInterval) clearInterval(speakInterval);
  speakInterval = setInterval(() => {
    if (state !== 'speaking') return;
    const env = 0.9 + Math.abs(Math.sin(Date.now()/220)) * 0.14 + Math.random()*0.04;
    orb.style.transform = `scale(${env})`;
  }, 60);
}
function stopSpeakingAnim() {
  if (speakInterval) clearInterval(speakInterval);
  orb.style.transform = '';
}

// ---- Mute ----
muteBtn.addEventListener('click', toggleMute);
function toggleMute() {
  muted = !muted;
  muteBtn.classList.toggle('active', muted);
  muteBtn.innerHTML = muted
    ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/></svg>`
    : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`;
  mutedLabel.classList.toggle('visible', muted);
  listeningLabel.classList.toggle('visible', state === 'listening' && !muted);
  if (muted) {
    orb.className = 'orb muted';
    stopListeningAnim(); stopSpeakingAnim();
  } else {
    setAvatarState(state);
  }
}

// ---- Composer input ----
composerInput.addEventListener('input', () => {
  if (isGenerating) return;
  const hasText = composerInput.value.trim().length > 0;
  sendBtn.className = 'send-btn ' + (hasText ? 'send-mode' : 'mic-mode');
  if (hasText) {
    suggChips.classList.add('hidden');
  } else {
    suggChips.classList.remove('hidden');
  }
  composerInput.style.height = 'auto';
  composerInput.style.height = Math.min(composerInput.scrollHeight, 80) + 'px';
});

// ---- Persona ----
function selectPersona(el, name) {
  document.querySelectorAll('.persona-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentPersona = name;
  moodLabel.textContent = `${name} · Curious`;
}

// ---- Messages ----
function hideEmptyState() {
  if (emptyState.parentNode) emptyState.remove();
}

function addMessage(role, text, modality, partial, interrupted) {
  hideEmptyState();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const glyphSvg = modality === 'voice'
    ? `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>`
    : `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;
  div.innerHTML = `
    <div class="bubble${partial?' partial':''}">
      ${text}
      ${interrupted ? '<span class="interrupted-badge">interrupted</span>' : ''}
      <div class="turn-glyph">${glyphSvg} ${modality}</div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function addWeatherCard() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="bubble" style="max-width:95%">
      <div class="app-card">
        <div class="app-card-header">
          <div class="app-icon">🌤</div>
          <span class="app-name">Weather — San Francisco</span>
        </div>
        <div class="app-card-body">
          <div class="weather-display">
            <div class="weather-temp">64°</div>
            <div class="weather-detail">
              <strong>Partly Cloudy</strong><br>
              Feels like 61° · Humidity 72%<br>
              Wind NW 12 mph
            </div>
          </div>
        </div>
        <div class="app-card-actions">
          <button class="card-btn primary">5-Day Forecast</button>
          <button class="card-btn secondary">Radar Map</button>
        </div>
      </div>
      <div class="turn-glyph" style="margin-top:6px">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg>
        voice
      </div>
      <div class="followup-chip" onclick="sendSuggestion('What about this weekend?')">✨ What about this weekend?</div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addAttachmentMessage(role, text, modality) {
  hideEmptyState();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `
    <div class="bubble">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div class="attach-thumbnail">🌅</div>
        <span style="font-size:12px;color:var(--text-muted)">sunset.jpg</span>
      </div>
      ${text}
      <div class="turn-glyph">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>
        typed
      </div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ---- Attachments ----
function addAttachment() {
  if (attachments.length >= 3) return;
  const files = ['photo_sunset.jpg', 'doc_notes.pdf', 'voice_memo.m4a'];
  const emojis = ['🌅', '📄', '🎵'];
  const i = attachments.length;
  const name = files[i % files.length];
  attachments.push(name);
  renderAttachments();
  // Orb reacts!
  orb.style.transform = 'scale(1.15) rotate(5deg)';
  setTimeout(() => { orb.style.transform = ''; }, 500);
}

function renderAttachments() {
  attachPreview.innerHTML = '';
  attachments.forEach((name, i) => {
    const emojis = ['🌅', '📄', '🎵'];
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    chip.innerHTML = `
      <div class="attach-thumbnail" style="width:28px;height:28px;font-size:14px">${emojis[i%3]}</div>
      <span>${name}</span>
      <button class="attach-remove" onclick="removeAttachment(${i})">✕</button>
    `;
    attachPreview.appendChild(chip);
  });
}

function removeAttachment(i) {
  attachments.splice(i, 1);
  renderAttachments();
}

// ---- Voice / Send ----
function startVoice() {
  if (muted) return;
  runDemo();
}

function handleSendBtn() {
  if (isGenerating) {
    stopGeneration();
    return;
  }
  const text = composerInput.value.trim();
  if (text.length > 0) {
    sendTyped(text);
  } else {
    startVoice();
  }
}

function sendTyped(text) {
  composerInput.value = '';
  composerInput.style.height = 'auto';
  sendBtn.className = 'send-btn mic-mode';
  if (attachments.length > 0) {
    addAttachmentMessage('user', text, 'typed');
    attachments = [];
    renderAttachments();
    // orb reacts
    setTimeout(() => {
      orb.style.background = 'radial-gradient(circle at 35% 32%,#ffe8d0 0%,#ffb088 28%,#9c6cf0 62%,#6e8bff 100%)';
      orb.style.transform = 'scale(1.18)';
      setTimeout(() => { orb.style.background=''; orb.style.transform=''; }, 700);
    }, 100);
  } else {
    addMessage('user', text, 'typed');
  }
  setTimeout(() => triggerAssistantReply(text), 800);
}

function sendSuggestion(text) {
  composerInput.value = '';
  addMessage('user', text, 'typed');
  setTimeout(() => triggerAssistantReply(text), 800);
}

function stopGeneration() {
  isGenerating = false;
  setAvatarState('idle');
  stopSpeakingAnim();
  sendBtn.className = 'send-btn mic-mode';
}

function triggerAssistantReply(userText) {
  isGenerating = true;
  sendBtn.className = 'send-btn stop-mode';
  setAvatarState('thinking');

  setTimeout(() => {
    setAvatarState('speaking');
    startSpeakingAnim();

    let reply, hasCard = false;
    const lower = userText.toLowerCase();
    if (lower.includes('weather') || lower.includes('forecast')) {
      reply = 'Let me pull up the latest conditions for you!';
      hasCard = true;
    } else if (lower.includes('story')) {
      reply = 'Ah, the ocean! 🌊 Once there was a lighthouse keeper who heard music rising from the deep — a song only audible at precisely 3 AM on the winter solstice…';
    } else if (lower.includes('pep talk') || lower.includes('pep')) {
      reply = 'Here\'s the truth: you\'ve already handled harder things than today. Every step forward — however small — is proof of your strength. You\'ve got this! 💫';
    } else if (lower.includes('dinner') || lower.includes('food')) {
      reply = 'How about a warm miso-glazed salmon with roasted sweet potatoes? Fast, satisfying, and it feels like a proper meal without the fuss. 🍜';
    } else if (lower.includes('weekend')) {
      reply = 'This weekend looks lovely — sunny Saturday, mild Sunday around 68°. Perfect for a picnic or a hike! 🌿';
    } else {
      reply = 'That\'s such a wonderful thing to explore together. Let me share something I find genuinely fascinating about that…';
    }

    const msgEl = addMessage('assistant', '', 'voice');
    const bubble = msgEl.querySelector('.bubble');
    let i = 0;
    const textNode = document.createTextNode('');
    bubble.insertBefore(textNode, bubble.querySelector('.turn-glyph'));

    const typeInterval = setInterval(() => {
      if (i < reply.length) {
        textNode.textContent += reply[i++];
        chatArea.scrollTop = chatArea.scrollHeight;
      } else {
        clearInterval(typeInterval);
        if (hasCard) { addWeatherCard(); }
        isGenerating = false;
        setAvatarState('idle');
        stopSpeakingAnim();
        sendBtn.className = 'send-btn mic-mode';
      }
    }, 28);
  }, 1100);
}

// ---- Demo Cycle ----
function runDemo() {
  if (demoTimer) { clearTimeout(demoTimer); demoTimer = null; }
  stopListeningAnim(); stopSpeakingAnim();
  if (isGenerating) { stopGeneration(); }

  // Add interrupted turn to show that feature
  if (chatArea.querySelectorAll('.msg').length === 0 && !document.getElementById('emptyState')?.parentNode) {
    // skip if already has messages
  }

  // IDLE -> LISTENING
  setAvatarState('listening');
  startListeningAnim();

  demoTimer = setTimeout(() => {
    // Add partial transcript
    hideEmptyState();
    const partialEl = addMessage('user', 'How\'s the weather today in…', 'voice', true);
    const partialBubble = partialEl.querySelector('.bubble');

    demoTimer = setTimeout(() => {
      // Finalize transcript (barge-in style — simulate interrupted then restart)
      partialBubble.classList.remove('partial');
      partialEl.querySelector('.bubble').querySelector('div').remove(); // remove old turn-glyph
      const tg = document.createElement('div');
      tg.className='turn-glyph';
      tg.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/></svg> voice`;
      partialBubble.appendChild(tg);
      partialBubble.querySelector('div:not(.turn-glyph)')?.remove();
      // Update text
      partialBubble.firstChild.textContent = 'How\'s the weather today in San Francisco?';

      setAvatarState('thinking');
      stopListeningAnim();

      demoTimer = setTimeout(() => {
        setAvatarState('speaking');
        startSpeakingAnim();

        const reply = 'It\'s 64° and partly cloudy right now — genuinely lovely weather! Winds are gentle from the northwest. I\'d say grab a light jacket and enjoy it!';
        const msgEl = addMessage('assistant', '', 'voice');
        const bubble = msgEl.querySelector('.bubble');
        let i = 0;
        const textNode = document.createTextNode('');
        bubble.insertBefore(textNode, bubble.querySelector('.turn-glyph'));

        const typeInterval = setInterval(() => {
          if (i < reply.length) {
            textNode.textContent += reply[i++];
            chatArea.scrollTop = chatArea.scrollHeight;
          } else {
            clearInterval(typeInterval);
            addWeatherCard();
            stopSpeakingAnim();
            setAvatarState('idle');
          }
        }, 22);

      }, 1200);
    }, 2200);
  }, 1800);
}

// Auto-start once
setTimeout(runDemo, 1200);
</script>
</body>
</html>
