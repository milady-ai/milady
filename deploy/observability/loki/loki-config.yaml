# Loki configuration for Eliza Cloud log storage.
#
# Two retention tiers selected by the `tier` stream label, set by the
# OTel Collector's attributes/audit-route processor:
#   - default app logs: 365 days
#   - audit_7y stream:  7 years (security-relevant audit events)
#
# Policy refs:
#   ../../../POLICIES/14-logging-monitoring.md
#   ../../../POLICIES/11-data-retention.md

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: s3            # use filesystem for dev
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
  aws:
    s3: s3://REGION/BUCKET        # placeholder — set per environment

# Per-stream retention enforced via compactor. The default is 365d;
# streams tagged `tier=audit_7y` retain 2557 days.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50

limits_config:
  retention_period: 365d
  retention_stream:
    - selector: '{tier="audit_7y"}'
      priority: 1
      period: 2557d   # ~ 7 years

  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true

analytics:
  reporting_enabled: false
