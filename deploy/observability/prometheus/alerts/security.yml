# Security alert rules for Eliza Cloud.
#
# Routed to PagerDuty / Opsgenie via Alertmanager.
# Severity labels:
#   sev0  page immediately
#   sev1  page during business hours; chat otherwise
#   sev2  chat only
#
# Policy ref: ../../../../POLICIES/14-logging-monitoring.md
# Runbook ref: ../../../../docs/security/INCIDENT-RUNBOOK.md
groups:
  - name: eliza.security
    interval: 30s
    rules:

      # ---- Authentication anomalies ----------------------------------------

      - alert: HighFailedAuthRate
        expr: |
          sum(rate(cloud_auth_attempts_total{outcome="failure"}[5m])) > 10
        for: 5m
        labels:
          severity: sev1
          category: auth
        annotations:
          summary: "Sustained failed auth rate exceeds 10/s for 5m"
          description: "Possible credential stuffing or auth bypass attempt. See INCIDENT-RUNBOOK Playbook D."

      - alert: AuthBypassSpike
        expr: |
          sum(rate(cloud_auth_attempts_total{outcome="failure"}[1m])) > 100
        for: 1m
        labels:
          severity: sev0
          category: auth
        annotations:
          summary: "Failed-auth spike >100/s"
          description: "Likely active attack. Page immediately."

      # ---- Audit-event sink ------------------------------------------------

      - alert: AuditSinkWriteFailures
        expr: |
          sum(rate(cloud_audit_events_write_failures_total[5m])) > 0
        for: 5m
        labels:
          severity: sev0
          category: audit
        annotations:
          summary: "audit_events sink is failing writes"
          description: "Any sustained failure to write security audit events is SEV-0. Investigate the cloud-api -> AuditDispatcher path."

      - alert: AuditEventVolumeDropped
        expr: |
          sum(rate(cloud_audit_events_total[15m])) < 0.1 * sum(rate(cloud_audit_events_total[7d] offset 7d))
        for: 30m
        labels:
          severity: sev1
          category: audit
        annotations:
          summary: "audit_events volume <10% of weekly baseline"
          description: "Likely sink misconfiguration or producer outage. Verify AuditDispatcher health."

      # ---- Anomalous data export -------------------------------------------

      - alert: AnomalousDataExportVolume
        expr: |
          sum by (user_id) (rate(cloud_data_export_bytes_total[10m])) > 5 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: sev1
          category: exfil
        annotations:
          summary: "Single user exporting >5 GiB / 10m"
          description: "Possible credential compromise or exfiltration. See INCIDENT-RUNBOOK Playbook G."

      # ---- Infrastructure health ------------------------------------------

      - alert: ContainerRestartLoop
        expr: |
          increase(kube_pod_container_status_restarts_total[15m]) > 5
        for: 15m
        labels:
          severity: sev2
          category: infra
        annotations:
          summary: "Container restarting in a loop"
          description: "Pod has restarted >5 times in 15 minutes."

      - alert: CertificateExpiringSoon
        expr: |
          probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: sev2
          category: tls
        annotations:
          summary: "TLS certificate expires within 14 days"
          description: "Renew or investigate cert-manager."

      - alert: CertManagerRenewalFailure
        expr: |
          increase(certmanager_certificate_renewal_errors_total[1h]) > 0
        for: 1h
        labels:
          severity: sev1
          category: tls
        annotations:
          summary: "cert-manager renewal failures detected"

      # ---- Backup / DR -----------------------------------------------------

      - alert: BackupJobFailure
        expr: |
          increase(eliza_backup_job_failures_total[1h]) > 0
        for: 5m
        labels:
          severity: sev1
          category: backup
        annotations:
          summary: "Backup job failed"
          description: "See INCIDENT-RUNBOOK Playbook F."

      - alert: BackupAgedOut
        expr: |
          time() - eliza_backup_last_success_timestamp_seconds > 36 * 3600
        for: 10m
        labels:
          severity: sev1
          category: backup
        annotations:
          summary: "No successful backup in 36h"

      # ---- KMS / Steward ---------------------------------------------------

      - alert: KMSUnwrapFailures
        expr: |
          sum(rate(steward_unwrap_failures_total[5m])) > 0.1
        for: 5m
        labels:
          severity: sev1
          category: kms
        annotations:
          summary: "Sustained Steward unwrap failures"
          description: "Possible AAD mismatch, corrupt ciphertext, or KEK rotation issue."

      - alert: KMSRotationOverdue
        expr: |
          time() - steward_key_last_rotated_timestamp_seconds > steward_key_rotation_target_seconds
        for: 1h
        labels:
          severity: sev2
          category: kms
        annotations:
          summary: "Key rotation overdue past target"
