# Default-deny baseline — SOC2 CC6.6.
# Applies to eliza-agents and eliza-infra. Add per-edge allow policies on top.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: eliza-agents
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: eliza-infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
