# Edge: ingress-nginx -> API (eliza-agents).
# Operator must label ingress-nginx namespace with kubernetes.io/metadata.name=ingress-nginx
# (default in modern K8s) and API pods with app.kubernetes.io/component=api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api
  namespace: eliza-agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 2138
        - protocol: TCP
          port: 31337
