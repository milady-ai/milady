# SOC2 A1.2 — availability via PodDisruptionBudgets.
# Stateful workloads keep at least 1 pod available during voluntary disruption.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-cnpg
  namespace: eliza-infra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      cnpg.io/cluster: eliza-pg
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: eliza-infra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: eliza-agents
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
