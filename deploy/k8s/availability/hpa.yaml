# SOC2 A1.2 — horizontal autoscaling for the API tier.
# CPU-based + custom request-rate metric (Prometheus adapter / KEDA).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: eliza-agents
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # TODO(soc2): align with the Deployment name emitted by the Server CRD
    # operator. The operator currently names the Deployment after the Server
    # CR; this HPA assumes a stable label-selector instead via the CRD's
    # `app.kubernetes.io/component: api`.
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom request-rate stub. Requires prometheus-adapter or KEDA installed.
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
