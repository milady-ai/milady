# SOC2 CC8.1 — only admit images signed by our CI OIDC identity.
# Switch mode to "enforce" after a warn-only soak period.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: require-cosign-signature
spec:
  mode: warn  # TODO(soc2): flip to "enforce" after 14d clean warn-only run
  images:
    - glob: "ghcr.io/elizaos/**"
    - glob: "ghcr.io/elizaos-plugins/**"
  authorities:
    - name: github-actions-keyless
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            # TODO(soc2): pin org name once final.
            subjectRegExp: "^https://github\\.com/elizaOS/.+/\\.github/workflows/sign-images\\.yml@.*$"
        ctlog:
          url: https://rekor.sigstore.dev
