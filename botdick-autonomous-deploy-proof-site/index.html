<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autonomous Deploy Proof</title>
    <meta
      name="description"
      content="A static proof page for an autonomous Cloudflare Pages deployment."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="proof-panel" aria-labelledby="page-title">
        <div class="signal" aria-hidden="true">
          <span class="signal__ring signal__ring--one"></span>
          <span class="signal__ring signal__ring--two"></span>
          <span class="signal__core"></span>
        </div>

        <div class="content">
          <p class="eyebrow">Cloudflare Pages static proof</p>
          <h1 id="page-title">Autonomous Deploy Proof</h1>
          <p class="lede">
            This original static page was created locally, deployed by command,
            and published as a live verification target.
          </p>

          <dl class="facts" aria-label="Deployment details">
            <div>
              <dt>Bot</dt>
              <dd>botdick</dd>
            </div>
            <div>
              <dt>Project</dt>
              <dd>autonomous-deploy-proof</dd>
            </div>
            <div>
              <dt>Domain</dt>
              <dd>milaidy.agency</dd>
            </div>
          </dl>
        </div>
      </section>
    </main>
  </body>
</html>
