name: Electrobun Release Artifacts

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release-artifacts:
    name: Build release artifacts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Linux Electrobun dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Release audit
        shell: bash
        run: scripts/electrobun-release-audit.sh
      - name: Build stable
        shell: bash
        env:
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          ELECTROBUN_SIGN: ${{ vars.ELECTROBUN_SIGN }}
          ELECTROBUN_NOTARIZE: ${{ vars.ELECTROBUN_NOTARIZE }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
          ELECTROBUN_APPLEAPIKEYPATH: ${{ secrets.ELECTROBUN_APPLEAPIKEYPATH }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
        run: |
          if bun run | grep -q "build:stable"; then bun run build:stable; else bunx electrobun build --env=stable; fi
      - uses: actions/upload-artifact@v4
        with:
          name: electrobun-artifacts-${{ runner.os }}
          path: artifacts/**
          if-no-files-found: warn
