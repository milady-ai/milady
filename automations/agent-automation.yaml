name: electrobun-agentic-desktop-automation
version: 1
session_start:
  - scripts/electrobun-agent-doctor.sh
pre_commit:
  - scripts/validate-agentic-electrobun.sh
  - scripts/security-audit.sh
  - scripts/dependency-audit.sh
post_feature:
  - scripts/electrobun-build-test.sh
release:
  - scripts/electrobun-agent-doctor.sh
  - scripts/validate-agentic-electrobun.sh
  - scripts/security-audit.sh
  - scripts/electrobun-release-audit.sh
  - scripts/electrobun-build-test.sh
notes:
  - Fast checks belong in hooks.
  - Full platform GUI/build matrices belong in CI runners for macOS, Windows, and Linux.
  - Do not upload build logs containing secrets, prompts, transcripts, or private user data.
